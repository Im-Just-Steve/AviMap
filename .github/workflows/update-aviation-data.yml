name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # FIND CURRENT NATS DATASETS FROM THE DATASET CHECKLIST
      #
      # The NATS Dataset Checklist is the source of truth for the
      # current filenames and effective dates.
      # ============================================================

      - name: Find current NATS AIP and VRP datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          python3 <<'PY'
          import html
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, unquote

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          EXPORT_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/export/sites/default/en/"
              "Publications/digital-datasets/"
          )

          import urllib.request

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "AviMap-NATS-Data-Updater/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          # --------------------------------------------------------
          # Work out which checklist is current.
          # --------------------------------------------------------

          print("")
          print("Downloading NATS digital datasets index...")

          index = download(INDEX_URL)
          index = html.unescape(index)

          checklist_links = re.findall(
              r'href\s*=\s*["\']([^"\']*Dataset_Checklist_[^"\']+\.HTML[^"\']*)["\']',
              index,
              flags=re.I
          )

          checklist_candidates = []

          for href in checklist_links:
              url = urljoin(
                  INDEX_URL,
                  unquote(href)
              )

              match = re.search(
                  r'Dataset_Checklist_(\d{4})_(\d{2})_(\d{2})\.HTML',
                  url,
                  flags=re.I
              )

              if not match:
                  continue

              date = datetime(
                  int(match.group(1)),
                  int(match.group(2)),
                  int(match.group(3))
              ).date()

              checklist_candidates.append(
                  (date, url)
              )

          # Fallback to the currently published checklist known to
          # be linked by the NATS site if the index structure changes.
          if not checklist_candidates:
              checklist_candidates.append(
                  (
                      datetime(
                          2026,
                          7,
                          9
                      ).date(),
                      CHECKLIST_BASE
                      + "Dataset_Checklist_2026_07_09.HTML"
                  )
              )

          today = datetime.now(
              timezone.utc
          ).date()

          eligible = [
              item
              for item in checklist_candidates
              if item[0] <= today
          ]

          if not eligible:
              raise SystemExit(
                  "ERROR: Could not find an effective NATS Dataset Checklist."
              )

          checklist_date, checklist_url = max(
              eligible,
              key=lambda item: item[0]
          )

          print("")
          print("NATS Dataset Checklist:")
          print(checklist_date)
          print(checklist_url)
          print("")

          checklist = download(
              checklist_url
          )

          checklist = html.unescape(
              checklist
          )

          Path(
              "/tmp/nats-checklist.html"
          ).write_text(
              checklist,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Find filenames in the checklist.
          # --------------------------------------------------------

          def extract_date(filename):
              match = re.search(
                  r'_(\d{8})(?:\.|_)',
                  filename
              )

              if not match:
                  return None

              try:
                  return datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  return None

          def extract_filename_candidates(pattern):
              names = set(
                  re.findall(
                      pattern,
                      checklist,
                      flags=re.I
                  )
              )

              return sorted(
                  names
              )

          aip_xml_names = extract_filename_candidates(
              r'EG_AIP_DS_FULL_\d{8}\.XML'
          )

          aip_kml_names = extract_filename_candidates(
              r'EG_AIP_DS_FULL_\d{8}\.KML'
          )

          vrp_names = extract_filename_candidates(
              r'EG_VRP_DS_AREA1_FULL_\d{8}\.(?:CSV|XLSX)'
          )

          print("==========================================")
          print("NATS CHECKLIST DATASETS")
          print("==========================================")
          print("")

          print("AIP XML:")
          for name in aip_xml_names:
              print(f"  {name}")

          print("")
          print("AIP KML:")
          for name in aip_kml_names:
              print(f"  {name}")

          print("")
          print("VRP:")
          for name in vrp_names:
              print(f"  {name}")

          print("")

          def select_latest(names, label):
              candidates = []

              for name in names:
                  date = extract_date(name)

                  if date is None:
                      continue

                  if date <= today:
                      candidates.append(
                          (date, name)
                      )

              if not candidates:
                  raise SystemExit(
                      f"ERROR: No effective {label} dataset found in "
                      "the NATS Dataset Checklist."
                  )

              return max(
                  candidates,
                  key=lambda item: item[0]
              )

          aip_xml_date, aip_xml_name = select_latest(
              aip_xml_names,
              "AIP XML"
          )

          aip_kml_date, aip_kml_name = select_latest(
              aip_kml_names,
              "AIP KML"
          )

          vrp_date, vrp_name = select_latest(
              vrp_names,
              "VRP"
          )

          if aip_xml_date != aip_kml_date:
              raise SystemExit(
                  "ERROR: NATS AIP XML and KML effective dates do not "
                  f"match: {aip_xml_date} vs {aip_kml_date}"
              )

          # --------------------------------------------------------
          # Find the actual href associated with each filename.
          #
          # If NATS displays the filename as plain table text rather
          # than a direct anchor, use the NATS export directory as
          # the fallback download location.
          # --------------------------------------------------------

          def find_href_for_filename(filename):
              escaped = re.escape(
                  filename
              )

              # Case 1: filename is inside an href.
              match = re.search(
                  r'href\s*=\s*["\']([^"\']*'
                  + escaped +
                  r'[^"\']*)["\']',
                  checklist,
                  flags=re.I
              )

              if match:
                  return urljoin(
                      checklist_url,
                      html.unescape(
                          unquote(
                              match.group(1)
                          )
                      )
                  )

              # Case 2: filename appears near an href in the same
              # table cell/HTML region.
              for match in re.finditer(
                  escaped,
                  checklist,
                  flags=re.I
              ):
                  start = max(
                      0,
                      match.start() - 2500
                  )

                  end = min(
                      len(checklist),
                      match.end() + 2500
                  )

                  nearby = checklist[
                      start:end
                  ]

                  hrefs = re.findall(
                      r'href\s*=\s*["\']([^"\']+)["\']',
                      nearby,
                      flags=re.I
                  )

                  for href in hrefs:
                      url = urljoin(
                          checklist_url,
                          html.unescape(
                              unquote(
                                  href
                              )
                          )
                      )

                      if filename.lower() in url.lower():
                          return url

                  # If exactly one obvious digital-dataset download
                  # link is nearby, use it.
                  for href in hrefs:
                      url = urljoin(
                          checklist_url,
                          html.unescape(
                              unquote(
                                  href
                              )
                          )

                      if (
                          "/cms-nats/export/" in url
                          and
                          filename.split(".")[0].lower()
                          in url.lower()
                      ):
                          return url

              # Case 3: standard NATS export directory fallback.
              return (
                  EXPORT_BASE
                  + filename
              )

          aip_xml_url = find_href_for_filename(
              aip_xml_name
          )

          aip_kml_url = find_href_for_filename(
              aip_kml_name
          )

          # The VRP checklist gives the CSV and XLSX filenames.
          # Prefer CSV because that is what AviMap consumes.
          vrp_csv_names = [
              name
              for name in vrp_names
              if name.upper().endswith(
                  ".CSV"
              )
          ]

          if not vrp_csv_names:
              raise SystemExit(
                  "ERROR: NATS checklist contains no VRP CSV."
              )

          vrp_csv_date, vrp_csv_name = select_latest(
              vrp_csv_names,
              "VRP CSV"
          )

          vrp_url = find_href_for_filename(
              vrp_csv_name
          )

          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print(f"AIP effective date : {aip_xml_date}")
          print(f"AIP XML filename   : {aip_xml_name}")
          print(f"AIP XML URL        : {aip_xml_url}")
          print("")
          print(f"AIP KML filename   : {aip_kml_name}")
          print(f"AIP KML URL        : {aip_kml_url}")
          print("")
          print(f"VRP effective date : {vrp_csv_date}")
          print(f"VRP CSV filename   : {vrp_csv_name}")
          print(f"VRP CSV URL        : {vrp_url}")
          print("")

          open(
              "/tmp/nats-aip-xml-url.txt",
              "w"
          ).write(
              aip_xml_url
          )

          open(
              "/tmp/nats-aip-kml-url.txt",
              "w"
          ).write(
              aip_kml_url
          )

          open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ).write(
              vrp_url
          )

          open(
              "/tmp/nats-airac-date.txt",
              "w"
          ).write(
              str(aip_xml_date)
          )

          open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ).write(
              str(vrp_csv_date)
          )
          PY


      # ============================================================
      # DOWNLOAD NATS AIP XML + KML
      # ============================================================

      - name: Download NATS UK ICAO AIP dataset
        run: |
          set -euo pipefail

          mkdir -p /tmp/nats

          AIP_XML_URL=$(cat /tmp/nats-aip-xml-url.txt)
          AIP_KML_URL=$(cat /tmp/nats-aip-kml-url.txt)

          echo "=========================================="
          echo "Downloading NATS UK ICAO AIP dataset"
          echo "=========================================="
          echo ""
          echo "AIXM XML:"
          echo "${AIP_XML_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_XML_URL}" \
            -o /tmp/nats/aip.xml

          echo "KML:"
          echo "${AIP_KML_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_KML_URL}" \
            -o /tmp/nats/aip.kml

          test -s /tmp/nats/aip.xml
          test -s /tmp/nats/aip.kml

          echo ""
          echo "Downloaded files:"
          ls -lh /tmp/nats/


      # ============================================================
      # DOWNLOAD NATS VRP CSV
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "${VRP_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats/vrp-download

          test -s /tmp/nats/vrp-download

          echo "Downloaded file:"
          file /tmp/nats/vrp-download
          ls -lh /tmp/nats/vrp-download

          mkdir -p /tmp/nats/vrp-extract

          if unzip -t /tmp/nats/vrp-download >/dev/null 2>&1; then

            echo "VRP download is a ZIP archive."

            unzip \
              -o \
              /tmp/nats/vrp-download \
              -d /tmp/nats/vrp-extract

            VRP_CSV=$(find \
              /tmp/nats/vrp-extract \
              -type f \
              \( -iname "*.csv" -o -iname "*.CSV" \) \
              | head -n 1 || true)

            if [ -z "${VRP_CSV}" ]; then
              echo "ERROR: No CSV found in NATS VRP ZIP."
              find \
                /tmp/nats/vrp-extract \
                -type f \
                -print
              exit 1
            fi

            cp \
              "${VRP_CSV}" \
              /tmp/nats/vrps.csv

          else

            echo "VRP download is not a ZIP; checking whether it is a CSV."

            if head -n 1 \
              /tmp/nats/vrp-download \
              | grep -qi "latitude"; then

              cp \
                /tmp/nats/vrp-download \
                /tmp/nats/vrps.csv

            else

              echo "ERROR: NATS VRP download is neither a ZIP nor a CSV."
              exit 1

            fi

          fi

          test -s /tmp/nats/vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          wc -l /tmp/nats/vrps.csv
          ls -lh /tmp/nats/vrps.csv


      # ============================================================
      # CONVERT NATS AIP KML AIRSPACE TO GEOJSON
      # ============================================================

      - name: Convert NATS airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse(
              "/tmp/nats/aip.kml"
          )

          root = tree.getroot()

          def local(tag):
              return tag.split(
                  "}",
                  1
              )[-1].lower()

          def child_text(element, wanted):
              for child in element.iter():
                  if local(child.tag) == wanted.lower():
                      text = "".join(
                          child.itertext()
                      ).strip()

                      if text:
                          return text

              return ""

          def all_text(element):
              return " ".join(
                  text.strip()
                  for text in element.itertext()
                  if text and text.strip()
              )

          def parse_coordinates(text):
              coords = []

              for token in re.split(
                  r"\s+",
                  text.strip()
              ):
                  if not token:
                      continue

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:
                      lon = float(parts[0])
                      lat = float(parts[1])
                  except ValueError:
                      continue

                  if (
                      -180 <= lon <= 180
                      and
                      -90 <= lat <= 90
                  ):
                      coords.append([
                          lon,
                          lat
                      ])

              return coords

          def classify(text):
              t = text.upper()

              if re.search(
                  r"\b(PROHIBITED|RESTRICTED|DANGER)\b",
                  t
              ):
                  return "PRD"

              if re.search(
                  r"\bATZ\b",
                  t
              ):
                  return "ATZ"

              if re.search(
                  r"\bTMZ\b",
                  t
              ):
                  return "TMZ"

              if re.search(
                  r"\bMATZ\b",
                  t
              ):
                  return "MATZ"

              if re.search(
                  r"\bRMZ\b",
                  t
              ):
                  return "RMZ"

              if re.search(
                  r"\bCLASS\s*A\b",
                  t
              ):
                  return "CLASS_A"

              if re.search(
                  r"\bCLASS\s*[BCD]\b",
                  t
              ):
                  return "CONTROLLED"

              if re.search(
                  r"\b(CTA|CTR|TMA|CTZ|CONTROLLED)\b",
                  t
              ):
                  return "CONTROLLED"

              return "OTHER"

          def polygon_geometry(polygon):
              rings = []

              for child in polygon.iter():
                  if local(child.tag) != "coordinates":
                      continue

                  coords = parse_coordinates(
                      "".join(
                          child.itertext()
                      )
                  )

                  if len(coords) >= 3:

                      if coords[0] != coords[-1]:
                          coords.append(
                              coords[0]
                          )

                      rings.append(
                          coords
                      )

              if not rings:
                  return None

              return {
                  "type": "Polygon",
                  "coordinates": rings
              }

          features = []

          for placemark in root.iter():

              if local(
                  placemark.tag
              ) != "placemark":
                  continue

              name = child_text(
                  placemark,
                  "name"
              )

              description = child_text(
                  placemark,
                  "description"
              )

              searchable = " ".join([
                  name,
                  description,
                  all_text(placemark)
              ])

              geometries = []

              for polygon in placemark.iter():

                  if local(
                      polygon.tag
                  ) != "polygon":
                      continue

                  geometry = polygon_geometry(
                      polygon
                  )

                  if geometry:
                      geometries.append(
                          geometry
                      )

              if not geometries:
                  continue

              category = classify(
                  searchable
              )

              if category == "OTHER":

                  if not re.search(
                      r"\b(AIRSPACE|CLASS\s*[A-G]|ATZ|TMZ|MATZ|RMZ|"
                      r"CTA|CTR|TMA|CTZ|PROHIBITED|RESTRICTED|DANGER)\b",
                      searchable,
                      flags=re.I
                  ):
                      continue

              if len(geometries) == 1:

                  geometry = geometries[0]

              else:

                  geometry = {
                      "type": "MultiPolygon",
                      "coordinates": [
                          g["coordinates"]
                          for g in geometries
                      ]
                  }

              features.append({
                  "type": "Feature",
                  "properties": {
                      "name": (
                          name
                          or
                          "NATS airspace"
                      ),
                      "description": description,
                      "category": category,
                      "source": (
                          "NATS UK ICAO AIP Dataset"
                      ),
                      "airac": Path(
                          "/tmp/nats-airac-date.txt"
                      ).read_text().strip()
                  },
                  "geometry": geometry
              })

          if not features:
              raise SystemExit(
                  "ERROR: NATS AIP KML produced zero airspace polygons."
              )

          Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          counts = {}

          for feature in features:

              category = feature[
                  "properties"
              ][
                  "category"
              ]

              counts[category] = (
                  counts.get(
                      category,
                      0
                  )
                  + 1
              )

          print("")
          print("==========================================")
          print("NATS AIRSPACE RESULT")
          print("==========================================")
          print("")
          print(
              f"Airspace polygons: {len(features)}"
          )

          for category, count in sorted(
              counts.items()
          ):
              print(
                  f"  {category}: {count}"
              )
          PY


      # ============================================================
      # CONVERT NATS VRPS TO GEOJSON
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          print("")
          print("CSV fields:")

          for field in fields:
              print(
                  f"  {field}"
              )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).strip().lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in normalised:
                      return normalised[key]

              for key, original in normalised.items():

                  for name in names:

                      n = norm(
                          name
                      )

                      if (
                          n in key
                          or
                          key in n
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          print("")
          print("Detected fields:")
          print(
              f"  Name:      {name_field}"
          )
          print(
              f"  Latitude:  {lat_field}"
          )
          print(
              f"  Longitude: {lon_field}"
          )

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify NATS VRP latitude/longitude fields."
              )

          def parse_coord(value, latitude):

              if value is None:
                  return None

              text = str(
                  value
              ).strip()

              if not text:
                  return None

              text = text.replace(
                  ",",
                  "."
              )

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = match.group(
                      1
                  ).upper()

                  text = text[
                      :match.start()
                  ].strip()

              try:

                  number = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          number = -abs(
                              number
                          )

                      elif hemisphere in (
                          "N",
                          "E"
                      ):
                          number = abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              compact = (
                  text
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):

                  try:

                      if "." in compact:

                          integer_part, decimal_part = (
                              compact.split(
                                  ".",
                                  1
                              )
                          )

                      else:

                          integer_part = compact
                          decimal_part = ""

                      if latitude:

                          if len(
                              integer_part
                          ) < 6:
                              raise ValueError

                          degrees = int(
                              integer_part[:2]
                          )

                          minutes = int(
                              integer_part[2:4]
                          )

                          seconds_text = (
                              integer_part[4:]
                          )

                      else:

                          if len(
                              integer_part
                          ) < 7:
                              raise ValueError

                          degrees = int(
                              integer_part[:3]
                          )

                          minutes = int(
                              integer_part[3:5]
                          )

                          seconds_text = (
                              integer_part[5:]
                          )

                      if decimal_part:

                          seconds_text += (
                              "."
                              + decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      limit = (
                          90
                          if latitude
                          else 180
                      )

                      if degrees > limit:
                          raise ValueError

                      if (
                          minutes >= 60
                          or
                          seconds >= 60
                      ):
                          raise ValueError

                      result = (
                          degrees
                          + minutes / 60
                          + seconds / 3600
                      )

                      if hemisphere in (
                          "S",
                          "W"
                      ):

                          result = -abs(
                              result
                          )

                      elif hemisphere in (
                          "N",
                          "E"
                      ):

                          result = abs(
                              result
                          )

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):

                      pass

              try:

                  numbers = re.findall(
                      r"[-+]?\d+(?:\.\d+)?",
                      text
                  )

                  if not numbers:
                      return None

                  values = [
                      float(number)
                      for number in numbers
                  ]

                  degrees = abs(
                      values[0]
                  )

                  minutes = (
                      abs(values[1])
                      if len(values) > 1
                      else 0
                  )

                  seconds = (
                      abs(values[2])
                      if len(values) > 2
                      else 0
                  )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  if hemisphere in (
                      "S",
                      "W"
                  ):

                      result = -abs(
                          result
                      )

                  elif hemisphere in (
                      "N",
                      "E"
                  ):

                      result = abs(
                          result
                      )

                  elif values[0] < 0:

                      result = -result

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if not (
                      -limit
                      <= result
                      <= limit
                  ):
                      return None

                  return result

              except (
                  ValueError,
                  IndexError
              ):

                  return None

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              latitude = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              longitude = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  invalid += 1
                  continue

              if not (
                  -90
                  <= latitude
                  <= 90
              ):

                  invalid += 1
                  continue

              if not (
                  -180
                  <= longitude
                  <= 180
              ):

                  invalid += 1
                  continue

              name = ""

              if name_field:

                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              if not name:

                  name = (
                      f"VRP {index}"
                  )

              properties = {
                  str(k).strip(): v
                  for k, v in row.items()
                  if k
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          longitude,
                          latitude
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(
              f"CSV records:         {len(rows)}"
          )
          print(
              f"Valid VRPs:          {len(features)}"
          )
          print(
              f"Invalid coordinates: {invalid}"
          )
          print("")

          if len(features) == 0:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs. "
                  "Existing repository data will NOT be replaced."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated NATS airspace dataset is empty."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated NATS VRP dataset is empty."
            exit 1
          fi

          echo "Validation successful."
          echo "Existing repository data has not been changed yet."


      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated NATS data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          AviMap UK aviation data is sourced from NATS UK digital datasets.

          Airspace:
          - UK ICAO AIP Dataset
          - NATS AIP KML geometry
          - Corresponding NATS AIXM XML dataset

          Reporting points:
          - NATS Visual Reference Points (VRP) List

          The GitHub Actions workflow validates both generated datasets
          before replacing the repository data.
          EOF


      # ============================================================
      # COMMIT ONLY VALID DATA
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          echo ""
          echo "=========================================="
          echo "DATA CHANGE CHECK"
          echo "=========================================="
          echo ""

          if git diff --cached --quiet; then

            echo "No changes detected."
            echo "Existing aviation data remains untouched."

          else

            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push

            echo ""
            echo "=========================================="
            echo "NATS AVIATION DATA UPDATE COMPLETE"
            echo "=========================================="

          fi
