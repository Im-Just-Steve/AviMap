name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS AIP and VRP datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/digital-datasets/index.html"
          )

          html = open(
              "/tmp/nats.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href\s*=\s*["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(timezone.utc).date()

          def find_current(pattern):
              found = []

              for href in hrefs:
                  match = re.search(
                      pattern,
                      href,
                      flags=re.I
                  )

                  if not match:
                      continue

                  try:
                      date = datetime.strptime(
                          match.group(1),
                          "%Y%m%d"
                      ).date()
                  except ValueError:
                      continue

                  found.append(
                      (date, href)
                  )

              if not found:
                  return None

              current = [
                  item
                  for item in found
                  if item[0] <= today
              ]

              if current:
                  date, href = max(
                      current,
                      key=lambda item: item[0]
                  )
              else:
                  date, href = min(
                      found,
                      key=lambda item: item[0]
                  )

              return date, urljoin(BASE, href)

          aip_xml = find_current(
              r'EG_AIP_DS_FULL_(\d{8})\.XML$'
          )

          aip_kml = find_current(
              r'EG_AIP_DS_FULL_(\d{8})\.KML$'
          )

          vrp_csv = find_current(
              r'EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV$'
          )

          if not aip_xml:
              raise SystemExit(
                  "ERROR: Could not find a current NATS UK ICAO AIP XML dataset."
              )

          if not aip_kml:
              raise SystemExit(
                  "ERROR: Could not find a current NATS UK ICAO AIP KML dataset."
              )

          if not vrp_csv:
              raise SystemExit(
                  "ERROR: Could not find a current NATS VRP CSV dataset."
              )

          print("")
          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print("AIP XML:")
          print(aip_xml[0], aip_xml[1])
          print("")
          print("AIP KML:")
          print(aip_kml[0], aip_kml[1])
          print("")
          print("VRP CSV:")
          print(vrp_csv[0], vrp_csv[1])
          print("")

          open("/tmp/nats-aip-xml-url.txt", "w").write(aip_xml[1])
          open("/tmp/nats-aip-kml-url.txt", "w").write(aip_kml[1])
          open("/tmp/nats-vrp-url.txt", "w").write(vrp_csv[1])

          open("/tmp/nats-airac-date.txt", "w").write(
              str(aip_xml[0])
          )
          PY


      # ============================================================
      # DOWNLOAD NATS AIP DATA
      # ============================================================

      - name: Download NATS UK ICAO AIP dataset
        run: |
          set -euo pipefail

          mkdir -p /tmp/nats

          AIP_XML_URL=$(cat /tmp/nats-aip-xml-url.txt)
          AIP_KML_URL=$(cat /tmp/nats-aip-kml-url.txt)

          echo "=========================================="
          echo "Downloading NATS UK ICAO AIP dataset"
          echo "=========================================="

          echo ""
          echo "AIXM XML:"
          echo "${AIP_XML_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_XML_URL}" \
            -o /tmp/nats/aip.xml

          echo ""
          echo "KML:"
          echo "${AIP_KML_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_KML_URL}" \
            -o /tmp/nats/aip.kml

          test -s /tmp/nats/aip.xml
          test -s /tmp/nats/aip.kml

          echo ""
          echo "Downloaded files:"
          ls -lh /tmp/nats/


      # ============================================================
      # DOWNLOAD NATS VRP DATA
      # ============================================================

      - name: Download NATS VRP CSV
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="

          echo "${VRP_URL}"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats/vrps.csv

          test -s /tmp/nats/vrps.csv

          echo ""
          echo "VRP CSV:"
          ls -lh /tmp/nats/vrps.csv


      # ============================================================
      # CONVERT NATS AIP KML AIRSPACE TO GEOJSON
      #
      # NATS AIXM XML is downloaded and retained as the authoritative
      # dataset. The associated NATS KML supplies the polygon
      # geometry in a directly consumable form.
      # ============================================================

      - name: Convert NATS airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          KML = "/tmp/nats/aip.kml"

          tree = ET.parse(KML)
          root = tree.getroot()

          def local(tag):
              return tag.split("}", 1)[-1].lower()

          def child_text(element, wanted):
              for child in element.iter():
                  if local(child.tag) == wanted.lower():
                      text = "".join(child.itertext()).strip()
                      if text:
                          return text
              return ""

          def all_text(element):
              return " ".join(
                  text.strip()
                  for text in element.itertext()
                  if text and text.strip()
              )

          def parse_coordinates(text):
              coords = []

              for token in re.split(r"\s+", text.strip()):
                  if not token:
                      continue

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:
                      lon = float(parts[0])
                      lat = float(parts[1])
                  except ValueError:
                      continue

                  if -180 <= lon <= 180 and -90 <= lat <= 90:
                      coords.append([lon, lat])

              return coords

          def classify(text):
              t = text.upper()

              # P/R/D have priority over generic controlled terms.
              if re.search(r"\b(PROHIBITED|RESTRICTED|DANGER)\b", t):
                  return "PRD"

              if re.search(r"\bP[\s-]?(AREA|ZONE)?\b", t):
                  return "PRD"

              if re.search(r"\bR[\s-]?(AREA|ZONE)?\b", t):
                  return "PRD"

              if re.search(r"\bD[\s-]?(AREA|ZONE)?\b", t):
                  return "PRD"

              if re.search(r"\bATZ\b", t):
                  return "ATZ"

              if re.search(r"\bTMZ\b", t):
                  return "TMZ"

              if re.search(r"\bMATZ\b", t):
                  return "MATZ"

              if re.search(r"\bRMZ\b", t):
                  return "RMZ"

              if re.search(r"\bCLASS\s*A\b", t):
                  return "CLASS_A"

              if re.search(r"\bCLASS\s*[BCD]\b", t):
                  return "CONTROLLED"

              if re.search(
                  r"\b(CTA|CTR|TMA|CTZ|CTA\/CTR|CONTROLLED)\b",
                  t
              ):
                  return "CONTROLLED"

              return "OTHER"

          def geometry_from_polygon(polygon):
              rings = []

              for child in polygon.iter():
                  if local(child.tag) != "coordinates":
                      continue

                  coords = parse_coordinates(
                      "".join(child.itertext())
                  )

                  if len(coords) >= 3:
                      if coords[0] != coords[-1]:
                          coords.append(coords[0])

                      rings.append(coords)

              if not rings:
                  return None

              # KML first ring is normally the outer boundary.
              # Additional rings are holes.
              return {
                  "type": "Polygon",
                  "coordinates": rings
              }

          features = []

          for placemark in root.iter():
              if local(placemark.tag) != "placemark":
                  continue

              name = child_text(
                  placemark,
                  "name"
              )

              description = child_text(
                  placemark,
                  "description"
              )

              extended = all_text(
                  placemark
              )

              searchable = " ".join(
                  [
                      name,
                      description,
                      extended
                  ]
              )

              geometries = []

              for polygon in placemark.iter():
                  if local(polygon.tag) != "polygon":
                      continue

                  geometry = geometry_from_polygon(
                      polygon
                  )

                  if geometry:
                      geometries.append(
                          geometry
                      )

              if not geometries:
                  continue

              # We only want polygonal airspace-type records.
              # The NATS AIP KML contains other AIP information;
              # obvious non-airspace records are ignored.
              category = classify(searchable)

              if category == "OTHER":
                  airspace_hint = re.search(
                      r"\b(AIRSPACE|ATZ|TMZ|MATZ|RMZ|CTA|CTR|TMA|CTZ|"
                      r"PROHIBITED|RESTRICTED|DANGER|CLASS\s*[A-G])\b",
                      searchable,
                      flags=re.I
                  )

                  if not airspace_hint:
                      continue

              if len(geometries) == 1:
                  geometry = geometries[0]
              else:
                  geometry = {
                      "type": "MultiPolygon",
                      "coordinates": [
                          geometry["coordinates"]
                          for geometry in geometries
                      ]
                  }

              properties = {
                  "name": name or "NATS airspace",
                  "description": description,
                  "category": category,
                  "source": "NATS UK ICAO AIP Dataset",
                  "airac": Path(
                      "/tmp/nats-airac-date.txt"
                  ).read_text().strip()
              }

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": geometry
              })

          if not features:
              raise SystemExit(
                  "ERROR: NATS AIP KML produced zero airspace polygons."
              )

          output = {
              "type": "FeatureCollection",
              "features": features
          }

          Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          ).write_text(
              json.dumps(
                  output,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          counts = {}

          for feature in features:
              category = feature["properties"]["category"]
              counts[category] = counts.get(category, 0) + 1

          print("")
          print("==========================================")
          print("NATS AIRSPACE RESULT")
          print("==========================================")
          print("")
          print(f"Airspace polygons: {len(features)}")

          for category, count in sorted(counts.items()):
              print(f"  {category}: {count}")
          PY


      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(rows[0].keys())

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).strip().lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):
              for name in names:
                  key = norm(name)

                  if key in normalised:
                      return normalised[key]

              for key, original in normalised.items():
                  for name in names:
                      n = norm(name)

                      if n in key or key in n:
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify NATS VRP latitude/longitude fields."
              )

          def parse_coord(value, latitude):
              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              text = text.replace(",", ".")

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:
                  hemisphere = match.group(1).upper()
                  text = text[:match.start()].strip()

              # Decimal degrees.
              try:
                  number = float(text)

                  limit = 90 if latitude else 180

                  if -limit <= number <= limit:
                      if hemisphere in ("S", "W"):
                          number = -abs(number)
                      elif hemisphere in ("N", "E"):
                          number = abs(number)

                      return number
              except ValueError:
                  pass

              compact = (
                  text
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              # NATS compact DDMMSS / DDDMMSS.
              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):
                  try:
                      if "." in compact:
                          integer_part, decimal_part = compact.split(
                              ".",
                              1
                          )
                      else:
                          integer_part = compact
                          decimal_part = ""

                      if latitude:
                          if len(integer_part) < 6:
                              raise ValueError

                          degrees = int(integer_part[:2])
                          minutes = int(integer_part[2:4])
                          seconds_text = integer_part[4:]
                      else:
                          if len(integer_part) < 7:
                              raise ValueError

                          degrees = int(integer_part[:3])
                          minutes = int(integer_part[3:5])
                          seconds_text = integer_part[5:]

                      if decimal_part:
                          seconds_text += "." + decimal_part

                      seconds = float(seconds_text)

                      limit = 90 if latitude else 180

                      if degrees > limit:
                          raise ValueError

                      if minutes >= 60 or seconds >= 60:
                          raise ValueError

                      result = (
                          degrees
                          + minutes / 60
                          + seconds / 3600
                      )

                      if hemisphere in ("S", "W"):
                          result = -abs(result)
                      elif hemisphere in ("N", "E"):
                          result = abs(result)

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):
                      pass

              # Conventional DMS fallback.
              try:
                  numbers = re.findall(
                      r"[-+]?\d+(?:\.\d+)?",
                      text
                  )

                  if not numbers:
                      return None

                  values = [
                      float(number)
                      for number in numbers
                  ]

                  degrees = abs(values[0])
                  minutes = abs(values[1]) if len(values) > 1 else 0
                  seconds = abs(values[2]) if len(values) > 2 else 0

                  if minutes >= 60 or seconds >= 60:
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  if hemisphere in ("S", "W"):
                      result = -abs(result)
                  elif hemisphere in ("N", "E"):
                      result = abs(result)
                  elif values[0] < 0:
                      result = -result

                  limit = 90 if latitude else 180

                  if not -limit <= result <= limit:
                      return None

                  return result

              except (
                  ValueError,
                  IndexError
              ):
                  return None

          features = []
          invalid = 0

          for index, row in enumerate(rows, 1):
              latitude = parse_coord(
                  row.get(lat_field),
                  True
              )

              longitude = parse_coord(
                  row.get(lon_field),
                  False
              )

              if latitude is None or longitude is None:
                  invalid += 1
                  continue

              if not -90 <= latitude <= 90:
                  invalid += 1
                  continue

              if not -180 <= longitude <= 180:
                  invalid += 1
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(name_field, "")
                  ).strip()

              if not name:
                  name = f"VRP {index}"

              properties = {
                  str(k).strip(): v
                  for k, v in row.items()
                  if k
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          longitude,
                          latitude
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(f"CSV records:         {len(rows)}")
          print(f"Valid VRPs:          {len(features)}")
          print(f"Invalid coordinates: {invalid}")
          print("")

          # HARD SAFETY CHECK.
          if len(features) == 0:
              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs. "
                  "Existing repository data will NOT be replaced."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate NATS generated data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: NATS airspace dataset is empty."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: NATS VRP dataset is empty."
            exit 1
          fi

          echo "Validation successful."
          echo "Existing repository data has not been changed yet."


      # ============================================================
      # ONLY NOW REPLACE REPOSITORY DATA
      # ============================================================

      - name: Install validated NATS data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          Aviation data is sourced from NATS UK digital datasets.

          Airspace:
          - UK ICAO AIP Dataset
          - NATS AIP KML geometry
          - NATS AIXM XML dataset downloaded during the same workflow

          Reporting points:
          - NATS Visual Reference Points (VRP) List

          The GitHub Actions workflow validates that both datasets contain
          features before replacing the repository data.
          EOF


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          echo ""
          echo "=========================================="
          echo "DATA CHANGE CHECK"
          echo "=========================================="
          echo ""

          if git diff --cached --quiet; then

            echo "No changes detected."
            echo "Existing aviation data remains untouched."

          else

            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push

            echo ""
            echo "=========================================="
            echo "NATS AVIATION DATA UPDATE COMPLETE"
            echo "=========================================="

          fi
