name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download UK airspace from OpenAIP
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -e

          mkdir -p data

          echo "Requesting UK airspace from OpenAIP..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=1" \
            -o /tmp/openaip-page.json

          echo "OpenAIP response received."

          echo "Response summary:"
          jq '{
            totalCount: .totalCount,
            totalPages: .totalPages,
            page: .page,
            limit: .limit,
            items: (.items | length)
          }' /tmp/openaip-page.json

          COUNT=$(jq '.items | length' /tmp/openaip-page.json)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: OpenAIP returned zero UK airspaces."
            exit 1
          fi

          echo "First page contains $COUNT airspaces."

      - name: Download all UK airspace pages
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -e

          rm -f /tmp/all-airspaces.jsonl

          TOTAL_PAGES=$(jq -r '.totalPages // 1' /tmp/openaip-page.json)

          echo "OpenAIP reports $TOTAL_PAGES pages."

          PAGE=1

          while [ "$PAGE" -le "$TOTAL_PAGES" ]; do

            echo ""
            echo "Downloading page $PAGE of $TOTAL_PAGES..."

            if [ "$PAGE" -eq 1 ]; then
              cp /tmp/openaip-page.json "/tmp/page-${PAGE}.json"
            else
              curl \
                --fail \
                --silent \
                --show-error \
                --retry 3 \
                --retry-delay 5 \
                -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
                -H "Accept: application/json" \
                "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=${PAGE}" \
                -o "/tmp/page-${PAGE}.json"
            fi

            COUNT=$(jq '.items | length' "/tmp/page-${PAGE}.json")

            echo "Page $PAGE contains $COUNT airspaces."

            jq -c '.items[]' "/tmp/page-${PAGE}.json" >> /tmp/all-airspaces.jsonl

            PAGE=$((PAGE + 1))

          done

          TOTAL=$(wc -l < /tmp/all-airspaces.jsonl)

          echo ""
          echo "========================================="
          echo "Total downloaded airspaces: $TOTAL"
          echo "========================================="

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No airspace records were downloaded."
            exit 1
          fi

      - name: Convert OpenAIP airspace to GeoJSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const input = "/tmp/all-airspaces.jsonl";
          const output = "data/uk-airspace.geojson";

          const lines = fs.readFileSync(input, "utf8")
            .split(/\r?\n/)
            .filter(Boolean);

          console.log(`Processing ${lines.length} OpenAIP airspace records...`);

          const features = [];

          for (const line of lines) {
            const item = JSON.parse(line);

            let geometry = item.geometry;

            if (typeof geometry === "string") {
              try {
                geometry = JSON.parse(geometry);
              } catch {
                continue;
              }
            }

            if (!geometry || !geometry.type || !geometry.coordinates) {
              continue;
            }

            features.push({
              type: "Feature",
              id: item._id || item.id,

              properties: {
                id: item._id || item.id || "",
                name: item.name || "Unknown airspace",
                type: item.type ?? "",
                icaoClass: item.icaoClass ?? "",
                activity: item.activity ?? "",
                upperLimit: item.upperLimit ?? null,
                lowerLimit: item.lowerLimit ?? null,
                country: item.country ?? "GB"
              },

              geometry: geometry
            });
          }

          if (features.length === 0) {
            throw new Error(
              "Conversion produced zero GeoJSON features."
            );
          }

          const geojson = {
            type: "FeatureCollection",
            features: features
          };

          fs.writeFileSync(
            output,
            JSON.stringify(geojson)
          );

          console.log(
            `Created ${features.length} GeoJSON airspace features.`
          );
          NODE

      - name: Validate GeoJSON
        run: |
          set -e

          echo "Validating generated GeoJSON..."

          TYPE=$(jq -r '.type' data/uk-airspace.geojson)
          COUNT=$(jq '.features | length' data/uk-airspace.geojson)

          echo "GeoJSON type: $TYPE"
          echo "GeoJSON features: $COUNT"

          if [ "$TYPE" != "FeatureCollection" ]; then
            echo "ERROR: Invalid GeoJSON type."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: GeoJSON contains zero features."
            exit 1
          fi

          echo "GeoJSON validation successful."

      - name: Commit updated airspace data
        run: |
          set -e

          git config user.name "AviMap Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/uk-airspace.geojson

          if git diff --cached --quiet; then
            echo "No changes to UK airspace data."
          else
            git commit -m "Update UK airspace data"
            git push
          fi
