          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          files = [
              Path(
                  "data/uk-airspace.geojson"
              ),
              Path(
                  "data/uk-reporting-points.geojson"
              )
          ]

          for path in files:

              print("")
              print(
                  "Validating:",
                  path
              )

              if not path.exists():
                  print(
                      "ERROR: File does not exist."
                  )
                  sys.exit(1)

              try:

                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception as exc:

                  print(
                      "ERROR: Invalid JSON:",
                      exc
                  )

                  sys.exit(1)

              if data.get(
                  "type"
              ) != "FeatureCollection":

                  print(
                      "ERROR: Not a FeatureCollection."
                  )

                  sys.exit(1)

              features = data.get(
                  "features"
              )

              if not isinstance(
                  features,
                  list
              ):

                  print(
                      "ERROR: features is not a list."
                  )

                  sys.exit(1)

              if not features:

                  print(
                      "ERROR: FeatureCollection is empty."
                  )

                  sys.exit(1)

              for feature in features:

                  if feature.get(
                      "type"
                  ) != "Feature":

                      print(
                          "ERROR: Invalid Feature."
                      )

                      sys.exit(1)

                  if not feature.get(
                      "geometry"
                  ):

                      print(
                          "ERROR: Feature has no geometry."
                      )

                      sys.exit(1)

              print(
                  f"Valid features: {len(features)}"
              )

          print("")
          print(
              "All generated GeoJSON passed validation."
          )
