      # ============================================================
      # NATS MATZ / CMATZ
      #
      # Hard-coded from UK AIP ENR 2.2 for AviMap's MSFS simulation
      # use case.
      #
      # Standard MATZ:
      #   Core: 5 NM radius, SFC-3000 FT AAL
      #   Stub: 5 NM from the core along the published runway heading,
      #         4 NM wide (2 NM each side), 1000-3000 FT AAL
      #
      # NATS explicitly lists several non-standard cases. Those are
      # represented by the overrides below rather than inferred from
      # the AIXM airspace dataset.
