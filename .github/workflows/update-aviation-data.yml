name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3 \
            python3-shapely


      # ============================================================
      # DISCOVER CURRENT NATS DATASETS
      # ============================================================

      - name: Discover current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin


          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()


          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []


              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []


              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:
                      self.text.append(
                          data
                      )


              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )


          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )


          def is_aip_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGAIPDSFULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "AIP" in value
                      and
                      (
                          "XML" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          def is_vrp_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "VRP" in value
                      and
                      (
                          "CSV" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          print(
              "=========================================="
          )

          print(
              "NATS DATASET DISCOVERY"
          )

          print(
              "=========================================="
          )


          checklist_body = None
          checklist_url = None


          for offset in range(90):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]


              for candidate in candidates:

                  try:

                      body, _ = fetch(
                          candidate
                      )

                  except Exception:

                      continue


                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )


                  if (
                      "EG_AIP_DS_FULL_"
                      in text
                      and
                      "EG_VRP_DS_AREA1_FULL_"
                      in text
                  ):

                      checklist_body = body
                      checklist_url = candidate

                      break


              if checklist_body is not None:
                  break


          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find current NATS Dataset Checklist."
              )


          print(
              "Checklist:",
              checklist_url
          )


          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )


          # --------------------------------------------------------
          # AIP AIRAC
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )


          aip_dates = []


          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )


          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )


          # --------------------------------------------------------
          # VRP AIRAC
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )


          vrp_dates = []


          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )


          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )


          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "VRP AIRAC:",
              vrp_stamp
          )


          # --------------------------------------------------------
          # DISCOVER DOWNLOAD LINKS
          # --------------------------------------------------------

          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )


          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Dataset index unavailable:",
                  exc
              )

              index_links = []


          aip_links = []
          vrp_links = []
          seen = set()


          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)


              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )


              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )


          # --------------------------------------------------------
          # FOLLOW AIP DATASET PAGES
          # --------------------------------------------------------

          for url, text in list(
              aip_links
          ):

              lower = url.lower()


              if not (
                  lower.endswith(
                      ".html"
                  )
                  or
                  lower.endswith(
                      ".htm"
                  )
                  or
                  lower.endswith(
                      "/"
                  )
              ):

                  continue


              try:

                  body, _ = fetch(
                      url
                  )


                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          aip_links.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )


              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )


          def unique_links(
              links
          ):

              result = []
              seen_urls = set()


              for url, text in links:

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  result.append(
                      (
                          url,
                          text
                      )
                  )


              return result


          aip_links = unique_links(
              aip_links
          )

          vrp_links = unique_links(
              vrp_links
          )


          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "AIP candidates:"
          )

          for url, text in aip_links:

              print(
                  text,
                  "=>",
                  url
              )


          print("")
          print(
              "VRP candidates:"
          )

          for url, text in vrp_links:

              print(
                  text,
                  "=>",
                  url
              )


          if not aip_links:

              raise SystemExit(
                  "ERROR: No AIP download candidate found."
              )


          if not vrp_links:

              raise SystemExit(
                  "ERROR: No VRP download candidate found."
              )

          PY


      # ============================================================
      # DOWNLOAD NATS AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip

          mkdir -p /tmp/nats-aip

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing NATS AIP URL:"
            echo "${URL}"


            rm -f /tmp/nats-aip-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-aip-download


            if file /tmp/nats-aip-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip

              mkdir -p /tmp/nats-aip


              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip


              echo ""
              echo "AIP archive contents:"

              find \
                /tmp/nats-aip \
                -type f \
                -print


              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )


              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS AIP download failed."

            exit 1

          fi


          echo ""
          echo "AIP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-aip.xml


          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY



      # ============================================================
      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-vrp

          mkdir -p /tmp/nats-vrp

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing NATS VRP URL:"
            echo "${URL}"


            rm -f /tmp/nats-vrp-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-vrp-download


            if file /tmp/nats-vrp-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-vrp

              mkdir -p /tmp/nats-vrp


              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp


              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )


              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-vrp-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS VRP download failed."

            exit 1

          fi


          echo ""
          echo "VRP source:"
          echo "${FOUND}"


          head \
            -n 10 \
            /tmp/uk-vrps.csv


      # ============================================================
      # IMPORT ALL NATS AIRSPACE
      #
      # IMPORTANT:
      #
      # NO CLASSIFICATION FILTERING.
      #
      # The converter deliberately starts with the known-good
      # geometry-discovery approach and then adds reference
      # resolution and curve handling around it.
      # ============================================================

      - name: Convert ALL NATS AIXM airspace
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data


          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path


          XML_FILE = "/tmp/uk-aip.xml"

          OUTPUT_FILE = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          # ========================================================
          # XML SETUP
          # ========================================================

          tree = ET.parse(
              XML_FILE
          )

          root = tree.getroot()


          def local(
              tag
          ):

              return tag.rsplit(
                  "}",
                  1
              )[-1]


          def attr_local(
              element,
              wanted
          ):

              wanted = wanted.lower()


              for key, value in element.attrib.items():

                  if (
                      local(
                          key
                      ).lower()
                      ==
                      wanted
                  ):

                      return value


              return None


          # --------------------------------------------------------
          # Parent map
          # --------------------------------------------------------

          parent_map = {}


          for parent in root.iter():

              for child in parent:

                  parent_map[
                      child
                  ] = parent


          # --------------------------------------------------------
          # Build a very broad ID index.
          #
          # AIXM/GML references can use gml:id, uuid or other local
          # identifiers. We index all of them.
          # --------------------------------------------------------

          id_index = {}


          def add_id(
              value,
              element
          ):

              if not value:
                  return


              value = value.strip()


              if not value:
                  return


              id_index[
                  value
              ] = element


              id_index[
                  value.lstrip("#")
              ] = element


              if value.startswith(
                  "urn:uuid:"
              ):

                  short = value[
                      len("urn:uuid:"):
                  ]

                  id_index[
                      short
                  ] = element


              if "#" in value:

                  fragment = value.rsplit(
                      "#",
                      1
                  )[-1]

                  id_index[
                      fragment
                  ] = element


          for element in root.iter():

              for key, value in element.attrib.items():

                  lname = local(
                      key
                  ).lower()


                  if lname in {
                      "id",
                      "uuid",
                      "identifier",
                      "href"
                  }:

                      add_id(
                          value,
                          element
                      )


          print("")
          print(
              "Indexed XML references:",
              len(
                  id_index
              )
          )


          # ========================================================
          # REFERENCE RESOLUTION
          # ========================================================

          def href_value(
              element
          ):

              if element is None:
                  return None


              for key, value in element.attrib.items():

                  lname = local(
                      key
                  ).lower()


                  if lname == "href":

                      return value


              return None


          def resolve_reference(
              value
          ):

              if not value:
                  return None


              candidates = []


              value = value.strip()


              candidates.append(
                  value
              )

              candidates.append(
                  value.lstrip("#")
              )


              if "#" in value:

                  candidates.append(
                      value.rsplit(
                          "#",
                          1
                      )[-1]
                  )


              if value.startswith(
                  "urn:uuid:"
              ):

                  candidates.append(
                      value[
                          len("urn:uuid:"):
                      ]
                  )


              for candidate in candidates:

                  if candidate in id_index:

                      return id_index[
                          candidate
                      ]


              # Last-resort suffix matching.

              short = candidates[-1]


              for key, element in id_index.items():

                  if key.endswith(
                      short
                  ):

                      return element


              return None


          def reference_target(
              element
          ):

              return resolve_reference(
                  href_value(
                      element
                  )
              )


          # ========================================================
          # RECURSIVE GRAPH WALK
          #
          # This is the important recovery mechanism.
          #
          # Instead of assuming the geometry is directly below
          # Airspace, we walk all reachable AIXM objects.
          # ========================================================

          def reachable_objects(
              start,
              maximum=20000
          ):

              result = []

              queue = [
                  start
              ]

              seen = set()


              while queue:

                  current = queue.pop()


                  if current is None:

                      continue


                  marker = id(
                      current
                  )


                  if marker in seen:

                      continue


                  seen.add(
                      marker
                  )


                  result.append(
                      current
                  )


                  if len(
                      result
                  ) >= maximum:

                      break


                  # The current object itself may be an xlink
                  # reference.

                  target = reference_target(
                      current
                  )


                  if target is not None:

                      queue.append(
                          target
                      )


                  # Follow every xlink underneath it.

                  for child in current.iter():

                      target = reference_target(
                          child
                      )


                      if target is not None:

                          queue.append(
                              target
                          )


              return result


          # ========================================================
          # COORDINATE PARSING
          # ========================================================

          def inherited_srs(
              element
          ):

              current = element


              for _ in range(
                  60
              ):

                  if current is None:

                      break


                  value = attr_local(
                      current,
                      "srsName"
                  )


                  if value:

                      return value


                  current = parent_map.get(
                      current
                  )


              return "EPSG:4326"


          def dimension(
              element
          ):

              value = (
                  attr_local(
                      element,
                      "srsDimension"
                  )
                  or
                  attr_local(
                      element,
                      "dimension"
                  )
              )


              try:

                  return max(
                      2,
                      int(
                          value
                      )
                  )

              except (
                  TypeError,
                  ValueError
              ):

                  return 2


          def number_list(
              text
          ):

              if not text:

                  return []


              values = []


              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:

                      continue


                  try:

                      values.append(
                          float(
                              token
                          )
                      )

                  except ValueError:

                      pass


              return values


          def convert_xy(
              first,
              second,
              srs
          ):

              srs = (
                  srs
                  or
                  "EPSG:4326"
              ).upper()


              # AIXM commonly uses EPSG:4326 where the coordinate
              # order is latitude, longitude.
              #
              # GeoJSON always wants longitude, latitude.

              if (
                  "4326" in srs
                  and
                  "CRS84" not in srs
              ):

                  return [
                      second,
                      first
                  ]


              return [
                  first,
                  second
              ]


          def extract_positions(
              element
          ):

              result = []


              for node in element.iter():

                  name = local(
                      node.tag
                  )


                  if name == "posList":

                      if not node.text:

                          continue


                      values = number_list(
                          node.text
                      )


                      dim = dimension(
                          node
                      )


                      srs = inherited_srs(
                          node
                      )


                      for i in range(
                          0,
                          len(values),
                          dim
                      ):

                          point = values[
                              i:
                              i + dim
                          ]


                          if len(
                              point
                          ) < 2:

                              continue


                          result.append(
                              convert_xy(
                                  point[0],
                                  point[1],
                                  srs
                              )
                          )


                  elif name == "pos":

                      if not node.text:

                          continue


                      values = number_list(
                          node.text
                      )


                      if len(
                          values
                      ) < 2:

                          continue


                      result.append(
                          convert_xy(
                              values[0],
                              values[1],
                              inherited_srs(
                                  node
                              )
                          )
                      )


                  elif name == "coordinates":

                      if not node.text:

                          continue


                      for token in re.split(
                          r"\s+",
                          node.text.strip()
                      ):

                          bits = token.split(
                              ","
                          )


                          if len(
                              bits
                          ) < 2:

                              continue


                          try:

                              first = float(
                                  bits[0]
                              )

                              second = float(
                                  bits[1]
                              )

                          except ValueError:

                              continue


                          result.append(
                              convert_xy(
                                  first,
                                  second,
                                  inherited_srs(
                                      node
                                  )
                              )
                          )


              return result


          # ========================================================
          # NUMERIC HELPERS
          # ========================================================

          def numeric(
              element,
              names
          ):

              wanted = {
                  x.lower()
                  for x in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      try:

                          return float(
                              node.text.strip()
                          )

                      except ValueError:

                          pass


              return None


          def radius_metres(
              element
          ):

              radius_node = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) == "radius":

                      radius_node = node

                      break


              if radius_node is None:

                  return None


              if not radius_node.text:

                  return None


              try:

                  radius = float(
                      radius_node.text.strip()
                  )

              except ValueError:

                  return None


              unit = (
                  attr_local(
                      radius_node,
                      "uom"
                  )
                  or
                  "m"
              ).lower()


              if unit in {
                  "km",
                  "kilometre",
                  "kilometres",
                  "kilometer",
                  "kilometers"
              }:

                  radius *= 1000.0


              elif unit in {
                  "nm",
                  "nmi",
                  "[nmi_i]"
              }:

                  radius *= 1852.0


              return radius


          # ========================================================
          # CIRCLE
          # ========================================================

          def make_circle(
              element
          ):

              center = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":

                      continue


                  pts = extract_positions(
                      node
                  )


                  if pts:

                      center = pts[0]

                      break


              if center is None:

                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:

                  return []


              result = []


              # 2.5-degree spacing gives a smooth circle while
              # keeping the resulting GeoJSON manageable.

              steps = 144


              lat0 = center[1]
              lon0 = center[0]


              for i in range(
                  steps + 1
              ):

                  bearing = (
                      i
                      *
                      360.0
                      /
                      steps
                  )


                  radians = math.radians(
                      bearing
                  )


                  latitude = (
                      lat0
                      +
                      (
                          radius
                          *
                          math.cos(
                              radians
                          )
                          /
                          111320.0
                      )
                  )


                  metres_per_degree_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  lat0
                              )
                          )
                      )
                  )


                  longitude = (
                      lon0
                      +
                      (
                          radius
                          *
                          math.sin(
                              radians
                          )
                          /
                          metres_per_degree_lon
                      )
                  )


                  result.append(
                      [
                          longitude,
                          latitude
                      ]
                  )


              return result


          # ========================================================
          # ARC
          #
          # Bearings are clockwise from true north.
          # ========================================================

          def make_arc(
              element
          ):

              center = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":

                      continue


                  pts = extract_positions(
                      node
                  )


                  if pts:

                      center = pts[0]

                      break


              if center is None:

                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:

                  return []


              start = numeric(
                  element,
                  {
                      "startAngle"
                  }
              )


              end = numeric(
                  element,
                  {
                      "endAngle"
                  }
              )


              if (
                  start is None
                  or
                  end is None
              ):

                  return []


              sweep = (
                  end
                  -
                  start
              )


              if abs(
                  sweep
              ) < 0.000001:

                  sweep = 360.0


              steps = max(
                  8,
                  min(
                      720,
                      int(
                          abs(
                              sweep
                          )
                          /
                          2.0
                      )
                  )
              )


              result = []


              lat0 = center[1]
              lon0 = center[0]


              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i
                      /
                      steps
                  )


                  bearing = (
                      start
                      +
                      (
                          sweep
                          *
                          fraction
                      )
                  )


                  radians = math.radians(
                      bearing
                  )


                  latitude = (
                      lat0
                      +
                      (
                          radius
                          *
                          math.cos(
                              radians
                          )
                          /
                          111320.0
                      )
                  )


                  metres_per_degree_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  lat0
                              )
                          )
                      )
                  )


                  longitude = (
                      lon0
                      +
                      (
                          radius
                          *
                          math.sin(
                              radians
                          )
                          /
                          metres_per_degree_lon
                      )
                  )


                  result.append(
                      [
                          longitude,
                          latitude
                      ]
                  )


              return result


          # ========================================================
          # CURVE EXTRACTION
          # ========================================================

          def curve_points(
              curve
          ):

              resolved = resolve_reference(
                  href_value(
                      curve
                  )
              )


              target = (
                  resolved
                  if resolved is not None
                  else
                  curve
              )


              # Circle.

              for node in target.iter():

                  name = local(
                      node.tag
                  )


                  if name in {
                      "CircleByCenterPoint",
                      "Circle"
                  }:

                      points = make_circle(
                          node
                      )


                      if points:

                          return points


              # Arc.

              for node in target.iter():

                  name = local(
                      node.tag
                  )


                  if name in {
                      "ArcByCenterPoint"
                  }:

                      points = make_arc(
                          node
                      )


                      if points:

                          return points


              # Normal straight/geodesic segment.

              for node in target.iter():

                  name = local(
                      node.tag
                  )


                  if name in {
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcString",
                      "ArcStringByBulge"
                  }:

                      points = extract_positions(
                          node
                      )


                      if len(
                          points
                      ) >= 2:

                          return points


              # Last resort.

              points = extract_positions(
                  target
              )


              if len(
                  points
              ) >= 2:

                  return points


              return []


          # ========================================================
          # RING EXTRACTION
          # ========================================================

          def ring_points(
              ring
          ):

              # ----------------------------------------------------
              # First: direct coordinate ring.
              # This is the known-good/simple path.
              # ----------------------------------------------------

              direct = extract_positions(
                  ring
              )


              if len(
                  direct
              ) >= 4:

                  if (
                      direct[0]
                      !=
                      direct[-1]
                  ):

                      direct.append(
                          direct[0]
                      )


                  return direct


              # ----------------------------------------------------
              # Second: curve members.
              # ----------------------------------------------------

              curve_members = []


              for node in ring.iter():

                  if local(
                      node.tag
                  ) != "curveMember":

                      continue


                  target = reference_target(
                      node
                  )


                  if target is not None:

                      curve_members.append(
                          target
                      )

                      continue


                  # Inline curve.

                  for child in node:

                      if local(
                          child.tag
                      ) in {
                          "Curve",
                          "LineStringSegment",
                          "GeodesicString",
                          "Geodesic",
                          "ArcString",
                          "ArcStringByBulge"
                      }:

                          curve_members.append(
                              child
                          )


              joined = []


              def same_point(
                  a,
                  b
              ):

                  return (
                      abs(
                          a[0] - b[0]
                      )
                      <
                      1e-8
                      and
                      abs(
                          a[1] - b[1]
                      )
                      <
                      1e-8
                  )


              def append_segment(
                  segment
              ):

                  if not segment:

                      return


                  if not joined:

                      joined.extend(
                          segment
                      )

                      return


                  if same_point(
                      joined[-1],
                      segment[0]
                  ):

                      joined.extend(
                          segment[1:]
                      )

                      return


                  if same_point(
                      joined[-1],
                      segment[-1]
                  ):

                      reversed_segment = list(
                          reversed(
                              segment
                          )
                      )

                      joined.extend(
                          reversed_segment[1:]
                      )

                      return


                  # A gap exists. Do not discard the segment.

                  joined.extend(
                      segment
                  )


              for curve in curve_members:

                  append_segment(
                      curve_points(
                          curve
                      )
                  )


              if len(
                  joined
              ) >= 3:

                  if not same_point(
                      joined[0],
                      joined[-1]
                  ):

                      joined.append(
                          joined[0]
                      )


                  return joined


              return []


          # ========================================================
          # PATCH EXTRACTION
          # ========================================================

          def polygon_patches_from_object(
              object_node
          ):

              patches = []


              for node in object_node.iter():

                  if local(
                      node.tag
                  ) == "PolygonPatch":

                      patches.append(
                          node
                      )


              return patches


          def polygon_from_patch(
              patch
          ):

              outer = None
              holes = []


              # Exterior.

              for node in patch.iter():

                  if local(
                      node.tag
                  ) != "exterior":

                      continue


                  for child in node.iter():

                      if local(
                          child.tag
                      ) in {
                          "LinearRing",
                          "Ring"
                      }:

                          outer = child

                          break


                  if outer is not None:

                      break


              if outer is None:

                  return None


              outer_points = ring_points(
                  outer
              )


              if len(
                  outer_points
              ) < 4:

                  return None


              # Interiors.

              for node in patch.iter():

                  if local(
                      node.tag
                  ) != "interior":

                      continue


                  for child in node.iter():

                      if local(
                          child.tag
                      ) in {
                          "LinearRing",
                          "Ring"
                      }:

                          points = ring_points(
                              child
                          )


                          if len(
                              points
                          ) >= 4:

                              holes.append(
                                  points
                              )


                          break


              return [
                  outer_points
              ] + holes


          # ========================================================
          # AIRSPACE GEOMETRY
          # ========================================================

          def geometry_for_airspace(
              airspace
          ):

              reachable = reachable_objects(
                  airspace
              )


              # ----------------------------------------------------
              # Primary path:
              # Find any PolygonPatch reachable from the Airspace.
              # ----------------------------------------------------

              patches = []


              seen_patch = set()


              for object_node in reachable:

                  for patch in polygon_patches_from_object(
                      object_node
                  ):

                      marker = id(
                          patch
                      )


                      if marker in seen_patch:

                          continue


                      seen_patch.add(
                          marker
                      )


                      patches.append(
                          patch
                      )


              polygons = []


              for patch in patches:

                  polygon = polygon_from_patch(
                      patch
                  )


                  if polygon is not None:

                      polygons.append(
                          polygon
                      )


              if polygons:

                  if len(
                      polygons
                  ) == 1:

                      return {
                          "type":
                              "Polygon",
                          "coordinates":
                              polygons[0]
                      }


                  return {
                      "type":
                          "MultiPolygon",
                      "coordinates":
                          polygons
                  }


              # ----------------------------------------------------
              # FALLBACK:
              #
              # Look specifically for Surface/CompositeSurface
              # objects and inspect their patches.
              # ----------------------------------------------------

              for object_node in reachable:

                  if local(
                      object_node.tag
                  ) not in {
                      "Surface",
                      "CompositeSurface"
                  }:

                      continue


                  patches = polygon_patches_from_object(
                      object_node
                  )


                  for patch in patches:

                      polygon = polygon_from_patch(
                          patch
                      )


                      if polygon is not None:

                          polygons.append(
                              polygon
                          )


              if polygons:

                  if len(
                      polygons
                  ) == 1:

                      return {
                          "type":
                              "Polygon",
                          "coordinates":
                              polygons[0]
                      }


                  return {
                      "type":
                          "MultiPolygon",
                      "coordinates":
                          polygons
                  }


              return None


          # ========================================================
          # METADATA
          # ========================================================

          def first_value(
              element,
              names
          ):

              wanted = {
                  x.lower()
                  for x in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      value = node.text.strip()


                      if value:

                          return value


              return ""


          # ========================================================
          # FIND ALL AIRSPACE
          # ========================================================

          airspaces = [
              element
              for element in root.iter()
              if local(
                  element.tag
              ) == "Airspace"
          ]


          print("")
          print(
              "=========================================="
          )

          print(
              "NATS AIRSPACE IMPORT"
          )

          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "NATS Airspace features:",
              len(
                  airspaces
              )
          )


          if not airspaces:

              raise SystemExit(
                  "ERROR: No NATS Airspace features found."
              )


          features = []


          geometry_success = 0
          geometry_missing = 0


          type_counts = Counter()
          type_success = Counter()
          type_failure = Counter()


          local_counts = Counter()
          local_success = Counter()
          local_failure = Counter()


          # ========================================================
          # PROCESS EVERYTHING
          # ========================================================

          for index, airspace in enumerate(
              airspaces,
              start=1
          ):

              airspace_type = first_value(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )


              local_type = first_value(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )


              designator = first_value(
                  airspace,
                  {
                      "designator"
                  }
              )


              name = first_value(
                  airspace,
                  {
                      "name"
                  }
              )


              airspace_class = first_value(
                  airspace,
                  {
                      "class",
                      "AirspaceClass"
                  }
              )


              type_key = (
                  airspace_type
                  or
                  "(blank)"
              )


              local_key = (
                  local_type
                  or
                  "(blank)"
              )


              type_counts[
                  type_key
              ] += 1


              local_counts[
                  local_key
              ] += 1


              geometry = geometry_for_airspace(
                  airspace
              )


              if geometry is not None:

                  geometry_success += 1

                  type_success[
                      type_key
                  ] += 1

                  local_success[
                      local_key
                  ] += 1

              else:

                  geometry_missing += 1

                  type_failure[
                      type_key
                  ] += 1

                  local_failure[
                      local_key
                  ] += 1


              identifier = (
                  attr_local(
                      airspace,
                      "id"
                  )
                  or
                  attr_local(
                      airspace,
                      "uuid"
                  )
                  or
                  ""
              )


              properties = {

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC,

                  "nats_feature_type":
                      "Airspace",

                  "nats_id":
                      identifier,

                  "designator":
                      designator,

                  "name":
                      (
                          name
                          or
                          designator
                          or
                          identifier
                          or
                          "NATS Airspace"
                      ),

                  "airspace_type":
                      airspace_type,

                  "local_type":
                      local_type,

                  "airspace_class":
                      airspace_class,

                  "geometry_available":
                      geometry is not None
              }


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )


              # ----------------------------------------------------
              # ATZ / MATZ diagnostics
              # ----------------------------------------------------

              combined = (
                  f"{airspace_type} "
                  f"{local_type} "
                  f"{designator} "
                  f"{name}"
              ).upper()


              if (
                  "ATZ" in combined
                  or
                  "MATZ" in combined
              ):

                  print("")
                  print(
                      "SPECIAL AIRSPACE:"
                  )

                  print(
                      "Index:",
                      index
                  )

                  print(
                      "Designator:",
                      designator
                  )

                  print(
                      "Name:",
                      name
                  )

                  print(
                      "Type:",
                      airspace_type
                  )

                  print(
                      "LocalType:",
                      local_type
                  )

                  print(
                      "Geometry:",
                      (
                          "YES"
                          if geometry is not None
                          else
                          "NO"
                      )
                  )


          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }


          Path(
              OUTPUT_FILE
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          # ========================================================
          # SUMMARY
          # ========================================================

          print("")
          print(
              "=========================================="
          )

          print(
              "NATS AIRSPACE GEOMETRY SUMMARY"
          )

          print(
              "=========================================="
          )

          print(
              "Total NATS Airspace:",
              len(
                  airspaces
              )
          )

          print(
              "Airspace with geometry:",
              geometry_success
          )

          print(
              "Airspace without geometry:",
              geometry_missing
          )


          print("")
          print(
              "AIRSPACE TYPES"
          )

          print(
              "------------------------------------------"
          )


          for key, count in type_counts.most_common():

              print(
                  f"{key:30s} "
                  f"total={count:5d} "
                  f"geometry={type_success[key]:5d} "
                  f"failed={type_failure[key]:5d}"
              )


          print("")
          print(
              "LOCAL TYPES"
          )

          print(
              "------------------------------------------"
          )


          for key, count in local_counts.most_common():

              print(
                  f"{key:40s} "
                  f"total={count:5d} "
                  f"geometry={local_success[key]:5d} "
                  f"failed={local_failure[key]:5d}"
              )


          print("")
          print(
              "GeoJSON:",
              OUTPUT_FILE
          )


          print("")
          print(
              "NO AIRSPACE CLASSIFICATION FILTERING WAS USED."
          )

          print(
              "ALL NATS AIRSPACE FEATURES WERE RETAINED."
          )

          PY


      # ============================================================
      # REPORTING POINTS
      #
      # Targeted VRP repair only.
      #
      # The NATS AIXM airspace importer above is unchanged.
      # This step accepts the different CSV layouts/coordinate
      # representations used by NATS VRP releases.
      # ============================================================

      - name: Convert NATS reporting points
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path("/tmp/uk-vrps.csv")
          output = Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          if not raw.strip():
              raise SystemExit(
                  "ERROR: NATS VRP CSV is empty."
              )

          # --------------------------------------------------------
          # Detect delimiter.
          # --------------------------------------------------------

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:20000],
                  delimiters=",;\t|"
              )
              delimiter = dialect.delimiter
          except csv.Error:
              delimiter = ","

          print("")
          print("==========================================")
          print("NATS REPORTING POINT IMPORT")
          print("==========================================")
          print("Detected delimiter:", repr(delimiter))

          # --------------------------------------------------------
          # Detect the real header row. Some NATS exports can contain
          # introductory lines before the CSV header.
          # --------------------------------------------------------

          lines = raw.splitlines()

          def header_score(line):
              lower = line.lower()
              words = (
                  "latitude",
                  "longitude",
                  "lat",
                  "lon",
                  "vrp",
                  "name",
                  "designator",
                  "identifier",
                  "point"
              )
              return sum(
                  1 for word in words if word in lower
              )

          header_index = 0
          best_score = 0

          for i, line in enumerate(lines[:100]):
              score = header_score(line)
              if score > best_score:
                  best_score = score
                  header_index = i

          print("Detected header row:", header_index + 1)

          csv_text = "\n".join(lines[header_index:])

          reader = csv.DictReader(
              csv_text.splitlines(),
              delimiter=delimiter
          )

          rows = list(reader)

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains no data rows."
              )

          fields = [
              field for field in (reader.fieldnames or [])
              if field is not None
          ]

          print("")
          print("Detected fields:")
          for field in fields:
              print("  ", repr(field))

          def normalise(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value or "").strip().lower()
              )

          field_map = {
              normalise(field): field
              for field in fields
          }

          def find_field(candidates):
              for candidate in candidates:
                  key = normalise(candidate)
                  if key in field_map:
                      return field_map[key]

              for key, original in field_map.items():
                  for candidate in candidates:
                      candidate_key = normalise(candidate)
                      if candidate_key and candidate_key in key:
                          return original

              return None

          latitude_field = find_field([
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal",
              "Latitude DMS",
              "Lat DMS",
              "Lat DD",
              "Lat Dec"
          ])

          longitude_field = find_field([
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal",
              "Longitude DMS",
              "Lon DMS",
              "Lon DD",
              "Long DD",
              "Long Dec"
          ])

          name_field = find_field([
              "VRP Name",
              "Name",
              "Designator",
              "Identifier",
              "VRP",
              "Point Name",
              "Point"
          ])

          # --------------------------------------------------------
          # Coordinate parser.
          #
          # Supports:
          #   51.2345
          #   -1.2345
          #   512345N
          #   0012345W
          #   51 23 45 N
          #   51:23:45N
          #   51°23'45"N
          # --------------------------------------------------------

          def parse_coordinate(value, latitude):
              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:
                  hemisphere = match.group(1).upper()
                  text = text[:match.start()].strip()

              # Plain decimal degrees.
              try:
                  number = float(
                      text.replace(",", ".")
                  )

                  limit = 90.0 if latitude else 180.0

                  if -limit <= number <= limit:
                      if hemisphere in ("S", "W"):
                          number = -abs(number)
                      elif hemisphere in ("N", "E"):
                          number = abs(number)
                      return number
              except ValueError:
                  pass

              # DMS containing spaces, :, degree/minute/second symbols.
              cleaned = (
                  text
                  .replace("°", " ")
                  .replace("'", " ")
                  .replace('"', " ")
                  .replace(":", " ")
              )

              values = re.findall(
                  r"[-+]?\d+(?:\.\d+)?",
                  cleaned
              )

              if len(values) >= 2:
                  try:
                      parts = [float(v) for v in values[:3]]

                      degrees = abs(parts[0])
                      minutes = abs(parts[1])
                      seconds = abs(parts[2]) if len(parts) >= 3 else 0.0

                      limit = 90.0 if latitude else 180.0

                      if (
                          degrees <= limit
                          and minutes < 60
                          and seconds < 60
                      ):
                          number = (
                              degrees
                              + minutes / 60.0
                              + seconds / 3600.0
                          )

                          if hemisphere in ("S", "W"):
                              number = -number

                          return number
                  except (ValueError, IndexError):
                      pass

              # Compact DMS, e.g. 512345N / 0012345W.
              compact = re.sub(
                  r"[^0-9.]",
                  "",
                  text
              )

              if compact:
                  try:
                      integer_part, dot, decimal_part = compact.partition(".")

                      if latitude and len(integer_part) >= 6:
                          degrees = int(integer_part[:2])
                          minutes = int(integer_part[2:4])
                          seconds_text = integer_part[4:]
                      elif not latitude and len(integer_part) >= 7:
                          degrees = int(integer_part[:3])
                          minutes = int(integer_part[3:5])
                          seconds_text = integer_part[5:]
                      else:
                          raise ValueError

                      if decimal_part:
                          seconds_text += "." + decimal_part

                      seconds = float(seconds_text)
                      limit = 90.0 if latitude else 180.0

                      if (
                          degrees <= limit
                          and minutes < 60
                          and seconds < 60
                      ):
                          number = (
                              degrees
                              + minutes / 60.0
                              + seconds / 3600.0
                          )

                          if hemisphere in ("S", "W"):
                              number = -number

                          return number
                  except ValueError:
                      pass

              return None

          # --------------------------------------------------------
          # If the field names aren't recognisable, inspect values
          # to identify likely coordinate columns.
          # --------------------------------------------------------

          def looks_like_coordinate(value, latitude):
              if value is None:
                  return False

              text = str(value).strip()

              if not text:
                  return False

              if re.search(r"[NSEW]\s*$", text, flags=re.I):
                  return parse_coordinate(value, latitude) is not None

              try:
                  number = float(text.replace(",", "."))
                  limit = 90.0 if latitude else 180.0
                  return -limit <= number <= limit
              except ValueError:
                  return parse_coordinate(value, latitude) is not None

          if latitude_field is None or longitude_field is None:
              print("")
              print("Named coordinate fields not both detected.")
              print("Attempting value-based detection...")

              for field in fields:
                  sample = [
                      row.get(field)
                      for row in rows[:25]
                  ]

                  hits_lat = sum(
                      looks_like_coordinate(v, True)
                      for v in sample
                  )

                  hits_lon = sum(
                      looks_like_coordinate(v, False)
                      for v in sample
                  )

                  if (
                      latitude_field is None
                      and hits_lat >= max(3, len(sample) // 2)
                  ):
                      latitude_field = field

                  if (
                      longitude_field is None
                      and field != latitude_field
                      and hits_lon >= max(3, len(sample) // 2)
                  ):
                      longitude_field = field

          print("")
          print("Latitude field:", repr(latitude_field))
          print("Longitude field:", repr(longitude_field))
          print("Name field:", repr(name_field))

          if latitude_field is None or longitude_field is None:
              print("")
              print("First five VRP rows:")
              for row in rows[:5]:
                  print(row)

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP coordinate fields."
              )

          features = []
          invalid = 0

          for index, row in enumerate(rows, start=1):
              latitude = parse_coordinate(
                  row.get(latitude_field),
                  True
              )

              longitude = parse_coordinate(
                  row.get(longitude_field),
                  False
              )

              if (
                  latitude is None
                  or longitude is None
                  or not -90 <= latitude <= 90
                  or not -180 <= longitude <= 180
              ):
                  invalid += 1

                  if invalid <= 10:
                      print("")
                      print("Invalid VRP row:", index)
                      print(
                          "  latitude:",
                          repr(row.get(latitude_field))
                      )
                      print(
                          "  longitude:",
                          repr(row.get(longitude_field))
                      )

                  continue

              properties = {
                  str(key).strip(): value
                  for key, value in row.items()
                  if key
              }

              if name_field:
                  name = str(
                      row.get(name_field, "")
                  ).strip()
              else:
                  name = ""

              if not name:
                  name = f"VRP {index}"

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = (
                  "NATS Visual Reference Points List"
              )

              features.append({
                  "type": "Feature",
                  "id": name,
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          longitude,
                          latitude
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS REPORTING POINT RESULT")
          print("==========================================")
          print("CSV records:", len(rows))
          print("Valid reporting points:", len(features))
          print("Invalid rows:", invalid)

          if not features:
              print("")
              print("Detected fields:")
              for field in fields:
                  print("  ", repr(field))

              print("")
              print("First five rows:")
              for row in rows[:5]:
                  print(row)

              raise SystemExit(
                  "ERROR: Zero valid NATS reporting points."
              )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print("")
          print("Output:", output)
          print("GeoJSON features:", len(features))

          PY


      # ============================================================
      # VALIDATE
      # ============================================================

      # ============================================================
      # MATZ / CMATZ GEOMETRY — CHART REPRODUCTION
      #
      # This layer is a fixed visual chart reproduction.
      #
      # The geometry is a fixed visual reproduction of the MATZ
      # symbols shown on UK MIL AIP ENR 6-17:
      #
      #   - 5 NM circle centred on the aerodrome/runway symbol
      #   - runway/stub rectangle aligned with the displayed runway
      #     heading
      #   - 4 NM rectangle width
      #   - 5 NM stub length outside the circle
      #   - the stub joins the circle at the two circle/intersection
      #     points, producing one continuous outline
      #   - reciprocal headings produce the two-sided runway/stub
      #     appearance shown on the chart
      #
      # Overlapping symbols are unioned into one exterior outline so
      # that there are no internal polygon boundaries.
      #
      # The chart itself is the geometry reference. This is intentional
      # for AviMap's MSFS/simulation use case.
      # ============================================================

      - name: Build MATZ and CMATZ geometry from ENR 6-17 chart
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import math

          from pathlib import Path
          from shapely.geometry import Polygon
          from shapely.ops import unary_union
          from shapely.geometry import mapping


          OUT = Path(
              "/tmp/avimap-data/uk-matz.geojson"
          )

          OUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          EARTH_M = 6371008.8
          NM_M = 1852.0


          def destination(
              latitude,
              longitude,
              bearing_deg,
              distance_nm
          ):

              bearing = math.radians(
                  bearing_deg
              )

              angular = (
                  distance_nm
                  * NM_M
                  / EARTH_M
              )

              lat1 = math.radians(
                  latitude
              )

              lon1 = math.radians(
                  longitude
              )

              lat2 = math.asin(
                  math.sin(lat1)
                  * math.cos(angular)
                  +
                  math.cos(lat1)
                  * math.sin(angular)
                  * math.cos(bearing)
              )

              lon2 = (
                  lon1
                  +
                  math.atan2(
                      math.sin(bearing)
                      * math.sin(angular)
                      * math.cos(lat1),
                      math.cos(angular)
                      -
                      math.sin(lat1)
                      * math.sin(lat2)
                  )
              )

              return (
                  math.degrees(lat2),
                  (
                      math.degrees(lon2)
                      + 540.0
                  )
                  % 360.0
                  - 180.0
              )


          def circle_polygon(
              latitude,
              longitude,
              radius_nm=5.0,
              points=96
          ):

              coordinates = []

              for index in range(
                  points + 1
              ):

                  bearing = (
                      360.0
                      * index
                      / points
                  )

                  lat, lon = destination(
                      latitude,
                      longitude,
                      bearing,
                      radius_nm
                  )

                  coordinates.append(
                      [lon, lat]
                  )

              return Polygon(
                  coordinates
              )


          def stub_polygon(
              latitude,
              longitude,
              heading_to_aerodrome,
              radius_nm=5.0,
              width_nm=4.0,
              outside_length_nm=5.0
          ):

              # The chart's runway/stub projects AWAY from the
              # aerodrome. The table-style heading points TO the
              # aerodrome, so the visible projection is reciprocal.
              outward = (
                  heading_to_aerodrome
                  + 180.0
              ) % 360.0

              half_width = (
                  width_nm / 2.0
              )

              # Start where the two long edges of the rectangular
              # stub intersect the MATZ circle.
              inner_distance = math.sqrt(
                  max(
                      0.0,
                      radius_nm ** 2
                      -
                      half_width ** 2
                  )
              )

              start_lat, start_lon = (
                  destination(
                      latitude,
                      longitude,
                      outward,
                      inner_distance
                  )
              )

              end_lat, end_lon = (
                  destination(
                      latitude,
                      longitude,
                      outward,
                      inner_distance
                      +
                      outside_length_nm
                  )
              )

              start_left = destination(
                  start_lat,
                  start_lon,
                  outward - 90.0,
                  half_width
              )

              start_right = destination(
                  start_lat,
                  start_lon,
                  outward + 90.0,
                  half_width
              )

              end_right = destination(
                  end_lat,
                  end_lon,
                  outward + 90.0,
                  half_width
              )

              end_left = destination(
                  end_lat,
                  end_lon,
                  outward - 90.0,
                  half_width
              )

              return Polygon(
                  [
                      [
                          start_left[1],
                          start_left[0]
                      ],
                      [
                          start_right[1],
                          start_right[0]
                      ],
                      [
                          end_right[1],
                          end_right[0]
                      ],
                      [
                          end_left[1],
                          end_left[0]
                      ],
                      [
                          start_left[1],
                          start_left[0]
                      ]
                  ]
              )


          def special_warton():

              # The chart's Warton symbol is the non-standard
              # rectangular MATZ presentation.
              latitude = 53.7450000
              longitude = -2.8833333

              latitude, longitude = (
                  destination(
                      latitude,
                      longitude,
                      180.0,
                      1.0
                  )
              )

              bearing = 71.0
              half_length = 10.0
              half_width = 3.0

              start = destination(
                  latitude,
                  longitude,
                  bearing + 180.0,
                  half_length
              )

              end = destination(
                  latitude,
                  longitude,
                  bearing,
                  half_length
              )

              start_left = destination(
                  start[0],
                  start[1],
                  bearing - 90.0,
                  half_width
              )

              start_right = destination(
                  start[0],
                  start[1],
                  bearing + 90.0,
                  half_width
              )

              end_right = destination(
                  end[0],
                  end[1],
                  bearing + 90.0,
                  half_width
              )

              end_left = destination(
                  end[0],
                  end[1],
                  bearing - 90.0,
                  half_width
              )

              return Polygon(
                  [
                      [
                          start_left[1],
                          start_left[0]
                      ],
                      [
                          start_right[1],
                          start_right[0]
                      ],
                      [
                          end_right[1],
                          end_right[0]
                      ],
                      [
                          end_left[1],
                          end_left[0]
                      ],
                      [
                          start_left[1],
                          start_left[0]
                      ]
                  ]
              )


          # --------------------------------------------------------
          # FIXED CHART LOCATIONS
          #
          # Only the MATZ symbols actually displayed on the supplied
          # ENR 6-17 chart are reproduced here.
          # --------------------------------------------------------

          CHART = [
              ("Barkston Heath", 52.9629833, -0.5603222, [58]),
              ("Benson", 51.6150389, -1.0958472, [8, 188]),
              ("Boscombe Down", 51.1530556, -1.7511111, [230, 50]),
              ("Coningsby", 53.0930556, -0.1661111, [252]),
              ("Cranwell", 53.0297333, -0.4927528, [263]),
              ("Culdrose", 50.0853972, -5.2540722, [293]),
              ("Fairford", 51.6836111, -1.7902778, [268]),
              ("Lakenheath", 52.4094028, 0.5610111, [56, 236]),
              ("Leeming", 54.2925000, -1.5352778, [156]),
              ("Leuchars", 56.3748917, -2.8587806, [262, 82]),
              ("Lossiemouth", 57.7066583, -3.3378889, [224]),
              ("Marham", 52.6483333, 0.5505556, [237, 57]),
              ("Merryfield", 50.9631361, -2.9388139, []),
              ("Middle Wallop", 51.1419667, -1.5726722, [256]),
              ("Mildenhall", 52.3619333, 0.4864056, [103, 283]),
              ("Mona", 53.2593000, -4.3740111, []),
              ("Odiham", 51.2341917, -0.9436972, [93]),
              ("Predannack", 50.0016667, -5.2319444, []),
              ("Shawbury", 52.7936111, -2.6677778, [180, 360]),
              ("Tern Hill", 52.8731611, -2.5321917, []),
              ("Topcliffe", 54.2072472, -1.3805306, []),
              ("Valley", 53.2481667, -4.5353333, [130]),
              ("Waddington", 53.1605556, -0.5238889, [202]),
              ("Warton", 53.7450000, -2.8833333, []),
              ("Wattisham", 52.1272222, 0.9563889, [228, 48]),
              ("Wittering", 52.6130556, -0.4759056, [253, 73]),
              ("Yeovilton", 51.0082694, -2.6454917, [263, 83]),
          ]


          components = []

          for (
              name,
              latitude,
              longitude,
              headings
          ) in CHART:

              if name == "Warton":

                  polygon = (
                      special_warton()
                  )

              else:

                  polygon = (
                      circle_polygon(
                          latitude,
                          longitude
                      )
                  )

                  for heading in headings:

                      polygon = unary_union(
                          [
                              polygon,
                              stub_polygon(
                                  latitude,
                                  longitude,
                                  heading
                              )
                          ]
                      )

              components.append(
                  {
                      "name": name,
                      "polygon": polygon
                  }
              )


          # --------------------------------------------------------
          # Connected chart-symbol groups.
          #
          # Unioning removes internal boundaries exactly as required
          # for overlapping MATZ/CMATZ symbols.
          # --------------------------------------------------------

          parent = list(
              range(len(components))
          )


          def find(index):

              while parent[index] != index:

                  parent[index] = parent[
                      parent[index]
                  ]

                  index = parent[index]

              return index


          def join(left, right):

              left = find(left)
              right = find(right)

              if left != right:

                  parent[right] = left


          for left in range(
              len(components)
          ):

              for right in range(
                  left + 1,
                  len(components)
              ):

                  if components[left][
                      "polygon"
                  ].intersects(
                      components[right][
                          "polygon"
                      ]
                  ):

                      join(
                          left,
                          right
                      )


          groups = {}

          for index, component in enumerate(
              components
          ):

              groups.setdefault(
                  find(index),
                  []
              ).append(index)


          features = []

          for indexes in groups.values():

              geometry = unary_union(
                  [
                      components[index][
                          "polygon"
                      ]
                      for index in indexes
                  ]
              )

              members = sorted(
                  [
                      components[index][
                          "name"
                      ]
                      for index in indexes
                  ]
              )

              if set(members) == {
                  "Lakenheath",
                  "Mildenhall"
              }:

                  airspace_type = "CMATZ"

                  display_name = (
                      "Lakenheath/Mildenhall CMATZ"
                  )

              elif len(members) > 1:

                  airspace_type = "MATZ"

                  display_name = (
                      " / ".join(
                          members
                      )
                  )

              else:

                  airspace_type = "MATZ"

                  display_name = members[0]


              features.append(
                  {
                      "type": "Feature",
                      "geometry": mapping(
                          geometry
                      ),
                      "properties": {
                          "source": (
                              "UK MIL AIP ENR 6-17 "
                              "chart reproduction"
                          ),
                          "airspace_type": (
                              airspace_type
                          ),
                          "name": (
                              display_name
                          ),
                          "members": members,
                          "chart_geometry": True,
                          "internal_boundaries": False
                      }
                  }
              )


          collection = {
              "type": "FeatureCollection",
              "features": features
          }


          OUT.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "=========================================="
          )
          print(
              "ENR 6-17 MATZ / CMATZ CHART GEOMETRY"
          )
          print(
              "=========================================="
          )
          print(
              "Chart symbols reproduced:",
              len(CHART)
          )
          print(
              "Connected outline features:",
              len(features)
          )
          print(
              "Internal boundaries:",
              "removed"
          )
          print(
              "Output:",
              OUT
          )
          print(
              "==========================================")

          PY


      - name: Validate generated aviation data
        run: |
          set -euo pipefail


          AIRSPACE="/tmp/avimap-data/uk-airspace.geojson"

          VRP="/tmp/avimap-data/uk-reporting-points.geojson"
          MATZ="/tmp/avimap-data/uk-matz.geojson"


          test -s "${AIRSPACE}"

          test -s "${VRP}"
          test -s "${MATZ}"


          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "${AIRSPACE}"
          )


          GEOMETRY_COUNT=$(
            jq \
              '[.features[] | select(.geometry != null)] | length' \
              "${AIRSPACE}"
          )


          NULL_GEOMETRY_COUNT=$(
            jq \
              '[.features[] | select(.geometry == null)] | length' \
              "${AIRSPACE}"
          )


          MATZ_COUNT=$(
            jq \
              '.features | length' \
              "${MATZ}"
          )


          VRP_COUNT=$(
            jq \
              '.features | length' \
              "${VRP}"
          )


          echo ""
          echo "=========================================="

          echo "FINAL VALIDATION"

          echo "=========================================="

          echo ""

          echo "NATS Airspace features:"
          echo "${AIRSPACE_COUNT}"

          echo ""

          echo "Airspace with geometry:"
          echo "${GEOMETRY_COUNT}"

          echo ""

          echo "Airspace without geometry:"
          echo "${NULL_GEOMETRY_COUNT}"

          echo ""

          echo "NATS reporting points:"
          echo "${VRP_COUNT}"

          echo ""
          echo "ENR 6-17 MATZ / CMATZ features:"
          echo "${MATZ_COUNT}"

          echo ""


          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS Airspace features."

            exit 1

          fi


          if [ "${GEOMETRY_COUNT}" -eq 0 ]; then

            echo ""
            echo "ERROR: ZERO AIRSPACE GEOMETRIES GENERATED."
            echo ""
            echo "The workflow will NOT overwrite the existing"
            echo "working airspace dataset with an empty geometry set."
            echo ""

            exit 1

          fi


          if [ "${MATZ_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS MATZ / CMATZ features."

            exit 1

          fi


          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS reporting points."

            exit 1

          fi


          echo "Validation successful."


      # ============================================================
      # INSTALL
      #
      # IMPORTANT:
      #
      # We only reach this point if at least one airspace geometry
      # was successfully generated.
      # ============================================================

      - name: Install NATS aviation data
        run: |
          set -euo pipefail

          mkdir -p data


          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson


          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson


          cp \
            /tmp/avimap-data/uk-matz.geojson \
            data/uk-matz.geojson


          echo ""
          echo "Installed aviation data:"
          echo ""


          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/uk-matz.geojson


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit NATS aviation data
        run: |
          set -euo pipefail


          git config \
            user.name \
            "AviMap Data Bot"


          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/uk-matz.geojson


          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."

            exit 0

          fi


          echo ""
          echo "Files being committed:"

          git diff \
            --cached \
            --stat


          git commit \
            -m "Reproduce ENR 6-17 MATZ and CMATZ chart geometry"


          git push
