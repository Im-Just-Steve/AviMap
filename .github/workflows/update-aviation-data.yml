name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # The checklist determines the current AIRAC.
      #
      # IMPORTANT:
      # The checklist URL uses /opencms/
      # but the actual downloadable datasets use:
      #
      # /export/sites/default/en/
      #
      # This distinction is intentional.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINDING CURRENT NATS DATASETS"
          echo "=========================================="
          echo ""

          python3 <<'PY'
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          today = datetime.now(
              timezone.utc
          ).date()

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          DATASET_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/export/sites/default/en/"
              "Publications/digital-datasets/"
          )

          ICAO_AIP_BASE = (
              DATASET_BASE +
              "ICAO%20AIP/"
          )

          print(
              "Today (UTC):",
              today
          )

          # --------------------------------------------------------
          # Find latest checklist.
          # --------------------------------------------------------

          selected_html = None
          selected_url = None
          selected_date = None

          print("")
          print(
              "Searching NATS Dataset Checklists..."
          )

          for offset in range(
              0,
              90
          ):

              date = (
                  today -
                  timedelta(
                      days=offset
                  )
              )

              stamp = date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.html",

                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.HTML"
              ]

              for url in candidates:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "AviMap-NATS-Data-Updater/1.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          html = (
                              response.read()
                              .decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                  except Exception:
                      continue

                  if (
                      "EG_AIP_DS_FULL_" not in html
                      or
                      "EG_VRP_DS_AREA1_FULL_" not in html
                  ):

                      continue

                  if (
                      selected_date is None
                      or
                      date > selected_date
                  ):

                      selected_date = date
                      selected_url = url
                      selected_html = html

          if selected_html is None:

              raise SystemExit(
                  "ERROR: Could not find a current "
                  "NATS Dataset Checklist."
              )

          print("")
          print(
              "Selected NATS checklist:"
          )
          print(
              selected_url
          )

          print(
              "Checklist date:",
              selected_date
          )

          # --------------------------------------------------------
          # Extract AIP AIRAC.
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              selected_html,
              flags=re.I
          )

          if not aip_matches:

              raise SystemExit(
                  "ERROR: NATS checklist contains no "
                  "AIP XML dataset."
              )

          aip_stamps = []

          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:

                  aip_stamps.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not aip_stamps:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )

          aip_date, aip_stamp = max(
              aip_stamps,
              key=lambda item: item[0]
          )

          # --------------------------------------------------------
          # Extract VRP AIRAC.
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              selected_html,
              flags=re.I
          )

          if not vrp_matches:

              raise SystemExit(
                  "ERROR: NATS checklist contains no "
                  "VRP CSV dataset."
              )

          vrp_stamps = []

          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:

                  vrp_stamps.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not vrp_stamps:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )

          vrp_date, vrp_stamp = max(
              vrp_stamps,
              key=lambda item: item[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_stamp}.XML"
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_stamp}.CSV"
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS DATASET DISCOVERY"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "AIP filename:",
              aip_filename
          )

          print("")
          print(
              "VRP AIRAC:",
              vrp_stamp
          )

          print(
              "VRP filename:",
              vrp_filename
          )

          print("")
          print(
              "NATS ICAO AIP base:"
          )

          print(
              ICAO_AIP_BASE
          )

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # NATS archive filenames use spaces rather than the
          # underscore dataset filename shown in the checklist.
          #
          # We test the XML archive first.
          # --------------------------------------------------------

          aip_archive_names = [
              f"EG AIS DS FULL {aip_stamp} XML.zip",
              f"EG AIS DS FULL {aip_stamp} XML.ZIP",
              f"EG AIP DS FULL {aip_stamp} XML.zip",
              f"EG AIP DS FULL {aip_stamp} XML.ZIP"
          ]

          # --------------------------------------------------------
          # VRP archive/name candidates.
          # --------------------------------------------------------

          vrp_bases = [
              DATASET_BASE +
              "VRP/",

              DATASET_BASE +
              "VRP%20Data/",

              DATASET_BASE +
              "Visual%20Reference%20Points/"
          ]

          vrp_names = [
              vrp_filename,

              vrp_filename.lower(),

              f"EG VRP DS AREA1 FULL {vrp_stamp} CSV.zip",

              f"EG VRP DS AREA1 FULL {vrp_stamp} CSV.ZIP"
          ]

          Path(
              "/tmp/nats-aip-base.txt"
          ).write_text(
              ICAO_AIP_BASE,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-archive-names.txt"
          ).write_text(
              "\n".join(
                  aip_archive_names
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-bases.txt"
          ).write_text(
              "\n".join(
                  vrp_bases
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-names.txt"
          ).write_text(
              "\n".join(
                  vrp_names
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "AIP archive candidates:"
          )

          for name in aip_archive_names:
              print(
                  ICAO_AIP_BASE + name
              )

          print("")
          print(
              "VRP discovery candidates prepared."
          )

          PY

      # ============================================================
      # DOWNLOAD NATS AIP
      #
      # Do NOT use HEAD.
      #
      # NATS has previously returned usable files to a normal GET
      # while HEAD probing was not representative.
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS AIP DATASET"
          echo "=========================================="
          echo ""

          AIP_BASE=$(
            cat /tmp/nats-aip-base.txt
          )

          mkdir -p /tmp/nats-aip

          FOUND=""

          while IFS= read -r NAME; do

            [ -z "${NAME}" ] && continue

            URL="${AIP_BASE}${NAME}"

            echo ""
            echo "Trying:"
            echo "${URL}"

            rm -f \
              /tmp/nats-aip-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output \
                /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then

              if file \
                /tmp/nats-aip-download \
                | grep -qi \
                  "Zip archive"; then

                echo ""
                echo "SUCCESS: NATS AIP ZIP found."

                cp \
                  /tmp/nats-aip-download \
                  /tmp/nats-aip.zip

                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-archive-names.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "=========================================="
            echo "NATS AIP DOWNLOAD FAILED"
            echo "=========================================="
            echo ""

            echo "The checklist is valid:"
            cat /tmp/nats-aip-filename.txt

            echo ""
            echo "But none of the known NATS ICAO AIP"
            echo "archive names returned a usable ZIP."
            echo ""

            echo "This is deliberately stopping here."
            echo "No aviation data will be changed."

            exit 1

          fi

          echo ""
          echo "Selected NATS AIP archive:"
          echo "${FOUND}"

          unzip \
            -o \
            /tmp/nats-aip.zip \
            -d /tmp/nats-aip

          echo ""
          echo "NATS AIP archive contents:"
          find /tmp/nats-aip \
            -type f \
            -print

          # --------------------------------------------------------
          # Locate the actual XML.
          # --------------------------------------------------------

          AIP_XML=$(
            find /tmp/nats-aip \
              -type f \
              \( \
                -iname 'EG_AIP_DS_FULL_*.xml' \
                -o \
                -iname 'EG_AIP_DS_FULL_*.XML' \
              \) \
              | head -n 1
          )

          if [ -z "${AIP_XML}" ]; then

            echo ""
            echo "ERROR: AIP ZIP contained no FULL XML."

            find /tmp/nats-aip \
              -type f \
              -print

            exit 1

          fi

          cp \
            "${AIP_XML}" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIP XML:"
          echo "${AIP_XML}"

          echo ""
          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""

          mkdir -p /tmp/nats-vrp

          FOUND=""

          while IFS= read -r BASE; do

            [ -z "${BASE}" ] && continue

            while IFS= read -r NAME; do

              [ -z "${NAME}" ] && continue

              URL="${BASE}${NAME}"

              echo ""
              echo "Trying:"
              echo "${URL}"

              rm -f \
                /tmp/nats-vrp-download

              HTTP_CODE=$(
                curl \
                  --location \
                  --silent \
                  --show-error \
                  --output \
                  /tmp/nats-vrp-download \
                  --write-out "%{http_code}" \
                  --retry 2 \
                  --retry-delay 3 \
                  "${URL}" \
                  || true
              )

              echo "HTTP: ${HTTP_CODE}"

              if [ "${HTTP_CODE}" = "200" ]; then

                if file \
                  /tmp/nats-vrp-download \
                  | grep -qi "Zip archive"; then

                  cp \
                    /tmp/nats-vrp-download \
                    /tmp/nats-vrp.zip

                  FOUND="${URL}"

                  break 2

                fi

                # Direct CSV.
                if file \
                  /tmp/nats-vrp-download \
                  | grep -qi \
                    "text\|CSV\|ASCII"; then

                  cp \
                    /tmp/nats-vrp-download \
                    /tmp/uk-vrps.csv

                  FOUND="${URL}"

                  break 2

                fi

              fi

            done < /tmp/nats-vrp-names.txt

          done < /tmp/nats-vrp-bases.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: Could not locate current NATS VRP dataset."

            exit 1

          fi

          echo ""
          echo "Selected VRP source:"
          echo "${FOUND}"

          if [ -f /tmp/nats-vrp.zip ]; then

            unzip \
              -o \
              /tmp/nats-vrp.zip \
              -d /tmp/nats-vrp

            VRP_CSV=$(
              find /tmp/nats-vrp \
                -type f \
                \( \
                  -iname '*.csv' \
                  -o \
                  -iname '*.CSV' \
                \) \
                | head -n 1
            )

            if [ -z "${VRP_CSV}" ]; then

              echo "ERROR: VRP ZIP contained no CSV."

              find /tmp/nats-vrp \
                -type f \
                -print

              exit 1

            fi

            cp \
              "${VRP_CSV}" \
              /tmp/uk-vrps.csv

          fi

          test -s \
            /tmp/uk-vrps.csv

          echo ""
          echo "VRP CSV:"
          ls -lh \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("")
          print("==========================================")
          print("PARSING NATS AIXM")
          print("==========================================")

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "XML:",
              XML
          )

          tree = ET.parse(XML)
          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          index = {}

          for element in root.iter():

              for key, value in element.attrib.items():

                  if local(key) in {
                      "id",
                      "gml:id"
                  }:

                      if value:
                          index[value] = element

          print(
              "Indexed XML objects:",
              len(index)
          )

          def resolve(element):

              current = element
              seen = set()

              while current is not None:

                  href = None

                  for key, value in current.attrib.items():

                      if local(key) in {
                          "href",
                          "xlink:href"
                      }:

                          href = value
                          break

                  if not href:
                      return current

                  reference = href.lstrip("#")

                  if reference in seen:
                      return current

                  seen.add(reference)

                  current = index.get(
                      reference
                  )

              return current

          def texts(element, names):

              wanted = set(names)
              values = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      in wanted
                      and
                      child.text
                  ):

                      value = child.text.strip()

                      if value:
                          values.append(value)

              return values

          def first_text(element, names):

              values = texts(
                  element,
                  names
              )

              return values[0] if values else ""

          def nums(text):

              values = []

              for value in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not value:
                      continue

                  try:
                      values.append(
                          float(value)
                      )
                  except ValueError:
                      pass

              return values

          def ring_from(element):

              element = resolve(
                  element
              )

              if element is None:
                  return []

              for child in element.iter():

                  if (
                      local(child.tag)
                      == "posList"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      coords = []

                      for i in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          coords.append(
                              [
                                  values[i + 1],
                                  values[i]
                              ]
                          )

                      if len(coords) >= 4:

                          if coords[0] != coords[-1]:

                              coords.append(
                                  coords[0]
                              )

                          return coords

              coords = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      == "pos"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      if len(values) >= 2:

                          coords.append(
                              [
                                  values[1],
                                  values[0]
                              ]
                          )

              if len(coords) >= 4:

                  if coords[0] != coords[-1]:

                      coords.append(
                          coords[0]
                      )

                  return coords

              return []

          def geometry_for(airspace):

              candidates = []

              for element in airspace.iter():

                  resolved = resolve(
                      element
                  )

                  if resolved is not None:

                      candidates.append(
                          resolved
                      )

              unique = []

              seen = set()

              for element in candidates:

                  marker = id(element)

                  if marker in seen:
                      continue

                  seen.add(marker)

                  unique.append(
                      element
                  )

              polygons = []

              for surface in unique:

                  for polygon in surface.iter():

                      if local(
                          polygon.tag
                      ) not in {
                          "PolygonPatch",
                          "Polygon"
                      }:

                          continue

                      rings = []

                      for ring in polygon.iter():

                          if local(
                              ring.tag
                          ) == "LinearRing":

                              points = ring_from(
                                  ring
                              )

                              if points:
                                  rings.append(
                                      points
                                  )

                      if rings:
                          polygons.append(
                              rings
                          )

              if not polygons:
                  return None

              if len(polygons) == 1:

                  return {
                      "type":
                          "Polygon",
                      "coordinates":
                          polygons[0]
                  }

              return {
                  "type":
                      "MultiPolygon",
                  "coordinates":
                      polygons
              }

          def classify(airspace):

              values = []

              values.extend(
                  texts(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "localType",
                          "AirspaceLocalType",
                          "class",
                          "AirspaceClassification",
                          "designator",
                          "name"
                      }
                  )
              )

              combined = " ".join(
                  values
              ).upper()

              compact = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  combined
              )

              if (
                  re.search(
                      r"\bMATZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE",
                      compact
                  )
              ):
                  return "MATZ"

              if (
                  re.search(
                      r"\bRMZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"RADIO\s+MANDATORY\s+ZONE",
                      compact
                  )
              ):
                  return "RMZ"

              if (
                  re.search(
                      r"\bTMZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"TRANSPONDER\s+MANDATORY\s+ZONE",
                      compact
                  )
              ):
                  return "TMZ"

              if (
                  re.search(
                      r"\bATZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"AERODROME\s+TRAFFIC\s+ZONE",
                      compact
                  )
              ):
                  return "ATZ"

              if re.search(
                  r"\bPROHIBITED\b",
                  compact
              ):
                  return "PA"

              if re.search(
                  r"\bRESTRICTED\b",
                  compact
              ):
                  return "RA"

              if re.search(
                  r"\bDANGER\b",
                  compact
              ):
                  return "DA"

              for letter in (
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              ):

                  if re.search(
                      rf"\bCLASS\s*{letter}\b",
                      compact
                  ):

                      return letter

              for value in values:

                  cleaned = re.sub(
                      r"[^A-Z]",
                      "",
                      value.upper()
                  )

                  if cleaned in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return cleaned

              return None

          categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          counts = {
              category: 0
              for category in categories
          }

          geometry_counts = {
              category: 0
              for category in categories
          }

          raw_count = 0
          classified_count = 0
          geometry_failures = 0

          features = []

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              category = classify(
                  airspace
              )

              if category is None:
                  continue

              classified_count += 1
              counts[category] += 1

              geometry = geometry_for(
                  airspace
              )

              if geometry is None:

                  geometry_failures += 1

                  continue

              geometry_counts[
                  category
              ] += 1

              designator = first_text(
                  airspace,
                  {"designator"}
              )

              name = first_text(
                  airspace,
                  {"name"}
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          {
                              "name":
                                  name
                                  or
                                  designator
                                  or
                                  "Unknown airspace",

                              "designator":
                                  designator,

                              "category":
                                  category,

                              "source":
                                  "NATS UK ICAO AIP Dataset",

                              "airac":
                                  AIRAC
                          },

                      "geometry":
                          geometry
                  }
              )

          print("")
          print("==========================================")
          print("NATS AIXM AIRSPACE RESULT")
          print("==========================================")

          print(
              "Raw NATS Airspace:",
              raw_count
          )

          print(
              "Classified AviMap airspaces:",
              classified_count
          )

          print(
              "Geometry successes:",
              len(features)
          )

          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print("CLASSIFICATION COUNTS")

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{counts[category]}"
              )

          print("")
          print("GEOMETRY COUNTS")

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts[category]}"
              )

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  "AIXM dataset."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero filtered airspace."
              )

          if len(features) == 0:

              raise SystemExit(
                  "ERROR: Zero valid airspace geometry."
              )

          Path(
              OUT
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "GeoJSON written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT VRPs
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          mapping = {
              norm(field):
                  field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  if norm(name) in mapping:

                      return mapping[
                          norm(name)
                      ]

              for key, original in mapping.items():

                  for name in names:

                      n = norm(name)

                      if (
                          n in key
                          or
                          key in n
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              lat_field is None
              or
              lon_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP "
                  "latitude/longitude fields."
              )

          def coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = str(
                  value
              ).strip()

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  value = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= value
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          value = -abs(
                              value
                          )

                      return value

              except ValueError:
                  pass

              compact = re.sub(
                  r"[^0-9.]",
                  "",
                  text
              )

              try:

                  if latitude:

                      degrees = int(
                          compact[:2]
                      )

                      minutes = int(
                          compact[2:4]
                      )

                      seconds = float(
                          compact[4:]
                      )

                  else:

                      degrees = int(
                          compact[:3]
                      )

                      minutes = int(
                          compact[3:5]
                      )

                      seconds = float(
                          compact[5:]
                      )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):

                      return None

                  result = (
                      degrees
                      +
                      minutes / 60
                      +
                      seconds / 3600
                  )

                  if hemisphere in {
                      "S",
                      "W"
                  }:

                      result = -abs(
                          result
                      )

                  return result

              except Exception:

                  return None

          features = []

          for row in rows:

              lat = coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):

                  continue

              name = ""

              if name_field:

                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              properties = {
                  str(key):
                      value
                  for key, value
                  in row.items()
                  if key
              }

              properties[
                  "name"
              ] = (
                  name
                  or
                  "VRP"
              )

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      lon,
                                      lat
                                  ]
                          }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: Zero valid VRPs."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="

          echo ""
          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero airspaces."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero VRPs."
            exit 1
          fi

          echo "Validation successful."

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo "No aviation data changes detected."
            exit 0

          fi

          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
