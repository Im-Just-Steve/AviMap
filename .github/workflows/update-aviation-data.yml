name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install lxml shapely pyproj

      # ============================================================
      # DOWNLOAD NATS DATASET INDEX
      # ============================================================

      - name: Download NATS dataset page
        shell: bash
        run: |
          set -euo pipefail

          NATS_URL="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          echo "=========================================="
          echo "Downloading NATS Digital Datasets page"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0" \
            "$NATS_URL" \
            --output /tmp/nats.html

          test -s /tmp/nats.html

          echo "Downloaded:"
          wc -c /tmp/nats.html

      # ============================================================
      # FIND CURRENT NATS AIP DATASET
      # ============================================================

      - name: Find current NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path("/tmp/nats.html").read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:
              match = re.search(
                  r'/ICAO_AIP/EG_AIP_DS_(\d{8})_XML\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append((date, href))

          print("")
          print("==========================================")
          print("NATS AIP DATASET DISCOVERY")
          print("==========================================")

          if not datasets:
              print("ERROR: No NATS AIP XML datasets found.")
              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item for item in datasets
              if item[0] <= today
          ]

          if not usable:
              raise SystemExit(
                  "ERROR: No effective NATS AIP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(BASE_URL, href)

          print("Selected AIRAC:")
          print(effective_date)
          print("")
          print("Selected URL:")
          print(url)

          Path("/tmp/nats-aip-url.txt").write_text(
              url,
              encoding="utf-8"
          )

          Path("/tmp/nats-aip-date.txt").write_text(
              str(effective_date),
              encoding="utf-8"
          )
          PY

      # ============================================================
      # DOWNLOAD NATS AIP
      # ============================================================

      - name: Download NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP dataset"
          echo "=========================================="
          echo "$AIP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$AIP_URL" \
            --output /tmp/nats-aip.zip

          test -s /tmp/nats-aip.zip

          unzip -t /tmp/nats-aip.zip

          mkdir -p /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip.zip \
            -d /tmp/nats-aip

          echo ""
          echo "Extracted files:"
          find /tmp/nats-aip -type f -print

      # ============================================================
      # LOCATE FULL AIP XML
      # ============================================================

      - name: Locate full NATS AIP XML
        shell: bash
        run: |
          set -euo pipefail

          AIRAC=$(cat /tmp/nats-aip-date.txt)
          AIRAC_COMPACT="${AIRAC//-/}"

          EXPECTED="EG_AIP_DS_FULL_${AIRAC_COMPACT}.xml"

          echo ""
          echo "=========================================="
          echo "Locating FULL NATS AIP XML"
          echo "=========================================="
          echo "Expected:"
          echo "$EXPECTED"
          echo ""

          XML_FILE=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "$EXPECTED" \
              | head -n 1
          )

          if [ -z "$XML_FILE" ]; then
            echo "ERROR: FULL NATS AIP XML not found."
            echo "The DELTA dataset will NOT be used."
            exit 1
          fi

          echo "FULL NATS AIP XML:"
          echo "$XML_FILE"

          printf '%s' "$XML_FILE" \
            > /tmp/nats-aip-xml-file.txt

      # ============================================================
      # FIND CURRENT NATS VRP DATASET
      # ============================================================

      - name: Find current NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path("/tmp/nats.html").read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:
              match = re.search(
                  r'/VRP/EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append((date, href))

          print("")
          print("==========================================")
          print("NATS VRP DATASET DISCOVERY")
          print("==========================================")

          if not datasets:
              raise SystemExit(
                  "ERROR: No NATS VRP datasets found."
              )

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item for item in datasets
              if item[0] <= today
          ]

          if not usable:
              raise SystemExit(
                  "ERROR: No effective NATS VRP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(BASE_URL, href)

          print("Selected VRP date:")
          print(effective_date)
          print("")
          print("Selected URL:")
          print(url)

          Path("/tmp/nats-vrp-url.txt").write_text(
              url,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo "$VRP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats-vrp.zip

          test -s /tmp/nats-vrp.zip

          mkdir -p /tmp/nats-vrp

          unzip \
            -o \
            /tmp/nats-vrp.zip \
            -d /tmp/nats-vrp

          echo ""
          echo "VRP files:"
          find /tmp/nats-vrp -type f -print

      # ============================================================
      # CONVERT NATS AIRSPACE
      # ============================================================

      - name: Convert NATS AIP airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          XML_FILE=$(cat /tmp/nats-aip-xml-file.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Converting NATS AIP airspace"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "XML:"
          echo "$XML_FILE"
          echo ""

          python3 <<'PY'
          from pathlib import Path
          from lxml import etree
          from shapely.geometry import Polygon, mapping
          from shapely.ops import unary_union
          from pyproj import Geod
          import json
          import re
          import sys

          XML_FILE = Path(
              "/tmp/nats-aip-xml-file.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          OUTPUT = Path(
              "data/uk-airspace.geojson"
          )

          GML = "http://www.opengis.net/gml/3.2"
          XLINK = "http://www.w3.org/1999/xlink"

          geod = Geod(
              ellps="WGS84"
          )

          parser = etree.XMLParser(
              huge_tree=True,
              recover=False,
              remove_comments=True
          )

          print("Parsing FULL NATS AIP XML...")

          tree = etree.parse(
              XML_FILE,
              parser
          )

          root = tree.getroot()

          print("XML parsed successfully.")

          # ========================================================
          # INDEX XML OBJECTS
          # ========================================================

          id_index = {}

          for element in root.iter():
              gml_id = element.get(
                  f"{{{GML}}}id"
              )

              if gml_id:
                  id_index[gml_id] = element

          print(
              f"Indexed XML objects: {len(id_index)}"
          )

          # ========================================================
          # BASIC HELPERS
          # ========================================================

          def lname(element):
              return etree.QName(element).localname


          def text(element):
              if element is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  "".join(element.itertext())
              ).strip()


          def href(element):
              return element.get(
                  f"{{{XLINK}}}href"
              )


          def resolve(element):
              value = href(element)

              if not value:
                  return element

              if "#" in value:
                  fragment = value.rsplit(
                      "#",
                      1
                  )[1]

                  if fragment in id_index:
                      return id_index[fragment]

              return element


          def first_text(element, names):
              wanted = {
                  name.lower()
                  for name in names
              }

              for child in element.iter():
                  if lname(
                      child
                  ).lower() in wanted:

                      value = text(child)

                      if value:
                          return value

              return ""


          def direct_or_reference(
              element,
              child_name
          ):
              matches = element.xpath(
                  f"./*[local-name()='{child_name}']"
              )

              result = []

              for child in matches:
                  target = resolve(child)

                  if target is not None:
                      result.append(target)

              return result


          # ========================================================
          # AIRSPACE FILTER
          #
          # ONLY KEEP:
          #
          # CLASS A-G
          # P
          # R
          # D
          # ATZ
          # MATZ
          # RMZ
          # TMZ
          #
          # EVERYTHING ELSE IS OMITTED.
          # ========================================================

          ALLOWED_CLASSES = {
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G"
          }

          ALLOWED_SPECIAL = {
              "P",
              "R",
              "D",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          }


          def normalise(value):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  (value or "").upper()
              )


          def classify_airspace(
              designator,
              name,
              air_type,
              local_type,
              classification
          ):
              designator = (
                  designator or ""
              ).upper().strip()

              name = (
                  name or ""
              ).upper().strip()

              air_type = normalise(
                  air_type
              )

              local_type = normalise(
                  local_type
              )

              classification = normalise(
                  classification
              )

              # ----------------------------------------------------
              # CLASS A-G
              # ----------------------------------------------------

              if classification in ALLOWED_CLASSES:
                  return (
                      True,
                      classification,
                      f"CLASS_{classification}",
                      "solid"
                  )

              # ----------------------------------------------------
              # P / R / D
              # ----------------------------------------------------

              if air_type in {
                  "P",
                  "PROHIBITED"
              }:
                  return (
                      True,
                      "P",
                      "PROHIBITED",
                      "solid"
                  )

              if air_type in {
                  "R",
                  "RESTRICTED"
              }:
                  return (
                      True,
                      "R",
                      "RESTRICTED",
                      "solid"
                  )

              if air_type in {
                  "D",
                  "DANGER"
              }:
                  return (
                      True,
                      "D",
                      "DANGER",
                      "solid"
                  )

              # ----------------------------------------------------
              # SPECIAL ZONES
              # ----------------------------------------------------

              for special in (
                  "MATZ",
                  "ATZ",
                  "RMZ",
                  "TMZ"
              ):

                  if special in {
                      air_type,
                      local_type,
                      classification
                  }:
                      return (
                          True,
                          special,
                          special,
                          "dashed"
                      )

              # Conservative name/designator fallback.
              combined = (
                  designator
                  + " "
                  + name
              )

              for special in (
                  "MATZ",
                  "ATZ",
                  "RMZ",
                  "TMZ"
              ):

                  if re.search(
                      rf"(?<![A-Z0-9]){special}(?![A-Z0-9])",
                      combined
                  ):
                      return (
                          True,
                          special,
                          special,
                          "dashed"
                      )

              return (
                  False,
                  None,
                  None,
                  None
              )


          # ========================================================
          # COORDINATE HELPERS
          # ========================================================

          def numbers(value):
              return [
                  float(number)
                  for number in re.findall(
                      r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?",
                      value or ""
                  )
              ]


          def geometry_srs(element):
              current = element

              while current is not None:
                  value = current.get(
                      "srsName"
                  )

                  if value:
                      return value

                  current = current.getparent()

              return (
                  "urn:ogc:def:crs:EPSG::4326"
              )


          def lat_first(srs):
              value = (
                  srs or ""
              ).upper()

              return (
                  "EPSG::4326" in value
                  or
                  "EPSG:4326" in value
                  or
                  "EPSG/0/4326" in value
              )


          def position_pairs(
              element
          ):
              pos_lists = element.xpath(
                  ".//*[local-name()='posList']"
              )

              if pos_lists:
                  node = pos_lists[0]

                  values = numbers(
                      text(node)
                  )

                  if len(values) < 2:
                      return []

                  try:
                      dimension = int(
                          node.get(
                              "srsDimension",
                              "2"
                          )
                      )
                  except Exception:
                      dimension = 2

                  dimension = max(
                      dimension,
                      2
                  )

                  pairs = []

                  for i in range(
                      0,
                      len(values) - 1,
                      dimension
                  ):
                      pairs.append(
                          (
                              values[i],
                              values[i + 1]
                          )
                      )

                  return pairs

              positions = element.xpath(
                  ".//*[local-name()='pos']"
              )

              pairs = []

              for node in positions:
                  values = numbers(
                      text(node)
                  )

                  if len(values) >= 2:
                      pairs.append(
                          (
                              values[0],
                              values[1]
                          )
                      )

              return pairs


          def to_lon_lat(
              pair,
              srs
          ):
              first, second = pair

              if lat_first(srs):
                  return (
                      second,
                      first
                  )

              return (
                  first,
                  second
              )


          def coordinates(
              element,
              srs
          ):
              return [
                  to_lon_lat(
                      pair,
                      srs
                  )
                  for pair in position_pairs(
                      element
                  )
              ]


          # ========================================================
          # RADIUS
          # ========================================================

          def radius_metres(
              element
          ):
              try:
                  value = float(
                      text(element)
                  )
              except Exception:
                  return None

              unit = (
                  element.get(
                      "uom",
                      "m"
                  )
                  .strip()
                  .lower()
              )

              if unit in {
                  "m",
                  "meter",
                  "metre",
                  "meters",
                  "metres"
              }:
                  return value

              if unit in {
                  "km",
                  "kilometer",
                  "kilometre"
              }:
                  return value * 1000

              if unit in {
                  "nm",
                  "nmi",
                  "[nmi_i]"
              }:
                  return value * 1852

              if unit in {
                  "ft",
                  "foot",
                  "feet"
              }:
                  return value * 0.3048

              if unit == "mi":
                  return value * 1609.344

              return value


          # ========================================================
          # ARC / CIRCLE
          # ========================================================

          def arc_points(
              segment,
              srs
          ):
              centre_values = position_pairs(
                  segment
              )

              if not centre_values:

                  point_nodes = segment.xpath(
                      ".//*[local-name()='pointProperty']"
                  )

                  for node in point_nodes:
                      target = resolve(node)

                      centre_values = position_pairs(
                          target
                      )

                      if centre_values:
                          break

              if not centre_values:
                  return []

              centre = to_lon_lat(
                  centre_values[0],
                  srs
              )

              radius_nodes = segment.xpath(
                  ".//*[local-name()='radius']"
              )

              if not radius_nodes:
                  return []

              radius = radius_metres(
                  radius_nodes[0]
              )

              if radius is None:
                  return []

              start_nodes = segment.xpath(
                  ".//*[local-name()='startAngle']"
              )

              end_nodes = segment.xpath(
                  ".//*[local-name()='endAngle']"
              )

              # Full circle.
              if not start_nodes or not end_nodes:

                  count = 96
                  result = []

                  for i in range(
                      count + 1
                  ):

                      angle = (
                          360.0
                          * i
                          / count
                      )

                      lon, lat, _ = geod.fwd(
                          centre[0],
                          centre[1],
                          angle,
                          radius
                      )

                      result.append(
                          (
                              lon,
                              lat
                          )
                      )

                  return result

              try:
                  start = float(
                      text(
                          start_nodes[0]
                      )
                  )

                  end = float(
                      text(
                          end_nodes[0]
                      )
                  )
              except Exception:
                  return []

              difference = end - start

              steps = max(
                  4,
                  int(
                      abs(difference) / 3
                  ) + 1
              )

              result = []

              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i / steps
                  )

                  angle = (
                      start
                      +
                      difference * fraction
                  )

                  lon, lat, _ = geod.fwd(
                      centre[0],
                      centre[1],
                      angle,
                      radius
                  )

                  result.append(
                      (
                          lon,
                          lat
                      )
                  )

              return result


          # ========================================================
          # CURVE
          # ========================================================

          def curve_segment_points(
              segment,
              srs
          ):
              segment_name = lname(
                  segment
              ).lower()

              if segment_name in {
                  "geodesicstring",
                  "linestringsegment",
                  "linestring",
                  "linearring"
              }:
                  return coordinates(
                      segment,
                      srs
                  )

              if segment_name in {
                  "arcbycenterpoint",
                  "circlebycenterpoint"
              }:
                  return arc_points(
                      segment,
                      srs
                  )

              return coordinates(
                  segment,
                  srs
              )


          def curve_points(
              curve,
              srs
          ):
              curve = resolve(curve)

              local_srs = (
                  curve.get(
                      "srsName"
                  )
                  or srs
              )

              segments = curve.xpath(
                  ".//*[local-name()='segments']/*"
              )

              result = []

              for segment in segments:

                  points = curve_segment_points(
                      segment,
                      local_srs
                  )

                  if not points:
                      continue

                  if result and points:

                      if (
                          abs(
                              result[-1][0]
                              -
                              points[0][0]
                          ) < 1e-10
                          and
                          abs(
                              result[-1][1]
                              -
                              points[0][1]
                          ) < 1e-10
                      ):
                          points = points[1:]

                  result.extend(
                      points
                  )

              return result


          # ========================================================
          # RING
          # ========================================================

          def ring_points(
              ring,
              srs
          ):
              ring = resolve(ring)

              linear_rings = ring.xpath(
                  ".//*[local-name()='LinearRing']"
              )

              if linear_rings:

                  return coordinates(
                      linear_rings[0],
                      srs
                  )

              members = ring.xpath(
                  "./*[local-name()='curveMember']"
              )

              result = []

              for member in members:

                  target = resolve(member)

                  curves = []

                  if target is not None:

                      if lname(
                          target
                      ).lower() == "curve":

                          curves.append(
                              target
                          )
                      else:

                          curves.extend(
                              target.xpath(
                                  ".//*[local-name()='Curve']"
                              )
                          )

                  if not curves:

                      curves = member.xpath(
                          ".//*[local-name()='Curve']"
                      )

                  for curve in curves:

                      points = curve_points(
                          curve,
                          srs
                      )

                      if not points:
                          continue

                      if result and points:

                          if (
                              abs(
                                  result[-1][0]
                                  -
                                  points[0][0]
                              ) < 1e-10
                              and
                              abs(
                                  result[-1][1]
                                  -
                                  points[0][1]
                              ) < 1e-10
                          ):
                              points = points[1:]

                      result.extend(
                          points
                      )

              return result


          # ========================================================
          # POLYGON PATCH
          # ========================================================

          def polygon_from_patch(
              patch,
              srs
          ):
              exterior = patch.xpath(
                  "./*[local-name()='exterior']"
              )

              if not exterior:

                  exterior = patch.xpath(
                      ".//*[local-name()='exterior']"
                  )

              if not exterior:
                  return None

              linear_rings = exterior[0].xpath(
                  ".//*[local-name()='LinearRing']"
              )

              if linear_rings:

                  outer = coordinates(
                      linear_rings[0],
                      srs
                  )

              else:

                  rings = exterior[0].xpath(
                      ".//*[local-name()='Ring']"
                  )

                  if not rings:
                      return None

                  outer = ring_points(
                      rings[0],
                      srs
                  )

              if len(outer) < 3:
                  return None

              if outer[0] != outer[-1]:
                  outer.append(
                      outer[0]
                  )

              holes = []

              interiors = patch.xpath(
                  "./*[local-name()='interior']"
              )

              for interior in interiors:

                  linear_rings = interior.xpath(
                      ".//*[local-name()='LinearRing']"
                  )

                  if linear_rings:

                      hole = coordinates(
                          linear_rings[0],
                          srs
                      )

                  else:

                      rings = interior.xpath(
                          ".//*[local-name()='Ring']"
                      )

                      if not rings:
                          continue

                      hole = ring_points(
                          rings[0],
                          srs
                      )

                  if len(hole) < 3:
                      continue

                  if hole[0] != hole[-1]:
                      hole.append(
                          hole[0]
                      )

                  holes.append(
                      hole
                  )

              try:

                  polygon = Polygon(
                      outer,
                      holes
                  )

              except Exception:

                  return None

              if polygon.is_empty:
                  return None

              if not polygon.is_valid:
                  polygon = polygon.buffer(0)

              if polygon.is_empty:
                  return None

              return polygon


          # ========================================================
          # SURFACE
          # ========================================================

          def surface_geometry(
              surface
          ):
              surface = resolve(surface)

              srs = geometry_srs(
                  surface
              )

              patches = surface.xpath(
                  ".//*[local-name()='PolygonPatch']"
              )

              geometries = []

              for patch in patches:

                  polygon = polygon_from_patch(
                      patch,
                      srs
                  )

                  if polygon is not None:
                      geometries.append(
                          polygon
                      )

              if not geometries:
                  return None

              try:
                  return unary_union(
                      geometries
                  )
              except Exception:
                  return geometries[0]


          # ========================================================
          # AIRSPACE VOLUME
          # ========================================================

          def volume_geometry(
              volume
          ):
              volume = resolve(volume)

              surfaces = direct_or_reference(
                  volume,
                  "horizontalProjection"
              )

              geometries = []

              for surface in surfaces:

                  geometry = surface_geometry(
                      surface
                  )

                  if geometry is not None:
                      geometries.append(
                          geometry
                      )

              if not geometries:

                  surfaces = volume.xpath(
                      ".//*[local-name()='Surface']"
                  )

                  for surface in surfaces:

                      geometry = surface_geometry(
                          surface
                      )

                      if geometry is not None:
                          geometries.append(
                              geometry
                          )

              if not geometries:
                  return None

              try:
                  return unary_union(
                      geometries
                  )
              except Exception:
                  return geometries[0]


          # ========================================================
          # GEOMETRY COMPONENTS
          # ========================================================

          def geometry_components(
              timeslice
          ):
              components = []

              for node in timeslice.xpath(
                  "./*[local-name()='geometryComponent']"
              ):

                  component = resolve(node)

                  components.append(
                      component
                  )

              if not components:

                  components = timeslice.xpath(
                      ".//*[local-name()='AirspaceGeometryComponent']"
                  )

              return components


          def component_operation(
              component
          ):
              return first_text(
                  component,
                  [
                      "operation"
                  ]
              ).upper()


          def component_sequence(
              component
          ):
              value = first_text(
                  component,
                  [
                      "operationSequence"
                  ]
              )

              try:
                  return int(value)
              except Exception:
                  return 999999


          def component_volume(
              component
          ):
              direct = direct_or_reference(
                  component,
                  "theAirspaceVolume"
              )

              if direct:
                  return direct[0]

              volumes = component.xpath(
                  ".//*[local-name()='AirspaceVolume']"
              )

              if volumes:
                  return resolve(
                      volumes[0]
                  )

              return None


          # ========================================================
          # AIRSPACE GEOMETRY
          # ========================================================

          def airspace_geometry(
              timeslice
          ):
              components = geometry_components(
                  timeslice
              )

              if not components:
                  return (
                      None,
                      0,
                      []
                  )

              ordered = sorted(
                  components,
                  key=component_sequence
              )

              result = None
              operations = []

              for component in ordered:

                  operation = component_operation(
                      component
                  )

                  operations.append(
                      operation
                  )

                  volume = component_volume(
                      component
                  )

                  if volume is None:
                      continue

                  geometry = volume_geometry(
                      volume
                  )

                  if geometry is None:
                      continue

                  if result is None:

                      result = geometry
                      continue

                  if operation in {
                      "SUBTRACTION",
                      "SUBTR"
                  }:

                      try:
                          result = result.difference(
                              geometry
                          )
                      except Exception:
                          pass

                  elif operation in {
                      "INTERSECTION",
                      "INTERS"
                  }:

                      try:
                          result = result.intersection(
                              geometry
                          )
                      except Exception:
                          pass

                  else:

                      try:
                          result = result.union(
                              geometry
                          )
                      except Exception:
                          pass

              return (
                  result,
                  len(components),
                  operations
              )


          # ========================================================
          # FIND AIRSPACE
          # ========================================================

          airspaces = root.xpath(
              "//*[local-name()='Airspace']"
          )

          print("")
          print(
              f"NATS Airspace features found: {len(airspaces)}"
          )

          if not airspaces:

              print(
                  "ERROR: No Airspace features found."
              )

              sys.exit(1)


          # ========================================================
          # FILTER BEFORE GEOMETRY PROCESSING
          # ========================================================

          selected = []
          omitted = 0
          omitted_types = {}

          for airspace in airspaces:

              timeslices = airspace.xpath(
                  ".//*[local-name()='AirspaceTimeSlice']"
              )

              timeslice = (
                  timeslices[-1]
                  if timeslices
                  else airspace
              )

              designator = first_text(
                  timeslice,
                  [
                      "designator"
                  ]
              )

              name = first_text(
                  timeslice,
                  [
                      "name"
                  ]
              )

              air_type = first_text(
                  timeslice,
                  [
                      "type"
                  ]
              )

              local_type = first_text(
                  timeslice,
                  [
                      "localType"
                  ]
              )

              classification = first_text(
                  timeslice,
                  [
                      "classification"
                  ]
              )

              (
                  keep,
                  category,
                  category_name,
                  boundary
              ) = classify_airspace(
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification
              )

              if keep:

                  selected.append(
                      (
                          airspace,
                          timeslice,
                          designator,
                          name,
                          air_type,
                          local_type,
                          classification,
                          category,
                          category_name,
                          boundary
                      )
                  )

              else:

                  omitted += 1

                  key = (
                      normalise(air_type)
                      or
                      normalise(local_type)
                      or
                      normalise(classification)
                      or
                      "OTHER"
                  )

                  omitted_types[key] = (
                      omitted_types.get(
                          key,
                          0
                      )
                      + 1
                  )


          print("")
          print("==========================================")
          print("AIRSPACE FILTER")
          print("==========================================")
          print("")
          print(
              f"Source NATS airspace: {len(airspaces)}"
          )
          print(
              f"Selected for AviMap: {len(selected)}"
          )
          print(
              f"Omitted: {omitted}"
          )

          print("")
          print("Omitted type summary:")

          for key, count in sorted(
              omitted_types.items()
          ):
              print(
                  f"  {key}: {count}"
              )

          print("")
          print("Allowed:")
          print("  Class A")
          print("  Class B")
          print("  Class C")
          print("  Class D")
          print("  Class E")
          print("  Class F")
          print("  Class G")
          print("  P - Prohibited")
          print("  R - Restricted")
          print("  D - Danger")
          print("  ATZ")
          print("  MATZ")
          print("  RMZ")
          print("  TMZ")

          if not selected:

              print("")
              print(
                  "ERROR: Filter selected zero airspace features."
              )

              sys.exit(1)


          # ========================================================
          # DEBUG SELECTED AIRSPACE
          # ========================================================

          print("")
          print("==========================================")
          print("AIXM GEOMETRY DEBUG")
          print("==========================================")

          for index, item in enumerate(
              selected[:5],
              1
          ):

              (
                  airspace,
                  timeslice,
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification,
                  category,
                  category_name,
                  boundary
              ) = item

              components = geometry_components(
                  timeslice
              )

              print("")
              print(
                  f"--- Selected Airspace {index} ---"
              )

              print(
                  "Designator:",
                  designator
              )

              print(
                  "Name:",
                  name
              )

              print(
                  "Type:",
                  air_type
              )

              print(
                  "Local type:",
                  local_type
              )

              print(
                  "Classification:",
                  classification
              )

              print(
                  "AviMap category:",
                  category_name
              )

              print(
                  "Geometry components:",
                  len(components)
              )


          # ========================================================
          # CONVERT SELECTED AIRSPACE
          # ========================================================

          features = []
          failures = 0
          failure_reasons = {}
          categories = {}

          for item in selected:

              (
                  airspace,
                  timeslice,
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification,
                  category,
                  category_name,
                  boundary
              ) = item

              try:

                  (
                      geometry,
                      component_count,
                      operations
                  ) = airspace_geometry(
                      timeslice
                  )

              except Exception as exc:

                  geometry = None
                  component_count = 0
                  operations = []

                  reason = (
                      f"exception:{type(exc).__name__}"
                  )

                  failure_reasons[reason] = (
                      failure_reasons.get(
                          reason,
                          0
                      )
                      + 1
                  )

                  if failures < 10:

                      print("")
                      print(
                          "GEOMETRY EXCEPTION"
                      )

                      print(
                          "Designator:",
                          designator
                      )

                      print(
                          "Name:",
                          name
                      )

                      print(
                          "Category:",
                          category_name
                      )

                      print(
                          "Exception:",
                          repr(exc)
                      )

              if geometry is None:

                  failures += 1

                  failure_reasons[
                      "no_geometry"
                  ] = (
                      failure_reasons.get(
                          "no_geometry",
                          0
                      )
                      + 1
                  )

                  if failures <= 10:

                      print("")
                      print(
                          "GEOMETRY FAILURE"
                      )

                      print(
                          "Designator:",
                          designator
                      )

                      print(
                          "Name:",
                          name
                      )

                      print(
                          "Category:",
                          category_name
                      )

                      print(
                          "Components:",
                          component_count
                      )

                      print(
                          "Operations:",
                          operations
                      )

                  continue

              if geometry.is_empty:

                  failures += 1

                  failure_reasons[
                      "empty_geometry"
                  ] = (
                      failure_reasons.get(
                          "empty_geometry",
                          0
                      )
                      + 1
                  )

                  continue

              categories[
                  category_name
              ] = (
                  categories.get(
                      category_name,
                      0
                  )
                  + 1
              )

              if category_name in {
                  "ATZ",
                  "MATZ",
                  "RMZ",
                  "TMZ"
              }:

                  stroke = "purple"

              elif category_name in {
                  "P",
                  "R",
                  "D"
              }:

                  stroke = "red"

              else:

                  stroke = "blue"

              features.append(
                  {
                      "type": "Feature",
                      "geometry": mapping(
                          geometry
                      ),
                      "properties": {
                          "designator": designator,
                          "name": name,
                          "type": air_type or "",
                          "localType": local_type or "",
                          "classification": classification or "",
                          "category": category_name,
                          "colour": stroke,
                          "boundary": boundary,
                          "stroke": stroke,
                          "lineStyle": boundary,
                          "airspaceType": air_type or "",
                          "airspaceClass": classification or "",
                          "source": "NATS UK ICAO AIP Dataset",
                          "airac": AIRAC
                      }
                  }
              )


          # ========================================================
          # RESULT
          # ========================================================

          print("")
          print("==========================================")
          print("AIRSPACE CONVERSION RESULT")
          print("==========================================")
          print("")
          print(
              f"Source Airspace features: {len(airspaces)}"
          )
          print(
              f"Selected by filter: {len(selected)}"
          )
          print(
              f"Valid geometries: {len(features)}"
          )
          print(
              f"Geometry failures: {failures}"
          )

          print("")
          print("Categories:")

          for category, count in sorted(
              categories.items()
          ):

              print(
                  f"  {category}: {count}"
              )

          print("")
          print("Failure reasons:")

          for reason, count in sorted(
              failure_reasons.items()
          ):

              print(
                  f"  {reason}: {count}"
              )


          # ========================================================
          # SAFETY CHECK
          # ========================================================

          if len(features) == 0:

              print("")
              print(
                  "ERROR: NATS AIP conversion produced "
                  "zero valid airspace geometries."
              )

              print(
                  "Existing GeoJSON has NOT been replaced."
              )

              sys.exit(1)

          if len(features) < 100:

              print("")
              print(
                  "ERROR: Suspiciously small filtered "
                  "airspace dataset."
              )

              print(
                  f"Only {len(features)} geometries produced."
              )

              print(
                  "Existing GeoJSON has NOT been replaced."
              )

              sys.exit(1)


          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          collection = {
              "type": "FeatureCollection",
              "features": features
          }

          temporary = OUTPUT.with_suffix(
              ".geojson.tmp"
          )

          temporary.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          temporary.replace(
              OUTPUT
          )

          print("")
          print(
              f"Written: {OUTPUT}"
          )

          print(
              f"Features: {len(features)}"
          )

          PY

