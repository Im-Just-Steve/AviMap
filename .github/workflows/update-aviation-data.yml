name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # DOWNLOAD OPENAIP AIRSPACE
      # ============================================================

      - name: Download UK airspace from OpenAIP
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading UK airspace from OpenAIP"
          echo "=========================================="

          if [ -z "${OPENAIP_API_KEY:-}" ]; then
            echo "ERROR: OPENAIP_API_KEY secret is not configured."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=1" \
            -o /tmp/openaip-page-1.json

          COUNT=$(jq '.items | length' /tmp/openaip-page-1.json)
          TOTAL_PAGES=$(jq -r '.totalPages // 1' /tmp/openaip-page-1.json)

          echo "First page airspaces: ${COUNT}"
          echo "Total pages: ${TOTAL_PAGES}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: OpenAIP returned zero airspaces."
            exit 1
          fi


      - name: Download all UK airspace pages
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -euo pipefail

          rm -f /tmp/all-airspaces.jsonl

          TOTAL_PAGES=$(jq -r '.totalPages // 1' /tmp/openaip-page-1.json)

          for PAGE in $(seq 1 "${TOTAL_PAGES}"); do

            echo "Downloading airspace page ${PAGE}/${TOTAL_PAGES}..."

            if [ "${PAGE}" -eq 1 ]; then
              PAGE_FILE="/tmp/openaip-page-1.json"
            else
              PAGE_FILE="/tmp/openaip-page-${PAGE}.json"

              curl \
                --fail \
                --silent \
                --show-error \
                --retry 3 \
                --retry-delay 5 \
                -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
                -H "Accept: application/json" \
                "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=${PAGE}" \
                -o "${PAGE_FILE}"
            fi

            PAGE_COUNT=$(jq '.items | length' "${PAGE_FILE}")

            echo "  ${PAGE_COUNT} airspaces"

            jq -c '.items[]' "${PAGE_FILE}" >> /tmp/all-airspaces.jsonl

          done

          AIRSPACE_RAW_COUNT=$(wc -l < /tmp/all-airspaces.jsonl)

          echo ""
          echo "Raw OpenAIP airspaces downloaded: ${AIRSPACE_RAW_COUNT}"

          if [ "${AIRSPACE_RAW_COUNT}" -eq 0 ]; then
            echo "ERROR: No airspaces were downloaded."
            exit 1
          fi


      # ============================================================
      # CONVERT AIRSPACE
      # ============================================================

      - name: Convert airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          node <<'NODE'
          const fs = require("fs");

          const lines = fs.readFileSync(
            "/tmp/all-airspaces.jsonl",
            "utf8"
          )
          .split(/\r?\n/)
          .filter(Boolean);

          const features = [];

          for (const line of lines) {
            const item = JSON.parse(line);

            let geometry = item.geometry;

            if (typeof geometry === "string") {
              try {
                geometry = JSON.parse(geometry);
              } catch {
                continue;
              }
            }

            if (
              !geometry ||
              !geometry.type ||
              !geometry.coordinates
            ) {
              continue;
            }

            features.push({
              type: "Feature",
              id: item._id || item.id,

              properties: {
                id: item._id || item.id || "",
                name: item.name || "Unknown airspace",
                type: item.type ?? "",
                icaoClass: item.icaoClass ?? "",
                activity: item.activity ?? "",
                upperLimit: item.upperLimit ?? null,
                lowerLimit: item.lowerLimit ?? null,
                country: item.country ?? "GB"
              },

              geometry
            });
          }

          if (features.length === 0) {
            throw new Error(
              "Airspace conversion produced zero valid features."
            );
          }

          fs.writeFileSync(
            "/tmp/avimap-data/uk-airspace.geojson",
            JSON.stringify({
              type: "FeatureCollection",
              features
            })
          );

          console.log(
            `Created ${features.length} airspace features.`
          );
          NODE


      # ============================================================
      # FIND CURRENT NATS VRP DATASET
      # ============================================================

      - name: Find current NATS VRP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS UK VRP dataset"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          html = open(
              "/tmp/nats.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:
              match = re.search(
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  effective_date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (effective_date, href)
              )

          if not datasets:
              print("ERROR: No NATS VRP ZIP datasets found.")
              print("")
              print("VRP links found:")

              for href in hrefs:
                  if "VRP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          print("")
          print("Available NATS VRP datasets:")

          for date, href in sorted(datasets):
              marker = ""

              if date <= today:
                  marker = " <-- current/available"

              print(
                  f"  {date}  {href}{marker}"
              )

          current = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if current:
              effective_date, href = max(
                  current,
                  key=lambda item: item[0]
              )
          else:
              effective_date, href = min(
                  datasets,
                  key=lambda item: item[0]
              )

          url = urljoin(
              "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html",
              href
          )

          print("")
          print("==========================================")
          print("SELECTED NATS VRP DATASET")
          print("==========================================")
          print("")
          print(f"Effective date: {effective_date}")
          print(f"URL: {url}")
          print("")

          with open("/tmp/nats-vrp-url.txt", "w") as f:
              f.write(url)

          with open("/tmp/nats-vrp-date.txt", "w") as f:
              f.write(str(effective_date))
          PY


      # ============================================================
      # DOWNLOAD AND EXTRACT NATS VRP ZIP
      # ============================================================

      - name: Download and extract NATS VRPs
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "Downloading NATS VRP ZIP"
          echo "=========================================="
          echo "${VRP_URL}"

          mkdir -p /tmp/nats-vrp

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats-vrp.zip

          test -s /tmp/nats-vrp.zip

          echo ""
          echo "ZIP contents:"
          unzip -l /tmp/nats-vrp.zip

          unzip \
            -o \
            /tmp/nats-vrp.zip \
            -d /tmp/nats-vrp

          VRP_CSV=$(find \
            /tmp/nats-vrp \
            -type f \
            \( -iname "*.csv" -o -iname "*.CSV" \) \
            | head -n 1)

          if [ -z "${VRP_CSV}" ]; then
            echo "ERROR: No CSV found inside NATS VRP ZIP."
            exit 1
          fi

          echo ""
          echo "Selected VRP CSV:"
          echo "${VRP_CSV}"

          cp "${VRP_CSV}" /tmp/uk-vrps.csv

          echo ""
          echo "CSV size:"
          wc -c /tmp/uk-vrps.csv


      # ============================================================
      # CONVERT NATS VRPs TO GEOJSON
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          print(f"CSV records: {len(rows)}")

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(rows[0].keys())

          print("")
          print("CSV fields:")
          for field in fields:
              print(f"  {field}")

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).strip().lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):
              for name in names:
                  key = norm(name)

                  if key in normalised:
                      return normalised[key]

              for key, original in normalised.items():
                  for name in names:
                      n = norm(name)

                      if n in key or key in n:
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          print("")
          print("Detected fields:")
          print(f"  Name:      {name_field}")
          print(f"  Latitude:  {lat_field}")
          print(f"  Longitude: {lon_field}")

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify NATS latitude/longitude fields."
              )

          def parse_coord(value, latitude):
              """
              NATS VRP coordinates use:
                Latitude  DDMMSS[.decimal]
                Longitude DDDMMSS[.decimal]

              The parser also accepts conventional decimal degrees
              and DMS values with N/S/E/W.
              """

              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              text = text.replace(",", ".")

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:
                  hemisphere = match.group(1).upper()
                  text = text[:match.start()].strip()

              # ----------------------------------------------
              # Ordinary decimal degrees
              # ----------------------------------------------

              try:
                  number = float(text)

                  limit = 90 if latitude else 180

                  if -limit <= number <= limit:
                      if hemisphere in ("S", "W"):
                          number = -abs(number)
                      elif hemisphere in ("N", "E"):
                          number = abs(number)

                      return number

              except ValueError:
                  pass

              # ----------------------------------------------
              # Remove DMS separators.
              # ----------------------------------------------

              compact = (
                  text
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
                  .strip()
              )

              # ----------------------------------------------
              # NATS compact DDMMSS / DDDMMSS.
              # ----------------------------------------------

              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):

                  try:
                      if "." in compact:
                          integer_part, decimal_part = compact.split(
                              ".",
                              1
                          )
                      else:
                          integer_part = compact
                          decimal_part = ""

                      if latitude:
                          if len(integer_part) < 6:
                              raise ValueError

                          degrees = int(
                              integer_part[:2]
                          )

                          minutes = int(
                              integer_part[2:4]
                          )

                          seconds_text = (
                              integer_part[4:]
                          )

                      else:
                          if len(integer_part) < 7:
                              raise ValueError

                          degrees = int(
                              integer_part[:3]
                          )

                          minutes = int(
                              integer_part[3:5]
                          )

                          seconds_text = (
                              integer_part[5:]
                          )

                      if decimal_part:
                          seconds_text += (
                              "." + decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      limit = 90 if latitude else 180

                      if degrees > limit:
                          raise ValueError

                      if minutes >= 60:
                          raise ValueError

                      if seconds >= 60:
                          raise ValueError

                      result = (
                          degrees
                          + minutes / 60
                          + seconds / 3600
                      )

                      if hemisphere in ("S", "W"):
                          result = -abs(result)

                      elif hemisphere in ("N", "E"):
                          result = abs(result)

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):
                      pass

              # ----------------------------------------------
              # Conventional DMS fallback.
              # ----------------------------------------------

              try:
                  numbers = re.findall(
                      r"[-+]?\d+(?:\.\d+)?",
                      text
                  )

                  if not numbers:
                      return None

                  values = [
                      float(number)
                      for number in numbers
                  ]

                  degrees = abs(values[0])

                  minutes = (
                      abs(values[1])
                      if len(values) > 1
                      else 0
                  )

                  seconds = (
                      abs(values[2])
                      if len(values) > 2
                      else 0
                  )

                  if minutes >= 60 or seconds >= 60:
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  if hemisphere in ("S", "W"):
                      result = -abs(result)

                  elif hemisphere in ("N", "E"):
                      result = abs(result)

                  elif values[0] < 0:
                      result = -result

                  limit = 90 if latitude else 180

                  if not -limit <= result <= limit:
                      return None

                  return result

              except (
                  ValueError,
                  IndexError
              ):
                  return None

          features = []
          invalid_coordinates = 0

          for index, row in enumerate(rows, 1):

              latitude = parse_coord(
                  row.get(lat_field),
                  True
              )

              longitude = parse_coord(
                  row.get(lon_field),
                  False
              )

              if latitude is None or longitude is None:
                  invalid_coordinates += 1
                  continue

              if not -90 <= latitude <= 90:
                  invalid_coordinates += 1
                  continue

              if not -180 <= longitude <= 180:
                  invalid_coordinates += 1
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(name_field, "")
                  ).strip()

              if not name:
                  name = f"VRP {index}"

              properties = {
                  str(k).strip(): v
                  for k, v in row.items()
                  if k
              }

              properties["name"] = name
              properties["ident"] = name

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          longitude,
                          latitude
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("VRP CONVERSION RESULT")
          print("==========================================")
          print("")
          print(f"CSV records:          {len(rows)}")
          print(f"Valid VRPs:           {len(features)}")
          print(f"Invalid coordinates:  {invalid_coordinates}")
          print("")

          # HARD SAFETY CHECK:
          # Never write an empty VRP dataset.
          if len(features) == 0:
              raise SystemExit(
                  "ERROR: VRP conversion produced ZERO valid features. "
                  "The existing repository data will NOT be replaced."
              )

          output = {
              "type": "FeatureCollection",
              "features": features
          }

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  output,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              f"Created {len(features)} UK VRP features."
          )
          PY


      # ============================================================
      # VALIDATE BOTH DATASETS BEFORE TOUCHING REPOSITORY FILES
      # ============================================================

      - name: Validate generated aviation data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL GENERATED DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated airspace dataset is empty."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated VRP dataset is empty."
            exit 1
          fi

          echo "Validation successful."
          echo "Repository data has not been changed yet."


      # ============================================================
      # ONLY AFTER VALIDATION, REPLACE REPOSITORY DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "Validated aviation data copied into repository."


      # ============================================================
      # COMMIT ONLY IF DATA ACTUALLY CHANGED
      # ============================================================

      - name: Commit updated aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "=========================================="
          echo "DATA CHANGE CHECK"
          echo "=========================================="
          echo ""

          if git diff --cached --quiet; then

            echo "No changes detected."
            echo "Existing aviation data remains untouched."

          else

            echo "Changes detected:"
            echo ""

            git diff --cached --stat

            echo ""
            echo "Committing updated aviation data..."

            git commit \
              -m "Update UK aviation data"

            git push

            echo ""
            echo "=========================================="
            echo "UPDATE COMPLETE"
            echo "=========================================="

          fi
