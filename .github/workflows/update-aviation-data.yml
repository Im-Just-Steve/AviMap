name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NATS DATASET DISCOVERY"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats-datasets.html

          test -s /tmp/nats-datasets.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = "https://nats-uk.ead-it.com"

          html = open(
              "/tmp/nats-datasets.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(
              timezone.utc
          ).date()

          def choose_dataset(
              patterns,
              label
          ):

              candidates = []

              for href in hrefs:

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          href,
                          flags=re.I
                      )

                      if not match:
                          continue

                      try:

                          date = datetime.strptime(
                              match.group(1),
                              "%Y%m%d"
                          ).date()

                      except ValueError:

                          continue

                      candidates.append(
                          (
                              date,
                              href
                          )
                      )

                      break

              if not candidates:

                  print("")
                  print(
                      f"ERROR: No {label} dataset found."
                  )

                  print("")
                  print(
                      "Relevant NATS links:"
                  )

                  for href in hrefs:

                      upper = href.upper()

                      if (
                          "AIP" in upper
                          or
                          "AIS" in upper
                          or
                          "VRP" in upper
                      ):

                          print(
                              href
                          )

                  raise SystemExit(1)

              current = [
                  item
                  for item in candidates
                  if item[0] <= today
              ]

              date, href = max(
                  current or candidates,
                  key=lambda item: item[0]
              )

              url = urljoin(
                  BASE,
                  href
              )

              print("")
              print(
                  label
              )
              print(
                  "  Effective date:",
                  date
              )
              print(
                  "  URL:",
                  url
              )

              return (
                  date,
                  url
              )

          # --------------------------------------------------------
          # NATS UK ICAO AIP XML
          #
          # Actual NATS filename:
          #
          # EG_AIP_DS_20260806_XML.zip
          # --------------------------------------------------------

          aip_date, aip_url = choose_dataset(
              [
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})\.XML$',
                  r'EG_AIP_DS_FULL_(\d{8})\.xml$'
              ],
              "UK ICAO AIP XML"
          )

          # --------------------------------------------------------
          # NATS VRP
          # --------------------------------------------------------

          vrp_date, vrp_url = choose_dataset(
              [
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV$'
              ],
              "NATS VRP"
          )

          print("")
          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print(
              "AIP AIRAC:",
              aip_date
          )
          print(
              "VRP DATE:",
              vrp_date
          )
          print("")

          open(
              "/tmp/nats-aip-url.txt",
              "w"
          ).write(
              aip_url
          )

          open(
              "/tmp/nats-aip-date.txt",
              "w"
          ).write(
              str(aip_date)
          )

          open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ).write(
              vrp_url
          )

          open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ).write(
              str(vrp_date)
          )

          PY

      # ============================================================
      # DOWNLOAD NATS AIXM
      # ============================================================

      - name: Download NATS UK ICAO AIP AIXM
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo ""
          echo "=========================================="
          echo "DOWNLOADING NATS AIXM"
          echo "=========================================="
          echo ""
          echo "$AIP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$AIP_URL" \
            -o /tmp/nats-aip-source.zip

          test -s /tmp/nats-aip-source.zip

          echo ""
          echo "Downloaded archive:"
          file /tmp/nats-aip-source.zip
          ls -lh /tmp/nats-aip-source.zip

          rm -rf /tmp/nats-aip

          mkdir -p \
            /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip-source.zip \
            -d /tmp/nats-aip

          echo ""
          echo "Extracted AIP files:"

          find \
            /tmp/nats-aip \
            -type f \
            -print

          AIP_XML=$(
            find \
              /tmp/nats-aip \
              -type f \
              \( \
                -iname "*.xml" \
                -o \
                -iname "*.XML" \
              \) \
              | grep -Ei \
                'EG_AIP_DS|AIP.*\.xml$' \
              | head -n 1
          )

          if [ -z "$AIP_XML" ]; then

              echo ""
              echo "ERROR: Could not locate AIXM XML."

              find \
                /tmp/nats-aip \
                -type f \
                -print

              exit 1

          fi

          cp \
            "$AIP_XML" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIXM XML:"
          echo "$AIP_XML"

          echo ""
          echo "AIXM size:"
          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS VRPS
      # ============================================================

      - name: Download NATS VRP list
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$VRP_URL" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          rm -rf \
            /tmp/nats-vrp

          mkdir -p \
            /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi "zip"; then

              unzip \
                -o \
                /tmp/nats-vrp-source \
                -d /tmp/nats-vrp

          else

              cp \
                /tmp/nats-vrp-source \
                /tmp/nats-vrp/vrps.csv

          fi

          VRP_CSV=$(
            find \
              /tmp/nats-vrp \
              -type f \
              \( \
                -iname "*.csv" \
                -o \
                -iname "*.CSV" \
              \) \
              | head -n 1
          )

          if [ -z "$VRP_CSV" ]; then

              echo ""
              echo "ERROR: No NATS VRP CSV found."

              find \
                /tmp/nats-vrp \
                -type f \
                -print

              exit 1

          fi

          cp \
            "$VRP_CSV" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "$VRP_CSV"

          wc -c \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      #
      # IMPORTANT:
      #
      # We deliberately do NOT use the NATS KML dataset here.
      #
      # Geometry is read from the AIXM XML itself:
      #
      # Airspace
      #   -> AirspaceGeometryComponent
      #      -> AirspaceVolume
      #         -> horizontalProjection
      #            -> Surface
      #               -> PolygonPatch
      #                  -> Ring / Curve
      #
      # The parser supports:
      #
      #   PolygonPatch
      #   LinearRing
      #   Ring
      #   Curve
      #   LineStringSegment
      #   GeodesicString
      #   ArcByBulge
      #   ArcByCenterPoint
      #   CircleByCenterPoint
      #
      # xlink references are also resolved.
      #
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # ========================================================
          # BASIC XML HELPERS
          # ========================================================

          def local(tag):

              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def text_value(
              element
          ):

              if element is None:
                  return ""

              if element.text:
                  value = (
                      element.text
                      .strip()
                  )

                  if value:
                      return value

              return ""

          def all_text(
              parent,
              names
          ):

              wanted = {
                  str(name).lower()
                  for name in names
              }

              values = []

              for element in parent.iter():

                  if (
                      local(
                          element.tag
                      ).lower()
                      not in wanted
                  ):

                      continue

                  value = text_value(
                      element
                  )

                  if value:

                      values.append(
                          value
                      )

              return values

          def first_text(
              parent,
              names
          ):

              values = all_text(
                  parent,
                  names
              )

              return (
                  values[0]
                  if values
                  else ""
              )

          def number(
              value
          ):

              try:

                  return float(
                      str(value).strip()
                  )

              except Exception:

                  return None

          def numbers_from_text(
              text
          ):

              values = []

              if not text:
                  return values

              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue

                  try:

                      values.append(
                          float(token)
                      )

                  except ValueError:

                      pass

              return values

          def position_from_element(
              element
          ):

              if element is None:
                  return None

              # Prefer direct gml:pos.
              for child in element.iter():

                  if local(
                      child.tag
                  ) != "pos":

                      continue

                  values = numbers_from_text(
                      child.text or ""
                  )

                  if len(values) >= 2:

                      return (
                          values[0],
                          values[1]
                      )

              # Fallback to posList.
              for child in element.iter():

                  if local(
                      child.tag
                  ) != "posList":

                      continue

                  values = numbers_from_text(
                      child.text or ""
                  )

                  if len(values) >= 2:

                      return (
                          values[0],
                          values[1]
                      )

              return None

          def positions_from_element(
              element
          ):

              positions = []

              if element is None:
                  return positions

              for child in element.iter():

                  tag = local(
                      child.tag
                  )

                  if tag == "posList":

                      values = numbers_from_text(
                          child.text or ""
                      )

                      for index in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          positions.append(
                              (
                                  values[index],
                                  values[index + 1]
                              )
                          )

                  elif tag == "pos":

                      values = numbers_from_text(
                          child.text or ""
                      )

                      if len(values) >= 2:

                          positions.append(
                              (
                                  values[0],
                                  values[1]
                              )
                          )

              return positions

          def uom_to_metres(
              value,
              uom
          ):

              if value is None:
                  return None

              unit = (
                  str(
                      uom or "m"
                  )
                  .strip()
                  .lower()
              )

              if unit in {
                  "m",
                  "meter",
                  "meters",
                  "metre",
                  "metres"
              }:

                  return value

              if unit in {
                  "km",
                  "kilometer",
                  "kilometers",
                  "kilometre",
                  "kilometres"
              }:

                  return value * 1000.0

              if unit in {
                  "nm",
                  "nmi",
                  "nauticalmile",
                  "nauticalmiles"
              }:

                  return value * 1852.0

              if unit in {
                  "ft",
                  "foot",
                  "feet"
              }:

                  return value * 0.3048

              return value

          # ========================================================
          # GEODESIC HELPERS
          # ========================================================

          EARTH_RADIUS_M = 6371008.8

          def destination(
              latitude,
              longitude,
              bearing,
              distance
          ):

              radius = EARTH_RADIUS_M

              bearing_rad = math.radians(
                  bearing
              )

              lat1 = math.radians(
                  latitude
              )

              lon1 = math.radians(
                  longitude
              )

              angular = (
                  distance
                  /
                  radius
              )

              lat2 = math.asin(
                  math.sin(lat1)
                  *
                  math.cos(angular)
                  +
                  math.cos(lat1)
                  *
                  math.sin(angular)
                  *
                  math.cos(bearing_rad)
              )

              lon2 = (
                  lon1
                  +
                  math.atan2(
                      math.sin(bearing_rad)
                      *
                      math.sin(angular)
                      *
                      math.cos(lat1),
                      math.cos(angular)
                      -
                      math.sin(lat1)
                      *
                      math.sin(lat2)
                  )
              )

              longitude_result = (
                  math.degrees(lon2)
                  + 540
              ) % 360 - 180

              return (
                  math.degrees(lat2),
                  longitude_result
              )

          def circle_points(
              latitude,
              longitude,
              radius_m,
              start_angle=0.0,
              end_angle=360.0,
              count=96
          ):

              if end_angle < start_angle:

                  end_angle += 360.0

              points = []

              for index in range(
                  count + 1
              ):

                  fraction = (
                      index
                      /
                      count
                  )

                  bearing = (
                      start_angle
                      +
                      (
                          end_angle
                          -
                          start_angle
                      )
                      *
                      fraction
                  )

                  points.append(
                      destination(
                          latitude,
                          longitude,
                          bearing,
                          radius_m
                      )
                  )

              return points

          # ========================================================
          # ARC BY BULGE
          # ========================================================

          def arc_by_bulge(
              start,
              end,
              bulge,
              count=32
          ):

              if (
                  start is None
                  or
                  end is None
              ):

                  return []

              if (
                  abs(bulge)
                  <
                  1e-12
              ):

                  return [
                      start,
                      end
                  ]

              # Local tangent-plane approximation.
              #
              # This is used only for the short arc segments
              # normally encountered in AIXM boundaries.

              centre_lat = math.radians(
                  (
                      start[0]
                      +
                      end[0]
                  )
                  /
                  2
              )

              sx = (
                  math.radians(
                      start[1]
                  )
                  *
                  math.cos(
                      centre_lat
                  )
              )

              sy = math.radians(
                  start[0]
              )

              ex = (
                  math.radians(
                      end[1]
                  )
                  *
                  math.cos(
                      centre_lat
                  )
              )

              ey = math.radians(
                  end[0]
              )

              dx = ex - sx
              dy = ey - sy

              chord = math.hypot(
                  dx,
                  dy
              )

              if chord == 0:

                  return [
                      start
                  ]

              mid_x = (
                  sx
                  +
                  ex
              ) / 2

              mid_y = (
                  sy
                  +
                  ey
              ) / 2

              normal_x = (
                  -dy
                  /
                  chord
              )

              normal_y = (
                  dx
                  /
                  chord
              )

              theta = (
                  4
                  *
                  math.atan(
                      bulge
                  )
              )

              half_sine = math.sin(
                  theta / 2
              )

              if abs(
                  half_sine
              ) < 1e-12:

                  return [
                      start,
                      end
                  ]

              radius = (
                  chord
                  /
                  (
                      2
                      *
                      abs(
                          half_sine
                      )
                  )
              )

              offset = math.sqrt(
                  max(
                      0,
                      radius * radius
                      -
                      (chord / 2) ** 2
                  )
              )

              direction = (
                  1
                  if bulge > 0
                  else -1
              )

              centre_x = (
                  mid_x
                  +
                  normal_x
                  *
                  offset
                  *
                  direction
              )

              centre_y = (
                  mid_y
                  +
                  normal_y
                  *
                  offset
                  *
                  direction
              )

              start_angle = math.atan2(
                  sy - centre_y,
                  sx - centre_x
              )

              step = (
                  theta
                  /
                  count
              )

              result = []

              for index in range(
                  count + 1
              ):

                  angle = (
                      start_angle
                      +
                      step * index
                  )

                  x = (
                      centre_x
                      +
                      radius
                      *
                      math.cos(angle)
                  )

                  y = (
                      centre_y
                      +
                      radius
                      *
                      math.sin(angle)
                  )

                  latitude = math.degrees(
                      y
                  )

                  longitude = math.degrees(
                      x
                      /
                      math.cos(
                          centre_lat
                      )
                  )

                  result.append(
                      (
                          latitude,
                          longitude
                      )
                  )

              return result

          # ========================================================
          # XML PARSE
          # ========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "PARSING NATS AIXM"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "XML:",
              XML
          )

          tree = ET.parse(
              XML
          )

          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          # ========================================================
          # BUILD XLink REFERENCE INDEX
          # ========================================================

          id_index = {}

          for element in root.iter():

              for attribute, value in (
                  element.attrib.items()
              ):

                  if (
                      local(attribute)
                      == "id"
                  ):

                      if value:

                          id_index[
                              value
                          ] = element

          print(
              "Indexed XML objects:",
              len(id_index)
          )

          XLINK_HREF = (
              "{http://www.w3.org/1999/xlink}"
              "href"
          )

          def href_of(
              element
          ):

              if element is None:
                  return None

              value = (
                  element.attrib.get(
                      XLINK_HREF
                  )
              )

              if value:
                  return value

              for attribute, value in (
                  element.attrib.items()
              ):

                  if (
                      local(attribute)
                      == "href"
                  ):

                      return value

              return None

          def resolve(
              element
          ):

              if element is None:
                  return None

              href = href_of(
                  element
              )

              if not href:
                  return element

              fragment = href.split(
                  "#"
              )[-1]

              return (
                  id_index.get(
                      fragment
                  )
                  or
                  element
              )

          # ========================================================
          # CURVE SEGMENTS
          # ========================================================

          def parse_arc_by_center(
              element
          ):

              centre = position_from_element(
                  element
              )

              if centre is None:
                  return []

              radius_value = None
              radius_uom = "m"

              start_angle = 0.0
              end_angle = 360.0

              for child in element.iter():

                  tag = local(
                      child.tag
                  )

                  if (
                      tag == "radius"
                      and
                      child.text
                  ):

                      radius_value = number(
                          child.text
                      )

                      radius_uom = (
                          child.attrib.get(
                              "uom",
                              "m"
                          )
                      )

                  elif (
                      tag == "startAngle"
                      and
                      child.text
                  ):

                      start_angle = number(
                          child.text
                      )

                  elif (
                      tag == "endAngle"
                      and
                      child.text
                  ):

                      end_angle = number(
                          child.text
                      )

              if (
                  radius_value is None
              ):

                  return []

              radius_m = uom_to_metres(
                  radius_value,
                  radius_uom
              )

              if radius_m is None:
                  return []

              if start_angle is None:
                  start_angle = 0.0

              if end_angle is None:
                  end_angle = 360.0

              return circle_points(
                  centre[0],
                  centre[1],
                  radius_m,
                  start_angle,
                  end_angle,
                  48
              )

          def parse_arc_by_bulge(
              element
          ):

              start = None
              end = None
              bulge = None

              for child in element.iter():

                  tag = local(
                      child.tag
                  )

                  if tag == "startPoint":

                      start = position_from_element(
                          child
                      )

                  elif tag == "endPoint":

                      end = position_from_element(
                          child
                      )

                  elif tag == "bulge":

                      bulge = number(
                          child.text
                      )

              if (
                  start is None
                  or
                  end is None
                  or
                  bulge is None
              ):

                  # Some files encode the first/last positions directly.
                  positions = positions_from_element(
                      element
                  )

                  if len(
                      positions
                  ) >= 2:

                      start = positions[0]
                      end = positions[-1]

                  if bulge is None:

                      bulge_value = first_text(
                          element,
                          {
                              "bulge"
                          }
                      )

                      bulge = number(
                          bulge_value
                      )

              if (
                  start is None
                  or
                  end is None
                  or
                  bulge is None
              ):

                  return []

              return arc_by_bulge(
                  start,
                  end,
                  bulge
              )

          def parse_curve_segment(
              segment
          ):

              segment = resolve(
                  segment
              )

              if segment is None:
                  return []

              tag = local(
                  segment.tag
              )

              if tag in {
                  "LineStringSegment",
                  "GeodesicString",
                  "Geodesic",
                  "LineString"
              }:

                  return positions_from_element(
                      segment
                  )

              if tag in {
                  "ArcByCenterPoint"
              }:

                  return parse_arc_by_center(
                      segment
                  )

              if tag in {
                  "ArcByBulge"
              }:

                  return parse_arc_by_bulge(
                      segment
                  )

              if tag in {
                  "ArcString",
                  "Arc"
              }:

                  return positions_from_element(
                      segment
                  )

              if tag in {
                  "CircleByCenterPoint"
              }:

                  points = parse_arc_by_center(
                      segment
                  )

                  if points:

                      return points

              # Generic fallback.
              return positions_from_element(
                  segment
              )

          def parse_curve(
              curve
          ):

              curve = resolve(
                  curve
              )

              if curve is None:
                  return []

              segments = []

              for element in curve.iter():

                  tag = local(
                      element.tag
                  )

                  if tag in {
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcByCenterPoint",
                      "ArcByBulge",
                      "ArcString",
                      "Arc",
                      "CircleByCenterPoint"
                  }:

                      segment = parse_curve_segment(
                          element
                      )

                      if segment:

                          segments.append(
                              segment
                          )

              if not segments:

                  return positions_from_element(
                      curve
                  )

              result = []

              for segment in segments:

                  for point in segment:

                      if (
                          result
                          and
                          point == result[-1]
                      ):

                          continue

                      result.append(
                          point
                      )

              return result

          # ========================================================
          # RINGS
          # ========================================================

          def parse_ring(
              ring
          ):

              ring = resolve(
                  ring
              )

              if ring is None:
                  return []

              tag = local(
                  ring.tag
              )

              if tag == "LinearRing":

                  positions = (
                      positions_from_element(
                          ring
                      )
                  )

                  if (
                      positions
                      and
                      positions[0]
                      !=
                      positions[-1]
                  ):

                      positions.append(
                          positions[0]
                      )

                  return positions

              result = []

              # AIXM/GML Ring is normally composed of curveMember
              # elements which may use xlink:href.

              for member in ring.iter():

                  if local(
                      member.tag
                  ) != "curveMember":

                      continue

                  target = resolve(
                      member
                  )

                  if target is member:

                      children = list(
                          member
                      )

                      if children:

                          target = resolve(
                              children[0]
                          )

                  if target is None:
                      continue

                  points = parse_curve(
                      target
                  )

                  for point in points:

                      if (
                          result
                          and
                          point == result[-1]
                      ):

                          continue

                      result.append(
                          point
                      )

              if not result:

                  result = positions_from_element(
                      ring
                  )

              if (
                  result
                  and
                  result[0]
                  !=
                  result[-1]
              ):

                  result.append(
                      result[0]
                  )

              return result

          # ========================================================
          # BOUNDARIES
          # ========================================================

          def parse_boundary(
              boundary
          ):

              boundary = resolve(
                  boundary
              )

              if boundary is None:
                  return []

              # LinearRing directly.
              for element in boundary.iter():

                  if local(
                      element.tag
                  ) == "LinearRing":

                      points = parse_ring(
                          element
                      )

                      if len(
                          points
                      ) >= 4:

                          return points

              # Ring.
              for element in boundary.iter():

                  if local(
                      element.tag
                  ) == "Ring":

                      points = parse_ring(
                          element
                      )

                      if len(
                          points
                      ) >= 4:

                          return points

              # Direct curveMember fallback.
              points = parse_ring(
                  boundary
              )

              return points

          # ========================================================
          # SURFACE / POLYGON PATCH
          # ========================================================

          def parse_surface(
              surface
          ):

              surface = resolve(
                  surface
              )

              if surface is None:
                  return []

              polygons = []

              for patch in surface.iter():

                  if local(
                      patch.tag
                  ) != "PolygonPatch":

                      continue

                  exterior = None
                  interiors = []

                  for child in patch:

                      child_tag = local(
                          child.tag
                      )

                      if child_tag == "exterior":

                          exterior = child

                      elif child_tag == "interior":

                          interiors.append(
                              child
                          )

                  if exterior is None:
                      continue

                  shell = parse_boundary(
                      exterior
                  )

                  if len(
                      shell
                  ) < 4:

                      continue

                  rings = [
                      [
                          [
                              point[1],
                              point[0]
                          ]
                          for point in shell
                      ]
                  ]

                  for interior in interiors:

                      hole = parse_boundary(
                          interior
                      )

                      if len(
                          hole
                      ) >= 4:

                          rings.append(
                              [
                                  [
                                      point[1],
                                      point[0]
                                  ]
                                  for point in hole
                              ]
                          )

                  polygons.append(
                      rings
                  )

              # Circle geometry can occur without a PolygonPatch.
              if not polygons:

                  for element in surface.iter():

                      if local(
                          element.tag
                      ) != "CircleByCenterPoint":

                          continue

                      points = parse_arc_by_center(
                          element
                      )

                      if len(
                          points
                      ) >= 4:

                          polygons.append(
                              [
                                  [
                                      [
                                          point[1],
                                          point[0]
                                      ]
                                      for point in points
                                  ]
                              ]
                          )

              return polygons

          # ========================================================
          # AIRSPACE GEOMETRY
          # ========================================================

          def geometry_from_element(
              container,
              depth=0
          ):

              if (
                  container is None
                  or
                  depth > 5
              ):

                  return None

              container = resolve(
                  container
              )

              polygons = []

              # ----------------------------------------------------
              # Horizontal projections
              # ----------------------------------------------------

              projection_found = False

              for element in container.iter():

                  if local(
                      element.tag
                  ) != "horizontalProjection":

                      continue

                  projection_found = True

                  target = resolve(
                      element
                  )

                  surfaces = []

                  if target is not element:

                      if local(
                          target.tag
                      ) == "Surface":

                          surfaces.append(
                              target
                          )

                  for child in element:

                      if local(
                          child.tag
                      ) == "Surface":

                          surfaces.append(
                              child
                          )

                      else:

                          resolved = resolve(
                              child
                          )

                          if (
                              resolved is not child
                              and
                              local(
                                  resolved.tag
                              )
                              ==
                              "Surface"
                          ):

                              surfaces.append(
                                  resolved
                              )

                  if not surfaces:

                      for candidate in element.iter():

                          if local(
                              candidate.tag
                          ) == "Surface":

                              surfaces.append(
                                  candidate
                              )

                  for surface in surfaces:

                      polygons.extend(
                          parse_surface(
                              surface
                          )
                      )

              # ----------------------------------------------------
              # Some NATS objects may expose the Surface one level
              # lower without the horizontalProjection wrapper.
              # ----------------------------------------------------

              if not polygons:

                  for element in container.iter():

                      if local(
                          element.tag
                      ) == "Surface":

                          polygons.extend(
                              parse_surface(
                                  element
                              )
                          )

              # ----------------------------------------------------
              # Follow geometry/dependency xlinks if no geometry was
              # found inline.
              # ----------------------------------------------------

              if not polygons:

                  for element in container.iter():

                      tag = local(
                          element.tag
                      )

                      if tag not in {
                          "AirspaceVolumeDependency",
                          "theAirspaceVolume",
                          "geometryComponent"
                      }:

                          continue

                      target = resolve(
                          element
                      )

                      if (
                          target is None
                          or
                          target is element
                      ):

                          continue

                      inherited = geometry_from_element(
                          target,
                          depth + 1
                      )

                      if inherited:

                          polygons.extend(
                              inherited
                          )

              if not polygons:

                  return None

              if len(
                  polygons
              ) == 1:

                  return {
                      "type": "Polygon",
                      "coordinates": polygons[0]
                  }

              return {
                  "type": "MultiPolygon",
                  "coordinates": polygons
              }

          # ========================================================
          # CLASSIFICATION
          # ========================================================

          def compact(
              value
          ):

              return re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  str(
                      value or ""
                  ).upper()
              ).strip()

          def compact_no_spaces(
              value
          ):

              return re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      value or ""
                  ).upper()
              )

          def classify(
              airspace_type,
              local_type,
              classification_values,
              name,
              designator
          ):

              type_text = compact(
                  airspace_type
              )

              local_text = compact(
                  local_type
              )

              name_text = compact(
                  name
              )

              designator_text = compact(
                  designator
              )

              combined_special = " ".join(
                  [
                      type_text,
                      local_text,
                      name_text,
                      designator_text
                  ]
              )

              # ----------------------------------------------------
              # SPECIAL ZONES FIRST
              # ----------------------------------------------------

              if re.search(
                  r"\b("
                  r"MATZ|"
                  r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE|"
                  r"MILITARY\s+ATZ"
                  r")\b",
                  combined_special
              ):

                  return "MATZ"

              if re.search(
                  r"\b("
                  r"RMZ|"
                  r"RADIO\s+(?:COMMUNICATION\s+)?MANDATORY\s+ZONE"
                  r")\b",
                  combined_special
              ):

                  return "RMZ"

              if re.search(
                  r"\b("
                  r"TMZ|"
                  r"TRANSPONDER\s+MANDATORY\s+ZONE"
                  r")\b",
                  combined_special
              ):

                  return "TMZ"

              if re.search(
                  r"\b("
                  r"ATZ|"
                  r"AERODROME\s+TRAFFIC\s+ZONE"
                  r")\b",
                  combined_special
              ):

                  return "ATZ"

              # ----------------------------------------------------
              # PROHIBITED / RESTRICTED / DANGER
              #
              # Explicit terminology first.
              # ----------------------------------------------------

              if re.search(
                  r"\b("
                  r"PROHIBITED"
                  r"|PROHIBITED\s+AREA"
                  r"|PA"
                  r")\b",
                  combined_special
              ):

                  return "PA"

              if re.search(
                  r"\b("
                  r"RESTRICTED"
                  r"|RESTRICTED\s+AREA"
                  r"|RA"
                  r")\b",
                  combined_special
              ):

                  return "RA"

              if re.search(
                  r"\b("
                  r"DANGER"
                  r"|DANGER\s+AREA"
                  r"|DA"
                  r")\b",
                  combined_special
              ):

                  return "DA"

              # ----------------------------------------------------
              # UK DESIGNATOR FALLBACKS
              #
              # EGP = prohibited
              # EGR = restricted
              # EGD = danger
              #
              # This is deliberately applied after explicit
              # terminology so Class D is never treated as DA.
              # ----------------------------------------------------

              designator_compact = (
                  compact_no_spaces(
                      designator
                  )
              )

              if re.match(
                  r"^EGP[0-9]",
                  designator_compact
              ):

                  return "PA"

              if re.match(
                  r"^EGR[0-9]",
                  designator_compact
              ):

                  return "RA"

              if re.match(
                  r"^EGD[0-9]",
                  designator_compact
              ):

                  return "DA"

              # ----------------------------------------------------
              # ICAO CLASS A-G
              #
              # Use the actual AirspaceLayerClass classification
              # values rather than guessing from arbitrary text.
              # ----------------------------------------------------

              for value in classification_values:

                  normalized = compact_no_spaces(
                      value
                  )

                  if normalized in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return normalized

                  if normalized in {
                      "CLASSA",
                      "CLASSB",
                      "CLASSC",
                      "CLASSD",
                      "CLASSE",
                      "CLASSF",
                      "CLASSG"
                  }:

                      return normalized[-1]

                  match = re.fullmatch(
                      r"CLASS([A-G])",
                      normalized
                  )

                  if match:

                      return match.group(1)

              # ----------------------------------------------------
              # Some NATS releases encode the class in type/localType.
              # ----------------------------------------------------

              for value in (
                  airspace_type,
                  local_type
              ):

                  normalized = compact_no_spaces(
                      value
                  )

                  if normalized in {
                      "CLASSA",
                      "CLASSB",
                      "CLASSC",
                      "CLASSD",
                      "CLASSE",
                      "CLASSF",
                      "CLASSG"
                  }:

                      return normalized[-1]

              # ----------------------------------------------------
              # Final textual fallback for names such as:
              #
              # "CLASS D AIRSPACE"
              # ----------------------------------------------------

              match = re.search(
                  r"\bCLASS\s*([A-G])\b",
                  name_text
              )

              if match:

                  return match.group(1)

              return None

          # ========================================================
          # AIRSPACE EXTRACTION
          # ========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE EXTRACTION"
          )
          print(
              "=========================================="
          )

          raw_airspaces = 0

          classified_airspaces = 0

          geometry_success = 0

          geometry_failure = 0

          classified_counts = {}

          geometry_counts = {}

          geometry_failures = []

          features = []

          requested_categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_airspaces += 1

              designator = first_text(
                  airspace,
                  {
                      "designator",
                      "AirspaceDesignator"
                  }
              )

              name = first_text(
                  airspace,
                  {
                      "name",
                      "AirspaceName"
                  }
              )

              airspace_type_values = all_text(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )

              local_type_values = all_text(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )

              classification_values = all_text(
                  airspace,
                  {
                      "classification",
                      "AirspaceClassification"
                  }
              )

              airspace_type = " ".join(
                  airspace_type_values
              )

              local_type = " ".join(
                  local_type_values
              )

              category = classify(
                  airspace_type,
                  local_type,
                  classification_values,
                  name,
                  designator
              )

              if category is None:

                  continue

              classified_airspaces += 1

              classified_counts[
                  category
              ] = (
                  classified_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              geometry = geometry_from_element(
                  airspace
              )

              if geometry is None:

                  geometry_failure += 1

                  if len(
                      geometry_failures
                  ) < 50:

                      geometry_failures.append(
                          {
                              "category": category,
                              "designator": designator,
                              "name": name,
                              "type": airspace_type,
                              "localType": local_type
                          }
                      )

                  continue

              geometry_success += 1

              geometry_counts[
                  category
              ] = (
                  geometry_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              properties = {
                  "name": (
                      name
                      or
                      designator
                      or
                      "Unknown airspace"
                  ),
                  "designator": designator,
                  "category": category,
                  "aixmType": airspace_type,
                  "aixmLocalType": local_type,
                  "icaoClass": (
                      " ".join(
                          classification_values
                      )
                  ),
                  "source": (
                      "NATS UK ICAO AIP Dataset"
                  ),
                  "airac": AIRAC
              }

              # ----------------------------------------------------
              # Preserve altitude information.
              # ----------------------------------------------------

              for key in (
                  "upperLimit",
                  "lowerLimit",
                  "upperLimitReference",
                  "lowerLimitReference",
                  "maximumLimit",
                  "minimumLimit"
              ):

                  value = first_text(
                      airspace,
                      {
                          key
                      }
                  )

                  if value:

                      properties[
                          key
                      ] = value

              feature_id = (
                  designator
                  or
                  f"NATS-AIRSPACE-{len(features)+1}"
              )

              features.append(
                  {
                      "type": "Feature",
                      "id": feature_id,
                      "properties": properties,
                      "geometry": geometry
                  }
              )

          # ========================================================
          # DIAGNOSTIC OUTPUT
          # ========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "Raw NATS Airspace features:",
              raw_airspaces
          )

          print(
              "Classified AviMap airspaces:",
              classified_airspaces
          )

          print(
              "Geometry successes:",
              geometry_success
          )

          print(
              "Geometry failures:",
              geometry_failure
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "CLASSIFICATION COUNTS"
          )
          print(
              "=========================================="
          )

          for category in requested_categories:

              print(
                  f"{category:5s}: "
                  f"{classified_counts.get(category, 0)}"
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "GEOMETRY COUNTS"
          )
          print(
              "=========================================="
          )

          for category in requested_categories:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts.get(category, 0)}"
              )

          # ========================================================
          # GEOMETRY FAILURE DETAILS
          # ========================================================

          if geometry_failures:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "GEOMETRY FAILURES"
              )
              print(
                  "=========================================="
              )

              for failure in geometry_failures:

                  print(
                      ""
                  )

                  print(
                      "Category:",
                      failure["category"]
                  )

                  print(
                      "Designator:",
                      failure["designator"]
                  )

                  print(
                      "Name:",
                      failure["name"]
                  )

                  print(
                      "Type:",
                      failure["type"]
                  )

                  print(
                      "Local type:",
                      failure["localType"]
                  )

          # ========================================================
          # SAFETY CHECK 1
          #
          # The full NATS dataset previously contained ~2400
          # Airspace objects. Do not accidentally process a partial
          # dataset.
          # ========================================================

          if raw_airspaces < 1000:

              raise SystemExit(
                  "ERROR: NATS AIXM Airspace count is "
                  f"suspiciously low: {raw_airspaces}. "
                  "Refusing to generate replacement data."
              )

          # ========================================================
          # SAFETY CHECK 2
          #
          # Every classified feature must have geometry.
          # ========================================================

          if geometry_failure > 0:

              print("")
              print(
                  "ERROR: One or more selected AviMap airspaces "
                  "had no usable geometry."
              )

              print(
                  "No GeoJSON will be committed."
              )

              raise SystemExit(1)

          # ========================================================
          # SAFETY CHECK 3
          #
          # We explicitly expect all of these UK airspace families
          # to be present in the NATS AIP dataset.
          #
          # A-G are not individually required because some ICAO
          # classes may legitimately have zero UK records.
          # ========================================================

          required_special_categories = [
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          missing_special = [
              category
              for category
              in required_special_categories
              if classified_counts.get(
                  category,
                  0
              ) == 0
          ]

          if missing_special:

              print("")
              print(
                  "ERROR: Expected AviMap airspace categories "
                  "were not detected:"
              )

              for category in missing_special:

                  print(
                      "  ",
                      category
                  )

              print("")
              print(
                  "This is treated as a source/classification "
                  "failure, not as a valid empty category."
              )

              raise SystemExit(1)

          # ========================================================
          # SAFETY CHECK 4
          #
          # Every category that was classified must have the same
          # number of geometries.
          # ========================================================

          for category, count in (
              classified_counts.items()
          ):

              geometry_count_for_category = (
                  geometry_counts.get(
                      category,
                      0
                  )
              )

              if (
                  geometry_count_for_category
                  !=
                  count
              ):

                  raise SystemExit(
                      "ERROR: Geometry/classification count mismatch "
                      f"for {category}: "
                      f"classified={count}, "
                      f"geometry={geometry_count_for_category}"
                  )

          if not features:

              raise SystemExit(
                  "ERROR: NATS AIXM conversion produced "
                  "zero GeoJSON features."
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "AIXM CONVERSION PASSED"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "GeoJSON features:",
              len(features)
          )

          Path(
              OUT
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "Written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "CSV fields:"
          )

          for field in fields:

              print(
                  "  ",
                  field
              )

          def norm(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(
                      value
                  )
                  .strip()
                  .lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(
              *names
          ):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              for key, original in (
                  normalised.items()
              ):

                  for name in names:

                      target = norm(
                          name
                      )

                      if (
                          target in key
                          or
                          key in target
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              not lat_field
              or
              not lon_field
          ):

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP "
                  f"coordinate fields. Fields: {fields}"
              )

          print("")
          print(
              "Detected fields:"
          )

          print(
              "  Name:",
              name_field
          )

          print(
              "  Latitude:",
              lat_field
          )

          print(
              "  Longitude:",
              lon_field
          )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:

                  return None

              text = (
                  str(
                      value
                  )
                  .strip()
                  .replace(
                      ",",
                      "."
                  )
              )

              if not text:

                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              # ----------------------------------------------------
              # Decimal degrees
              # ----------------------------------------------------

              try:

                  decimal = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= decimal
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          decimal = -abs(
                              decimal
                          )

                      return decimal

              except ValueError:

                  pass

              # ----------------------------------------------------
              # DMS / DDM
              # ----------------------------------------------------

              cleaned = (
                  text
                  .upper()
                  .replace(
                      "°",
                      " "
                  )
                  .replace(
                      "'",
                      " "
                  )
                  .replace(
                      '"',
                      " "
                  )
              )

              numbers = re.findall(
                  r"[-+]?\d+(?:[.,]\d+)?",
                  cleaned
              )

              if not numbers:

                  return None

              values = [
                  float(
                      number.replace(
                          ",",
                          "."
                      )
                  )
                  for number in numbers
              ]

              result = abs(
                  values[0]
              )

              if len(
                  values
              ) > 1:

                  result += (
                      abs(
                          values[1]
                      )
                      /
                      60
                  )

              if len(
                  values
              ) > 2:

                  result += (
                      abs(
                          values[2]
                      )
                      /
                      3600
                  )

              if hemisphere in {
                  "S",
                  "W"
              }:

                  result = -result

              limit = (
                  90
                  if latitude
                  else 180
              )

              if (
                  result < -limit
                  or
                  result > limit
              ):

                  return None

              return result

          features = []

          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              latitude = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              longitude = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  invalid += 1

                  continue

              if not (
                  -90
                  <= latitude
                  <= 90
                  and
                  -180
                  <= longitude
                  <= 180
              ):

                  invalid += 1

                  continue

              if name_field:

                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              else:

                  name = ""

              if not name:

                  name = (
                      f"VRP {index}"
                  )

              properties = {
                  str(
                      key
                  ).strip(): value
                  for key, value in row.items()
                  if key
              }

              properties[
                  "name"
              ] = name

              properties[
                  "ident"
              ] = name

              properties[
                  "category"
              ] = "VRP"

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": properties,
                      "geometry": {
                          "type": "Point",
                          "coordinates": [
                              longitude,
                              latitude
                          ]
                      }
                  }
              )

          print("")
          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          print(
              "Invalid coordinates:",
              invalid
          )

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero valid points."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # FINAL VALIDATION
      #
      # Nothing is copied into the repository until both datasets
      # have passed validation.
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"

          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA VALIDATION"
          echo "=========================================="

          test -s \
            "$AIRSPACE_FILE"

          test -s \
            "$VRP_FILE"

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "$AIRSPACE_FILE"
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              "$VRP_FILE"
          )

          echo ""
          echo "Airspaces:"
          echo "$AIRSPACE_COUNT"

          echo ""
          echo "VRPs:"
          echo "$VRP_COUNT"

          if [ "$AIRSPACE_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR: Zero airspaces."

              exit 1

          fi

          if [ "$VRP_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR: Zero VRPs."

              exit 1

          fi

          jq -e \
            '.type == "FeatureCollection"' \
            "$AIRSPACE_FILE" \
            > /dev/null

          jq -e \
            '.type == "FeatureCollection"' \
            "$VRP_FILE" \
            > /dev/null

          # --------------------------------------------------------
          # Verify every airspace has one of the permitted categories.
          # --------------------------------------------------------

          INVALID_CATEGORY_COUNT=$(
            jq '
              [
                .features[]
                | .properties.category
                | select(
                    . != "A"
                    and . != "B"
                    and . != "C"
                    and . != "D"
                    and . != "E"
                    and . != "F"
                    and . != "G"
                    and . != "PA"
                    and . != "RA"
                    and . != "DA"
                    and . != "ATZ"
                    and . != "MATZ"
                    and . != "RMZ"
                    and . != "TMZ"
                  )
              ]
              | length
            ' \
            "$AIRSPACE_FILE"
          )

          echo ""
          echo "Invalid category features:"
          echo "$INVALID_CATEGORY_COUNT"

          if [ "$INVALID_CATEGORY_COUNT" -ne 0 ]; then

              echo ""
              echo "ERROR: GeoJSON contains an unsupported"
              echo "airspace category."

              exit 1

          fi

          echo ""
          echo "=========================================="
          echo "NATS DATA VALIDATION PASSED"
          echo "=========================================="

      # ============================================================
      # INSTALL ONLY VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "INSTALLING VALIDATED AVIATION DATA"
          echo "=========================================="

          mkdir -p \
            data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "Installed files:"

          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          echo ""
          echo "=========================================="
          echo "CHECKING FOR DATA CHANGES"
          echo "=========================================="

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff \
            --cached \
            --quiet; then

              echo ""
              echo "No aviation-data changes detected."

              exit 0

          fi

          echo ""
          echo "Changes detected:"

          git diff \
            --cached \
            --stat

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "Committing AIRAC:"
          echo "$AIRAC"

          git commit \
            -m "Update UK aviation data from NATS ${AIRAC}"

          git push

          echo ""
          echo "=========================================="
          echo "NATS AVIATION DATA UPDATED"
          echo "=========================================="
