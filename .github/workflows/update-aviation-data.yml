name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats-datasets.html

          test -s /tmp/nats-datasets.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = (
              "https://nats-uk.ead-it.com"
          )

          html = open(
              "/tmp/nats-datasets.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(
              timezone.utc
          ).date()

          def select_dataset(
              patterns,
              label
          ):
              candidates = []

              for href in hrefs:

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          href,
                          flags=re.I
                      )

                      if not match:
                          continue

                      try:

                          date = datetime.strptime(
                              match.group(1),
                              "%Y%m%d"
                          ).date()

                      except ValueError:

                          continue

                      candidates.append(
                          (
                              date,
                              href
                          )
                      )

                      break

              if not candidates:

                  print("")
                  print(
                      f"ERROR: No {label} dataset found on NATS page."
                  )

                  print("")
                  print(
                      "Relevant NATS links:"
                  )

                  for href in hrefs:

                      upper = href.upper()

                      if (
                          "AIP" in upper
                          or
                          "AIS" in upper
                          or
                          "VRP" in upper
                      ):

                          print(
                              href
                          )

                  raise SystemExit(1)

              current = [
                  item
                  for item in candidates
                  if item[0] <= today
              ]

              selected = max(
                  current or candidates,
                  key=lambda item: item[0]
              )

              date, href = selected

              url = urljoin(
                  BASE,
                  href
              )

              print("")
              print(
                  f"{label}:"
              )
              print(
                  f"  Effective date: {date}"
              )
              print(
                  f"  URL: {url}"
              )

              return (
                  date,
                  url
              )

          # --------------------------------------------------------
          # AIP XML
          #
          # Current NATS filename:
          # EG_AIP_DS_20260806_XML.zip
          # --------------------------------------------------------

          aip_date, aip_url = select_dataset(
              [
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})\.XML$',
                  r'EG_AIP_DS_FULL_(\d{8})\.xml$'
              ],
              "UK ICAO AIP XML"
          )

          # --------------------------------------------------------
          # AIP KML
          #
          # Current NATS filename:
          # EG_AIS_DS_FULL_20260806_KML.zip
          #
          # Note the AIS in this filename.
          # --------------------------------------------------------

          kml_date, kml_url = select_dataset(
              [
                  r'EG_AIS_DS_FULL_(\d{8})_KML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})_KML\.zip$'
              ],
              "UK ICAO AIP KML"
          )

          # --------------------------------------------------------
          # VRP
          # --------------------------------------------------------

          vrp_date, vrp_url = select_dataset(
              [
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV$'
              ],
              "NATS VRP"
          )

          print("")
          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print(
              "AIP XML:",
              aip_date,
              aip_url
          )
          print(
              "AIP KML:",
              kml_date,
              kml_url
          )
          print(
              "VRP:",
              vrp_date,
              vrp_url
          )

          # --------------------------------------------------------
          # Safety: XML and KML must refer to the same AIRAC.
          # --------------------------------------------------------

          if aip_date != kml_date:

              raise SystemExit(
                  "ERROR: NATS AIP XML and KML dates do not match."
                  f" XML={aip_date}, KML={kml_date}"
              )

          open(
              "/tmp/nats-aip-url.txt",
              "w"
          ).write(
              aip_url
          )

          open(
              "/tmp/nats-aip-date.txt",
              "w"
          ).write(
              str(aip_date)
          )

          open(
              "/tmp/nats-kml-url.txt",
              "w"
          ).write(
              kml_url
          )

          open(
              "/tmp/nats-kml-date.txt",
              "w"
          ).write(
              str(kml_date)
          )

          open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ).write(
              vrp_url
          )

          open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ).write(
              str(vrp_date)
          )
          PY

      # ============================================================
      # DOWNLOAD NATS AIP XML
      # ============================================================

      - name: Download NATS AIP XML dataset
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP XML"
          echo "=========================================="
          echo ""
          echo "$AIP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$AIP_URL" \
            -o /tmp/nats-aip-source

          test -s /tmp/nats-aip-source

          rm -rf /tmp/nats-aip
          mkdir -p /tmp/nats-aip

          if file /tmp/nats-aip-source | grep -qi "zip"; then

              echo "AIP download is a ZIP."

              unzip \
                -o \
                /tmp/nats-aip-source \
                -d /tmp/nats-aip

          else

              echo "AIP download is not recognised as ZIP."

              file /tmp/nats-aip-source

              exit 1

          fi

          AIP_XML=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "*.xml" \
              | head -n 1
          )

          if [ -z "$AIP_XML" ]; then

              echo ""
              echo "ERROR: No XML found inside NATS AIP ZIP."

              find \
                /tmp/nats-aip \
                -type f \
                -print

              exit 1

          fi

          cp \
            "$AIP_XML" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIP XML:"
          echo "$AIP_XML"

          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS AIP KML
      # ============================================================

      - name: Download NATS AIP KML dataset
        run: |
          set -euo pipefail

          KML_URL=$(cat /tmp/nats-kml-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP KML"
          echo "=========================================="
          echo ""
          echo "$KML_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$KML_URL" \
            -o /tmp/nats-kml-source

          test -s /tmp/nats-kml-source

          rm -rf /tmp/nats-kml
          mkdir -p /tmp/nats-kml

          if file /tmp/nats-kml-source | grep -qi "zip"; then

              echo "KML download is a ZIP."

              unzip \
                -o \
                /tmp/nats-kml-source \
                -d /tmp/nats-kml

          else

              echo "ERROR: NATS KML download is not a ZIP."

              file /tmp/nats-kml-source

              exit 1

          fi

          echo ""
          echo "Extracted KML files:"

          find \
            /tmp/nats-kml \
            -type f \
            \( \
              -iname "*.kml" \
              -o \
              -iname "*.kmz" \
            \) \
            -print

          KML_COUNT=$(
            find \
              /tmp/nats-kml \
              -type f \
              -iname "*.kml" \
              | wc -l
          )

          if [ "$KML_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR: No KML files found inside NATS KML ZIP."

              find \
                /tmp/nats-kml \
                -type f \
                -print

              exit 1

          fi

          echo ""
          echo "KML files found:"
          echo "$KML_COUNT"

      # ============================================================
      # DOWNLOAD NATS VRPS
      # ============================================================

      - name: Download NATS VRP list
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$VRP_URL" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          rm -rf /tmp/nats-vrp
          mkdir -p /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi "zip"; then

              unzip \
                -o \
                /tmp/nats-vrp-source \
                -d /tmp/nats-vrp

          else

              cp \
                /tmp/nats-vrp-source \
                /tmp/nats-vrp/vrps.csv

          fi

          VRP_CSV=$(
            find \
              /tmp/nats-vrp \
              -type f \
              \( \
                -iname "*.csv" \
                -o \
                -iname "*.CSV" \
              \) \
              | head -n 1
          )

          if [ -z "$VRP_CSV" ]; then

              echo ""
              echo "ERROR: No CSV found in NATS VRP dataset."

              find \
                /tmp/nats-vrp \
                -type f \
                -print

              exit 1

          fi

          cp \
            "$VRP_CSV" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "$VRP_CSV"

          wc -c \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS KML AIRSPACE
      #
      # KML supplies the actual geographic geometry.
      #
      # AIP XML is used as an additional source of airspace
      # terminology/classification where a useful match can be made.
      # ============================================================

      - name: Convert NATS KML airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          KML_ROOT = Path(
              "/tmp/nats-kml"
          )

          AIP_XML = Path(
              "/tmp/uk-aip.xml"
          )

          OUT = Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # ========================================================
          # HELPERS
          # ========================================================

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()

          def normalise(value):
              return re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(value or "").upper()
              )

          def combined_text(
              element
          ):
              parts = []

              for node in element.iter():

                  if node.text:

                      value = clean(
                          node.text
                      )

                      if value:
                          parts.append(
                              value
                          )

              return " ".join(
                  parts
              )

          # ========================================================
          # CANONICAL AVIMAP CLASSIFICATION
          #
          # A-G
          # PA
          # RA
          # DA
          # ATZ
          # MATZ
          # RMZ
          # TMZ
          # ========================================================

          def classify(
              text,
              explicit_class=""
          ):

              value = clean(
                  text
              ).upper()

              # ----------------------------------------------------
              # SPECIAL ZONES FIRST
              # ----------------------------------------------------

              if re.search(
                  r"\b(?:MATZ|MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE|MILITARY\s+ATZ)\b",
                  value
              ):

                  return "MATZ"

              if re.search(
                  r"\b(?:RMZ|RADIO\s+(?:COMMUNICATION\s+)?MANDATORY\s+ZONE)\b",
                  value
              ):

                  return "RMZ"

              if re.search(
                  r"\b(?:TMZ|TRANSPONDER\s+MANDATORY\s+ZONE)\b",
                  value
              ):

                  return "TMZ"

              if re.search(
                  r"\b(?:ATZ|AERODROME\s+TRAFFIC\s+ZONE)\b",
                  value
              ):

                  return "ATZ"

              # ----------------------------------------------------
              # PROHIBITED / RESTRICTED / DANGER
              # ----------------------------------------------------

              if re.search(
                  r"\b(?:PA|PROHIBITED\s+AREA|PROHIBITED)\b",
                  value
              ):

                  return "PA"

              if re.search(
                  r"\b(?:RA|RESTRICTED\s+AREA|RESTRICTED)\b",
                  value
              ):

                  return "RA"

              if re.search(
                  r"\b(?:DA|DANGER\s+AREA|DANGER)\b",
                  value
              ):

                  return "DA"

              # ----------------------------------------------------
              # EXPLICIT CLASS
              # ----------------------------------------------------

              explicit = re.sub(
                  r"[^A-Z0-9]",
                  "",
                  str(
                      explicit_class or ""
                  ).upper()
              )

              if explicit in {
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              }:

                  return explicit

              if explicit in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:

                  return explicit[-1]

              # ----------------------------------------------------
              # CLASS WORDS
              # ----------------------------------------------------

              match = re.search(
                  r"\bCLASS\s*([A-G])\b",
                  value
              )

              if match:

                  return match.group(1)

              # ----------------------------------------------------
              # "CLASS A AIRSPACE" etc.
              # ----------------------------------------------------

              match = re.search(
                  r"\b([A-G])\s+CLASS\b",
                  value
              )

              if match:

                  return match.group(1)

              return None

          # ========================================================
          # XML METADATA INDEX
          #
          # This is deliberately metadata only.
          # Geometry comes from the NATS KML.
          # ========================================================

          xml_index = []

          print("")
          print(
              "=========================================="
          )
          print(
              "INDEXING NATS AIP XML METADATA"
          )
          print(
              "=========================================="
          )

          try:

              tree = ET.parse(
                  AIP_XML
              )

              root = tree.getroot()

              for element in root.iter():

                  if local(
                      element.tag
                  ) != "Airspace":

                      continue

                  designator = ""
                  name = ""
                  airspace_type = ""
                  local_type = ""
                  classification = ""

                  for node in element.iter():

                      node_name = local(
                          node.tag
                      )

                      value = clean(
                          node.text
                          if node.text
                          else ""
                      )

                      if not value:
                          continue

                      if (
                          not designator
                          and
                          node_name.lower()
                          in {
                              "designator",
                              "airspacedesignator"
                          }
                      ):

                          designator = value

                      if (
                          not name
                          and
                          node_name.lower()
                          in {
                              "name",
                              "airspacename"
                          }
                      ):

                          name = value

                      if (
                          node_name.lower()
                          in {
                              "type",
                              "airspacetype"
                          }
                      ):

                          airspace_type += (
                              " "
                              + value
                          )

                      if (
                          node_name.lower()
                          in {
                              "localtype",
                              "airspacelocaltype"
                          }
                      ):

                          local_type += (
                              " "
                              + value
                          )

                      if (
                          node_name.lower()
                          in {
                              "class",
                              "airspaceclassification",
                              "classification"
                          }
                      ):

                          classification += (
                              " "
                              + value
                          )

                  metadata_text = " ".join(
                      [
                          designator,
                          name,
                          airspace_type,
                          local_type,
                          classification
                      ]
                  )

                  category = classify(
                      metadata_text,
                      classification
                  )

                  xml_index.append(
                      {
                          "designator": clean(
                              designator
                          ),
                          "name": clean(
                              name
                          ),
                          "category": category,
                          "text": clean(
                              metadata_text
                          )
                      }
                  )

          except Exception as exc:

              print(
                  "WARNING: Could not index AIP XML metadata:"
              )

              print(
                  repr(exc)
              )

              print(
                  "KML classification will still be attempted."
              )

          print(
              "AIP Airspace metadata records:",
              len(xml_index)
          )

          # ========================================================
          # XML MATCHING
          # ========================================================

          def find_xml_metadata(
              placemark_text
          ):

              if not xml_index:
                  return None

              candidate = clean(
                  placemark_text
              )

              if not candidate:
                  return None

              candidate_upper = candidate.upper()

              # ----------------------------------------------------
              # Exact-ish designator/name match first.
              # ----------------------------------------------------

              for item in xml_index:

                  designator = (
                      item["designator"]
                      .upper()
                  )

                  name = (
                      item["name"]
                      .upper()
                  )

                  if (
                      designator
                      and
                      designator in candidate_upper
                  ):

                      return item

                  if (
                      name
                      and
                      len(name) >= 4
                      and
                      name in candidate_upper
                  ):

                      return item

              return None

          # ========================================================
          # KML GEOMETRY
          # ========================================================

          def parse_coordinates(
              text
          ):

              coords = []

              for token in re.split(
                  r"\s+",
                  clean(text)
              ):

                  if not token:
                      continue

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:

                      lon = float(
                          parts[0]
                      )

                      lat = float(
                          parts[1]
                      )

                  except ValueError:

                      continue

                  if not (
                      -180
                      <= lon
                      <= 180
                      and
                      -90
                      <= lat
                      <= 90
                  ):

                      continue

                  coords.append(
                      [
                          lon,
                          lat
                      ]
                  )

              return coords

          def geometry_from_element(
              placemark
          ):

              # ----------------------------------------------------
              # Polygon
              # ----------------------------------------------------

              polygons = []

              for polygon in placemark.iter():

                  if local(
                      polygon.tag
                  ) != "Polygon":

                      continue

                  rings = []

                  for ring in polygon.iter():

                      if local(
                          ring.tag
                      ) != "LinearRing":

                          continue

                      coordinates = None

                      for node in ring:

                          if (
                              local(
                                  node.tag
                              )
                              ==
                              "coordinates"
                          ):

                              coordinates = (
                                  node.text
                                  or ""
                              )

                              break

                      if not coordinates:
                          continue

                      points = parse_coordinates(
                          coordinates
                      )

                      if len(points) < 3:
                          continue

                      if points[0] != points[-1]:

                          points.append(
                              points[0]
                          )

                      rings.append(
                          points
                      )

                  if rings:

                      polygons.append(
                          rings
                      )

              if polygons:

                  if len(polygons) == 1:

                      return {
                          "type": "Polygon",
                          "coordinates": polygons[0]
                      }

                  return {
                      "type": "MultiPolygon",
                      "coordinates": polygons
                  }

              # ----------------------------------------------------
              # MultiGeometry
              # ----------------------------------------------------

              multi_polygons = []

              for child in placemark.iter():

                  if local(
                      child.tag
                  ) != "MultiGeometry":

                      continue

                  for polygon in child.iter():

                      if local(
                          polygon.tag
                      ) != "Polygon":

                          continue

                      rings = []

                      for ring in polygon.iter():

                          if local(
                              ring.tag
                          ) != "LinearRing":

                              continue

                          coordinates = None

                          for node in ring:

                              if (
                                  local(
                                      node.tag
                                  )
                                  ==
                                  "coordinates"
                              ):

                                  coordinates = (
                                      node.text
                                      or ""
                                  )

                                  break

                          if not coordinates:
                              continue

                          points = parse_coordinates(
                              coordinates
                          )

                          if len(points) >= 3:

                              if points[0] != points[-1]:

                                  points.append(
                                      points[0]
                                  )

                              rings.append(
                                  points
                              )

                      if rings:

                          multi_polygons.append(
                              rings
                          )

              if multi_polygons:

                  return {
                      "type": "MultiPolygon",
                      "coordinates": multi_polygons
                  }

              return None

          # ========================================================
          # READ ALL KML FILES
          # ========================================================

          kml_files = sorted(
              KML_ROOT.rglob(
                  "*.kml"
              )
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS KML AIRSPACE CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "KML files:",
              len(kml_files)
          )

          if not kml_files:

              raise SystemExit(
                  "ERROR: No NATS KML files found."
              )

          features = []

          placemark_count = 0
          geometry_count = 0
          filtered_count = 0
          unmatched_count = 0

          category_counts = {}
          unmatched_examples = []

          for kml_file in kml_files:

              print(
                  "Reading:",
                  kml_file
              )

              try:

                  tree = ET.parse(
                      kml_file
                  )

              except Exception as exc:

                  print(
                      "WARNING: Failed to parse:",
                      kml_file
                  )

                  print(
                      repr(exc)
                  )

                  continue

              root = tree.getroot()

              for placemark in root.iter():

                  if local(
                      placemark.tag
                  ) != "Placemark":

                      continue

                  placemark_count += 1

                  name = ""

                  for node in placemark:

                      if (
                          local(
                              node.tag
                          )
                          ==
                          "name"
                      ):

                          name = clean(
                              node.text
                              or ""
                          )

                          break

                  full_text = combined_text(
                      placemark
                  )

                  xml_match = find_xml_metadata(
                      full_text
                  )

                  xml_text = (
                      xml_match["text"]
                      if xml_match
                      else ""
                  )

                  xml_category = (
                      xml_match["category"]
                      if xml_match
                      else None
                  )

                  classification_text = (
                      name
                      + " "
                      + full_text
                      + " "
                      + xml_text
                  )

                  category = classify(
                      classification_text
                  )

                  if category is None:

                      category = xml_category

                  if category is None:

                      filtered_count += 1

                      if len(
                          unmatched_examples
                      ) < 25:

                          unmatched_examples.append(
                              name
                              or
                              full_text[:200]
                          )

                      unmatched_count += 1

                      continue

                  geometry = geometry_from_element(
                      placemark
                  )

                  if geometry is None:

                      continue

                  geometry_count += 1

                  category_counts[
                      category
                  ] = (
                      category_counts.get(
                          category,
                          0
                      )
                      + 1
                  )

                  properties = {
                      "name": (
                          name
                          or
                          (
                              xml_match["name"]
                              if xml_match
                              else "Unknown airspace"
                          )
                      ),
                      "category": category,
                      "source": (
                          "NATS UK ICAO AIP KML"
                      ),
                      "airac": AIRAC
                  }

                  if xml_match:

                      if xml_match[
                          "designator"
                      ]:

                          properties[
                              "designator"
                          ] = xml_match[
                              "designator"
                          ]

                      if xml_match[
                          "name"
                      ]:

                          properties[
                              "aipName"
                          ] = xml_match[
                              "name"
                          ]

                  features.append(
                      {
                          "type": "Feature",
                          "properties": properties,
                          "geometry": geometry
                      }
                  )

          # ========================================================
          # SUMMARY
          # ========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS KML CONVERSION RESULT"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "KML placemarks:",
              placemark_count
          )

          print(
              "Placemark geometries:",
              geometry_count
          )

          print(
              "Filtered/unclassified:",
              filtered_count
          )

          print(
              "GeoJSON features:",
              len(features)
          )

          print("")
          print(
              "AviMap airspace categories:"
          )

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              print(
                  f"  {category}: "
                  f"{category_counts.get(category, 0)}"
              )

          print("")

          if unmatched_examples:

              print(
                  "Examples of unclassified KML placemarks:"
              )

              for example in unmatched_examples:

                  print(
                      "  -",
                      example
                  )

          # ========================================================
          # SAFETY CHECKS
          # ========================================================

          if not features:

              raise SystemExit(
                  "ERROR: NATS KML conversion produced "
                  "zero filtered airspace geometries."
              )

          if len(features) < 100:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  f"airspace dataset: {len(features)} features."
              )

          # We specifically expect at least some airspace
          # categories beyond generic class data.
          #
          # This is diagnostic only: do not fail if a particular
          # category genuinely has zero records in a future AIRAC.
          print("")
          print(
              "KML airspace conversion passed safety checks."
          )

          OUT.write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "Written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CSV"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "CSV fields:"
          )

          for field in fields:

              print(
                  "  ",
                  field
              )

          def norm(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value)
                  .strip()
                  .lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(
              *names
          ):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              for key, original in normalised.items():

                  for name in names:

                      target = norm(
                          name
                      )

                      if (
                          target in key
                          or
                          key in target
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              not lat_field
              or
              not lon_field
          ):

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP "
                  f"coordinate fields. Fields: {fields}"
              )

          print("")
          print(
              "Detected fields:"
          )

          print(
              "  Name:",
              name_field
          )

          print(
              "  Latitude:",
              lat_field
          )

          print(
              "  Longitude:",
              lon_field
          )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = (
                  str(value)
                  .strip()
                  .replace(
                      ",",
                      "."
                  )
              )

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  number = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):

                          number = -abs(
                              number
                          )

                      elif hemisphere in (
                          "N",
                          "E"
                      ):

                          number = abs(
                              number
                          )

                      return number

              except ValueError:

                  pass

              compact = (
                  text
                  .replace(
                      "°",
                      ""
                  )
                  .replace(
                      "'",
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      " ",
                      ""
                  )
              )

              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):

                  try:

                      if "." in compact:

                          integer_part, decimal_part = (
                              compact.split(
                                  ".",
                                  1
                              )
                          )

                      else:

                          integer_part = compact
                          decimal_part = ""

                      if latitude:

                          if len(
                              integer_part
                          ) < 6:

                              raise ValueError

                          degrees = int(
                              integer_part[:2]
                          )

                          minutes = int(
                              integer_part[2:4]
                          )

                          seconds_text = (
                              integer_part[4:]
                          )

                      else:

                          if len(
                              integer_part
                          ) < 7:

                              raise ValueError

                          degrees = int(
                              integer_part[:3]
                          )

                          minutes = int(
                              integer_part[3:5]
                          )

                          seconds_text = (
                              integer_part[5:]
                          )

                      if decimal_part:

                          seconds_text += (
                              "."
                              + decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      limit = (
                          90
                          if latitude
                          else 180
                      )

                      if (
                          degrees > limit
                          or
                          minutes >= 60
                          or
                          seconds >= 60
                      ):

                          raise ValueError

                      result = (
                          degrees
                          +
                          minutes / 60
                          +
                          seconds / 3600
                      )

                      if hemisphere in (
                          "S",
                          "W"
                      ):

                          result = -abs(
                              result
                          )

                      elif hemisphere in (
                          "N",
                          "E"
                      ):

                          result = abs(
                              result
                          )

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):

                      pass

              return None

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):

                  invalid += 1
                  continue

              if not (
                  -90 <= lat <= 90
                  and
                  -180 <= lon <= 180
              ):

                  invalid += 1
                  continue

              name = (
                  str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()
                  if name_field
                  else ""
              )

              name = (
                  name
                  or
                  f"VRP {index}"
              )

              properties = {
                  str(
                      key
                  ).strip(): value
                  for key, value in row.items()
                  if key
              }

              properties[
                  "name"
              ] = name

              properties[
                  "ident"
              ] = name

              properties[
                  "category"
              ] = "VRP"

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": properties,
                      "geometry": {
                          "type": "Point",
                          "coordinates": [
                              lon,
                              lat
                          ]
                      }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "VRP CONVERSION RESULT"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          print(
              "Invalid coordinates:",
              invalid
          )

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero features. Existing repository data "
                  "will NOT be replaced."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE GENERATED DATA
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "VALIDATING GENERATED NATS DATA"
          echo "=========================================="

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"
          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          test -s "$AIRSPACE_FILE"
          test -s "$VRP_FILE"

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "$AIRSPACE_FILE"
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              "$VRP_FILE"
          )

          echo ""
          echo "Airspaces:"
          echo "$AIRSPACE_COUNT"

          echo ""
          echo "VRPs:"
          echo "$VRP_COUNT"

          test "$AIRSPACE_COUNT" -gt 0
          test "$VRP_COUNT" -gt 0

          echo ""
          echo "Checking GeoJSON structure..."

          jq -e \
            '.type == "FeatureCollection"' \
            "$AIRSPACE_FILE" \
            > /dev/null

          jq -e \
            '.type == "FeatureCollection"' \
            "$VRP_FILE" \
            > /dev/null

          echo ""
          echo "Validation successful."

      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "Installing validated aviation data"
          echo "=========================================="

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "Installed:"
          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT ONLY IF CHANGED
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "COMMITTING NATS AVIATION DATA"
          echo "=========================================="

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff \
            --cached \
            --quiet; then

            echo ""
            echo "No aviation-data changes detected."

            exit 0

          fi

          echo ""
          echo "Changes:"
          git diff \
            --cached \
            --stat

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          git commit \
            -m "Update UK aviation data from NATS AIS ${AIRAC}"

          git push

          echo ""
          echo "=========================================="
          echo "NATS AVIATION DATA UPDATED"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
