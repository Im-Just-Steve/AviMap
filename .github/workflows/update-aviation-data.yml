        run: |
          set -euo pipefail


          AIRSPACE="/tmp/avimap-data/uk-airspace.geojson"

          VRP="/tmp/avimap-data/uk-reporting-points.geojson"
          MATZ="/tmp/avimap-data/uk-matz.geojson"


          test -s "${AIRSPACE}"

          test -s "${VRP}"
          test -s "${MATZ}"


          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "${AIRSPACE}"
          )


          GEOMETRY_COUNT=$(
            jq \
              '[.features[] | select(.geometry != null)] | length' \
              "${AIRSPACE}"
          )


          NULL_GEOMETRY_COUNT=$(
            jq \
              '[.features[] | select(.geometry == null)] | length' \
              "${AIRSPACE}"
          )


          MATZ_COUNT=$(
            jq \
              '.features | length' \
              "${MATZ}"
          )


          VRP_COUNT=$(
            jq \
              '.features | length' \
              "${VRP}"
          )


          echo ""
          echo "=========================================="

          echo "FINAL VALIDATION"

          echo "=========================================="

          echo ""

          echo "NATS Airspace features:"
          echo "${AIRSPACE_COUNT}"

          echo ""

          echo "Airspace with geometry:"
          echo "${GEOMETRY_COUNT}"

          echo ""

          echo "Airspace without geometry:"
          echo "${NULL_GEOMETRY_COUNT}"

          echo ""

          echo "NATS reporting points:"
          echo "${VRP_COUNT}"

          echo ""
          echo "NATS MATZ / CMATZ features:"
          echo "${MATZ_COUNT}"

          echo ""


          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS Airspace features."

            exit 1

          fi


          if [ "${GEOMETRY_COUNT}" -eq 0 ]; then

            echo ""
            echo "ERROR: ZERO AIRSPACE GEOMETRIES GENERATED."
            echo ""
            echo "The workflow will NOT overwrite the existing"
            echo "working airspace dataset with an empty geometry set."
            echo ""

            exit 1

          fi


          if [ "${MATZ_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS MATZ / CMATZ features."

            exit 1

          fi


          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: No NATS reporting points."

            exit 1

          fi


          echo "Validation successful."


      # ============================================================
      # INSTALL
      #
      # IMPORTANT:
      #
      # We only reach this point if at least one airspace geometry
      # was successfully generated.
      # ============================================================

      - name: Install NATS aviation data
        run: |
          set -euo pipefail

          mkdir -p data


          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson


          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson


          cp \
            /tmp/avimap-data/uk-matz.geojson \
            data/uk-matz.geojson


          echo ""
          echo "Installed aviation data:"
          echo ""


          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/uk-matz.geojson


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit NATS aviation data
        run: |
          set -euo pipefail


          git config \
            user.name \
            "AviMap Data Bot"


          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/uk-matz.geojson


          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."

            exit 0

          fi


          echo ""
          echo "Files being committed:"

          git diff \
            --cached \
            --stat


          git commit \
            -m "Add hard-coded NATS MATZ and CMATZ data"


          git push
