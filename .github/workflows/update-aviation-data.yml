name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3


      # ============================================================
      # DISCOVER CURRENT NATS DATASETS
      # ============================================================

      - name: Discover current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin


          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()


          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []


              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []


              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:
                      self.text.append(
                          data
                      )


              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )


          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )


          def is_aip_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGAIPDSFULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "AIP" in value
                      and
                      (
                          "XML" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          def is_vrp_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "VRP" in value
                      and
                      (
                          "CSV" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          print(
              "=========================================="
          )

          print(
              "NATS DATASET DISCOVERY"
          )

          print(
              "=========================================="
          )


          checklist_body = None
          checklist_url = None


          for offset in range(90):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]


              for candidate in candidates:

                  try:

                      body, _ = fetch(
                          candidate
                      )

                  except Exception:

                      continue


                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )


                  if (
                      "EG_AIP_DS_FULL_"
                      in text
                      and
                      "EG_VRP_DS_AREA1_FULL_"
                      in text
                  ):

                      checklist_body = body
                      checklist_url = candidate

                      break


              if checklist_body is not None:
                  break


          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find current NATS Dataset Checklist."
              )


          print(
              "Checklist:",
              checklist_url
          )


          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )


          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )


          aip_dates = []


          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )


          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )


          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )


          vrp_dates = []


          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )


          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )


          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "VRP AIRAC:",
              vrp_stamp
          )


          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )


          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: dataset index unavailable:",
                  exc
              )

              index_links = []


          aip_links = []
          vrp_links = []
          seen = set()


          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)


              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )


              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )


          for url, text in list(
              aip_links
          ):

              lower = url.lower()


              if not (
                  lower.endswith(".html")
                  or
                  lower.endswith(".htm")
                  or
                  lower.endswith("/")
              ):

                  continue


              try:

                  body, _ = fetch(
                      url
                  )


                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          aip_links.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )


              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )


          def unique_links(
              links
          ):

              result = []
              seen_urls = set()


              for url, text in links:

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  result.append(
                      (
                          url,
                          text
                      )
                  )


              return result


          aip_links = unique_links(
              aip_links
          )

          vrp_links = unique_links(
              vrp_links
          )


          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "AIP candidates:"
          )

          for url, text in aip_links:
              print(
                  text,
                  "=>",
                  url
              )


          print("")
          print(
              "VRP candidates:"
          )

          for url, text in vrp_links:
              print(
                  text,
                  "=>",
                  url
              )


          if not aip_links:

              raise SystemExit(
                  "ERROR: No AIP download candidate found."
              )


          if not vrp_links:

              raise SystemExit(
                  "ERROR: No VRP download candidate found."
              )

          PY


      # ============================================================
      # DOWNLOAD AIP
      # ============================================================

      - name: Download NATS AIP
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip

          mkdir -p /tmp/nats-aip

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing:"
            echo "${URL}"


            rm -f /tmp/nats-aip-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-aip-download


            if file /tmp/nats-aip-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip

              mkdir -p /tmp/nats-aip


              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip


              echo ""
              echo "AIP archive:"

              find \
                /tmp/nats-aip \
                -type f \
                -print


              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )


              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-links.txt


          if [ -z "${FOUND}" ]; then

            echo "ERROR: AIP download failed."

            exit 1

          fi


          echo ""
          echo "AIP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-aip.xml


          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY


      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-vrp

          mkdir -p /tmp/nats-vrp

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing:"
            echo "${URL}"


            rm -f /tmp/nats-vrp-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-vrp-download


            if file /tmp/nats-vrp-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-vrp

              mkdir -p /tmp/nats-vrp


              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp


              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )


              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-vrp-links.txt


          if [ -z "${FOUND}" ]; then

            echo "ERROR: VRP download failed."

            exit 1

          fi


          echo ""
          echo "VRP source:"
          echo "${FOUND}"


          head \
            -n 10 \
            /tmp/uk-vrps.csv


      # ============================================================
      # AIXM → GEOJSON
      #
      # NO AIRSPACE FILTERING.
      #
      # The purpose of this converter is to faithfully reconstruct
      # the horizontal geometry contained in NATS AIXM.
      # ============================================================

      - name: Convert ALL NATS AIXM airspace
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data


          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path


          XML_FILE = (
              "/tmp/uk-aip.xml"
          )

          OUTPUT_FILE = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          # ========================================================
          # XML
          # ========================================================

          tree = ET.parse(
              XML_FILE
          )

          root = tree.getroot()


          def local(tag):

              return tag.rsplit(
                  "}",
                  1
              )[-1]


          def attr_local(
              element,
              wanted
          ):

              wanted = wanted.lower()


              for key, value in element.attrib.items():

                  if (
                      local(
                          key
                      ).lower()
                      ==
                      wanted
                  ):

                      return value


              return None


          parent_map = {}


          for parent in root.iter():

              for child in parent:

                  parent_map[
                      child
                  ] = parent


          id_index = {}


          for element in root.iter():

              for key, value in element.attrib.items():

                  lname = local(
                      key
                  ).lower()


                  if lname in {
                      "id",
                      "uuid"
                  } and value:

                      id_index[
                          value.lstrip("#")
                      ] = element


          print("")
          print(
              "Indexed XML objects:",
              len(
                  id_index
              )
          )


          # ========================================================
          # XLink
          # ========================================================

          def href_target(
              element
          ):

              if element is None:
                  return None


              href = None


              for key, value in element.attrib.items():

                  if (
                      local(
                          key
                      ).lower()
                      ==
                      "href"
                  ):

                      href = value

                      break


              if not href:
                  return None


              reference = href.split(
                  "#",
                  1
              )[-1].strip()


              if not reference:
                  return None


              return id_index.get(
                  reference
              )


          def resolve_chain(
              element,
              maximum=40
          ):

              result = []

              seen = set()

              current = element


              for _ in range(
                  maximum
              ):

                  if current is None:
                      break


                  marker = id(
                      current
                  )


                  if marker in seen:
                      break


                  seen.add(
                      marker
                  )


                  result.append(
                      current
                  )


                  target = href_target(
                      current
                  )


                  if target is None:
                      break


                  current = target


              return result


          # ========================================================
          # COORDINATES
          # ========================================================

          def inherited_srs(
              element
          ):

              current = element


              for _ in range(
                  50
              ):

                  if current is None:
                      break


                  value = attr_local(
                      current,
                      "srsName"
                  )


                  if value:
                      return value


                  current = parent_map.get(
                      current
                  )


              return "EPSG:4326"


          def dimension(
              element
          ):

              value = (
                  attr_local(
                      element,
                      "srsDimension"
                  )
                  or
                  attr_local(
                      element,
                      "dimension"
                  )
              )


              try:

                  return max(
                      2,
                      int(
                          value
                      )
                  )

              except (
                  TypeError,
                  ValueError
              ):

                  return 2


          def parse_numbers(
              text
          ):

              if not text:
                  return []


              result = []


              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue


                  try:

                      result.append(
                          float(
                              token
                          )
                      )

                  except ValueError:

                      pass


              return result


          def positions(
              element
          ):

              result = []


              for node in element.iter():

                  name = local(
                      node.tag
                  )


                  if name == "posList":

                      if not node.text:
                          continue


                      values = parse_numbers(
                          node.text
                      )


                      dim = dimension(
                          node
                      )


                      for i in range(
                          0,
                          len(values),
                          dim
                      ):

                          point = values[
                              i:
                              i + dim
                          ]


                          if len(point) < 2:
                              continue


                          first = point[0]
                          second = point[1]


                          srs = inherited_srs(
                              node
                          ).upper()


                          if (
                              "4326" in srs
                              and
                              "CRS84" not in srs
                          ):

                              result.append(
                                  [
                                      second,
                                      first
                                  ]
                              )

                          else:

                              result.append(
                                  [
                                      first,
                                      second
                                  ]
                              )


                  elif name == "pos":

                      if not node.text:
                          continue


                      values = parse_numbers(
                          node.text
                      )


                      if len(values) < 2:
                          continue


                      first = values[0]
                      second = values[1]


                      srs = inherited_srs(
                          node
                      ).upper()


                      if (
                          "4326" in srs
                          and
                          "CRS84" not in srs
                      ):

                          result.append(
                              [
                                  second,
                                  first
                              ]
                          )

                      else:

                          result.append(
                              [
                                  first,
                                  second
                              ]
                          )


                  elif name == "coordinates":

                      if not node.text:
                          continue


                      for token in re.split(
                          r"\s+",
                          node.text.strip()
                      ):

                          bits = token.split(
                              ","
                          )


                          if len(bits) < 2:
                              continue


                          try:

                              first = float(
                                  bits[0]
                              )

                              second = float(
                                  bits[1]
                              )

                          except ValueError:

                              continue


                          srs = inherited_srs(
                              node
                          ).upper()


                          if (
                              "4326" in srs
                              and
                              "CRS84" not in srs
                          ):

                              result.append(
                                  [
                                      second,
                                      first
                                  ]
                              )

                          else:

                              result.append(
                                  [
                                      first,
                                      second
                                  ]
                              )


              return result


          # ========================================================
          # ANGLES / RADIUS
          # ========================================================

          def numeric_value(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      try:

                          return float(
                              node.text.strip()
                          )

                      except ValueError:

                          continue


              return None


          def radius_metres(
              element
          ):

              radius_node = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) == "radius":

                      radius_node = node

                      break


              if radius_node is None:
                  return None


              if not radius_node.text:
                  return None


              try:

                  radius = float(
                      radius_node.text.strip()
                  )

              except ValueError:

                  return None


              unit = (
                  attr_local(
                      radius_node,
                      "uom"
                  )
                  or
                  "m"
              ).lower()


              if unit in {
                  "km",
                  "kilometre",
                  "kilometres",
                  "kilometer",
                  "kilometers"
              }:

                  radius *= 1000.0


              elif unit in {
                  "nm",
                  "nmi",
                  "[nmi_i]"
              }:

                  radius *= 1852.0


              return radius


          # ========================================================
          # AIXM ARC
          #
          # AIXM bearings are clockwise from true north.
          #
          # Therefore:
          #
          # latitude  = centre + north/south component
          # longitude = centre + east/west component
          #
          # 0 degrees = north
          # 90 degrees = east
          # 180 degrees = south
          # 270 degrees = west
          # ========================================================

          def arc_by_center_points(
              element
          ):

              center = None


              # Find the actual centre position.

              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":

                      continue


                  points = positions(
                      node
                  )


                  if points:

                      center = points[0]

                      break


              if center is None:

                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:

                  return []


              start = numeric_value(
                  element,
                  {
                      "startAngle"
                  }
              )


              end = numeric_value(
                  element,
                  {
                      "endAngle"
                  }
              )


              if (
                  start is None
                  or
                  end is None
              ):

                  return []


              # AIXM arc is clockwise from north.

              sweep = (
                  end -
                  start
              )


              # Avoid producing a zero-length arc.

              if abs(
                  sweep
              ) < 0.000001:

                  sweep = 360.0


              # Keep the actual encoded direction.

              steps = max(
                  8,
                  min(
                      720,
                      int(
                          abs(
                              sweep
                          )
                          /
                          2.0
                      )
                  )
              )


              result = []


              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i /
                      steps
                  )


                  bearing = (
                      start
                      +
                      (
                          sweep
                          *
                          fraction
                      )
                  )


                  radians = math.radians(
                      bearing
                  )


                  lat0 = center[1]


                  lon0 = center[0]


                  # North/south component.

                  delta_lat = (
                      radius
                      *
                      math.cos(
                          radians
                      )
                      /
                      111320.0
                  )


                  latitude = (
                      lat0
                      +
                      delta_lat
                  )


                  # East/west component.

                  metres_per_degree_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  lat0
                              )
                          )
                      )
                  )


                  delta_lon = (
                      radius
                      *
                      math.sin(
                          radians
                      )
                      /
                      metres_per_degree_lon
                  )


                  longitude = (
                      lon0
                      +
                      delta_lon
                  )


                  result.append(
                      [
                          longitude,
                          latitude
                      ]
                  )


              return result


          # ========================================================
          # CIRCLE
          # ========================================================

          def circle_points(
              element
          ):

              radius = radius_metres(
                  element
              )


              if radius is None:
                  return []


              center = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":

                      continue


                  points = positions(
                      node
                  )


                  if points:

                      center = points[0]

                      break


              if center is None:

                  return []


              points = []


              # 360 degrees, clockwise from north.

              steps = 144


              for i in range(
                  steps + 1
              ):

                  bearing = (
                      i
                      *
                      360.0
                      /
                      steps
                  )


                  radians = math.radians(
                      bearing
                  )


                  lat0 = center[1]
                  lon0 = center[0]


                  latitude = (
                      lat0
                      +
                      (
                          radius
                          *
                          math.cos(
                              radians
                          )
                          /
                          111320.0
                      )
                  )


                  metres_per_degree_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  lat0
                              )
                          )
                      )
                  )


                  longitude = (
                      lon0
                      +
                      (
                          radius
                          *
                          math.sin(
                              radians
                          )
                          /
                          metres_per_degree_lon
                      )
                  )


                  points.append(
                      [
                          longitude,
                          latitude
                      ]
                  )


              return points


          # ========================================================
          # CURVE SEGMENTS
          # ========================================================

          def curve_segments(
              curve,
              seen=None
          ):

              if seen is None:
                  seen = set()


              curve = (
                  resolve_chain(
                      curve
                  )[-1]
                  if resolve_chain(
                      curve
                  )
                  else curve
              )


              marker = id(
                  curve
              )


              if marker in seen:

                  return []


              seen.add(
                  marker
              )


              result = []


              for node in curve.iter():

                  name = local(
                      node.tag
                  )


                  if name in {
                      "ArcByCenterPoint",
                      "CircleByCenterPoint"
                  }:

                      if name == "CircleByCenterPoint":

                          points = circle_points(
                              node
                          )

                          if points:

                              result.append(
                                  (
                                      "circle",
                                      points
                                  )
                              )

                      else:

                          points = arc_by_center_points(
                              node
                          )

                          if points:

                              result.append(
                                  (
                                      "arc",
                                      points
                                  )
                              )


                  elif name in {
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcString",
                      "ArcStringByBulge"
                  }:

                      points = positions(
                          node
                      )


                      if len(
                          points
                      ) >= 2:

                          result.append(
                              (
                                  name,
                                  points
                              )
                          )


              return result


          # ========================================================
          # JOIN CURVE SEGMENTS
          # ========================================================

          def append_joined(
              output,
              segment
          ):

              if not segment:

                  return


              if not output:

                  output.extend(
                      segment
                  )

                  return


              # Normal case: segment starts where previous segment
              # ended.

              if (
                  output[-1]
                  ==
                  segment[0]
              ):

                  output.extend(
                      segment[1:]
                  )

                  return


              # Sometimes floating point differences leave two
              # nearly identical points.

              def close(
                  a,
                  b
              ):

                  return (
                      abs(
                          a[0] - b[0]
                      )
                      <
                      1e-8
                      and
                      abs(
                          a[1] - b[1]
                      )
                      <
                      1e-8
                  )


              if close(
                  output[-1],
                  segment[0]
              ):

                  output.extend(
                      segment[1:]
                  )

                  return


              # If the encoded curve direction is reversed, reverse
              # this segment before joining.

              if close(
                  output[-1],
                  segment[-1]
              ):

                  reversed_segment = list(
                      reversed(
                          segment
                      )
                  )

                  output.extend(
                      reversed_segment[1:]
                  )

                  return


              # Gap. Preserve the segment rather than silently
              # discarding it. The diagnostic will expose this.

              output.extend(
                  segment
              )


          # ========================================================
          # RING
          # ========================================================

          def ring_points(
              ring
          ):

              resolved = resolve_chain(
                  ring
              )


              if not resolved:

                  return []


              target = resolved[-1]


              # First try a conventional LinearRing coordinate list.

              direct = positions(
                  target
              )


              if len(
                  direct
              ) >= 4:

                  if (
                      direct[0]
                      !=
                      direct[-1]
                  ):

                      direct.append(
                          direct[0]
                      )


                  return direct


              # AIXM commonly uses curveMember.

              joined = []


              curve_members = []


              for node in target.iter():

                  if local(
                      node.tag
                  ) != "curveMember":

                      continue


                  target_curve = href_target(
                      node
                  )


                  if target_curve is None:

                      # It may be an inline Curve.

                      for child in node:

                          if local(
                              child.tag
                          ) in {
                              "Curve",
                              "GeodesicString",
                              "LineStringSegment"
                          }:

                              target_curve = child

                              break


                  if target_curve is not None:

                      curve_members.append(
                          target_curve
                      )


              for curve in curve_members:

                  segments = curve_segments(
                      curve
                  )


                  for segment_type, segment in segments:

                      append_joined(
                          joined,
                          segment
                      )


              if len(
                  joined
              ) >= 3:

                  if (
                      joined[0]
                      !=
                      joined[-1]
                  ):

                      joined.append(
                          joined[0]
                      )


                  return joined


              return []


          # ========================================================
          # SURFACES
          # ========================================================

          def collect_surface_objects(
              airspace
          ):

              result = []

              seen = set()

              queue = [
                  airspace
              ]


              # Follow every reference under the airspace. This
              # catches horizontalProjection references, shared
              # surfaces, rings and curves.

              while queue:

                  current = queue.pop()


                  if current is None:

                      continue


                  marker = id(
                      current
                  )


                  if marker in seen:

                      continue


                  seen.add(
                      marker
                  )


                  name = local(
                      current.tag
                  )


                  if name in {
                      "Surface",
                      "CompositeSurface"
                  }:

                      result.append(
                          current
                      )


                  # Follow direct xlinks.

                  target = href_target(
                      current
                  )


                  if target is not None:

                      queue.append(
                          target
                      )


                  # Follow references contained by this object.

                  for child in current.iter():

                      target = href_target(
                          child
                      )


                      if target is not None:

                          queue.append(
                              target
                          )


              return result


          # ========================================================
          # POLYGON PATCHES
          # ========================================================

          def polygons_for_airspace(
              airspace
          ):

              polygons = []


              surfaces = collect_surface_objects(
                  airspace
              )


              for surface in surfaces:

                  for patch in surface.iter():

                      if local(
                          patch.tag
                      ) != "PolygonPatch":

                          continue


                      exterior = None
                      interiors = []


                      # Only examine direct boundary structures
                      # beneath this patch.

                      for node in patch:

                          name = local(
                              node.tag
                          )


                          if name == "exterior":

                              for child in node.iter():

                                  if local(
                                      child.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      exterior = child

                                      break


                          elif name == "interior":

                              for child in node.iter():

                                  if local(
                                      child.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      points = ring_points(
                                          child
                                      )


                                      if len(
                                          points
                                      ) >= 4:

                                          interiors.append(
                                              points
                                          )


                                      break


                      if exterior is None:

                          continue


                      outer = ring_points(
                          exterior
                      )


                      if len(
                          outer
                      ) < 4:

                          continue


                      polygons.append(
                          [
                              outer
                          ]
                          +
                          interiors
                      )


              return polygons


          # ========================================================
          # AIRSPACE METADATA
          # ========================================================

          def first_value(
              element,
              names
          ):

              wanted = {
                  x.lower()
                  for x in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      value = node.text.strip()


                      if value:

                          return value


              return ""


          # ========================================================
          # FIND EVERY AIRSPACE
          # ========================================================

          airspaces = [
              element
              for element in root.iter()
              if local(
                  element.tag
              )
              ==
              "Airspace"
          ]


          print("")
          print(
              "=========================================="
          )

          print(
              "NATS AIRSPACE GEOMETRY RECONSTRUCTION"
          )

          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "NATS Airspace features:",
              len(
                  airspaces
              )
          )


          if not airspaces:

              raise SystemExit(
                  "ERROR: No NATS Airspace features found."
              )


          features = []


          geometry_success = 0
          geometry_missing = 0


          type_counts = Counter()
          type_geometry_success = Counter()
          type_geometry_failure = Counter()


          local_type_counts = Counter()
          local_type_geometry_failure = Counter()


          curve_statistics = Counter()
          ring_failures = 0
          surface_failures = 0


          # ========================================================
          # PROCESS EVERY AIRSPACE
          # ========================================================

          for index, airspace in enumerate(
              airspaces,
              start=1
          ):

              airspace_type = first_value(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )


              local_type = first_value(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )


              designator = first_value(
                  airspace,
                  {
                      "designator"
                  }
              )


              name = first_value(
                  airspace,
                  {
                      "name"
                  }
              )


              airspace_class = first_value(
                  airspace,
                  {
                      "class",
                      "AirspaceClass"
                  }
              )


              type_key = (
                  airspace_type
                  or
                  "(blank)"
              )


              local_key = (
                  local_type
                  or
                  "(blank)"
              )


              type_counts[
                  type_key
              ] += 1


              local_type_counts[
                  local_key
              ] += 1


              polygons = polygons_for_airspace(
                  airspace
              )


              if not polygons:

                  geometry_missing += 1

                  type_geometry_failure[
                      type_key
                  ] += 1

                  local_type_geometry_failure[
                      local_key
                  ] += 1

              else:

                  geometry_success += 1

                  type_geometry_success[
                      type_key
                  ] += 1


                  for polygon in polygons:

                      if len(
                          polygon
                      ) >= 1:

                          curve_statistics[
                              "polygon"
                          ] += 1


                          if len(
                              polygon[0]
                          ) >= 4:

                              curve_statistics[
                                  "outer_ring"
                              ] += 1

                          else:

                              ring_failures += 1


              geometry = None


              if polygons:

                  if len(
                      polygons
                  ) == 1:

                      geometry = {
                          "type":
                              "Polygon",
                          "coordinates":
                              polygons[0]
                      }

                  else:

                      geometry = {
                          "type":
                              "MultiPolygon",
                          "coordinates":
                              polygons
                      }


              identifier = (
                  attr_local(
                      airspace,
                      "id"
                  )
                  or
                  attr_local(
                      airspace,
                      "uuid"
                  )
                  or
                  ""
              )


              properties = {

                  # Raw NATS/AIXM metadata.

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC,

                  "nats_feature_type":
                      "Airspace",

                  "nats_id":
                      identifier,

                  "designator":
                      designator,

                  "name":
                      (
                          name
                          or
                          designator
                          or
                          identifier
                          or
                          "NATS Airspace"
                      ),

                  "airspace_type":
                      airspace_type,

                  "local_type":
                      local_type,

                  "airspace_class":
                      airspace_class,

                  "geometry_available":
                      geometry is not None
              }


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )


              # Useful live diagnostics for ATZ/MATZ and any
              # suspiciously named feature.

              combined = (
                  f"{airspace_type} "
                  f"{local_type} "
                  f"{designator} "
                  f"{name}"
              ).upper()


              if (
                  "ATZ" in combined
                  or
                  "MATZ" in combined
              ):

                  print("")
                  print(
                      "SPECIAL DIAGNOSTIC:"
                  )

                  print(
                      "Airspace:",
                      index
                  )

                  print(
                      "Designator:",
                      designator
                  )

                  print(
                      "Name:",
                      name
                  )

                  print(
                      "Type:",
                      airspace_type
                  )

                  print(
                      "LocalType:",
                      local_type
                  )

                  print(
                      "Geometry:",
                      (
                          "YES"
                          if geometry
                          else
                          "NO"
                      )
                  )

                  print(
                      "Polygons:",
                      len(
                          polygons
                      )
                  )


          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }


          Path(
              OUTPUT_FILE
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          # ========================================================
          # DIAGNOSTICS
          # ========================================================

          print("")
          print(
              "=========================================="
          )

          print(
              "GEOMETRY SUMMARY"
          )

          print(
              "=========================================="
          )

          print(
              "Total NATS Airspace:",
              len(
                  airspaces
              )
          )

          print(
              "Airspace with geometry:",
              geometry_success
          )

          print(
              "Airspace without geometry:",
              geometry_missing
          )

          print(
              "Ring failures:",
              ring_failures
          )


          print("")
          print(
              "AIRSPACE TYPES"
          )

          print(
              "------------------------------------------"
          )


          for key, count in type_counts.most_common():

              success = type_geometry_success[
                  key
              ]

              failure = type_geometry_failure[
                  key
              ]


              print(
                  f"{key:30s} "
                  f"total={count:5d} "
                  f"geometry={success:5d} "
                  f"failed={failure:5d}"
              )


          print("")
          print(
              "LOCAL TYPES"
          )

          print(
              "------------------------------------------"
          )


          for key, count in local_type_counts.most_common():

              failure = local_type_geometry_failure[
                  key
              ]


              print(
                  f"{key:40s} "
                  f"total={count:5d} "
                  f"geometry_failed={failure:5d}"
              )


          print("")
          print(
              "OUTPUT:"
          )

          print(
              OUTPUT_FILE
          )


          print("")
          print(
              "IMPORTANT:"
          )

          print(
              "No airspace classification filtering was performed."
          )

          print(
              "Every NATS Airspace feature has been written."
          )

          print(
              "Features without geometry remain in GeoJSON as geometry:null."
          )

          PY


      # ============================================================
      # VRP CONVERSION
      # ============================================================

      - name: Convert NATS reporting points
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re

          from pathlib import Path


          source = Path(
              "/tmp/uk-vrps.csv"
          )


          output = Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          )


          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )


          try:

              dialect = csv.Sniffer().sniff(
                  raw[:20000],
                  delimiters=",;\t|"
              )

          except csv.Error:

              dialect = csv.excel


          reader = csv.DictReader(
              raw.splitlines(),
              dialect=dialect
          )


          rows = list(
              reader
          )


          if not rows:

              raise SystemExit(
                  "ERROR: No VRP records."
              )


          fields = [
              field
              for field in rows[0].keys()
              if field is not None
          ]


          def normalise(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )


          normalised = {
              normalise(field):
                  field
              for field in fields
          }


          def find_field(
              candidates
          ):

              for candidate in candidates:

                  key = normalise(
                      candidate
                  )


                  if key in normalised:

                      return normalised[
                          key
                      ]


              for key, original in normalised.items():

                  for candidate in candidates:

                      if normalise(
                          candidate
                      ) in key:

                          return original


              return None


          latitude_field = find_field(
              [
                  "Latitude",
                  "Lat"
              ]
          )


          longitude_field = find_field(
              [
                  "Longitude",
                  "Lon",
                  "Long"
              ]
          )


          if (
              latitude_field is None
              or
              longitude_field is None
          ):

              raise SystemExit(
                  "ERROR: VRP coordinate fields not found."
              )


          def parse_coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None


              text = str(
                  value
              ).strip()


              if not text:
                  return None


              hemisphere = None


              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )


              if match:

                  hemisphere = (
                      match.group(
                          1
                      ).upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )


              try:

                  number = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )


                  limit = (
                      90
                      if latitude
                      else
                      180
                  )


                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          number = -abs(
                              number
                          )


                      return number

              except ValueError:

                  pass


              if hemisphere:

                  cleaned = re.sub(
                      r"[^0-9.]",
                      "",
                      text
                  )


                  try:

                      whole = cleaned.split(
                          ".",
                          1
                      )[0]


                      if len(
                          whole
                      ) >= 6:

                          if latitude:

                              degrees = float(
                                  cleaned[:2]
                              )

                              minutes = float(
                                  cleaned[2:4]
                              )

                              seconds = float(
                                  cleaned[4:]
                              )

                          else:

                              degrees = float(
                                  cleaned[:3]
                              )

                              minutes = float(
                                  cleaned[3:5]
                              )

                              seconds = float(
                                  cleaned[5:]
                              )


                          number = (
                              degrees
                              +
                              minutes / 60.0
                              +
                              seconds / 3600.0
                          )


                          if hemisphere in {
                              "S",
                              "W"
                          }:

                              number = -number


                          return number

                  except ValueError:

                      pass


              return None


          name_field = find_field(
              [
                  "VRP name",
                  "Name",
                  "Designator",
                  "Identifier",
                  "VRP"
              ]
          )


          features = []


          for row in rows:

              lat = parse_coordinate(
                  row.get(
                      latitude_field
                  ),
                  True
              )


              lon = parse_coordinate(
                  row.get(
                      longitude_field
                  ),
                  False
              )


              if (
                  lat is None
                  or
                  lon is None
              ):

                  continue


              properties = {
                  str(key):
                      value
                  for key, value in row.items()
                  if key
              }


              if name_field:

                  properties[
                      "name"
                  ] = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()


              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      lon,
                                      lat
                                  ]
                          }
                  }
              )


          if not features:

              raise SystemExit(
                  "ERROR: No valid VRPs."
              )


          output.write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          print(
              "NATS VRPs:",
              len(features)
          )


          PY


