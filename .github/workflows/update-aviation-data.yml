name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install lxml shapely pyproj


      # ============================================================
      # DOWNLOAD NATS DATASET INDEX
      # ============================================================

      - name: Download NATS dataset page
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading NATS Digital Datasets page"
          echo "=========================================="

          NATS_URL="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0" \
            "$NATS_URL" \
            --output /tmp/nats.html

          test -s /tmp/nats.html

          echo ""
          echo "NATS dataset page:"
          wc -c /tmp/nats.html


      # ============================================================
      # FIND CURRENT NATS AIP DATASET
      # ============================================================

      - name: Find current NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:

              match = re.search(
                  r'/ICAO_AIP/'
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  effective_date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (
                      effective_date,
                      href
                  )
              )

          print("")
          print("==========================================")
          print("NATS AIP DATASET DISCOVERY")
          print("==========================================")
          print("")

          if not datasets:

              print(
                  "ERROR: No NATS AIP XML datasets found."
              )

              print("")
              print("ICAO_AIP references:")

              for href in hrefs:

                  if "ICAO_AIP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if not usable:

              raise SystemExit(
                  "ERROR: No effective NATS AIP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print(
              "Selected AIRAC:"
          )

          print(
              effective_date
          )

          print("")
          print(
              "Selected URL:"
          )

          print(
              url
          )

          Path(
              "/tmp/nats-aip-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              str(effective_date),
              encoding="utf-8"
          )

          PY


      # ============================================================
      # DOWNLOAD NATS AIP DATASET
      # ============================================================

      - name: Download NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP dataset"
          echo "=========================================="
          echo ""
          echo "$AIP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$AIP_URL" \
            --output /tmp/nats-aip.zip

          test -s /tmp/nats-aip.zip

          echo ""
          echo "Downloaded:"
          ls -lh /tmp/nats-aip.zip

          echo ""
          echo "Testing ZIP:"
          unzip -t /tmp/nats-aip.zip

          mkdir -p /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip.zip \
            -d /tmp/nats-aip

          echo ""
          echo "Extracted files:"

          find \
            /tmp/nats-aip \
            -type f \
            -print


      # ============================================================
      # LOCATE FULL NATS AIP XML
      #
      # NEVER fall back to DELTA.
      # ============================================================

      - name: Locate full NATS AIP XML
        shell: bash
        run: |
          set -euo pipefail

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          AIRAC_COMPACT="${AIRAC//-/}"

          EXPECTED="EG_AIP_DS_FULL_${AIRAC_COMPACT}.xml"

          echo ""
          echo "=========================================="
          echo "Locating FULL NATS AIP XML"
          echo "=========================================="
          echo ""
          echo "Effective date:"
          echo "$AIRAC"
          echo ""
          echo "Expected:"
          echo "$EXPECTED"
          echo ""

          echo "Available XML files:"

          find \
            /tmp/nats-aip \
            -type f \
            -iname "*.xml" \
            -print

          echo ""

          XML_FILE=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "$EXPECTED" \
              | head -n 1
          )

          if [ -z "$XML_FILE" ]; then

            echo "ERROR: FULL NATS AIP XML not found."
            echo ""
            echo "Expected:"
            echo "$EXPECTED"
            echo ""
            echo "The DELTA dataset will NOT be used."

            exit 1
          fi

          echo "=========================================="
          echo "FULL NATS AIP XML SELECTED"
          echo "=========================================="
          echo ""
          echo "$XML_FILE"
          echo ""

          ls -lh "$XML_FILE"

          printf '%s' "$XML_FILE" \
            > /tmp/nats-aip-xml-file.txt


      # ============================================================
      # FIND CURRENT NATS VRP DATASET
      # ============================================================

      - name: Find current NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:

              match = re.search(
                  r'/VRP/'
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  effective_date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (
                      effective_date,
                      href
                  )
              )

          print("")
          print("==========================================")
          print("NATS VRP DATASET DISCOVERY")
          print("==========================================")
          print("")

          if not datasets:

              print(
                  "ERROR: No NATS VRP datasets found."
              )

              print("")
              print("VRP references:")

              for href in hrefs:

                  if "VRP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if not usable:

              raise SystemExit(
                  "ERROR: No effective NATS VRP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print(
              "Selected VRP date:"
          )

          print(
              effective_date
          )

          print("")
          print(
              "Selected URL:"
          )

          print(
              url
          )

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          PY


      # ============================================================
      # DOWNLOAD NATS VRP DATASET
      # ============================================================

      - name: Download NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats-vrp.zip

          test -s /tmp/nats-vrp.zip

          mkdir -p /tmp/nats-vrp

          unzip \
            -o \
            /tmp/nats-vrp.zip \
            -d /tmp/nats-vrp

          echo ""
          echo "VRP files:"

          find \
            /tmp/nats-vrp \
            -type f \
            -print


      # ============================================================
      # CONVERT NATS AIP AIXM -> GEOJSON
      # ============================================================

      - name: Convert NATS AIP airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          XML_FILE=$(cat /tmp/nats-aip-xml-file.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Converting NATS AIP airspace"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "XML:"
          echo "$XML_FILE"
          echo ""

          python3 <<'PY'
          from pathlib import Path
          from lxml import etree
          from shapely.geometry import Polygon, GeometryCollection, mapping
          from shapely.ops import unary_union
          from pyproj import Geod
          import json
          import math
          import re
          import sys

          XML_FILE = Path(
              "/tmp/nats-aip-xml-file.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          OUTPUT = Path(
              "data/uk-airspace.geojson"
          )

          GML = "http://www.opengis.net/gml/3.2"
          XLINK = "http://www.w3.org/1999/xlink"

          geod = Geod(
              ellps="WGS84"
          )

          parser = etree.XMLParser(
              huge_tree=True,
              recover=False,
              remove_comments=True
          )

          print(
              "Parsing FULL NATS AIP XML..."
          )

          tree = etree.parse(
              XML_FILE,
              parser
          )

          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          # ========================================================
          # INDEX XML IDS
          # ========================================================

          id_index = {}

          for element in root.iter():

              gml_id = element.get(
                  f"{{{GML}}}id"
              )

              if gml_id:

                  id_index[gml_id] = element

          print(
              f"Indexed XML objects: {len(id_index)}"
          )


          # ========================================================
          # BASIC HELPERS
          # ========================================================

          def lname(element):

              return etree.QName(
                  element
              ).localname


          def text(element):

              if element is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  "".join(
                      element.itertext()
                  )
              ).strip()


          def href(element):

              return element.get(
                  f"{{{XLINK}}}href"
              )


          def resolve(element):

              value = href(
                  element
              )

              if not value:
                  return element

              if "#" in value:

                  fragment = value.rsplit(
                      "#",
                      1
                  )[1]

                  if fragment in id_index:

                      return id_index[
                          fragment
                      ]

              return element


          def direct_or_reference(
              element,
              child_name
          ):

              matches = element.xpath(
                  f"./*[local-name()='{child_name}']"
              )

              result = []

              for child in matches:

                  target = resolve(
                      child
                  )

                  if target is not None:

                      result.append(
                          target
                      )

              return result


          def first_text(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }

              for child in element.iter():

                  if lname(
                      child
                  ).lower() in wanted:

                      value = text(
                          child
                      )

                      if value:

                          return value

              return ""


          # ========================================================
          # COORDINATE READING
          # ========================================================

          def numbers(value):

              return [
                  float(number)
                  for number in re.findall(
                      r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?",
                      value or ""
                  )
              ]


          def geometry_srs(
              element
          ):

              current = element

              while current is not None:

                  value = current.get(
                      "srsName"
                  )

                  if value:

                      return value

                  current = current.getparent()

              return (
                  "urn:ogc:def:crs:EPSG::4326"
              )


          def is_lat_first(
              srs
          ):

              value = (
                  srs or ""
              ).upper()

              if (
                  "EPSG::4326" in value
                  or
                  "EPSG:4326" in value
                  or
                  "EPSG/0/4326" in value
              ):

                  return True

              return False


          def position_pairs(
              element,
              srs
          ):

              pos_list = element.xpath(
                  ".//*[local-name()='posList']"
              )

              if pos_list:

                  values = numbers(
                      text(
                          pos_list[0]
                      )
                  )

                  if len(values) < 2:

                      return []

                  dimension = pos_list[0].get(
                      "srsDimension"
                  )

                  try:

                      dimension = int(
                          dimension
                      ) if dimension else 2

                  except Exception:

                      dimension = 2

                  if dimension < 2:

                      dimension = 2

                  pairs = []

                  for i in range(
                      0,
                      len(values) - 1,
                      dimension
                  ):

                      pairs.append(
                          (
                              values[i],
                              values[i + 1]
                          )
                      )

                  return pairs

              positions = element.xpath(
                  ".//*[local-name()='pos']"
              )

              pairs = []

              for position in positions:

                  values = numbers(
                      text(
                          position
                      )
                  )

                  if len(values) >= 2:

                      pairs.append(
                          (
                              values[0],
                              values[1]
                          )
                      )

              return pairs


          def to_lon_lat(
              pair,
              srs
          ):

              first, second = pair

              if is_lat_first(
                  srs
              ):

                  return (
                      second,
                      first
                  )

              return (
                  first,
                  second
              )


          def coordinates_from_element(
              element,
              srs
          ):

              return [
                  to_lon_lat(
                      pair,
                      srs
                  )
                  for pair in position_pairs(
                      element,
                      srs
                  )
              ]


          # ========================================================
          # RADIUS
          # ========================================================

          def radius_metres(
              element
          ):

              value_text = text(
                  element
              )

              try:

                  value = float(
                      value_text
                  )

              except Exception:

                  return None

              uom = (
                  element.get(
                      "uom"
                  )
                  or
                  "m"
              ).strip().lower()

              if uom in {
                  "m",
                  "meter",
                  "metre",
                  "meters",
                  "metres"
              }:

                  return value

              if uom in {
                  "km",
                  "kilometer",
                  "kilometre"
              }:

                  return value * 1000.0

              if uom in {
                  "[nmi_i]",
                  "nmi",
                  "nm",
                  "nauticalmile",
                  "nauticalmiles"
              }:

                  return value * 1852.0

              if uom in {
                  "ft",
                  "foot",
                  "feet"
              }:

                  return value * 0.3048

              if uom in {
                  "mi"
              }:

                  return value * 1609.344

              print(
                  f"WARNING: Unknown radius unit '{uom}', "
                  "assuming metres."
              )

              return value


          # ========================================================
          # ARC GENERATION
          #
          # EPSG:4326 uses latitude first and AIXM angles are
          # measured clockwise from North.
          # ========================================================

          def arc_points(
              segment,
              srs
          ):

              centre_values = position_pairs(
                  segment,
                  srs
              )

              if not centre_values:

                  point_nodes = segment.xpath(
                      ".//*[local-name()='pointProperty']"
                  )

                  for node in point_nodes:

                      target = resolve(
                          node
                      )

                      centre_values = position_pairs(
                          target,
                          srs
                      )

                      if centre_values:

                          break

              if not centre_values:

                  return []

              centre = to_lon_lat(
                  centre_values[0],
                  srs
              )

              radius_node = segment.xpath(
                  ".//*[local-name()='radius']"
              )

              if not radius_node:

                  return []

              radius = radius_metres(
                  radius_node[0]
              )

              if radius is None:

                  return []

              start_node = segment.xpath(
                  ".//*[local-name()='startAngle']"
              )

              end_node = segment.xpath(
                  ".//*[local-name()='endAngle']"
              )

              # Full circle.
              if not start_node or not end_node:

                  count = 96

                  result = []

                  for i in range(
                      count + 1
                  ):

                      angle = (
                          360.0
                          *
                          i
                          /
                          count
                      )

                      lon, lat, _ = geod.fwd(
                          centre[0],
                          centre[1],
                          angle,
                          radius
                      )

                      result.append(
                          (
                              lon,
                              lat
                          )
                      )

                  return result

              try:

                  start = float(
                      text(
                          start_node[0]
                      )
                  )

                  end = float(
                      text(
                          end_node[0]
                      )
                  )

              except Exception:

                  return []

              difference = (
                  end
                  -
                  start
              )

              if abs(
                  difference
              ) >= 360.0:

                  return arc_points(
                      segment,
                      srs
                  )

              direction = 1.0

              if difference < 0:

                  direction = -1.0

              steps = max(
                  4,
                  int(
                      abs(
                          difference
                      )
                      /
                      3.0
                  )
                  +
                  1
              )

              result = []

              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i
                      /
                      steps
                  )

                  angle = (
                      start
                      +
                      difference
                      *
                      fraction
                  )

                  lon, lat, _ = geod.fwd(
                      centre[0],
                      centre[1],
                      angle,
                      radius
                  )

                  result.append(
                      (
                          lon,
                          lat
                      )
                  )

              return result


          # ========================================================
          # CURVE SEGMENT
          # ========================================================

          def curve_segment_points(
              segment,
              srs
          ):

              name = lname(
                  segment
              ).lower()

              if name in {
                  "geodesicstring",
                  "linestringsegment",
                  "linestring",
                  "linearring"
              }:

                  return coordinates_from_element(
                      segment,
                      srs
                  )

              if name == "arcbycenterpoint":

                  return arc_points(
                      segment,
                      srs
                  )

              if name == "circlebycenterpoint":

                  return arc_points(
                      segment,
                      srs
                  )

              if name == "arc":

                  points = coordinates_from_element(
                      segment,
                      srs
                  )

                  # AIXM edge arcs are defined by points.
                  # Connecting the encoded points preserves the
                  # supplied boundary without inventing a curve.
                  return points

              # Try any nested coordinate geometry.
              points = coordinates_from_element(
                  segment,
                  srs
              )

              return points


          # ========================================================
          # CURVE
          # ========================================================

          def curve_points(
              curve,
              srs
          ):

              curve = resolve(
                  curve
              )

              local_srs = (
                  curve.get(
                      "srsName"
                  )
                  or
                  srs
              )

              segments = curve.xpath(
                  ".//*[local-name()='segments']/*"
              )

              result = []

              for segment in segments:

                  points = curve_segment_points(
                      segment,
                      local_srs
                  )

                  if not points:

                      continue

                  if result and points:

                      # Avoid duplicating shared boundary point.
                      if (
                          abs(
                              result[-1][0]
                              -
                              points[0][0]
                          ) < 1e-10
                          and
                          abs(
                              result[-1][1]
                              -
                              points[0][1]
                          ) < 1e-10
                      ):

                          points = points[1:]

                  result.extend(
                      points
                  )

              return result


          # ========================================================
          # RING
          # ========================================================

          def ring_points(
              ring,
              srs
          ):

              ring = resolve(
                  ring
              )

              # Simple LinearRing.
              linear_rings = ring.xpath(
                  ".//*[local-name()='LinearRing']"
              )

              for linear_ring in linear_rings:

                  points = coordinates_from_element(
                      linear_ring,
                      srs
                  )

                  if len(points) >= 3:

                      return points

              # Curve-based Ring.
              members = ring.xpath(
                  "./*[local-name()='curveMember']"
              )

              result = []

              for member in members:

                  target = resolve(
                      member
                  )

                  curves = []

                  if target is not None:

                      if (
                          lname(
                              target
                          ).lower()
                          ==
                          "curve"
                      ):

                          curves.append(
                              target
                          )

                      else:

                          curves.extend(
                              target.xpath(
                                  ".//*[local-name()='Curve']"
                              )
                          )

                  if not curves:

                      curves = member.xpath(
                          ".//*[local-name()='Curve']"
                      )

                  for curve in curves:

                      points = curve_points(
                          curve,
                          srs
                      )

                      if not points:

                          continue

                      if result and points:

                          if (
                              abs(
                                  result[-1][0]
                                  -
                                  points[0][0]
                              ) < 1e-10
                              and
                              abs(
                                  result[-1][1]
                                  -
                                  points[0][1]
                              ) < 1e-10
                          ):

                              points = points[1:]

                      result.extend(
                          points
                      )

              return result


          # ========================================================
          # POLYGON PATCH
          # ========================================================

          def polygon_from_patch(
              patch,
              srs
          ):

              exterior = patch.xpath(
                  "./*[local-name()='exterior']"
              )

              if not exterior:

                  exterior = patch.xpath(
                      ".//*[local-name()='exterior']"
                  )

              if not exterior:

                  return None

              outer_rings = exterior[0].xpath(
                  ".//*[local-name()='LinearRing']"
              )

              if outer_rings:

                  outer = coordinates_from_element(
                      outer_rings[0],
                      srs
                  )

              else:

                  rings = exterior[0].xpath(
                      ".//*[local-name()='Ring']"
                  )

                  if not rings:

                      return None

                  outer = ring_points(
                      rings[0],
                      srs
                  )

              if len(outer) < 3:

                  return None

              if outer[0] != outer[-1]:

                  outer.append(
                      outer[0]
                  )

              holes = []

              interiors = patch.xpath(
                  "./*[local-name()='interior']"
              )

              for interior in interiors:

                  linear_rings = interior.xpath(
                      ".//*[local-name()='LinearRing']"
                  )

                  if linear_rings:

                      hole = coordinates_from_element(
                          linear_rings[0],
                          srs
                      )

                  else:

                      rings = interior.xpath(
                          ".//*[local-name()='Ring']"
                      )

                      if not rings:

                          continue

                      hole = ring_points(
                          rings[0],
                          srs
                      )

                  if len(hole) >= 3:

                      if hole[0] != hole[-1]:

                          hole.append(
                              hole[0]
                          )

                      holes.append(
                          hole
                      )

              try:

                  polygon = Polygon(
                      outer,
                      holes
                  )

              except Exception:

                  return None

              if polygon.is_empty:

                  return None

              if not polygon.is_valid:

                  polygon = polygon.buffer(
                      0
                  )

              if polygon.is_empty:

                  return None

              return polygon


          # ========================================================
          # SURFACE
          # ========================================================

          def surface_geometry(
              surface
          ):

              surface = resolve(
                  surface
              )

              srs = geometry_srs(
                  surface
              )

              patches = surface.xpath(
                  ".//*[local-name()='PolygonPatch']"
              )

              geometries = []

              for patch in patches:

                  polygon = polygon_from_patch(
                      patch,
                      srs
                  )

                  if polygon is not None:

                      geometries.append(
                          polygon
                      )

              if not geometries:

                  return None

              try:

                  return unary_union(
                      geometries
                  )

              except Exception:

                  return geometries[0]


          # ========================================================
          # AIRSPACE VOLUME
          # ========================================================

          def volume_geometry(
              volume
          ):

              volume = resolve(
                  volume
              )

              surfaces = direct_or_reference(
                  volume,
                  "horizontalProjection"
              )

              geometries = []

              for surface in surfaces:

                  geometry = surface_geometry(
                      surface
                  )

                  if geometry is not None:

                      geometries.append(
                          geometry
                      )

              if not geometries:

                  # Fallback for embedded Surface.
                  surfaces = volume.xpath(
                      ".//*[local-name()='Surface']"
                  )

                  for surface in surfaces:

                      geometry = surface_geometry(
                          surface
                      )

                      if geometry is not None:

                          geometries.append(
                              geometry
                          )

              if not geometries:

                  return None

              try:

                  return unary_union(
                      geometries
                  )

              except Exception:

                  return geometries[0]


          # ========================================================
          # GEOMETRY COMPONENTS
          # ========================================================

          def geometry_components(
              timeslice
          ):

              components = []

              for node in timeslice.xpath(
                  "./*[local-name()='geometryComponent']"
              ):

                  component = resolve(
                      node
                  )

                  components.append(
                      component
                  )

              # Some datasets may embed components deeper.
              if not components:

                  components = timeslice.xpath(
                      ".//*[local-name()='AirspaceGeometryComponent']"
                  )

              return components


          def component_operation(
              component
          ):

              value = first_text(
                  component,
                  [
                      "operation"
                  ]
              ).upper()

              return value


          def component_sequence(
              component
          ):

              value = first_text(
                  component,
                  [
                      "operationSequence"
                  ]
              )

              try:

                  return int(
                      value
                  )

              except Exception:

                  return 999999


          def component_volume(
              component
          ):

              direct = direct_or_reference(
                  component,
                  "theAirspaceVolume"
              )

              if direct:

                  return direct[0]

              volumes = component.xpath(
                  ".//*[local-name()='AirspaceVolume']"
              )

              if volumes:

                  return resolve(
                      volumes[0]
                  )

              return None


          # ========================================================
          # AIRSPACE AGGREGATION
          # ========================================================

          def airspace_geometry(
              timeslice
          ):

              components = geometry_components(
                  timeslice
              )

              if not components:

                  return None, 0, []

              ordered = sorted(
                  components,
                  key=component_sequence
              )

              result = None

              operations = []

              for component in ordered:

                  operation = component_operation(
                      component
                  )

                  operations.append(
                      operation
                  )

                  volume = component_volume(
                      component
                  )

                  if volume is None:

                      continue

                  geometry = volume_geometry(
                      volume
                  )

                  if geometry is None:

                      continue

                  if result is None:

                      result = geometry
                      continue

                  if operation in {
                      "SUBTRACTION",
                      "SUBTR"
                  }:

                      try:

                          result = result.difference(
                              geometry
                          )

                      except Exception:

                          pass

                  elif operation in {
                      "INTERSECTION",
                      "INTERS"
                  }:

                      try:

                          result = result.intersection(
                              geometry
                          )

                      except Exception:

                          pass

                  else:

                      # BASE / UNION / unknown.
                      try:

                          result = result.union(
                              geometry
                          )

                      except Exception:

                          pass

              return (
                  result,
                  len(
                      components
                  ),
                  operations
              )


          # ========================================================
          # FIND AIRSPACE FEATURES
          # ========================================================

          airspaces = root.xpath(
              "//*[local-name()='Airspace']"
          )

          print("")
          print(
              f"NATS Airspace features found: {len(airspaces)}"
          )

          if not airspaces:

              print(
                  "ERROR: No Airspace features found."
              )

              sys.exit(1)


          # ========================================================
          # DEBUG FIRST FIVE AIRSPACES
          # ========================================================

          print("")
          print("==========================================")
          print("AIXM GEOMETRY DEBUG")
          print("==========================================")

          for index, airspace in enumerate(
              airspaces[:5],
              1
          ):

              timeslices = airspace.xpath(
                  ".//*[local-name()='AirspaceTimeSlice']"
              )

              timeslice = (
                  timeslices[-1]
                  if timeslices
                  else airspace
              )

              designator = first_text(
                  timeslice,
                  [
                      "designator"
                  ]
              )

              name = first_text(
                  timeslice,
                  [
                      "name"
                  ]
              )

              components = geometry_components(
                  timeslice
              )

              print("")
              print(
                  f"--- Airspace {index} ---"
              )

              print(
                  "Designator:",
                  designator
              )

              print(
                  "Name:",
                  name
              )

              print(
                  "Geometry components:",
                  len(components)
              )

              for component_index, component in enumerate(
                  components,
                  1
              ):

                  print(
                      f"  Component {component_index}"
                  )

                  print(
                      "    Operation:",
                      component_operation(
                          component
                      )
                  )

                  print(
                      "    Sequence:",
                      component_sequence(
                          component
                      )
                  )

                  volume = component_volume(
                      component
                  )

                  print(
                      "    AirspaceVolume:",
                      "YES"
                      if volume is not None
                      else
                      "NO"
                  )

                  if volume is not None:

                      surfaces = direct_or_reference(
                          volume,
                          "horizontalProjection"
                      )

                      print(
                          "    Horizontal surfaces:",
                          len(
                              surfaces
                          )
                      )

                      for surface in surfaces[:3]:

                          print(
                              "      Surface CRS:",
                              geometry_srs(
                                  surface
                              )
                          )

                          patches = surface.xpath(
                              ".//*[local-name()='PolygonPatch']"
                          )

                          print(
                              "      PolygonPatch count:",
                              len(patches)
                          )

                          for patch in patches[:2]:

                              print(
                                  "      Ring types:",
                                  [
                                      lname(
                                          child
                                      )
                                      for child in patch.xpath(
                                          ".//*[local-name()='exterior']/*"
                                      )
                                  ]
                              )

                              print(
                                  "      Curve segment types:",
                                  [
                                      lname(
                                          segment
                                      )
                                      for segment in patch.xpath(
                                          ".//*[local-name()='segments']/*"
                                      )[:10]
                                  ]
                              )


          # ========================================================
          # CONVERT
          # ========================================================

          features = []

          failures = 0

          failure_reasons = {}

          categories = {}


          def classify(
              designator,
              name,
              air_type,
              local_type,
              classification
          ):

              combined = " ".join(
                  [
                      designator,
                      name,
                      air_type,
                      local_type,
                      classification
                  ]
              ).upper()

              if (
                  air_type == "P"
                  or
                  "PROHIBITED" in combined
              ):

                  return (
                      "PROHIBITED",
                      "red",
                      "solid"
                  )

              if (
                  air_type == "R"
                  or
                  "RESTRICTED" in combined
              ):

                  return (
                      "RESTRICTED",
                      "red",
                      "solid"
                  )

              if (
                  air_type == "D"
                  or
                  "DANGER" in combined
              ):

                  return (
                      "DANGER",
                      "red",
                      "solid"
                  )

              if (
                  classification == "A"
                  or
                  re.search(
                      r"\bCLASS[\s_-]*A\b",
                      combined
                  )
              ):

                  return (
                      "CLASS_A",
                      "purple",
                      "solid"
                  )

              if (
                  air_type == "ATZ"
                  or
                  local_type == "ATZ"
                  or
                  "ATZ" in combined
              ):

                  return (
                      "ATZ",
                      "purple",
                      "dashed"
                  )

              if (
                  air_type == "TMZ"
                  or
                  local_type == "TMZ"
                  or
                  "TMZ" in combined
              ):

                  return (
                      "TMZ",
                      "purple",
                      "dashed"
                  )

              if (
                  air_type == "MATZ"
                  or
                  local_type == "MATZ"
                  or
                  "MATZ" in combined
              ):

                  return (
                      "MATZ",
                      "blue",
                      "dashed"
                  )

              if (
                  air_type == "RMZ"
                  or
                  local_type == "RMZ"
                  or
                  "RMZ" in combined
              ):

                  return (
                      "RMZ",
                      "blue",
                      "dashed"
                  )

              if air_type in {
                  "CTA",
                  "CTR",
                  "TMA",
                  "TCA",
                  "AWY",
                  "SECTOR",
                  "FIR",
                  "UIR"
              }:

                  return (
                      "CONTROLLED",
                      "blue",
                      "solid"
                  )

              return (
                  "OTHER",
                  "grey",
                  "solid"
              )


          for index, airspace in enumerate(
              airspaces,
              1
          ):

              timeslices = airspace.xpath(
                  ".//*[local-name()='AirspaceTimeSlice']"
              )

              timeslice = (
                  timeslices[-1]
                  if timeslices
                  else airspace
              )

              designator = first_text(
                  timeslice,
                  [
                      "designator"
                  ]
              )

              name = first_text(
                  timeslice,
                  [
                      "name"
                  ]
              )

              air_type = first_text(
                  timeslice,
                  [
                      "type"
                  ]
              ).upper()

              local_type = first_text(
                  timeslice,
                  [
                      "localType"
                  ]
              ).upper()

              classification = first_text(
                  timeslice,
                  [
                      "classification"
                  ]
              ).upper()

              try:

                  geometry, component_count, operations = (
                      airspace_geometry(
                          timeslice
                      )
                  )

              except Exception as exc:

                  geometry = None
                  component_count = 0
                  operations = []

                  reason = (
                      f"exception:{type(exc).__name__}"
                  )

                  failure_reasons[
                      reason
                  ] = failure_reasons.get(
                      reason,
                      0
                  ) + 1

              if geometry is None:

                  failures += 1

                  reason = (
                      "no_geometry"
                  )

                  failure_reasons[
                      reason
                  ] = failure_reasons.get(
                      reason,
                      0
                  ) + 1

                  if failures <= 10:

                      print("")
                      print(
                          "GEOMETRY FAILURE"
                      )

                      print(
                          "Designator:",
                          designator
                      )

                      print(
                          "Name:",
                          name
                      )

                      print(
                          "Components:",
                          component_count
                      )

                      print(
                          "Operations:",
                          operations
                      )

                  continue

              if geometry.is_empty:

                  failures += 1

                  reason = (
                      "empty_geometry"
                  )

                  failure_reasons[
                      reason
                  ] = failure_reasons.get(
                      reason,
                      0
                  ) + 1

                  continue

              category, colour, boundary = classify(
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification
              )

              categories[
                  category
              ] = categories.get(
                  category,
                  0
              ) + 1

              feature = {
                  "type": "Feature",
                  "geometry": mapping(
                      geometry
                  ),
                  "properties": {
                      "designator": designator,
                      "name": name,
                      "type": air_type,
                      "localType": local_type,
                      "classification": classification,

                      "category": category,
                      "colour": colour,
                      "boundary": boundary,

                      "stroke": colour,
                      "lineStyle": boundary,

                      "airspaceType": air_type,
                      "airspaceClass": classification,

                      "source": "NATS UK ICAO AIP Dataset",
                      "airac": AIRAC
                  }
              }

              features.append(
                  feature
              )


          # ========================================================
          # RESULT
          # ========================================================

          print("")
          print("==========================================")
          print("AIRSPACE CONVERSION RESULT")
          print("==========================================")
          print("")

          print(
              f"Source Airspace features: {len(airspaces)}"
          )

          print(
              f"Valid geometries: {len(features)}"
          )

          print(
              f"Geometry failures: {failures}"
          )

          print("")
          print(
              "Failure reasons:"
          )

          for reason, count in sorted(
              failure_reasons.items()
          ):

              print(
                  f"  {reason}: {count}"
              )

          print("")
          print(
              "Categories:"
          )

          for category, count in sorted(
              categories.items()
          ):

              print(
                  f"  {category}: {count}"
              )


          # ========================================================
          # SAFETY CHECKS
          # ========================================================

          if len(features) == 0:

              print("")
              print(
                  "ERROR: NATS AIP conversion produced "
                  "zero valid airspace geometries."
              )

              print("")
              print(
                  "Existing uk-airspace.geojson has NOT "
                  "been replaced."
              )

              sys.exit(1)


          if len(features) < 100:

              print("")
              print(
                  "ERROR: Suspiciously small airspace dataset."
              )

              print(
                  f"Only {len(features)} geometries were produced."
              )

              print(
                  "Existing uk-airspace.geojson has NOT "
                  "been replaced."
              )

              sys.exit(1)


          # ========================================================
          # WRITE
          # ========================================================

          collection = {
              "type": "FeatureCollection",
              "features": features
          }

          temporary = OUTPUT.with_suffix(
              ".geojson.tmp"
          )

          temporary.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          temporary.replace(
              OUTPUT
          )

          print("")
          print(
              f"Written: {OUTPUT}"
          )

          print(
              f"Features: {len(features)}"
          )

