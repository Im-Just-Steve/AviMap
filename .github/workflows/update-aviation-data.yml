name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install lxml shapely


      # ============================================================
      # DOWNLOAD NATS DATASET INDEX
      # ============================================================

      - name: Download NATS dataset page
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading NATS Digital Datasets page"
          echo "=========================================="

          NATS_URL="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0" \
            "$NATS_URL" \
            --output /tmp/nats.html

          test -s /tmp/nats.html

          echo ""
          echo "Downloaded NATS dataset page:"
          wc -c /tmp/nats.html


      # ============================================================
      # FIND CURRENT NATS AIP DATASET
      # ============================================================

      - name: Find current NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:

              match = re.search(
                  r'/ICAO_AIP/'
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  effective_date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (
                      effective_date,
                      href
                  )
              )

          print("")
          print("==========================================")
          print("NATS AIP DATASET DISCOVERY")
          print("==========================================")
          print("")

          if not datasets:

              print(
                  "ERROR: No NATS AIP XML ZIP datasets found."
              )

              print("")
              print("ICAO_AIP references found:")

              for href in hrefs:
                  if "ICAO_AIP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if not usable:

              raise SystemExit(
                  "ERROR: No effective NATS AIP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print(
              "Selected AIRAC:"
          )
          print(
              effective_date
          )

          print("")
          print(
              "Selected URL:"
          )
          print(
              url
          )

          Path(
              "/tmp/nats-aip-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              str(effective_date),
              encoding="utf-8"
          )

          PY


      # ============================================================
      # DOWNLOAD NATS AIP DATASET
      # ============================================================

      - name: Download NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP dataset"
          echo "=========================================="
          echo ""
          echo "$AIP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$AIP_URL" \
            --output /tmp/nats-aip.zip

          test -s /tmp/nats-aip.zip

          echo ""
          echo "Downloaded:"
          ls -lh /tmp/nats-aip.zip

          echo ""
          echo "Testing ZIP:"
          unzip -t /tmp/nats-aip.zip

          mkdir -p /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip.zip \
            -d /tmp/nats-aip

          echo ""
          echo "Extracted files:"
          find \
            /tmp/nats-aip \
            -type f \
            -print


      # ============================================================
      # LOCATE FULL NATS AIP XML
      #
      # IMPORTANT:
      # Never fall back to the DELTA dataset.
      # ============================================================

      - name: Locate full NATS AIP XML
        shell: bash
        run: |
          set -euo pipefail

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          AIRAC_COMPACT="${AIRAC//-/}"

          EXPECTED="EG_AIP_DS_FULL_${AIRAC_COMPACT}.xml"

          echo ""
          echo "=========================================="
          echo "Locating FULL NATS AIP XML"
          echo "=========================================="
          echo ""
          echo "Effective date:"
          echo "$AIRAC"
          echo ""
          echo "Expected filename:"
          echo "$EXPECTED"
          echo ""

          echo "Available XML files:"
          find \
            /tmp/nats-aip \
            -type f \
            -iname "*.xml" \
            -print

          echo ""

          XML_FILE=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "$EXPECTED" \
              | head -n 1
          )

          if [ -z "$XML_FILE" ]; then

            echo "ERROR: FULL NATS AIP XML was not found."
            echo ""
            echo "Expected:"
            echo "$EXPECTED"
            echo ""
            echo "The workflow will NOT use the DELTA dataset."
            echo ""
            echo "Available files:"
            find \
              /tmp/nats-aip \
              -type f \
              -print

            exit 1
          fi

          echo "=========================================="
          echo "FULL NATS AIP XML SELECTED"
          echo "=========================================="
          echo ""
          echo "$XML_FILE"
          echo ""

          ls -lh "$XML_FILE"

          printf '%s' "$XML_FILE" \
            > /tmp/nats-aip-xml-file.txt


      # ============================================================
      # FIND CURRENT NATS VRP DATASET
      # ============================================================

      - name: Find current NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:

              match = re.search(
                  r'/VRP/'
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  effective_date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (
                      effective_date,
                      href
                  )
              )

          print("")
          print("==========================================")
          print("NATS VRP DATASET DISCOVERY")
          print("==========================================")
          print("")

          if not datasets:

              print(
                  "ERROR: No NATS VRP datasets found."
              )

              print("")
              print("VRP references found:")

              for href in hrefs:
                  if "VRP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if not usable:

              raise SystemExit(
                  "ERROR: No effective NATS VRP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print(
              "Selected VRP date:"
          )
          print(
              effective_date
          )

          print("")
          print(
              "Selected URL:"
          )
          print(
              url
          )

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          PY


      # ============================================================
      # DOWNLOAD NATS VRP DATASET
      # ============================================================

      - name: Download NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats-vrp.zip

          test -s /tmp/nats-vrp.zip

          mkdir -p /tmp/nats-vrp

          unzip \
            -o \
            /tmp/nats-vrp.zip \
            -d /tmp/nats-vrp

          echo ""
          echo "Extracted VRP files:"
          find \
            /tmp/nats-vrp \
            -type f \
            -print


      # ============================================================
      # CONVERT NATS AIP AIXM -> GEOJSON
      # ============================================================

      - name: Convert NATS AIP airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          XML_FILE=$(cat /tmp/nats-aip-xml-file.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Converting NATS AIP airspace"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "XML:"
          echo "$XML_FILE"
          echo ""

          python3 <<'PY'
          from pathlib import Path
          from lxml import etree
          from shapely.geometry import Polygon, MultiPolygon
          from shapely.ops import unary_union
          import json
          import re
          import sys

          XML_FILE = Path(
              "/tmp/nats-aip-xml-file.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          OUTPUT = Path(
              "data/uk-airspace.geojson"
          )

          parser = etree.XMLParser(
              huge_tree=True,
              recover=False,
              remove_comments=True
          )

          print("Parsing FULL NATS AIP XML...")

          tree = etree.parse(
              XML_FILE,
              parser
          )

          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          # --------------------------------------------------------
          # Index gml:id objects.
          # --------------------------------------------------------

          id_index = {}

          for element in root.iter():

              gml_id = element.get(
                  "{http://www.opengis.net/gml/3.2}id"
              )

              if gml_id:

                  id_index[gml_id] = element

          print(
              f"Indexed XML objects: {len(id_index)}"
          )

          def local_name(element):

              return etree.QName(
                  element
              ).localname.lower()

          def text(element):

              if element is None:
                  return ""

              value = "".join(
                  element.itertext()
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

          def first_text(element, names):

              wanted = {
                  item.lower()
                  for item in names
              }

              for child in element.iter():

                  if local_name(child) in wanted:

                      value = text(
                          child
                      )

                      if value:
                          return value

              return ""

          def href_target(element):

              href = element.get(
                  "{http://www.w3.org/1999/xlink}href"
              )

              if not href:
                  return None

              if href.startswith("#"):

                  return id_index.get(
                      href[1:]
                  )

              return None

          # --------------------------------------------------------
          # Coordinate parser.
          # --------------------------------------------------------

          def numbers_from_text(value):

              return [
                  float(number)
                  for number in re.findall(
                      r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?",
                      value or ""
                  )
              ]

          def coordinate_list(element):

              pos_list = element.xpath(
                  ".//*[local-name()='posList']"
              )

              if pos_list:

                  values = numbers_from_text(
                      text(
                          pos_list[0]
                      )
                  )

                  dimension = pos_list[0].get(
                      "srsDimension"
                  )

                  try:
                      dimension = int(
                          dimension
                      ) if dimension else 2
                  except Exception:
                      dimension = 2

                  if dimension < 2:
                      dimension = 2

                  result = []

                  for i in range(
                      0,
                      len(values) - 1,
                      dimension
                  ):

                      result.append(
                          (
                              values[i],
                              values[i + 1]
                          )
                      )

                  return result

              positions = element.xpath(
                  ".//*[local-name()='pos']"
              )

              result = []

              for pos in positions:

                  values = numbers_from_text(
                      text(pos)
                  )

                  if len(values) >= 2:

                      result.append(
                          (
                              values[0],
                              values[1]
                          )
                      )

              return result

          # --------------------------------------------------------
          # Extract a LinearRing.
          # --------------------------------------------------------

          def extract_ring(ring):

              coords = coordinate_list(
                  ring
              )

              if len(coords) >= 3:

                  return coords

              return []

          # --------------------------------------------------------
          # Convert an AIXM/GML PolygonPatch.
          # --------------------------------------------------------

          def extract_polygon(polygon):

              exterior = polygon.xpath(
                  ".//*[local-name()='exterior']"
              )

              if not exterior:
                  return None

              outer_rings = exterior[0].xpath(
                  ".//*[local-name()='LinearRing']"
              )

              if not outer_rings:
                  return None

              outer = extract_ring(
                  outer_rings[0]
              )

              if len(outer) < 3:
                  return None

              holes = []

              interiors = polygon.xpath(
                  ".//*[local-name()='interior']"
              )

              for interior in interiors:

                  rings = interior.xpath(
                      ".//*[local-name()='LinearRing']"
                  )

                  if not rings:
                      continue

                  hole = extract_ring(
                      rings[0]
                  )

                  if len(hole) >= 3:

                      holes.append(
                          hole
                      )

              return (
                  outer,
                  holes
              )

          # --------------------------------------------------------
          # Convert coordinate order to GeoJSON lon/lat.
          #
          # NATS AIXM geographic coordinates can be represented
          # according to the CRS declared in the document.
          #
          # We use the values themselves to determine the most
          # plausible geographic orientation.
          # --------------------------------------------------------

          def orient_ring(
              coords
          ):

              if not coords:
                  return []

              direct = 0
              reverse = 0

              for a, b in coords[:100]:

                  if (
                      -180 <= a <= 180
                      and
                      -90 <= b <= 90
                  ):

                      direct += 1

                  if (
                      -90 <= a <= 90
                      and
                      -180 <= b <= 180
                  ):

                      reverse += 1

              if reverse > direct:

                  return [
                      (
                          b,
                          a
                      )
                      for a, b in coords
                  ]

              return coords

          def make_polygon(
              outer,
              holes
          ):

              outer = orient_ring(
                  outer
              )

              holes = [
                  orient_ring(
                      hole
                  )
                  for hole in holes
              ]

              try:

                  polygon = Polygon(
                      outer,
                      holes
                  )

              except Exception:

                  return None

              if polygon.is_empty:
                  return None

              if not polygon.is_valid:

                  polygon = polygon.buffer(
                      0
                  )

              if polygon.is_empty:
                  return None

              return polygon

          # --------------------------------------------------------
          # Resolve geometry references recursively.
          # --------------------------------------------------------

          def extract_geometry(
              element,
              visited=None
          ):

              if visited is None:
                  visited = set()

              object_id = element.get(
                  "{http://www.opengis.net/gml/3.2}id"
              )

              if object_id:

                  if object_id in visited:
                      return []

                  visited.add(
                      object_id
                  )

              polygons = []

              # Direct Polygon / PolygonPatch geometry.
              polygon_nodes = element.xpath(
                  ".//*[local-name()='Polygon']"
              )

              polygon_nodes += element.xpath(
                  ".//*[local-name()='PolygonPatch']"
              )

              seen_nodes = set()

              for polygon in polygon_nodes:

                  node_id = id(
                      polygon
                  )

                  if node_id in seen_nodes:
                      continue

                  seen_nodes.add(
                      node_id
                  )

                  result = extract_polygon(
                      polygon
                  )

                  if result:

                      polygons.append(
                          result
                      )

              # Resolve xlink references.
              for child in element.iter():

                  target = href_target(
                      child
                  )

                  if target is None:
                      continue

                  polygons.extend(
                      extract_geometry(
                          target,
                          visited
                      )
                  )

              return polygons

          # --------------------------------------------------------
          # Find Airspace features in FULL dataset.
          # --------------------------------------------------------

          airspaces = root.xpath(
              "//*[local-name()='Airspace']"
          )

          print("")
          print(
              f"NATS Airspace features found: {len(airspaces)}"
          )

          if len(airspaces) == 0:

              print(
                  "ERROR: FULL NATS AIP contains no Airspace features."
              )

              sys.exit(1)

          features = []

          failures = 0

          categories = {}

          # --------------------------------------------------------
          # Classification.
          # --------------------------------------------------------

          def classify(
              designator,
              name,
              air_type,
              local_type,
              classification
          ):

              combined = " ".join(
                  [
                      designator,
                      name,
                      air_type,
                      local_type,
                      classification
                  ]
              ).upper()

              if (
                  air_type == "P"
                  or
                  "PROHIBITED" in combined
              ):

                  return (
                      "PROHIBITED",
                      "red",
                      "solid"
                  )

              if (
                  air_type == "R"
                  or
                  "RESTRICTED" in combined
              ):

                  return (
                      "RESTRICTED",
                      "red",
                      "solid"
                  )

              if (
                  air_type == "D"
                  or
                  "DANGER" in combined
              ):

                  return (
                      "DANGER",
                      "red",
                      "solid"
                  )

              if (
                  classification == "A"
                  or
                  re.search(
                      r"\bCLASS[\s_-]*A\b",
                      combined
                  )
              ):

                  return (
                      "CLASS_A",
                      "purple",
                      "solid"
                  )

              if (
                  air_type == "ATZ"
                  or
                  local_type == "ATZ"
                  or
                  "ATZ" in combined
              ):

                  return (
                      "ATZ",
                      "purple",
                      "dashed"
                  )

              if (
                  air_type == "TMZ"
                  or
                  local_type == "TMZ"
                  or
                  "TMZ" in combined
              ):

                  return (
                      "TMZ",
                      "purple",
                      "dashed"
                  )

              if (
                  air_type == "MATZ"
                  or
                  local_type == "MATZ"
                  or
                  "MATZ" in combined
              ):

                  return (
                      "MATZ",
                      "blue",
                      "dashed"
                  )

              if (
                  air_type == "RMZ"
                  or
                  local_type == "RMZ"
                  or
                  "RMZ" in combined
              ):

                  return (
                      "RMZ",
                      "blue",
                      "dashed"
                  )

              if air_type in {
                  "CTA",
                  "CTR",
                  "TMA",
                  "TCA",
                  "AWY",
                  "SECTOR",
                  "FIR",
                  "UIR"
              }:

                  return (
                      "CONTROLLED",
                      "blue",
                      "solid"
                  )

              return (
                  "OTHER",
                  "grey",
                  "solid"
              )

          # --------------------------------------------------------
          # Process every Airspace feature.
          # --------------------------------------------------------

          for index, airspace in enumerate(
              airspaces,
              1
          ):

              timeslices = airspace.xpath(
                  ".//*[local-name()='AirspaceTimeSlice']"
              )

              if timeslices:

                  timeslice = timeslices[-1]

              else:

                  timeslice = airspace

              designator = first_text(
                  timeslice,
                  [
                      "designator"
                  ]
              )

              name = first_text(
                  timeslice,
                  [
                      "name"
                  ]
              )

              air_type = first_text(
                  timeslice,
                  [
                      "type"
                  ]
              ).upper()

              local_type = first_text(
                  timeslice,
                  [
                      "localType"
                  ]
              ).upper()

              classification = first_text(
                  timeslice,
                  [
                      "classification"
                  ]
              ).upper()

              polygons = extract_geometry(
                  timeslice
              )

              if not polygons:

                  polygons = extract_geometry(
                      airspace
                  )

              if not polygons:

                  failures += 1
                  continue

              geometries = []

              for outer, holes in polygons:

                  polygon = make_polygon(
                      outer,
                      holes
                  )

                  if polygon is not None:

                      geometries.append(
                          polygon
                      )

              if not geometries:

                  failures += 1
                  continue

              try:

                  geometry = unary_union(
                      geometries
                  )

              except Exception:

                  geometry = geometries[0]

              if geometry.is_empty:

                  failures += 1
                  continue

              category, colour, boundary = classify(
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification
              )

              categories[
                  category
              ] = categories.get(
                  category,
                  0
              ) + 1

              feature = {
                  "type": "Feature",
                  "geometry": json.loads(
                      json.dumps(
                          geometry.__geo_interface__
                      )
                  ),
                  "properties": {
                      "designator": designator,
                      "name": name,
                      "type": air_type,
                      "localType": local_type,
                      "classification": classification,

                      "category": category,
                      "colour": colour,
                      "boundary": boundary,

                      "stroke": colour,
                      "lineStyle": boundary,

                      "airspaceType": air_type,
                      "airspaceClass": classification,

                      "source": "NATS UK ICAO AIP Dataset",
                      "airac": AIRAC
                  }
              }

              features.append(
                  feature
              )

          print("")
          print("==========================================")
          print("AIRSPACE CONVERSION RESULT")
          print("==========================================")
          print("")
          print(
              f"Source Airspace features: {len(airspaces)}"
          )
          print(
              f"Valid geometries: {len(features)}"
          )
          print(
              f"Geometry failures: {failures}"
          )
          print("")
          print("Categories:")

          for category, count in sorted(
              categories.items()
          ):

              print(
                  f"  {category}: {count}"
              )

          # --------------------------------------------------------
          # IMPORTANT SAFETY CHECK.
          #
          # Do not destroy good existing data if the NATS parser
          # produces nothing useful.
          # --------------------------------------------------------

          if len(features) == 0:

              print("")
              print(
                  "ERROR: NATS AIP conversion produced "
                  "zero valid airspace geometries."
              )

              print(
                  "Existing uk-airspace.geojson has NOT been replaced."
              )

              sys.exit(1)

          if len(features) < 10:

              print("")
              print(
                  "ERROR: Suspiciously small airspace dataset."
