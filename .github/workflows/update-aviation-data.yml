name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find current NATS datasets
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          NATS_PAGE="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$NATS_PAGE" \
            --output /tmp/nats-index.html

          test -s /tmp/nats-index.html

          python3 <<'PY'
          import re
          from datetime import date
          from pathlib import Path

          html = Path(
              "/tmp/nats-index.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Find all dates displayed by the NATS page.
          dates = []

          for match in re.finditer(
              r"\b(\d{2})/(\d{2})/(\d{4})\b",
              html
          ):
              try:
                  d = date(
                      int(match.group(3)),
                      int(match.group(2)),
                      int(match.group(1))
                  )
              except ValueError:
                  continue

              if d <= date.today():
                  dates.append(d)

          if not dates:
              raise SystemExit(
                  "ERROR: Could not find an effective NATS date."
              )

          effective = max(dates)

          suffix = effective.strftime(
              "%Y%m%d"
          )

          print("")
          print("NATS effective dataset date:")
          print(f"  {effective}")
          print(f"  {suffix}")
          print("")

          Path(
              "/tmp/nats-date.txt"
          ).write_text(
              suffix,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # We need these exact filenames.
          # --------------------------------------------------------

          aip_xml = f"EG_AIP_DS_FULL_{suffix}.XML"
          aip_kml = f"EG_AIP_DS_FULL_{suffix}.KML"
          vrp_csv = f"EG_VRP_DS_AREA1_FULL_{suffix}.CSV"

          # --------------------------------------------------------
          # Extract every href from the page.
          # --------------------------------------------------------

          hrefs = re.findall(
              r"""href\s*=\s*["']([^"']+)["']""",
              html,
              flags=re.I
          )

          def find_link(filename):
              filename_lower = filename.lower()

              for href in hrefs:
                  if filename_lower in href.lower():
                      return href

              return None

          xml_link = find_link(aip_xml)
          kml_link = find_link(aip_kml)
          vrp_link = find_link(vrp_csv)

          print("Dataset links found directly on NATS page:")
          print("")
          print(f"  AIP XML: {xml_link}")
          print(f"  AIP KML: {kml_link}")
          print(f"  VRP CSV: {vrp_link}")
          print("")

          # --------------------------------------------------------
          # The NATS index page may not expose every file directly.
          # The search therefore also records the filenames so the
          # next stage can inspect the NATS export locations.
          # --------------------------------------------------------

          Path(
              "/tmp/nats-aip-xml-name.txt"
          ).write_text(
              aip_xml,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-kml-name.txt"
          ).write_text(
              aip_kml,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-name.txt"
          ).write_text(
              vrp_csv,
              encoding="utf-8"
          )

          if xml_link:
              Path(
                  "/tmp/nats-aip-xml-link.txt"
              ).write_text(
                  xml_link,
                  encoding="utf-8"
              )

          if kml_link:
              Path(
                  "/tmp/nats-aip-kml-link.txt"
              ).write_text(
                  kml_link,
                  encoding="utf-8"
              )

          if vrp_link:
              Path(
                  "/tmp/nats-vrp-link.txt"
              ).write_text(
                  vrp_link,
                  encoding="utf-8"
              )
          PY

      - name: Locate NATS download URLs
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path(
              "/tmp/nats-index.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          suffix = Path(
              "/tmp/nats-date.txt"
          ).read_text().strip()

          filenames = {
              "aip_xml": f"EG_AIP_DS_FULL_{suffix}.XML",
              "aip_kml": f"EG_AIP_DS_FULL_{suffix}.KML",
              "vrp": f"EG_VRP_DS_AREA1_FULL_{suffix}.CSV"
          }

          # --------------------------------------------------------
          # Collect all URLs on the page.
          # --------------------------------------------------------

          hrefs = re.findall(
              r"""href\s*=\s*["']([^"']+)["']""",
              html,
              flags=re.I
          )

          base = (
              "https://nats-uk.ead-it.com/"
          )

          urls = []

          for href in hrefs:
              urls.append(
                  urljoin(
                      base,
                      href
                  )
              )

          # --------------------------------------------------------
          # Look for exact filenames first.
          # --------------------------------------------------------

          found = {}

          for key, filename in filenames.items():

              for url in urls:

                  if filename.lower() in url.lower():
                      found[key] = url
                      break

          # --------------------------------------------------------
          # If the index page does not expose the actual files,
          # inspect the HTML around the filename for links.
          # --------------------------------------------------------

          for key, filename in filenames.items():

              if key in found:
                  continue

              pattern = re.escape(
                  filename
              )

              matches = list(
                  re.finditer(
                      pattern,
                      html,
                      flags=re.I
                  )
              )

              for match in matches:

                  start = max(
                      0,
                      match.start() - 5000
                  )

                  end = min(
                      len(html),
                      match.end() + 5000
                  )

                  nearby = html[
                      start:end
                  ]

                  nearby_hrefs = re.findall(
                      r"""href\s*=\s*["']([^"']+)["']""",
                      nearby,
                      flags=re.I
                  )

                  for href in nearby_hrefs:

                      url = urljoin(
                          base,
                          href
                      )

                      if (
                          "/cms-nats/export/" in url
                          or
                          filename.lower() in url.lower()
                      ):
                          found[key] = url
                          break

                  if key in found:
                      break

          print("")
          print("==========================================")
          print("NATS DOWNLOAD URL DISCOVERY")
          print("==========================================")
          print("")

          for key in (
              "aip_xml",
              "aip_kml",
              "vrp"
          ):

              print(
                  f"{key}:"
              )

              print(
                  f"  {found.get(key, 'NOT FOUND')}"
              )

              print("")

          # --------------------------------------------------------
          # Save anything discovered.
          # --------------------------------------------------------

          for key, url in found.items():

              Path(
                  f"/tmp/nats-{key}-url.txt"
              ).write_text(
                  url,
                  encoding="utf-8"
              )

          # --------------------------------------------------------
          # Do NOT fail yet if the page does not expose the links.
          #
          # The next step will query the NATS export directory
          # structure.
          # --------------------------------------------------------

          if not found:
              print(
                  "No direct download links were exposed by the index."
              )
          PY

      - name: Download NATS AIP data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/nats

          echo "=========================================="
          echo "Downloading NATS AIP"
          echo "=========================================="

          if [ -f /tmp/nats-aip_xml-url.txt ]; then
            XML_URL=$(cat /tmp/nats-aip_xml-url.txt)
          else
            XML_URL=""
          fi

          if [ -f /tmp/nats-aip_kml-url.txt ]; then
            KML_URL=$(cat /tmp/nats-aip_kml-url.txt)
          else
            KML_URL=""
          fi

          # --------------------------------------------------------
          # Try the exact links first.
          # --------------------------------------------------------

          if [ -n "$XML_URL" ]; then

            echo ""
            echo "AIP XML:"
            echo "$XML_URL"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --user-agent "AviMap/1.0" \
              "$XML_URL" \
              --output /tmp/nats/aip.xml || true

          fi

          if [ -n "$KML_URL" ]; then

            echo ""
            echo "AIP KML:"
            echo "$KML_URL"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --user-agent "AviMap/1.0" \
              "$KML_URL" \
              --output /tmp/nats/aip.kml || true

          fi

          # --------------------------------------------------------
          # Verify whether we actually obtained the files.
          # --------------------------------------------------------

          XML_OK=0
          KML_OK=0

          if [ -s /tmp/nats/aip.xml ]; then
            XML_OK=1
          fi

          if [ -s /tmp/nats/aip.kml ]; then
            KML_OK=1
          fi

          echo ""
          echo "AIP XML downloaded: $XML_OK"
          echo "AIP KML downloaded: $KML_OK"
          echo ""

          # --------------------------------------------------------
          # If the NATS index didn't expose the files, stop here
          # with useful diagnostics rather than guessing URLs.
          # --------------------------------------------------------

          if [ "$XML_OK" -ne 1 ] || [ "$KML_OK" -ne 1 ]; then

            echo "ERROR: NATS did not expose usable AIP download URLs."
            echo ""
            echo "The effective dataset is:"
            cat /tmp/nats-date.txt
            echo ""
            echo "Expected:"
            cat /tmp/nats-aip-xml-name.txt
            cat /tmp/nats-aip-kml-name.txt
            echo ""
            echo "This is intentional: the workflow will not invent"
            echo "an NATS download path and risk downloading the wrong data."
            exit 1

          fi

          echo "AIP download successful."

      - name: Download NATS VRP data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/nats

          if [ -f /tmp/nats-vrp-url.txt ]; then
            VRP_URL=$(cat /tmp/nats-vrp-url.txt)
          else
            echo "ERROR: NATS VRP download URL was not discovered."
            exit 1
          fi

          echo "=========================================="
          echo "Downloading NATS VRP"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats/vrp-download

          test -s /tmp/nats/vrp-download

          mkdir -p /tmp/nats/vrp-extract

          if unzip -t \
            /tmp/nats/vrp-download \
            >/dev/null 2>&1
          then

            unzip \
              -o \
              /tmp/nats/vrp-download \
              -d /tmp/nats/vrp-extract

            VRP_CSV=$(
              find \
                /tmp/nats/vrp-extract \
                -type f \
                -iname "*.csv" \
                | head -n 1 || true
            )

            if [ -z "$VRP_CSV" ]; then
              echo "ERROR: No CSV found in VRP archive."
              exit 1
            fi

            cp \
              "$VRP_CSV" \
              /tmp/nats/vrps.csv

          else

            cp \
              /tmp/nats/vrp-download \
              /tmp/nats/vrps.csv

          fi

          test -s /tmp/nats/vrps.csv

          echo ""
          echo "VRP download successful."
          wc -l /tmp/nats/vrps.csv

      - name: Convert NATS airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse(
              "/tmp/nats/aip.kml"
          )

          root = tree.getroot()

          def local(tag):
              return tag.split(
                  "}",
                  1
              )[-1].lower()

          def text(element):
              return " ".join(
                  x.strip()
                  for x in element.itertext()
                  if x.strip()
              )

          def parse_coords(value):
              result = []

              for token in re.split(
                  r"\s+",
                  value.strip()
              ):

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:
                      lon = float(parts[0])
                      lat = float(parts[1])
                  except ValueError:
                      continue

                  if (
                      -180 <= lon <= 180
                      and
                      -90 <= lat <= 90
                  ):
                      result.append([
                          lon,
                          lat
                      ])

              return result

          def classify(value):
              value = value.upper()

              if re.search(
                  r"\b(PROHIBITED|RESTRICTED|DANGER)\b",
                  value
              ):
                  return "PRD"

              if re.search(
                  r"\bATZ\b",
                  value
              ):
                  return "ATZ"

              if re.search(
                  r"\bTMZ\b",
                  value
              ):
                  return "TMZ"

              if re.search(
                  r"\bMATZ\b",
                  value
              ):
                  return "MATZ"

              if re.search(
                  r"\bRMZ\b",
                  value
              ):
                  return "RMZ"

              if re.search(
                  r"\bCLASS\s*A\b",
                  value
              ):
                  return "CLASS_A"

              if re.search(
                  r"\bCLASS\s*[BCD]\b",
                  value
              ):
                  return "CONTROLLED"

              if re.search(
                  r"\b(CTA|CTR|TMA|CTZ|CONTROLLED)\b",
                  value
              ):
                  return "CONTROLLED"

              return "OTHER"

          features = []

          for placemark in root.iter():

              if local(
                  placemark.tag
              ) != "placemark":
                  continue

              name = ""
              description = ""

              for element in placemark.iter():

                  tag = local(
                      element.tag
                  )

                  if (
                      tag == "name"
                      and
                      not name
                  ):
                      name = text(
                          element
                      )

                  if (
                      tag == "description"
                      and
                      not description
                  ):
                      description = text(
                          element
                      )

              searchable = text(
                  placemark
              )

              category = classify(
                  searchable
              )

              rings = []

              for element in placemark.iter():

                  if local(
                      element.tag
                  ) != "coordinates":
                      continue

                  coords = parse_coords(
                      text(element)
                  )

                  if len(coords) >= 3:

                      if coords[0] != coords[-1]:
                          coords.append(
                              coords[0]
                          )

                      rings.append(
                          coords
                      )

              if not rings:
                  continue

              features.append({
                  "type": "Feature",
                  "properties": {
                      "name": (
                          name
                          or
                          "NATS airspace"
                      ),
                      "description": description,
                      "category": category,
                      "source": "NATS UK ICAO AIP Dataset"
                  },
                  "geometry": {
                      "type": "Polygon",
                      "coordinates": rings
                  }
              })

          if not features:
              raise SystemExit(
                  "ERROR: NATS AIP produced zero airspace polygons."
              )

          Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              f"Airspace polygons: {len(features)}"
          )
          PY

      - name: Convert NATS VRPs to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          lookup = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  key = norm(name)

                  if key in lookup:
                      return lookup[key]

              for key, original in lookup.items():

                  for name in names:

                      wanted = norm(name)

                      if (
                          wanted in key
                          or
                          key in wanted
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify VRP coordinates."
              )

          def parse_coord(
              value,
              latitude
          ):
              if value is None:
                  return None

              value = str(
                  value
              ).strip()

              if not value:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  value,
                  flags=re.I
              )

              if match:

                  hemisphere = match.group(
                      1
                  ).upper()

                  value = value[
                      :match.start()
                  ].strip()

              try:

                  number = float(
                      value.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          number = -abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              compact = (
                  value
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              match = re.fullmatch(
                  r"(\d+)(?:\.(\d+))?",
                  compact
              )

              if not match:
                  return None

              integer_part = match.group(
                  1
              )

              decimal_part = (
                  match.group(2)
                  or
                  ""
              )

              try:

                  if latitude:

                      if len(integer_part) < 6:
                          return None

                      degrees = int(
                          integer_part[:2]
                      )

                      minutes = int(
                          integer_part[2:4]
                      )

                      seconds_text = (
                          integer_part[4:]
                      )

                  else:

                      if len(integer_part) < 7:
                          return None

                      degrees = int(
                          integer_part[:3]
                      )

                      minutes = int(
                          integer_part[3:5]
                      )

                      seconds_text = (
                          integer_part[5:]
                      )

                  if decimal_part:
                      seconds_text += (
                          "."
                          + decimal_part
                      )

                  seconds = float(
                      seconds_text
                  )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if result > limit:
                      return None

                  if hemisphere in (
                      "S",
                      "W"
                  ):
                      result = -result

                  return result

              except ValueError:
                  return None

          features = []

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(lat_field),
                  True
              )

              lon = parse_coord(
                  row.get(lon_field),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              if not name:
                  name = f"VRP {index}"

              properties = {
                  str(k): v
                  for k, v in row.items()
                  if k
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          lon,
                          lat
                      ]
                  }
              })

          print(
              f"CSV records: {len(rows)}"
          )

          print(
              f"Valid VRPs: {len(features)}"
          )

          if not features:
              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL VALIDATION"
          echo "=========================================="
          echo ""
          echo "Airspaces: $AIRSPACE_COUNT"
          echo "VRPs:      $VRP_COUNT"
          echo ""

          if [ "$AIRSPACE_COUNT" -eq 0 ]; then
            echo "ERROR: Airspace dataset is empty."
            exit 1
          fi

          if [ "$VRP_COUNT" -eq 0 ]; then
            echo "ERROR: VRP dataset is empty."
            exit 1
          fi

          echo "Validation successful."

      - name: Install validated data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          Source: NATS UK Digital Datasets.

          Airspace:
          - UK ICAO AIP Dataset

          Reporting points:
          - Visual Reference Points (VRP) List

          Data is validated before being committed.
          EOF

      - name: Commit updated aviation data
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push
          fi
