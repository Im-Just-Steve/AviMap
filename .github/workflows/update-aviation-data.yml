name: Inspect NATS dataset download mechanism

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:

      - name: Inspect NATS dataset page
        shell: bash
        run: |
          set -euo pipefail

          URL="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          echo "=========================================="
          echo "NATS DATASET PAGE INSPECTION"
          echo "=========================================="
          echo ""
          echo "URL:"
          echo "$URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "$URL" \
            --output /tmp/nats.html

          echo "Downloaded page:"
          wc -c /tmp/nats.html

          echo ""
          echo "=========================================="
          echo "AIP REFERENCES"
          echo "=========================================="

          grep \
            -in \
            -E \
            'UK ICAO AIP|EG_AIP|AIP XML|AIP KML|download' \
            /tmp/nats.html \
            | head -200 \
            || true

          echo ""
          echo "=========================================="
          echo "FORM ELEMENTS"
          echo "=========================================="

          grep \
            -in \
            -E \
            '<form|</form>|action=|method=' \
            /tmp/nats.html \
            | head -200 \
            || true

          echo ""
          echo "=========================================="
          echo "SCRIPT REFERENCES"
          echo "=========================================="

          grep \
            -oiE \
            '<script[^>]+src=["'\''][^"'\'']+["'\'']' \
            /tmp/nats.html \
            | head -200 \
            || true

          echo ""
          echo "=========================================="
          echo "DATA / DOWNLOAD ATTRIBUTES"
          echo "=========================================="

          grep \
            -oiE \
            '.{0,150}(download|dataset|aip|kml|xml|api).{0,300}' \
            /tmp/nats.html \
            | head -300 \
            || true

          echo ""
          echo "=========================================="
          echo "FULL AIP HTML CONTEXT"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          patterns = [
              "UK ICAO AIP",
              "EG_AIP",
              "AIP XML",
              "AIP KML",
              "ICAO AIP"
          ]

          for pattern in patterns:

              print("")
              print("=" * 70)
              print(f"CONTEXT FOR: {pattern}")
              print("=" * 70)

              found = False

              for match in re.finditer(
                  pattern,
                  html,
                  flags=re.I
              ):

                  found = True

                  start = max(
                      0,
                      match.start() - 1500
                  )

                  end = min(
                      len(html),
                      match.end() + 3000
                  )

                  print(
                      html[start:end]
                  )

                  print("")
                  print("-" * 70)

              if not found:
                  print("NOT FOUND")

          PY

          echo ""
          echo "=========================================="
          echo "END INSPECTION"
          echo "=========================================="
