name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3


      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin


          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()


          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []


              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []


              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:
                      self.text.append(
                          data
                      )


              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )


          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )


          def is_aip(
              url,
              text,
              stamp
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGAIPDSFULL{stamp}" in value
                  or
                  (
                      stamp in value
                      and
                      "AIP" in value
                      and
                      (
                          "XML" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          def is_vrp(
              url,
              text,
              stamp
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGVRPDSAREA1FULL{stamp}" in value
                  or
                  (
                      stamp in value
                      and
                      "VRP" in value
                      and
                      (
                          "CSV" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          print("==========================================")
          print("FINDING CURRENT NATS DATASETS")
          print("==========================================")


          checklist_body = None
          checklist_url = None


          for offset in range(90):

              candidate_date = (
                  today -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.html",

                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.HTML"
              ]


              for candidate in candidates:

                  try:
                      body, _ = fetch(
                          candidate
                      )

                  except Exception:
                      continue


                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )


                  if (
                      "EG_AIP_DS_FULL_" in text
                      and
                      "EG_VRP_DS_AREA1_FULL_" in text
                  ):

                      checklist_body = body
                      checklist_url = candidate

                      break


              if checklist_body is not None:
                  break


          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find current NATS Dataset Checklist."
              )


          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )


          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )


          aip_dates = []

          for stamp in aip_matches:

              try:
                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:
                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current NATS AIP AIRAC found."
              )


          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda x: x[0]
          )


          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )


          vrp_dates = []

          for stamp in vrp_matches:

              try:
                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:
                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current NATS VRP AIRAC found."
              )


          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda x: x[0]
          )


          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )


          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Dataset index unavailable:",
                  exc
              )

              index_links = []


          aip_links = []
          vrp_links = []
          seen = set()


          for url, text in (
              checklist_links +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)


              if is_aip(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )


              if is_vrp(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )


          # Follow dataset pages looking for the actual archive.

          for url, text in list(
              aip_links
          ):

              lower = url.lower()

              if not (
                  lower.endswith(
                      ".html"
                  )
                  or
                  lower.endswith(
                      ".htm"
                  )
                  or
                  lower.endswith("/")
              ):
                  continue


              try:

                  body, _ = fetch(
                      url
                  )

                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          aip_links.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )

              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )


          def unique(
              links
          ):

              output = []
              seen_urls = set()

              for url, text in links:

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  output.append(
                      (
                          url,
                          text
                      )
                  )

              return output


          aip_links = unique(
              aip_links
          )

          vrp_links = unique(
              vrp_links
          )


          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "Checklist:",
              checklist_url
          )

          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "VRP AIRAC:",
              vrp_stamp
          )

          print("")
          print("AIP candidates:")

          for url, text in aip_links:
              print(
                  text,
                  "=>",
                  url
              )

          print("")
          print("VRP candidates:")

          for url, text in vrp_links:
              print(
                  text,
                  "=>",
                  url
              )


          if not aip_links:
              raise SystemExit(
                  "ERROR: No NATS AIP download candidate found."
              )


          if not vrp_links:
              raise SystemExit(
                  "ERROR: No NATS VRP download candidate found."
              )

          PY


      # ============================================================
      # DOWNLOAD AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip
          mkdir -p /tmp/nats-aip

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "Trying:"
            echo "${URL}"


            rm -f /tmp/nats-aip-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-aip-download


            if file /tmp/nats-aip-download |
              grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip
              mkdir -p /tmp/nats-aip


              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip


              echo ""
              echo "Archive contents:"

              find \
                /tmp/nats-aip \
                -type f \
                -print


              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )


              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS AIP download failed."

            exit 1

          fi


          echo ""
          echo "AIP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-aip.xml


          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY


      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-vrp
          mkdir -p /tmp/nats-vrp

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "Trying:"
            echo "${URL}"


            rm -f /tmp/nats-vrp-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-vrp-download


            if file /tmp/nats-vrp-download |
              grep -qi "Zip archive"; then

              rm -rf /tmp/nats-vrp
              mkdir -p /tmp/nats-vrp


              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp


              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )


              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-vrp-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS VRP download failed."

            exit 1

          fi


          echo ""
          echo "VRP source:"
          echo "${FOUND}"


      # ============================================================
      # CONVERT NATS AIXM
      #
      # NO FILTERING.
      #
      # ALL NATS AIRSPACE IS RETAINED.
      #
      # Geometry handling:
      #
      # 1. Direct PolygonPatch
      # 2. Referenced Surface
      # 3. Referenced Curve
      # 4. CircleByCenterPoint
      # 5. ArcByCenterPoint
      # 6. Multiple geometry components
      #
      # Crucially, disconnected segments are NEVER artificially
      # joined together.
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data


          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET

          from collections import Counter
          from pathlib import Path


          XML_FILE = "/tmp/uk-aip.xml"

          OUTPUT_FILE = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          print("==========================================")
          print("PARSING NATS AIXM")
          print("==========================================")
          print("")
          print("AIRAC:", AIRAC)
          print("XML:", XML_FILE)


          tree = ET.parse(
              XML_FILE
          )

          root = tree.getroot()


          print("XML parsed successfully.")


          # ========================================================
          # XML HELPERS
          # ========================================================

          def local(
              tag
          ):

              return tag.rsplit(
                  "}",
                  1
              )[-1]


          def attr(
              element,
              name
          ):

              if element is None:
                  return None

              wanted = name.lower()


              for key, value in element.attrib.items():

                  if local(
                      key
                  ).lower() == wanted:

                      return value


              return None


          parent_map = {}


          for parent in root.iter():

              for child in parent:

                  parent_map[
                      child
                  ] = parent


          # ========================================================
          # REFERENCE INDEX
          # ========================================================

          id_index = {}


          def add_identifier(
              value,
              element
          ):

              if not value:
                  return


              value = value.strip()


              if not value:
                  return


              id_index[
                  value
              ] = element


              id_index[
                  value.lstrip("#")
              ] = element


              if "#" in value:

                  id_index[
                      value.rsplit(
                          "#",
                          1
                      )[-1]
                  ] = element


              if value.startswith(
                  "urn:uuid:"
              ):

                  id_index[
                      value[
                          9:
                      ]
                  ] = element


          for element in root.iter():

              for key, value in element.attrib.items():

                  lname = local(
                      key
                  ).lower()


                  if lname in {
                      "id",
                      "uuid",
                      "identifier",
                      "href"
                  }:

                      add_identifier(
                          value,
                          element
                      )


          print(
              "Indexed XML objects:",
              len(id_index)
          )


          def resolve(
              value
          ):

              if not value:
                  return None


              candidates = [
                  value,
                  value.lstrip("#")
              ]


              if "#" in value:

                  candidates.append(
                      value.rsplit(
                          "#",
                          1
                      )[-1]
                  )


              if value.startswith(
                  "urn:uuid:"
              ):

                  candidates.append(
                      value[9:]
                  )


              for candidate in candidates:

                  if candidate in id_index:

                      return id_index[
                          candidate
                      ]


              return None


          def href(
              element
          ):

              return attr(
                  element,
                  "href"
              )


          def target(
              element
          ):

              return resolve(
                  href(
                      element
                  )
              )


          # ========================================================
          # REACHABLE OBJECTS
          # ========================================================

          def reachable(
              start
          ):

              queue = [
                  start
              ]

              output = []

              seen = set()


              while queue:

                  current = queue.pop()


                  if current is None:
                      continue


                  marker = id(
                      current
                  )


                  if marker in seen:
                      continue


                  seen.add(
                      marker
                  )

                  output.append(
                      current
                  )


                  linked = target(
                      current
                  )


                  if linked is not None:

                      queue.append(
                          linked
                      )


                  for child in current.iter():

                      linked = target(
                          child
                      )


                      if linked is not None:

                          queue.append(
                              linked
                          )


              return output


          # ========================================================
          # COORDINATES
          # ========================================================

          def numbers(
              text
          ):

              if not text:
                  return []


              output = []


              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue


                  try:

                      output.append(
                          float(
                              token
                          )
                      )

                  except ValueError:
                      pass


              return output


          def srs(
              element
          ):

              current = element


              for _ in range(
                  50
              ):

                  if current is None:
                      break


                  value = attr(
                      current,
                      "srsName"
                  )


                  if value:
                      return value


                  current = parent_map.get(
                      current
                  )


              return "EPSG:4326"


          def xy(
              first,
              second,
              srs_name
          ):

              name = (
                  srs_name
                  or
                  "EPSG:4326"
              ).upper()


              # AIXM commonly supplies latitude longitude.
              # GeoJSON requires longitude latitude.

              if (
                  "4326" in name
                  and
                  "CRS84" not in name
              ):

                  return [
                      second,
                      first
                  ]


              return [
                  first,
                  second
              ]


          def positions(
              element
          ):

              output = []


              for node in element.iter():

                  name = local(
                      node.tag
                  )


                  if name == "posList":

                      values = numbers(
                          node.text
                      )


                      dimension = (
                          int(
                              attr(
                                  node,
                                  "srsDimension"
                              )
                              or
                              "2"
                          )
                      )


                      dimension = max(
                          2,
                          dimension
                      )


                      for i in range(
                          0,
                          len(values),
                          dimension
                      ):

                          part = values[
                              i:
                              i + dimension
                          ]


                          if len(
                              part
                          ) >= 2:

                              output.append(
                                  xy(
                                      part[0],
                                      part[1],
                                      srs(
                                          node
                                      )
                                  )
                              )


                  elif name == "pos":

                      values = numbers(
                          node.text
                      )


                      if len(
                          values
                      ) >= 2:

                          output.append(
                              xy(
                                  values[0],
                                  values[1],
                                  srs(
                                      node
                                  )
                              )
                          )


                  elif name == "coordinates":

                      if not node.text:
                          continue


                      for token in re.split(
                          r"\s+",
                          node.text.strip()
                      ):

                          bits = token.split(
                              ","
                          )


                          if len(
                              bits
                          ) < 2:
                              continue


                          try:

                              first = float(
                                  bits[0]
                              )

                              second = float(
                                  bits[1]
                              )

                          except ValueError:

                              continue


                          output.append(
                              xy(
                                  first,
                                  second,
                                  srs(
                                      node
                                  )
                              )
                          )


              return output


          # ========================================================
          # CIRCLE / ARC
          # ========================================================

          def radius_metres(
              element
          ):

              for node in element.iter():

                  if local(
                      node.tag
                  ) != "radius":

                      continue


                  if not node.text:
                      return None


                  try:

                      radius = float(
                          node.text.strip()
                      )

                  except ValueError:

                      return None


                  unit = (
                      attr(
                          node,
                          "uom"
                      )
                      or
                      "m"
                  ).lower()


                  if unit in {
                      "km",
                      "kilometre",
                      "kilometres",
                      "kilometer",
                      "kilometers"
                  }:

                      radius *= 1000.0


                  elif unit in {
                      "nm",
                      "nmi",
                      "[nmi_i]"
                  }:

                      radius *= 1852.0


                  return radius


              return None


          def angle_value(
              element,
              name
          ):

              for node in element.iter():

                  if local(
                      node.tag
                  ).lower() == name.lower():

                      if node.text:

                          try:

                              return float(
                                  node.text.strip()
                              )

                          except ValueError:

                              pass


              return None


          def circle(
              element
          ):

              centre = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":

                      continue


                  points = positions(
                      node
                  )


                  if points:

                      centre = points[0]

                      break


              if centre is None:
                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:
                  return []


              latitude = centre[1]
              longitude = centre[0]


              result = []


              steps = 144


              for i in range(
                  steps + 1
              ):

                  bearing = (
                      360.0
                      *
                      i
                      /
                      steps
                  )


                  radians = math.radians(
                      bearing
                  )


                  lat = (
                      latitude
                      +
                      radius
                      *
                      math.cos(
                          radians
                      )
                      /
                      111320.0
                  )


                  metres_per_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  latitude
                              )
                          )
                      )
                  )


                  lon = (
                      longitude
                      +
                      radius
                      *
                      math.sin(
                          radians
                      )
                      /
                      metres_per_lon
                  )


                  result.append(
                      [
                          lon,
                          lat
                      ]
                  )


              return result


          def arc(
              element
          ):

              centre = None


              for node in element.iter():

                  if local(
                      node.tag
                  ) != "pos":
                      continue


                  points = positions(
                      node
                  )


                  if points:

                      centre = points[0]

                      break


              if centre is None:
                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:
                  return []


              start = angle_value(
                  element,
                  "startAngle"
              )


              end = angle_value(
                  element,
                  "endAngle"
              )


              if (
                  start is None
                  or
                  end is None
              ):

                  return []


              sweep = end - start


              if abs(
                  sweep
              ) < 0.000001:

                  sweep = 360.0


              steps = max(
                  8,
                  min(
                      720,
                      int(
                          abs(
                              sweep
                          )
                          /
                          2.0
                      )
                  )
              )


              latitude = centre[1]
              longitude = centre[0]


              result = []


              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i
                      /
                      steps
                  )


                  bearing = (
                      start
                      +
                      sweep
                      *
                      fraction
                  )


                  radians = math.radians(
                      bearing
                  )


                  lat = (
                      latitude
                      +
                      radius
                      *
                      math.cos(
                          radians
                      )
                      /
                      111320.0
                  )


                  metres_per_lon = (
                      111320.0
                      *
                      max(
                          0.01,
                          math.cos(
                              math.radians(
                                  latitude
                              )
                          )
                      )
                  )


                  lon = (
                      longitude
                      +
                      radius
                      *
                      math.sin(
                          radians
                      )
                      /
                      metres_per_lon
                  )


                  result.append(
                      [
                          lon,
                          lat
                      ]
                  )


              return result


          # ========================================================
          # GEOMETRY SEGMENT EXTRACTION
          # ========================================================

          def segment(
              element
          ):

              if element is None:
                  return []


              name = local(
                  element.tag
              )


              if name in {
                  "CircleByCenterPoint",
                  "Circle"
              }:

                  return circle(
                      element
                  )


              if name in {
                  "ArcByCenterPoint"
              }:

                  return arc(
                      element
                  )


              points = positions(
                  element
              )


              if len(
                  points
              ) >= 2:

                  return points


              # Search referenced/contained curve.

              for child in element.iter():

                  child_name = local(
                      child.tag
                  )


                  if child_name in {
                      "CircleByCenterPoint",
                      "Circle",
                      "ArcByCenterPoint",
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcString",
                      "ArcStringByBulge"
                  }:

                      result = segment(
                          child
                      )


                      if len(
                          result
                      ) >= 2:

                          return result


              return []


          # ========================================================
          # SAFE SEGMENT JOINING
          #
          # NEVER bridge a gap.
          # ========================================================

          def same_point(
              a,
              b,
              tolerance=1e-7
          ):

              if (
                  a is None
                  or
                  b is None
              ):

                  return False


              return (
                  abs(
                      a[0] - b[0]
                  )
                  <= tolerance
                  and
                  abs(
                      a[1] - b[1]
                  )
                  <= tolerance
              )


          def join_segments(
              segments
          ):

              remaining = [
                  list(
                      segment
                  )
                  for segment in segments
                  if len(
                      segment
                  ) >= 2
              ]


              if not remaining:
                  return []


              rings = []


              while remaining:

                  current = remaining.pop(
                      0
                  )


                  changed = True


                  while changed:

                      changed = False


                      for i, candidate in enumerate(
                          remaining
                      ):

                          if same_point(
                              current[-1],
                              candidate[0]
                          ):

                              current.extend(
                                  candidate[1:]
                              )

                              remaining.pop(
                                  i
                              )

                              changed = True

                              break


                          if same_point(
                              current[-1],
                              candidate[-1]
                          ):

                              candidate = list(
                                  reversed(
                                      candidate
                                  )
                              )

                              current.extend(
                                  candidate[1:]
                              )

                              remaining.pop(
                                  i
                              )

                              changed = True

                              break


                          if same_point(
                              current[0],
                              candidate[-1]
                          ):

                              current = (
                                  candidate[:-1]
                                  +
                                  current
                              )

                              remaining.pop(
                                  i
                              )

                              changed = True

                              break


                          if same_point(
                              current[0],
                              candidate[0]
                          ):

                              candidate = list(
                                  reversed(
                                      candidate
                                  )
                              )

                              current = (
                                  candidate[:-1]
                                  +
                                  current
                              )

                              remaining.pop(
                                  i
                              )

                              changed = True

                              break


                  if len(
                      current
                  ) >= 3:

                      if same_point(
                          current[0],
                          current[-1]
                      ):

                          rings.append(
                              current
                          )

                      else:

                          # Do NOT invent a closing line.
                          print(
                              "WARNING: Discarding open ring "
                              "rather than creating artificial geometry."
                          )

                  else:

                      print(
                          "WARNING: Discarding geometry "
                          "with fewer than three points."
                      )


              return rings


          # ========================================================
          # RING
          # ========================================================

          def ring(
              ring_element
          ):

              # Direct linear ring.

              direct = positions(
                  ring_element
              )


              if len(
                  direct
              ) >= 4:

                  if not same_point(
                      direct[0],
                      direct[-1]
                  ):

                      direct.append(
                          direct[0]
                      )


                  return [
                      direct
                  ]


              segments = []


              # Explicit curve members.

              for node in ring_element.iter():

                  if local(
                      node.tag
                  ) != "curveMember":

                      continue


                  linked = target(
                      node
                  )


                  if linked is not None:

                      points = segment(
                          linked
                      )


                      if len(
                          points
                      ) >= 2:

                          segments.append(
                              points
                          )

                      continue


                  # Inline curve.

                  for child in node:

                      points = segment(
                          child
                      )


                      if len(
                          points
                      ) >= 2:

                          segments.append(
                              points
                          )


              return join_segments(
                  segments
              )


          # ========================================================
          # PATCH
          # ========================================================

          def patch_geometry(
              patch
          ):

              outer_rings = []


              for node in patch.iter():

                  if local(
                      node.tag
                  ) != "exterior":

                      continue


                  for child in node.iter():

                      if local(
                          child.tag
                      ) in {
                          "LinearRing",
                          "Ring"
                      }:

                          outer_rings.extend(
                              ring(
                                  child
                              )
                          )

                          break


              if not outer_rings:
                  return []


              # A patch normally has one exterior. Keep every
              # successfully reconstructed exterior separately.

              polygons = []


              for outer in outer_rings:

                  if len(
                      outer
                  ) < 4:
                      continue


                  holes = []


                  for node in patch.iter():

                      if local(
                          node.tag
                      ) != "interior":

                          continue


                      for child in node.iter():

                          if local(
                              child.tag
                          ) in {
                              "LinearRing",
                              "Ring"
                          }:

                              hole_rings = ring(
                                  child
                              )


                              if hole_rings:

                                  holes.append(
                                      hole_rings[0]
                                  )

                              break


                  polygons.append(
                      [
                          outer
                      ] +
                      holes
                  )


              return polygons


          # ========================================================
          # EXTRACT DIRECT GEOMETRY OBJECTS
          #
          # This catches MATZ-style circular geometry that isn't
          # necessarily wrapped in a PolygonPatch.
          # ========================================================

          def direct_geometry(
              object_node
          ):

              geometries = []


              # PolygonPatch first.

              patches = [
                  node
                  for node in object_node.iter()
                  if local(
                      node.tag
                  ) == "PolygonPatch"
              ]


              for patch in patches:

                  geometries.extend(
                      patch_geometry(
                          patch
                      )
                  )


              if geometries:
                  return geometries


              # Direct circle.

              for node in object_node.iter():

                  if local(
                      node.tag
                  ) in {
                      "CircleByCenterPoint",
                      "Circle"
                  }:

                      points = circle(
                          node
                      )


                      if len(
                          points
                      ) >= 4:

                          geometries.append(
                              [
                                  points
                              ]
                          )


              if geometries:
                  return geometries


              # Direct arc is not by itself a polygon. We only use
              # it when it is a complete closed arc.

              for node in object_node.iter():

                  if local(
                      node.tag
                  ) == "ArcByCenterPoint":

                      points = arc(
                          node
                      )


                      if (
                          len(
                              points
                          ) >= 4
                          and
                          same_point(
                              points[0],
                              points[-1]
                          )
                      ):

                          geometries.append(
                              [
                                  points
                              ]
                          )


              return geometries


          # ========================================================
          # AIRSPACE GEOMETRY
          # ========================================================

          def airspace_geometry(
              airspace
          ):

              objects = reachable(
                  airspace
              )


              polygons = []


              # ----------------------------------------------------
              # Process geometry components individually.
              #
              # This is important for MATZ and other compound
              # airspaces.
              # ----------------------------------------------------

              for object_node in objects:

                  name = local(
                      object_node.tag
                  )


                  if name not in {
                      "Surface",
                      "CompositeSurface",
                      "AirspaceVolume",
                      "AirspaceGeometryComponent",
                      "horizontalProjection"
                  }:

                      continue


                  geometries = direct_geometry(
                      object_node
                  )


                  polygons.extend(
                      geometries
                  )


              # ----------------------------------------------------
              # Also inspect every reachable object as a fallback.
              # ----------------------------------------------------

              if not polygons:

                  for object_node in objects:

                      geometries = direct_geometry(
                          object_node
                      )


                      polygons.extend(
                          geometries
                      )


              # Deduplicate exact polygons.

              unique = []
              seen = set()


              for polygon in polygons:

                  if not polygon:
                      continue


                  key = json.dumps(
                      polygon,
                      sort_keys=True,
                      separators=(
                          ",",
                          ":"
                      )
                  )


                  if key in seen:
                      continue


                  seen.add(
                      key
                  )

                  unique.append(
                      polygon
                  )


              if not unique:
                  return None


              if len(
                  unique
              ) == 1:

                  return {
                      "type":
                          "Polygon",

                      "coordinates":
                          unique[0]
                  }


              return {
                  "type":
                      "MultiPolygon",

                  "coordinates":
                      unique
              }


          # ========================================================
          # AIRSPACE METADATA
          # ========================================================

          def text_value(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      value = node.text.strip()


                      if value:
                          return value


              return ""


          # ========================================================
          # FIND AIRSPACE
          # ========================================================

          airspaces = [
              element
              for element in root.iter()
              if local(
                  element.tag
              ) == "Airspace"
          ]


          print("")
          print("==========================================")
          print("NATS AIRSPACE EXTRACTION")
          print("==========================================")
          print("")
          print(
              "Raw NATS Airspace features:",
              len(airspaces)
          )


          if not airspaces:

              raise SystemExit(
                  "ERROR: No NATS Airspace features found."
              )


          features = []


          geometry_success = 0
          geometry_failure = 0


          type_counts = Counter()
          type_geometry = Counter()


          special_counts = Counter()
          special_geometry = Counter()


          # ========================================================
          # PROCESS EVERYTHING
          # ========================================================

          for index, airspace in enumerate(
              airspaces,
              start=1
          ):

              designator = text_value(
                  airspace,
                  {
                      "designator"
                  }
              )


              name = text_value(
                  airspace,
                  {
                      "name"
                  }
              )


              airspace_type = text_value(
                  airspace,
                  {
                      "type"
                  }
              )


              local_type = text_value(
                  airspace,
                  {
                      "localType"
                  }
              )


              airspace_class = text_value(
                  airspace,
                  {
                      "class"
                  }
              )


              identifier = (
                  attr(
                      airspace,
                      "id"
                  )
                  or
                  attr(
                      airspace,
                      "uuid"
                  )
                  or
                  ""
              )


              geometry = airspace_geometry(
                  airspace
              )


              key = (
                  local_type
                  or
                  airspace_type
                  or
                  airspace_class
                  or
                  "(blank)"
              )


              type_counts[
                  key
              ] += 1


              if geometry is not None:

                  geometry_success += 1

                  type_geometry[
                      key
                  ] += 1

              else:

                  geometry_failure += 1


              combined = (
                  f"{airspace_type} "
                  f"{local_type} "
                  f"{designator} "
                  f"{name}"
              ).upper()


              for special in (
                  "ATZ",
                  "MATZ",
                  "RMZ",
                  "TMZ"
              ):

                  if special in combined:

                      special_counts[
                          special
                      ] += 1


                      if geometry is not None:

                          special_geometry[
                              special
                          ] += 1


              properties = {

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC,

                  "nats_id":
                      identifier,

                  "designator":
                      designator,

                  "name":
                      (
                          name
                          or
                          designator
                          or
                          identifier
                          or
                          "NATS Airspace"
                      ),

                  "nats_type":
                      airspace_type,

                  "nats_local_type":
                      local_type,

                  "nats_class":
                      airspace_class,

                  "geometry_available":
                      geometry is not None
              }


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )


              # Detailed diagnostics for special zones.

              if any(
                  special in combined
                  for special in (
                      "ATZ",
                      "MATZ",
                      "RMZ",
                      "TMZ"
                  )
              ):

                  print("")
                  print(
                      "SPECIAL AIRSPACE"
                  )

                  print(
                      "Index:",
                      index
                  )

                  print(
                      "Designator:",
                      designator
                  )

                  print(
                      "Name:",
                      name
                  )

                  print(
                      "Type:",
                      airspace_type
                  )

                  print(
                      "Local type:",
                      local_type
                  )

                  print(
                      "Geometry:",
                      (
                          "YES"
                          if geometry is not None
                          else
                          "NO"
                      )
                  )


          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }


          Path(
              OUTPUT_FILE
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          # ========================================================
          # SUMMARY
          # ========================================================

          print("")
          print("==========================================")
          print("NATS AIRSPACE RESULT")
          print("==========================================")
          print("")
          print(
              "Raw NATS Airspace:",
              len(airspaces)
          )

          print(
              "GeoJSON features:",
              len(features)
          )

          print(
              "Valid geometries:",
              geometry_success
          )

          print(
              "Geometry failures:",
              geometry_failure
          )


          print("")
          print("SPECIAL AIRSPACE")
          print("------------------------------------------")


          for special in (
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ):

              print(
                  f"{special}: "
                  f"{special_counts[special]} total / "
                  f"{special_geometry[special]} with geometry"
              )


          print("")
          print("AIRSPACE TYPES")
          print("------------------------------------------")


          for key, count in type_counts.most_common():

              print(
                  f"{key}: "
                  f"{count} total / "
                  f"{type_geometry[key]} geometry"
              )


          print("")
          print(
              "GeoJSON:",
              OUTPUT_FILE
          )


          print("")
          print(
              "NO AIRSPACE FILTERING HAS BEEN APPLIED."
          )

          print(
              "ALL NATS AIRSPACE FEATURES ARE RETAINED."
          )


          # --------------------------------------------------------
          # SAFETY CHECK
          # --------------------------------------------------------

          if geometry_success == 0:

              raise SystemExit(
                  "ERROR: NATS conversion produced zero valid geometries."
              )

          PY


      # ============================================================
      # CONVERT REPORTING POINTS
      # ============================================================

      - name: Convert NATS reporting points to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re

          from pathlib import Path


          source = Path(
              "/tmp/uk-vrps.csv"
          )


          output = Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          )


          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )


          try:

              dialect = csv.Sniffer().sniff(
                  raw[:20000],
                  delimiters=",;\t|"
              )

          except csv.Error:

              dialect = csv.excel


          reader = csv.DictReader(
              raw.splitlines(),
              dialect=dialect
          )


          rows = list(
              reader
          )


          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains no records."
              )


          fields = [
              field
              for field in rows[0].keys()
              if field is not None
          ]


          def normalise(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )


          field_map = {
              normalise(field):
                  field
              for field in fields
          }


          def find_field(
              candidates
          ):

              for candidate in candidates:

                  key = normalise(
                      candidate
                  )

                  if key in field_map:

                      return field_map[
                          key
                      ]


              for key, original in field_map.items():

                  for candidate in candidates:

                      if normalise(
                          candidate
                      ) in key:

                          return original


              return None


          latitude_field = find_field(
              [
                  "Latitude",
                  "Lat"
              ]
          )


          longitude_field = find_field(
              [
                  "Longitude",
                  "Lon",
                  "Long"
              ]
          )


          if (
              latitude_field is None
              or
              longitude_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP coordinates."
              )


          name_field = find_field(
              [
                  "VRP name",
                  "Name",
                  "Designator",
                  "Identifier",
                  "VRP"
              ]
          )


          def coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None


              text = str(
                  value
              ).strip()


              if not text:
                  return None


              hemisphere = None


              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )


              if match:

                  hemisphere = match.group(
                      1
                  ).upper()

                  text = text[
                      :match.start()
                  ].strip()


              try:

                  number = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )


                  limit = (
                      90
                      if latitude
                      else
                      180
                  )


                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          number = -abs(
                              number
                          )


                      return number

              except ValueError:
                  pass


              return None


          features = []


          for row in rows:

              lat = coordinate(
                  row.get(
                      latitude_field
                  ),
                  True
              )


              lon = coordinate(
                  row.get(
                      longitude_field
                  ),
                  False
              )


              if (
                  lat is None
                  or
                  lon is None
              ):

                  continue


              properties = {
                  str(key):
                      value
                  for key, value in row.items()
                  if key
              }


              if name_field:

                  properties[
                      "name"
                  ] = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()


              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points"
              )


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      lon,
                                      lat
                                  ]
                          }
                  }
              )


          if not features:

              raise SystemExit(
                  "ERROR: Zero valid NATS reporting points."
              )


          output.write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          print(
              "Reporting points:",
              len(features)
          )

          print(
              "Output:",
              output
          )

          PY


