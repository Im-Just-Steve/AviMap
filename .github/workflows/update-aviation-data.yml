name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            curl \
            jq

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NATS DATASET DISCOVERY"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats-datasets.html

          test -s /tmp/nats-datasets.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = "https://nats-uk.ead-it.com"

          html = open(
              "/tmp/nats-datasets.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(
              timezone.utc
          ).date()

          def choose_dataset(patterns, label):

              candidates = []

              for href in hrefs:

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          href,
                          flags=re.I
                      )

                      if not match:
                          continue

                      try:

                          date = datetime.strptime(
                              match.group(1),
                              "%Y%m%d"
                          ).date()

                      except ValueError:

                          continue

                      candidates.append(
                          (
                              date,
                              href
                          )
                      )

                      break

              if not candidates:

                  print("")
                  print(
                      f"ERROR: No {label} dataset found."
                  )

                  raise SystemExit(1)

              current = [
                  item
                  for item in candidates
                  if item[0] <= today
              ]

              date, href = max(
                  current or candidates,
                  key=lambda item: item[0]
              )

              url = urljoin(
                  BASE,
                  href
              )

              print("")
              print(label)
              print("  Effective date:", date)
              print("  URL:", url)

              return date, url

          # --------------------------------------------------------
          # NATS FULL AIXM DATASET ZIP
          #
          # IMPORTANT:
          # We deliberately require the FULL dataset.
          # --------------------------------------------------------

          aip_date, aip_url = choose_dataset(
              [
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})_XML\.zip$'
              ],
              "NATS UK ICAO AIP AIXM"
          )

          # --------------------------------------------------------
          # NATS VRP DATASET
          # --------------------------------------------------------

          vrp_date, vrp_url = choose_dataset(
              [
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV$'
              ],
              "NATS VRP"
          )

          print("")
          print("==========================================")
          print("SELECTED DATASETS")
          print("==========================================")
          print("")
          print("AIP AIRAC:", aip_date)
          print("VRP DATE:", vrp_date)
          print("")

          open(
              "/tmp/nats-aip-url.txt",
              "w"
          ).write(
              aip_url
          )

          open(
              "/tmp/nats-aip-date.txt",
              "w"
          ).write(
              aip_date.strftime("%Y%m%d")
          )

          open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ).write(
              vrp_url
          )

          open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ).write(
              vrp_date.strftime("%Y%m%d")
          )

          PY

      # ============================================================
      # DOWNLOAD FULL NATS AIXM DATASET
      # ============================================================

      - name: Download NATS AIXM dataset
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "DOWNLOADING NATS FULL AIXM DATASET"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "URL:"
          echo "$AIP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$AIP_URL" \
            -o /tmp/nats-aip-source.zip

          test -s /tmp/nats-aip-source.zip

          echo ""
          echo "Downloaded archive:"
          file /tmp/nats-aip-source.zip
          ls -lh /tmp/nats-aip-source.zip

          rm -rf /tmp/nats-aip

          mkdir -p /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip-source.zip \
            -d /tmp/nats-aip

          echo ""
          echo "=========================================="
          echo "NATS AIXM ARCHIVE CONTENTS"
          echo "=========================================="

          find \
            /tmp/nats-aip \
            -type f \
            -printf '%p\n' \
            | sort

          # --------------------------------------------------------
          # CRITICAL FIX
          #
          # Select ONLY:
          #
          # EG_AIP_DS_FULL_YYYYMMDD.xml
          #
          # Never:
          #
          # EG_AIP_DS_DIFF_DELTA_YYYYMMDD.xml
          # export-filter.xml
          # metadata.xml
          # KML
          # --------------------------------------------------------

          EXPECTED_FULL="EG_AIP_DS_FULL_${AIRAC}.xml"

          echo ""
          echo "Expected FULL AIXM:"
          echo "$EXPECTED_FULL"

          FULL_XML=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "$EXPECTED_FULL" \
              | head -n 1
          )

          # --------------------------------------------------------
          # Case-insensitive fallback for archives that use XML
          # instead of xml.
          # --------------------------------------------------------

          if [ -z "$FULL_XML" ]; then

            FULL_XML=$(
              find \
                /tmp/nats-aip \
                -type f \
                | while read -r file; do

                    base=$(basename "$file")

                    if [ "${base,,}" = "${EXPECTED_FULL,,}" ]; then
                      echo "$file"
                    fi

                  done \
                  | head -n 1
            )

          fi

          # --------------------------------------------------------
          # Absolutely refuse to use a non-FULL XML.
          # --------------------------------------------------------

          if [ -z "$FULL_XML" ]; then

            echo ""
            echo "ERROR: The NATS archive does not contain:"
            echo "$EXPECTED_FULL"
            echo ""
            echo "Available XML files:"
            
            find \
              /tmp/nats-aip \
              -type f \
              \( \
                -iname "*.xml" \
                -o \
                -iname "*.XML" \
              \) \
              -print \
              | sort

            echo ""
            echo "No AIXM file was selected."
            echo "Existing aviation data has NOT been changed."

            exit 1

          fi

          # --------------------------------------------------------
          # Safety check: reject anything containing DIFF/DELTA.
          # --------------------------------------------------------

          FULL_BASENAME=$(basename "$FULL_XML")

          if echo "$FULL_BASENAME" \
            | grep -Eiq 'DIFF|DELTA'; then

            echo ""
            echo "ERROR: Selected AIXM file appears to be a"
            echo "DIFF/DELTA dataset:"
            echo "$FULL_XML"

            exit 1

          fi

          if ! echo "$FULL_BASENAME" \
            | grep -Eiq '^EG_AIP_DS_FULL_[0-9]{8}\.xml$'; then

            echo ""
            echo "ERROR: Selected file does not match the"
            echo "required FULL AIXM filename:"
            echo "$FULL_BASENAME"

            exit 1

          fi

          cp \
            "$FULL_XML" \
            /tmp/uk-aip.xml

          echo ""
          echo "=========================================="
          echo "FULL AIXM SELECTED"
          echo "=========================================="
          echo ""
          echo "$FULL_XML"
          echo ""
          echo "Size:"
          ls -lh /tmp/uk-aip.xml

          # --------------------------------------------------------
          # Diagnostic sanity check.
          #
          # The FULL file we previously successfully used contained
          # approximately 141k XML objects. If this is tiny again,
          # stop immediately.
          # --------------------------------------------------------

          XML_SIZE=$(stat -c%s /tmp/uk-aip.xml)

          echo ""
          echo "XML byte size:"
          echo "$XML_SIZE"

          if [ "$XML_SIZE" -lt 10000000 ]; then

            echo ""
            echo "ERROR: FULL AIXM XML is unexpectedly small."
            echo "Refusing to process it."

            exit 1

          fi

      # ============================================================
      # DOWNLOAD NATS VRPS
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$VRP_URL" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          rm -rf /tmp/nats-vrp

          mkdir -p /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi zip; then

            unzip \
              -o \
              /tmp/nats-vrp-source \
              -d /tmp/nats-vrp

          else

            cp \
              /tmp/nats-vrp-source \
              /tmp/nats-vrp/vrps.csv

          fi

          echo ""
          echo "VRP archive contents:"

          find \
            /tmp/nats-vrp \
            -type f \
            -print

          VRP_CSV=$(
            find \
              /tmp/nats-vrp \
              -type f \
              \( \
                -iname "*.csv" \
                -o \
                -iname "*.CSV" \
              \) \
              | head -n 1
          )

          if [ -z "$VRP_CSV" ]; then

            echo ""
            echo "ERROR: No VRP CSV found."

            exit 1

          fi

          cp \
            "$VRP_CSV" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "$VRP_CSV"

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text().strip()

          print("")
          print("==========================================")
          print("PARSING NATS AIXM")
          print("==========================================")
          print("")
          print("AIRAC:", AIRAC)
          print("XML:", XML)

          tree = ET.parse(XML)
          root = tree.getroot()

          print("XML parsed successfully.")

          # ========================================================
          # INDEX ALL XML OBJECTS
          # ========================================================

          id_index = {}

          for element in root.iter():

              for attribute, value in element.attrib.items():

                  if (
                      attribute.rsplit("}", 1)[-1]
                      == "id"
                  ):

                      if value:
                          id_index[value] = element

          print(
              "Indexed XML objects:",
              len(id_index)
          )

          XLINK_HREF = (
              "{http://www.w3.org/1999/xlink}"
              "href"
          )

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def resolve(element):

              if element is None:
                  return None

              href = (
                  element.attrib.get(
                      XLINK_HREF
                  )
              )

              if not href:

                  for attribute, value in (
                      element.attrib.items()
                  ):

                      if (
                          local(attribute)
                          == "href"
                      ):

                          href = value
                          break

              if not href:
                  return element

              ident = href.split("#")[-1]

              return id_index.get(
                  ident,
                  element
              )

          def first_text(parent, names):

              wanted = {
                  name.lower()
                  for name in names
              }

              for element in parent.iter():

                  if (
                      local(
                          element.tag
                      ).lower()
                      in wanted
                  ):

                      if element.text:

                          value = (
                              element.text.strip()
                          )

                          if value:
                              return value

              return ""

          def all_text(parent, names):

              wanted = {
                  name.lower()
                  for name in names
              }

              values = []

              for element in parent.iter():

                  if (
                      local(
                          element.tag
                      ).lower()
                      in wanted
                  ):

                      if element.text:

                          value = (
                              element.text.strip()
                          )

                          if value:
                              values.append(
                                  value
                              )

              return values

          def parse_numbers(text):

              if not text:
                  return []

              result = []

              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue

                  try:
                      result.append(
                          float(token)
                      )
                  except ValueError:
                      pass

              return result

          def positions(element):

              result = []

              for child in element.iter():

                  tag = local(
                      child.tag
                  )

                  if tag == "pos":

                      values = parse_numbers(
                          child.text or ""
                      )

                      if len(values) >= 2:

                          result.append(
                              (
                                  values[0],
                                  values[1]
                              )
                          )

                  elif tag == "posList":

                      values = parse_numbers(
                          child.text or ""
                      )

                      for i in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          result.append(
                              (
                                  values[i],
                                  values[i + 1]
                              )
                          )

              return result

          # ========================================================
          # BASIC RING EXTRACTION
          #
          # Full NATS AIXM contains the actual geometry through
          # GML Surface / PolygonPatch structures.
          # ========================================================

          def ring_points(element):

              element = resolve(element)

              if element is None:
                  return []

              direct = positions(element)

              if len(direct) >= 4:
                  return direct

              result = []

              for member in element.iter():

                  if local(
                      member.tag
                  ) != "curveMember":

                      continue

                  target = resolve(
                      member
                  )

                  if target is member:

                      children = list(member)

                      if children:
                          target = resolve(
                              children[0]
                          )

                  if target is None:
                      continue

                  pts = positions(
                      target
                  )

                  for point in pts:

                      if (
                          not result
                          or
                          point != result[-1]
                      ):

                          result.append(
                              point
                          )

              if (
                  result
                  and
                  result[0]
                  !=
                  result[-1]
              ):

                  result.append(
                      result[0]
                  )

              return result

          def surface_polygons(surface):

              surface = resolve(
                  surface
              )

              if surface is None:
                  return []

              polygons = []

              for patch in surface.iter():

                  if local(
                      patch.tag
                  ) != "PolygonPatch":

                      continue

                  exterior = None
                  interiors = []

                  for child in patch:

                      tag = local(
                          child.tag
                      )

                      if tag == "exterior":
                          exterior = child

                      elif tag == "interior":
                          interiors.append(
                              child
                          )

                  if exterior is None:
                      continue

                  shell = ring_points(
                      exterior
                  )

                  if len(shell) < 4:
                      continue

                  polygon = [
                      [
                          [
                              point[1],
                              point[0]
                          ]
                          for point in shell
                      ]
                  ]

                  for interior in interiors:

                      hole = ring_points(
                          interior
                      )

                      if len(hole) >= 4:

                          polygon.append(
                              [
                                  [
                                      point[1],
                                      point[0]
                                  ]
                                  for point in hole
                              ]
                          )

                  polygons.append(
                      polygon
                  )

              return polygons

          def airspace_geometry(airspace):

              polygons = []

              # ----------------------------------------------------
              # Search all horizontalProjection elements.
              # ----------------------------------------------------

              for projection in airspace.iter():

                  if local(
                      projection.tag
                  ) != "horizontalProjection":

                      continue

                  target = resolve(
                      projection
                  )

                  candidates = []

                  if (
                      target is not projection
                      and
                      target is not None
                  ):

                      candidates.append(
                          target
                      )

                  candidates.extend(
                      list(projection)
                  )

                  for candidate in candidates:

                      candidate = resolve(
                          candidate
                      )

                      if candidate is None:
                          continue

                      if local(
                          candidate.tag
                      ) == "Surface":

                          polygons.extend(
                              surface_polygons(
                                  candidate
                              )

                          )

                      for nested in candidate.iter():

                          if local(
                              nested.tag
                          ) == "Surface":

                              polygons.extend(
                                  surface_polygons(
                                      nested
                                  )
                              )

              # ----------------------------------------------------
              # Fallback: any Surface below the Airspace object.
              # ----------------------------------------------------

              if not polygons:

                  for element in airspace.iter():

                      if local(
                          element.tag
                      ) == "Surface":

                          polygons.extend(
                              surface_polygons(
                                  element
                              )
                          )

              if not polygons:
                  return None

              if len(polygons) == 1:

                  return {
                      "type": "Polygon",
                      "coordinates": polygons[0]
                  }

              return {
                  "type": "MultiPolygon",
                  "coordinates": polygons
              }

          # ========================================================
          # CLASSIFICATION
          # ========================================================

          def normal(value):

              return re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      value or ""
                  ).upper()
              )

          def classify(
              airspace,
              name,
              designator,
              airspace_type,
              local_type,
              classifications
          ):

              combined = " ".join(
                  [
                      name,
                      designator,
                      airspace_type,
                      local_type,
                      *classifications
                  ]
              ).upper()

              compact = normal(
                  combined
              )

              # ----------------------------------------------------
              # SPECIAL ZONES
              # ----------------------------------------------------

              if (
                  "MATZ" in compact
                  or
                  "MILITARYAERODROMETRAFFICZONE"
                  in compact
              ):

                  return "MATZ"

              if (
                  "RMZ" in compact
                  or
                  "RADIOMANDATORYZONE"
                  in compact
              ):

                  return "RMZ"

              if (
                  "TMZ" in compact
                  or
                  "TRANSPONDERMANDATORYZONE"
                  in compact
              ):

                  return "TMZ"

              if (
                  "ATZ" in compact
                  or
                  "AERODROMETRAFFICZONE"
                  in compact
              ):

                  return "ATZ"

              # ----------------------------------------------------
              # PROHIBITED / RESTRICTED / DANGER
              # ----------------------------------------------------

              if (
                  "PROHIBITED" in compact
                  or
                  re.search(
                      r"\bPA\b",
                      combined
                  )
                  or
                  re.match(
                      r"^EGP\d",
                      normal(designator)
                  )
              ):

                  return "PA"

              if (
                  "RESTRICTED" in compact
                  or
                  re.search(
                      r"\bRA\b",
                      combined
                  )
                  or
                  re.match(
                      r"^EGR\d",
                      normal(designator)
                  )
              ):

                  return "RA"

              if (
                  "DANGER" in compact
                  or
                  re.search(
                      r"\bDA\b",
                      combined
                  )
                  or
                  re.match(
                      r"^EGD\d",
                      normal(designator)
                  )
              ):

                  return "DA"

              # ----------------------------------------------------
              # CLASS A-G
              # ----------------------------------------------------

              for value in classifications:

                  n = normal(
                      value
                  )

                  if n in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return n

                  if n in {
                      "CLASSA",
                      "CLASSB",
                      "CLASSC",
                      "CLASSD",
                      "CLASSE",
                      "CLASSF",
                      "CLASSG"
                  }:

                      return n[-1]

              for value in (
                  airspace_type,
                  local_type
              ):

                  n = normal(
                      value
                  )

                  if n in {
                      "CLASSA",
                      "CLASSB",
                      "CLASSC",
                      "CLASSD",
                      "CLASSE",
                      "CLASSF",
                      "CLASSG"
                  }:

                      return n[-1]

              match = re.search(
                  r"\bCLASS\s*([A-G])\b",
                  combined,
                  flags=re.I
              )

              if match:
                  return match.group(1)

              return None

          # ========================================================
          # EXTRACT
          # ========================================================

          raw_count = 0
          classified_count = 0
          geometry_count = 0
          geometry_failures = 0

          counts = {}
          geometry_counts = {}

          features = []

          permitted = {
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          }

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              name = first_text(
                  airspace,
                  {
                      "name",
                      "AirspaceName"
                  }
              )

              designator = first_text(
                  airspace,
                  {
                      "designator",
                      "AirspaceDesignator"
                  }
              )

              airspace_type = first_text(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )

              local_type = first_text(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )

              classifications = all_text(
                  airspace,
                  {
                      "classification",
                      "AirspaceClassification"
                  }
              )

              category = classify(
                  airspace,
                  name,
                  designator,
                  airspace_type,
                  local_type,
                  classifications
              )

              if category not in permitted:
                  continue

              classified_count += 1

              counts[category] = (
                  counts.get(
                      category,
                      0
                  )
                  + 1
              )

              geometry = airspace_geometry(
                  airspace
              )

              if geometry is None:

                  geometry_failures += 1

                  print("")
                  print(
                      "GEOMETRY FAILURE:"
                  )
                  print(
                      "  Category:",
                      category
                  )
                  print(
                      "  Designator:",
                      designator
                  )
                  print(
                      "  Name:",
                      name
                  )

                  continue

              geometry_count += 1

              geometry_counts[category] = (
                  geometry_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": {
                          "name": (
                              name
                              or
                              designator
                              or
                              "Unknown"
                          ),
                          "designator": designator,
                          "category": category,
                          "aixmType": airspace_type,
                          "aixmLocalType": local_type,
                          "classification": (
                              classifications
                          ),
                          "source": (
                              "NATS UK ICAO AIP Dataset"
                          ),
                          "airac": AIRAC
                      },
                      "geometry": geometry
                  }
              )

          # ========================================================
          # REPORT
          # ========================================================

          print("")
          print("==========================================")
          print("NATS AIXM AIRSPACE RESULT")
          print("==========================================")
          print("")
          print("AIRAC:", AIRAC)
          print("")
          print(
              "Raw NATS Airspace features:",
              raw_count
          )
          print(
              "Classified AviMap airspaces:",
              classified_count
          )
          print(
              "Geometry successes:",
              geometry_count
          )
          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print("==========================================")
          print("CLASSIFICATION COUNTS")
          print("==========================================")

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              print(
                  f"{category:5s}: "
                  f"{counts.get(category, 0)}"
              )

          print("")
          print("==========================================")
          print("GEOMETRY COUNTS")
          print("==========================================")

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts.get(category, 0)}"
              )

          # ========================================================
          # HARD SAFETY CHECKS
          # ========================================================

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: FULL NATS AIXM contains only "
                  f"{raw_count} Airspace objects. "
                  "This is not the expected full dataset. "
                  "Refusing to replace existing GeoJSON."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero classified AviMap airspace "
                  "features were produced."
              )

          if geometry_failures != 0:

              raise SystemExit(
                  "ERROR: "
                  f"{geometry_failures} selected airspace "
                  "features had no usable geometry. "
                  "Refusing to create incomplete GeoJSON."
              )

          if geometry_count == 0:

              raise SystemExit(
                  "ERROR: Zero valid airspace geometries."
              )

          # Every classified object must have geometry.
          for category, count in counts.items():

              if (
                  geometry_counts.get(
                      category,
                      0
                  )
                  != count
              ):

                  raise SystemExit(
                      "ERROR: Geometry count mismatch for "
                      f"{category}."
                  )

          Path(
              OUT
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("AIXM CONVERSION PASSED")
          print("==========================================")
          print("")
          print(
              "GeoJSON features:",
              len(features)
          )
          print(
              "Written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value or "").lower()
              )

          lookup = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  key = norm(name)

                  if key in lookup:
                      return lookup[key]

              for key, field in lookup.items():

                  for name in names:

                      target = norm(name)

                      if (
                          target in key
                          or
                          key in target
                      ):

                          return field

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier"
          )

          lat_field = find_field(
              "Latitude",
              "Lat"
          )

          lon_field = find_field(
              "Longitude",
              "Long",
              "Lon"
          )

          if not lat_field or not lon_field:

              raise SystemExit(
                  "ERROR: Could not identify VRP coordinate fields."
              )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1).upper()
                  )

                  text = text[
                      :match.start()
                  ].strip()

              try:

                  decimal = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= decimal
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          decimal = -abs(
                              decimal
                          )

                      return decimal

              except ValueError:
                  pass

              cleaned = (
                  text
                  .replace(
                      "°",
                      " "
                  )
                  .replace(
                      "'",
                      " "
                  )
                  .replace(
                      '"',
                      " "
                  )
              )

              values = re.findall(
                  r"[-+]?\d+(?:[.,]\d+)?",
                  cleaned
              )

              if not values:
                  return None

              values = [
                  float(
                      value.replace(
                          ",",
                          "."
                      )
                  )
                  for value in values
              ]

              result = abs(
                  values[0]
              )

              if len(values) > 1:
                  result += (
                      abs(values[1])
                      /
                      60
                  )

              if len(values) > 2:
                  result += (
                      abs(values[2])
                      /
                      3600
                  )

              if hemisphere in {
                  "S",
                  "W"
              }:

                  result = -result

              return result

          features = []

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(lat_field),
                  True
              )

              lon = parse_coord(
                  row.get(lon_field),
                  False
              )

              if lat is None or lon is None:
                  continue

              name = (
                  str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()
                  if name_field
                  else ""
              )

              if not name:
                  name = f"VRP {index}"

              properties = {
                  key: value
                  for key, value in row.items()
                  if key
              }

              properties["name"] = name
              properties["category"] = "VRP"
              properties["source"] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": properties,
                      "geometry": {
                          "type": "Point",
                          "coordinates": [
                              lon,
                              lat
                          ]
                      }
                  }
              )

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(
              "CSV records:",
              len(rows)
          )
          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero valid points."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"
          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA VALIDATION"
          echo "=========================================="

          test -s "$AIRSPACE_FILE"
          test -s "$VRP_FILE"

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            "$AIRSPACE_FILE"
          )

          VRP_COUNT=$(
            jq '.features | length' \
            "$VRP_FILE"
          )

          echo ""
          echo "Airspace features:"
          echo "$AIRSPACE_COUNT"

          echo ""
          echo "VRP features:"
          echo "$VRP_COUNT"

          if [ "$AIRSPACE_COUNT" -eq 0 ]; then
            echo "ERROR: Zero airspace features."
            exit 1
          fi

          if [ "$VRP_COUNT" -eq 0 ]; then
            echo "ERROR: Zero VRP features."
            exit 1
          fi

          jq -e \
            '.type == "FeatureCollection"' \
            "$AIRSPACE_FILE" \
            >/dev/null

          jq -e \
            '.type == "FeatureCollection"' \
            "$VRP_FILE" \
            >/dev/null

          INVALID=$(
            jq '
              [
                .features[]
                | .properties.category
                | select(
                    . != "A"
                    and . != "B"
                    and . != "C"
                    and . != "D"
                    and . != "E"
                    and . != "F"
                    and . != "G"
                    and . != "PA"
                    and . != "RA"
                    and . != "DA"
                    and . != "ATZ"
                    and . != "MATZ"
                    and . != "RMZ"
                    and . != "TMZ"
                  )
              ]
              | length
            ' \
            "$AIRSPACE_FILE"
          )

          echo ""
          echo "Invalid categories:"
          echo "$INVALID"

          if [ "$INVALID" -ne 0 ]; then
            echo ""
            echo "ERROR: Unsupported airspace category found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VALIDATION PASSED"
          echo "=========================================="

      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "Installed:"
          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff \
            --cached \
            --quiet; then

            echo ""
            echo "No aviation data changes."

            exit 0

          fi

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "Changes:"
          git diff \
            --cached \
            --stat

          git commit \
            -m "Update UK aviation data from NATS ${AIRAC}"

          git push

          echo ""
          echo "=========================================="
          echo "NATS AVIATION DATA UPDATED"
          echo "=========================================="
