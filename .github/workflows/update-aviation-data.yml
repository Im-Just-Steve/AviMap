name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # The NATS Dataset Checklist is used as the authoritative
      # source for the current AIRAC and dataset filenames.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINDING CURRENT NATS DATASETS"
          echo "=========================================="
          echo ""

          python3 <<'PY'
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/"
          )

          CHECKLIST_BASE = (
              BASE +
              "Checklists/"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          print(
              "Today (UTC):",
              today
          )

          # --------------------------------------------------------
          # Find the current checklist.
          #
          # NATS has been publishing the checklist with the AIRAC
          # effective date in the filename.
          # --------------------------------------------------------

          checklist_candidates = []

          for offset in range(
              0,
              90
          ):

              date = (
                  today -
                  timedelta(
                      days=offset
                  )
              )

              stamp = date.strftime(
                  "%Y_%m_%d"
              )

              checklist_candidates.extend(
                  [
                      CHECKLIST_BASE +
                      f"Dataset_Checklist_{stamp}.HTML",

                      CHECKLIST_BASE +
                      f"Dataset_Checklist_{stamp}.html"
                  ]
              )

          selected_checklist = None
          selected_html = None
          selected_date = None

          print(
              "Searching NATS Dataset Checklists..."
          )

          for url in checklist_candidates:

              match = re.search(
                  r"Dataset_Checklist_"
                  r"(\d{4})_(\d{2})_(\d{2})",
                  url
              )

              if not match:
                  continue

              date = datetime.strptime(
                  "-".join(
                      match.groups()
                  ),
                  "%Y-%m-%d"
              ).date()

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "AviMap-NATS-Data-Updater/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      html = (
                          response.read()
                          .decode(
                              "utf-8",
                              errors="replace"
                          )
                      )

              except Exception:
                  continue

              if (
                  "EG_AIP_DS_FULL_" not in html
                  or
                  "EG_VRP_DS_AREA1_FULL_" not in html
              ):
                  continue

              if (
                  selected_date is None
                  or
                  date > selected_date
              ):

                  selected_checklist = url
                  selected_html = html
                  selected_date = date

          if selected_checklist is None:

              raise SystemExit(
                  "ERROR: Could not locate a current "
                  "NATS Dataset Checklist containing "
                  "both AIP and VRP datasets."
              )

          print("")
          print(
              "Selected NATS checklist:"
          )
          print(
              selected_checklist
          )

          print(
              "Checklist date:",
              selected_date
          )

          Path(
              "/tmp/nats-checklist.html"
          ).write_text(
              selected_html,
              encoding="utf-8"
          )

          # ========================================================
          # AIP DATASET
          # ========================================================

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              selected_html,
              flags=re.I
          )

          if not aip_matches:

              raise SystemExit(
                  "ERROR: No NATS AIP XML dataset "
                  "found in checklist."
              )

          aip_dates = []

          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not aip_dates:

              raise SystemExit(
                  "ERROR: No usable current NATS "
                  "AIP XML dataset found."
              )

          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_stamp}.XML"
          )

          # ========================================================
          # VRP DATASET
          # ========================================================

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              selected_html,
              flags=re.I
          )

          if not vrp_matches:

              raise SystemExit(
                  "ERROR: No NATS VRP CSV dataset "
                  "found in checklist."
              )

          vrp_dates = []

          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No usable current NATS "
                  "VRP dataset found."
              )

          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_stamp}.CSV"
          )

          # ========================================================
          # NATS ICAO AIP DIRECTORY
          #
          # This is the publishing area confirmed by the previously
          # working AviMap workflow.
          # ========================================================

          ICAO_AIP_BASE = (
              BASE +
              "ICAO%20AIP/"
          )

          # --------------------------------------------------------
          # NATS uses human-readable archive filenames for these
          # downloadable datasets.
          #
          # The previously working KML path was:
          #
          # EG AIS DS FULL 20260806 KML.zip
          #
          # Therefore test the corresponding XML archive forms.
          # --------------------------------------------------------

          stamp = aip_stamp

          aip_candidates = [

              ICAO_AIP_BASE +
              f"EG AIS DS FULL {stamp} XML.zip",

              ICAO_AIP_BASE +
              f"EG AIP DS FULL {stamp} XML.zip",

              ICAO_AIP_BASE +
              f"EG AIS DS FULL {stamp} XML.ZIP",

              ICAO_AIP_BASE +
              f"EG AIP DS FULL {stamp} XML.ZIP",

              # Also test direct XML forms in case NATS exposes
              # them in addition to the archive.
              ICAO_AIP_BASE +
              f"EG_AIP_DS_FULL_{stamp}.XML",

              ICAO_AIP_BASE +
              f"EG AIP DS FULL {stamp}.XML",

              ICAO_AIP_BASE +
              f"EG_AIP_DS_FULL_{stamp}.xml"
          ]

          # --------------------------------------------------------
          # VRP candidates.
          #
          # NATS VRP publishing has historically used a separate
          # digital-datasets/VRP area.
          # --------------------------------------------------------

          VRP_BASES = [

              BASE +
              "VRP/",

              BASE +
              "VRP%20Data/",

              BASE +
              "Visual%20Reference%20Points/"
          ]

          vrp_candidates = []

          for vrp_base in VRP_BASES:

              vrp_candidates.extend(
                  [
                      vrp_base +
                      vrp_filename,

                      vrp_base +
                      vrp_filename.lower(),

                      vrp_base +
                      f"EG VRP DS AREA1 FULL {vrp_stamp} CSV.zip",

                      vrp_base +
                      f"EG VRP DS AREA1 FULL {vrp_stamp} CSV.ZIP"
                  ]
              )

          def exists(url):

              request = urllib.request.Request(
                  url,
                  method="HEAD",
                  headers={
                      "User-Agent":
                      "AviMap-NATS-Data-Updater/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return (
                          response.status
                          == 200
                      )

              except Exception:
                  return False

          # ========================================================
          # FIND AIP
          # ========================================================

          aip_url = None

          print("")
          print(
              "Testing NATS ICAO AIP download URLs..."
          )
          print("")

          for candidate in aip_candidates:

              print(
                  "Trying:",
                  candidate
              )

              if exists(candidate):

                  aip_url = candidate

                  print(
                      "FOUND:"
                  )
                  print(
                      candidate
                  )

                  break

          if aip_url is None:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{aip_filename}, but the expected "
                  "ICAO AIP download archive could not "
                  "be located."
              )

          # ========================================================
          # FIND VRP
          # ========================================================

          vrp_url = None

          print("")
          print(
              "Testing NATS VRP download URLs..."
          )
          print("")

          for candidate in vrp_candidates:

              print(
                  "Trying:",
                  candidate
              )

              if exists(candidate):

                  vrp_url = candidate

                  print(
                      "FOUND:"
                  )
                  print(
                      candidate
                  )

                  break

          if vrp_url is None:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{vrp_filename}, but the VRP "
                  "download could not be located."
              )

          # ========================================================
          # WRITE DISCOVERY RESULTS
          # ========================================================

          Path(
              "/tmp/nats-aip-url.txt"
          ).write_text(
              aip_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              vrp_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS DATASET DISCOVERY COMPLETE"
          )
          print(
              "=========================================="
          )
          print("")
          print(
              "AIP date:",
              aip_date
          )
          print(
              "AIP filename:",
              aip_filename
          )
          print(
              "AIP URL:",
              aip_url
          )
          print("")
          print(
              "VRP date:",
              vrp_date
          )
          print(
              "VRP filename:",
              vrp_filename
          )
          print(
              "VRP URL:",
              vrp_url
          )
          print("")

          PY

      # ============================================================
      # DOWNLOAD NATS AIP DATASET
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS AIP DATASET"
          echo "=========================================="
          echo ""

          echo "URL:"
          echo "${AIP_URL}"

          echo ""

          mkdir -p /tmp/nats-aip

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "${AIP_URL}" \
            -o /tmp/nats-aip-source

          test -s /tmp/nats-aip-source

          echo ""
          echo "Downloaded file:"
          file /tmp/nats-aip-source

          # --------------------------------------------------------
          # Archive or direct file.
          # --------------------------------------------------------

          if file /tmp/nats-aip-source | grep -qi zip; then

              echo ""
              echo "AIP download is a ZIP archive."

              unzip \
                -o \
                /tmp/nats-aip-source \
                -d /tmp/nats-aip

          else

              echo ""
              echo "AIP download is a direct file."

              cp \
                /tmp/nats-aip-source \
                /tmp/nats-aip/$(cat /tmp/nats-aip-filename.txt)

          fi

          echo ""
          echo "AIP archive contents:"
          find /tmp/nats-aip \
            -type f \
            -print

          # --------------------------------------------------------
          # Locate the FULL AIP XML.
          # --------------------------------------------------------

          AIP_FILE=$(
            find /tmp/nats-aip \
              -type f \
              \( \
                -iname 'EG_AIP_DS_FULL_*.xml' \
                -o \
                -iname 'EG_AIP_DS_FULL_*.XML' \
              \) \
              | head -n 1
          )

          if [ -z "${AIP_FILE}" ]; then

              echo ""
              echo "ERROR: No FULL NATS AIP XML found."

              find /tmp/nats-aip \
                -type f \
                -print

              exit 1

          fi

          cp \
            "${AIP_FILE}" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIP XML:"
          echo "${AIP_FILE}"

          echo ""
          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS VRP DATASET
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""

          echo "URL:"
          echo "${VRP_URL}"

          echo ""

          mkdir -p /tmp/nats-vrp

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "${VRP_URL}" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          if file /tmp/nats-vrp-source | grep -qi zip; then

              unzip \
                -o \
                /tmp/nats-vrp-source \
                -d /tmp/nats-vrp

          else

              cp \
                /tmp/nats-vrp-source \
                /tmp/nats-vrp/vrps.csv

          fi

          VRP_CSV=$(
            find /tmp/nats-vrp \
              -type f \
              \( \
                -iname '*.csv' \
                -o \
                -iname '*.CSV' \
              \) \
              | head -n 1
          )

          if [ -z "${VRP_CSV}" ]; then

              echo ""
              echo "ERROR: No NATS VRP CSV found."

              find /tmp/nats-vrp \
                -type f \
                -print

              exit 1

          fi

          cp \
            "${VRP_CSV}" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "${VRP_CSV}"

          echo ""
          wc -c \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      #
      # This stage intentionally only publishes:
      #
      # A-G
      # PA
      # RA
      # DA
      # ATZ
      # MATZ
      # RMZ
      # TMZ
      #
      # NOTAM airspace is deliberately excluded for now.
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("")
          print(
              "=========================================="
          )
          print(
              "PARSING NATS AIXM"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "XML:",
              XML
          )

          tree = ET.parse(XML)
          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          # --------------------------------------------------------
          # Index all XML objects.
          # --------------------------------------------------------

          index = {}

          for element in root.iter():

              for key, value in (
                  element.attrib.items()
              ):

                  if local(key) in {
                      "id",
                      "gml:id"
                  }:

                      if value:
                          index[value] = element

          print(
              "Indexed XML objects:",
              len(index)
          )

          def resolve(element):

              current = element
              seen = set()

              while current is not None:

                  href = None

                  for key, value in (
                      current.attrib.items()
                  ):

                      if local(key) in {
                          "href",
                          "xlink:href"
                      }:

                          href = value
                          break

                  if not href:
                      return current

                  reference = (
                      href
                      .lstrip("#")
                  )

                  if reference in seen:
                      return current

                  seen.add(
                      reference
                  )

                  current = index.get(
                      reference
                  )

              return current

          def texts(element, names):

              wanted = set(names)
              values = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      in wanted
                      and
                      child.text
                  ):

                      value = (
                          child.text.strip()
                      )

                      if value:
                          values.append(
                              value
                          )

              return values

          def first_text(element, names):

              values = texts(
                  element,
                  names
              )

              return (
                  values[0]
                  if values
                  else ""
              )

          # --------------------------------------------------------
          # Coordinate helpers.
          # --------------------------------------------------------

          def nums(text):

              result = []

              for value in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not value:
                      continue

                  try:
                      result.append(
                          float(value)
                      )
                  except ValueError:
                      pass

              return result

          def ring_from(element):

              element = resolve(
                  element
              )

              if element is None:
                  return []

              # posList
              for child in element.iter():

                  if (
                      local(child.tag)
                      ==
                      "posList"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      coords = []

                      for i in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          coords.append(
                              [
                                  values[i + 1],
                                  values[i]
                              ]
                          )

                      if len(coords) >= 4:

                          if (
                              coords[0]
                              !=
                              coords[-1]
                          ):
                              coords.append(
                                  coords[0]
                              )

                          return coords

              # Individual pos elements.
              coords = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      ==
                      "pos"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      if len(values) >= 2:

                          coords.append(
                              [
                                  values[1],
                                  values[0]
                              ]
                          )

              if len(coords) >= 4:

                  if (
                      coords[0]
                      !=
                      coords[-1]
                  ):

                      coords.append(
                          coords[0]
                      )

                  return coords

              return []

          # --------------------------------------------------------
          # Geometry extraction.
          #
          # NATS AIXM geometry may be represented through references
          # rather than directly below Airspace.
          # --------------------------------------------------------

          def geometry_for(airspace):

              surfaces = []

              for element in airspace.iter():

                  if local(
                      element.tag
                  ) in {
                      "horizontalProjection",
                      "theAirspaceVolume"
                  }:

                      resolved = resolve(
                          element
                      )

                      if resolved is not None:
                          surfaces.append(
                              resolved
                          )

              # Search all referenced objects for polygons.
              for element in airspace.iter():

                  resolved = resolve(
                      element
                  )

                  if resolved is not None:

                      surfaces.append(
                          resolved
                      )

              # De-duplicate objects.
              unique = []

              seen = set()

              for element in surfaces:

                  marker = id(
                      element
                  )

                  if marker in seen:
                      continue

                  seen.add(
                      marker
                  )

                  unique.append(
                      element
                  )

              polygons = []

              for surface in unique:

                  for polygon in surface.iter():

                      if local(
                          polygon.tag
                      ) not in {
                          "PolygonPatch",
                          "Polygon"
                      }:
                          continue

                      rings = []

                      for ring in polygon.iter():

                          if local(
                              ring.tag
                          ) == "LinearRing":

                              points = ring_from(
                                  ring
                              )

                              if points:
                                  rings.append(
                                      points
                                  )

                      if rings:

                          polygons.append(
                              rings
                          )

              if not polygons:
                  return None

              if len(polygons) == 1:

                  return {
                      "type":
                          "Polygon",

                      "coordinates":
                          polygons[0]
                  }

              return {
                  "type":
                      "MultiPolygon",

                  "coordinates":
                      polygons
              }

          # --------------------------------------------------------
          # Classification.
          #
          # IMPORTANT:
          # The source contains many Airspace objects that are not
          # wanted by AviMap. Only these categories survive.
          # --------------------------------------------------------

          def classify(
              airspace
          ):

              values = []

              values.extend(
                  texts(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "localType",
                          "AirspaceLocalType",
                          "class",
                          "AirspaceClassification",
                          "designator",
                          "name"
                      }
                  )
              )

              combined = " ".join(
                  values
              ).upper()

              compact = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  combined
              )

              # ----------------------------------------------------
              # Special zones.
              # ----------------------------------------------------

              if re.search(
                  r"\bMATZ\b",
                  compact
              ) or re.search(
                  r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE",
                  compact
              ):

                  return "MATZ"

              if re.search(
                  r"\bRMZ\b",
                  compact
              ) or re.search(
                  r"RADIO\s+MANDATORY\s+ZONE",
                  compact
              ):

                  return "RMZ"

              if re.search(
                  r"\bTMZ\b",
                  compact
              ) or re.search(
                  r"TRANSPONDER\s+MANDATORY\s+ZONE",
                  compact
              ):

                  return "TMZ"

              if re.search(
                  r"\bATZ\b",
                  compact
              ) or re.search(
                  r"AERODROME\s+TRAFFIC\s+ZONE",
                  compact
              ):

                  return "ATZ"

              # ----------------------------------------------------
              # PA / RA / DA.
              # ----------------------------------------------------

              if re.search(
                  r"\bPROHIBITED\b",
                  compact
              ):

                  return "PA"

              if re.search(
                  r"\bRESTRICTED\b",
                  compact
              ):

                  return "RA"

              if re.search(
                  r"\bDANGER\b",
                  compact
              ):

                  return "DA"

              # ----------------------------------------------------
              # ICAO class.
              # ----------------------------------------------------

              for letter in (
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              ):

                  if re.search(
                      rf"\bCLASS\s*{letter}\b",
                      compact
                  ):

                      return letter

              # Exact standalone class value.
              for value in values:

                  value = re.sub(
                      r"[^A-Z]",
                      "",
                      value.upper()
                  )

                  if value in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return value

              return None

          # --------------------------------------------------------
          # Process.
          # --------------------------------------------------------

          features = []

          raw_count = 0
          classified_count = 0
          geometry_failures = 0

          counts = {
              category: 0
              for category in [
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G",
                  "PA",
                  "RA",
                  "DA",
                  "ATZ",
                  "MATZ",
                  "RMZ",
                  "TMZ"
              ]
          }

          geometry_counts = {
              category: 0
              for category in counts
          }

          failures = []

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              category = classify(
                  airspace
              )

              if category is None:
                  continue

              classified_count += 1

              counts[
                  category
              ] += 1

              geometry = geometry_for(
                  airspace
              )

              if geometry is None:

                  geometry_failures += 1

                  failures.append(
                      (
                          category,
                          first_text(
                              airspace,
                              {
                                  "designator"
                              }
                          ),
                          first_text(
                              airspace,
                              {
                                  "name"
                              }
                          )
                      )
                  )

                  continue

              geometry_counts[
                  category
              ] += 1

              designator = first_text(
                  airspace,
                  {
                      "designator"
                  }
              )

              name = first_text(
                  airspace,
                  {
                      "name"
                  }
              )

              properties = {
                  "name":
                      name
                      or
                      designator
                      or
                      "Unknown airspace",

                  "designator":
                      designator,

                  "category":
                      category,

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC
              }

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )

          # --------------------------------------------------------
          # Results.
          # --------------------------------------------------------

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "Raw NATS Airspace:",
              raw_count
          )

          print(
              "Classified AviMap airspaces:",
              classified_count
          )

          print(
              "Geometry successes:",
              len(features)
          )

          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print(
              "CLASSIFICATION COUNTS"
          )

          for category in counts:

              print(
                  f"{category:5s}: "
                  f"{counts[category]}"
              )

          print("")
          print(
              "GEOMETRY COUNTS"
          )

          for category in geometry_counts:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts[category]}"
              )

          # --------------------------------------------------------
          # Failure diagnostics.
          # --------------------------------------------------------

          if failures:

              print("")
              print(
                  "GEOMETRY FAILURES"
              )

              for category, designator, name in failures[:100]:

                  print(
                      category,
                      designator,
                      name
                  )

              if len(failures) > 100:

                  print(
                      "... and",
                      len(failures) - 100,
                      "more"
                  )

          # --------------------------------------------------------
          # Safety checks.
          #
          # We must never replace a known-good dataset with an
          # empty/partial dataset.
          # --------------------------------------------------------

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  f"AIXM dataset: {raw_count} Airspace objects."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: NATS AIXM conversion produced "
                  "zero filtered airspace objects."
              )

          if len(features) == 0:

              raise SystemExit(
                  "ERROR: NATS AIXM conversion produced "
                  "zero valid airspace geometries."
              )

          # If a selected category has records but every geometry
          # failed, do not publish partial data.
          for category in counts:

              if (
                  counts[category] > 0
                  and
                  geometry_counts[category] == 0
              ):

                  raise SystemExit(
                      "ERROR: Category "
                      f"{category} has "
                      f"{counts[category]} source objects "
                      "but zero valid geometries."
                  )

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }

          Path(
              OUT
          ).write_text(
              json.dumps(
                  output,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "GeoJSON written:",
              OUT
          )

          print(
              "Features:",
              len(features)
          )

          PY

      # ============================================================
      # CONVERT VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: VRP CSV contains zero rows."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value)
                  .lower()
              )

          field_map = {
              norm(field):
                  field
              for field in fields
              if field
          }

          def field(*names):

              for name in names:

                  if norm(name) in field_map:

                      return field_map[
                          norm(name)
                      ]

              for key, original in field_map.items():

                  for name in names:

                      n = norm(name)

                      if (
                          n in key
                          or
                          key in n
                      ):

                          return original

              return None

          name_field = field(
              "VRP Name",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              lat_field is None
              or
              lon_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP "
                  "coordinate fields."
              )

          def coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = str(
                  value
              ).strip()

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              # Decimal.
              try:

                  result = float(
                      text
                      .replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= result
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          result = -abs(
                              result
                          )

                      return result

              except ValueError:
                  pass

              # DDMMSS / DDDMMSS.
              compact = re.sub(
                  r"[^0-9.]",
                  "",
                  text
              )

              if re.fullmatch(
                  r"\d{6}(?:\.\d+)?",
                  compact
              ):

                  degrees = int(
                      compact[
                          :2
                      ]
                  )

                  minutes = int(
                      compact[
                          2:4
                      ]
                  )

                  seconds = float(
                      compact[
                          4:
                      ]
                  )

              elif re.fullmatch(
                  r"\d{7}(?:\.\d+)?",
                  compact
              ):

                  degrees = int(
                      compact[
                          :3
                      ]
                  )

                  minutes = int(
                      compact[
                          3:5
                      ]
                  )

                  seconds = float(
                      compact[
                          5:
                      ]
                  )

              else:

                  numbers = re.findall(
                      r"\d+(?:\.\d+)?",
                      text
                  )

                  if not numbers:
                      return None

                  values = [
                      float(
                          value
                      )
                      for value in numbers
                  ]

                  result = values[0]

                  if len(values) > 1:
                      result += (
                          values[1] / 60
                      )

                  if len(values) > 2:
                      result += (
                          values[2] / 3600
                      )

                  if hemisphere in {
                      "S",
                      "W"
                  }:

                      result = -abs(
                          result
                      )

                  return result

              if (
                  minutes >= 60
                  or
                  seconds >= 60
              ):

                  return None

              result = (
                  degrees
                  +
                  minutes / 60
                  +
                  seconds / 3600
              )

              if hemisphere in {
                  "S",
                  "W"
              }:

                  result = -abs(
                      result
                  )

              return result

          features = []

          for row in rows:

              lat = coordinate(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = coordinate(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):
                  continue

              name = (
                  row.get(
                      name_field,
                      ""
                  ).strip()
                  if name_field
                  else ""
              )

              properties = {
                  str(key):
                      value
                  for key, value
                  in row.items()
                  if key
              }

              properties[
                  "name"
              ] = (
                  name
                  or
                  "VRP"
              )

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      lon,
                                      lat
                                  ]
                          }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "CSV rows:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: VRP conversion produced "
                  "zero valid points."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""

          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"

          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero airspaces."
            exit 1

          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero VRPs."
            exit 1

          fi

          echo "Validation successful."

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."
            exit 0

          fi

          echo ""
          echo "=========================================="
          echo "COMMITTING NATS AVIATION DATA"
          echo "=========================================="
          echo ""

          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
