name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # IMPORTANT:
      # We discover the actual NATS-provided href.
      #
      # We do NOT construct the AIP download filename ourselves.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINDING CURRENT NATS DATASETS"
          echo "=========================================="
          echo ""

          python3 <<'PY'
          import html
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          print(
              "Today (UTC):",
              today
          )

          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []

              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:

                      self.text.append(
                          data
                      )

              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      text = " ".join(
                          self.text
                      )

                      self.links.append(
                          (
                              self.href,
                              text
                          )
                      )

                      self.href = None
                      self.text = []

          def fetch(
              url
          ):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  href = html.unescape(
                      href.strip()
                  )

                  absolute = urljoin(
                      base_url,
                      href
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result

          def compact(
              value
          ):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )

          def is_aip_link(
              url,
              text,
              airac
          ):

              combined = (
                  url
                  + " "
                  + text
              )

              value = compact(
                  combined
              )

              if (
                  f"EGAIPDSFULL{airac}"
                  in value
              ):
                  return True

              if (
                  f"EGAIPDS{airac}XML"
                  in value
              ):
                  return True

              if (
                  airac in value
                  and
                  "AIP" in value
                  and
                  (
                      "XML" in value
                      or
                      "ZIP" in value
                  )
              ):
                  return True

              if (
                  airac in value
                  and
                  "AIS" in value
                  and
                  (
                      "XML" in value
                      or
                      "ZIP" in value
                  )
              ):
                  return True

              return False

          def is_vrp_link(
              url,
              text,
              airac
          ):

              combined = (
                  url
                  + " "
                  + text
              )

              value = compact(
                  combined
              )

              if (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
              ):
                  return True

              if (
                  airac in value
                  and
                  "VRP" in value
                  and
                  (
                      "CSV" in value
                      or
                      "XLSX" in value
                      or
                      "ZIP" in value
                  )
              ):
                  return True

              return False

          # --------------------------------------------------------
          # Find latest checklist.
          # --------------------------------------------------------

          checklist_body = None
          checklist_url = None
          checklist_date = None

          print("")
          print(
              "Searching NATS Dataset Checklists..."
          )

          for offset in range(
              0,
              90
          ):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]

              for candidate in candidates:

                  try:

                      body, _ = fetch(
                          candidate
                      )

                  except Exception:

                      continue

                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )

                  if (
                      "EG_AIP_DS_FULL_" not in text
                      or
                      "EG_VRP_DS_AREA1_FULL_" not in text
                  ):

                      continue

                  checklist_body = body
                  checklist_url = candidate
                  checklist_date = candidate_date

                  break

              if checklist_body is not None:

                  break

          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find a current "
                  "NATS Dataset Checklist."
              )

          print("")
          print(
              "Selected NATS checklist:"
          )
          print(
              checklist_url
          )

          print(
              "Checklist date:",
              checklist_date
          )

          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )

          # --------------------------------------------------------
          # Current AIP AIRAC.
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )

          aip_dates = []

          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue

              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )

          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_stamp}.XML"
          )

          # --------------------------------------------------------
          # Current VRP AIRAC.
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )

          vrp_dates = []

          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue

              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )

          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_stamp}.CSV"
          )

          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "AIP checklist dataset:",
              aip_filename
          )

          print("")
          print(
              "VRP AIRAC:",
              vrp_stamp
          )

          print(
              "VRP checklist dataset:",
              vrp_filename
          )

          # --------------------------------------------------------
          # Parse checklist links.
          # --------------------------------------------------------

          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )

          print("")
          print(
              "Checklist links found:",
              len(checklist_links)
          )

          # --------------------------------------------------------
          # Download digital dataset index.
          # --------------------------------------------------------

          print("")
          print(
              "Downloading NATS digital dataset index..."
          )

          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Could not download "
                  "digital dataset index:",
                  exc
              )

              index_links = []

          print(
              "Index links found:",
              len(index_links)
          )

          # --------------------------------------------------------
          # Find actual NATS-provided AIP hrefs.
          # --------------------------------------------------------

          aip_links = []

          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              key = (
                  url,
                  text
              )

              if key in seen:
                  continue

              seen.add(
                  key
              )

              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )

          # --------------------------------------------------------
          # Inspect linked dataset pages.
          # --------------------------------------------------------

          expanded = []

          for url, text in list(
              aip_links
          ):

              lower = url.lower()

              if not (
                  lower.endswith(
                      ".html"
                  )
                  or
                  lower.endswith(
                      ".htm"
                  )
                  or
                  lower.endswith(
                      "/"
                  )
              ):

                  continue

              print("")
              print(
                  "Inspecting linked AIP dataset page:"
              )
              print(
                  url
              )

              try:

                  body, _ = fetch(
                      url
                  )

                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          expanded.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )

              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )

          aip_links.extend(
              expanded
          )

          # --------------------------------------------------------
          # Deduplicate.
          # --------------------------------------------------------

          unique_aip_links = []

          seen_urls = set()

          for url, text in aip_links:

              if url in seen_urls:
                  continue

              seen_urls.add(
                  url
              )

              unique_aip_links.append(
                  (
                      url,
                      text
                  )
              )

          aip_links = unique_aip_links

          # --------------------------------------------------------
          # VRP links.
          # --------------------------------------------------------

          vrp_links = []

          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              key = (
                  url,
                  text
              )

              if key in seen:
                  continue

              seen.add(
                  key
              )

              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )

          unique_vrp_links = []

          seen_urls = set()

          for url, text in vrp_links:

              if url in seen_urls:
                  continue

              seen_urls.add(
                  url
              )

              unique_vrp_links.append(
                  (
                      url,
                      text
                  )
              )

          vrp_links = unique_vrp_links

          # --------------------------------------------------------
          # Diagnostics.
          # --------------------------------------------------------

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIP LINKS FOUND"
          )
          print(
              "=========================================="
          )

          for url, text in aip_links:

              print(
                  "TEXT:",
                  text
              )

              print(
                  "HREF:",
                  url
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP LINKS FOUND"
          )
          print(
              "=========================================="
          )

          for url, text in vrp_links:

              print(
                  "TEXT:",
                  text
              )

              print(
                  "HREF:",
                  url
              )

          # --------------------------------------------------------
          # Save discovery state.
          # --------------------------------------------------------

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )

          if not aip_links:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{aip_filename}, but no actual "
                  "NATS AIP download href could be found."
              )

          if not vrp_links:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{vrp_filename}, but no actual "
                  "NATS VRP download href could be found."
              )

          print("")
          print(
              "NATS dataset discovery complete."
          )

          PY

      # ============================================================
      # DOWNLOAD NATS AIP DATASET
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS AIP DATASET"
          echo "=========================================="
          echo ""

          rm -rf \
            /tmp/nats-aip

          mkdir -p \
            /tmp/nats-aip

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "NATS supplied URL:"
            echo "${URL}"

            rm -f \
              /tmp/nats-aip-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output \
                /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi

            echo ""
            echo "Response type:"
            file \
              /tmp/nats-aip-download

            if file \
              /tmp/nats-aip-download \
              | grep -qi \
                "Zip archive"; then

              echo ""
              echo "NATS AIP response is a ZIP archive."

              rm -rf \
                /tmp/nats-aip

              mkdir -p \
                /tmp/nats-aip

              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip

              echo ""
              echo "AIP archive contents:"
              find \
                /tmp/nats-aip \
                -type f \
                -print

              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )

              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml

                FOUND="${URL}"

                break

              fi

              echo ""
              echo "Expected FULL AIP XML was not found in archive."

              continue

            fi

            # ------------------------------------------------------
            # Direct XML fallback.
            # ------------------------------------------------------

            if grep -aqi \
              "<[^>]*Airspace" \
              /tmp/nats-aip-download; then

              cp \
                /tmp/nats-aip-download \
                /tmp/uk-aip.xml

              FOUND="${URL}"

              break

            fi

          done < /tmp/nats-aip-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "=========================================="
            echo "NATS AIP DOWNLOAD FAILED"
            echo "=========================================="
            echo ""

            echo "Checklist dataset:"
            cat \
              /tmp/nats-aip-filename.txt

            echo ""
            echo "NATS-provided links tested:"
            cat \
              /tmp/nats-aip-links.txt

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "NATS AIP DOWNLOAD SUCCESSFUL"
          echo "=========================================="
          echo ""

          echo "Source:"
          echo "${FOUND}"

          echo ""
          echo "AIP XML:"
          ls -lh \
            /tmp/uk-aip.xml

          python3 <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIP XML parses successfully."
          )
          PY

      # ============================================================
      # DOWNLOAD NATS VRP DATASET
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""

          rm -rf \
            /tmp/nats-vrp

          mkdir -p \
            /tmp/nats-vrp

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "NATS supplied URL:"
            echo "${URL}"

            rm -f \
              /tmp/nats-vrp-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output \
                /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi

            file \
              /tmp/nats-vrp-download

            if file \
              /tmp/nats-vrp-download \
              | grep -qi \
                "Zip archive"; then

              rm -rf \
                /tmp/nats-vrp

              mkdir -p \
                /tmp/nats-vrp

              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp

              echo ""
              echo "VRP archive contents:"
              find \
                /tmp/nats-vrp \
                -type f \
                -print

              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )

              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv

                FOUND="${URL}"

                break

              fi

            fi

            # ------------------------------------------------------
            # Direct CSV fallback.
            # ------------------------------------------------------

            if head \
              -n 10 \
              /tmp/nats-vrp-download \
              | grep -Eqi \
                "latitude|longitude"; then

              cp \
                /tmp/nats-vrp-download \
                /tmp/uk-vrps.csv

              FOUND="${URL}"

              break

            fi

          done < /tmp/nats-vrp-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "=========================================="
            echo "NATS VRP DOWNLOAD FAILED"
            echo "=========================================="
            echo ""

            echo "Checklist dataset:"
            cat \
              /tmp/nats-vrp-filename.txt

            echo ""
            echo "NATS-provided links:"
            cat \
              /tmp/nats-vrp-links.txt

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "NATS VRP DOWNLOAD SUCCESSFUL"
          echo "=========================================="
          echo ""

          echo "Source:"
          echo "${FOUND}"

          echo ""
          echo "VRP CSV:"
          ls -lh \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE TO GEOJSON
      #
      # IMPORTANT:
      #
      # The previous converter found the correct 403 airspaces but
      # returned zero geometries.
      #
      # This version explicitly follows:
      #
      # Airspace
      #   -> AirspaceGeometryComponent
      #   -> AirspaceVolume
      #   -> horizontalProjection
      #   -> Surface
      #   -> PolygonPatch
      #   -> Ring
      #   -> curveMember
      #   -> Curve
      #   -> Curve segments
      #
      # It also follows xlink:href references at every geometry level.
      #
      # Supported geometry forms include:
      #
      #   pos
      #   posList
      #   LineStringSegment
      #   GeodesicString
      #   Geodesic
      #   Arc
      #   ArcString
      #   ArcByCenterPoint
      #   CircleByCenterPoint
      #   Circle
      #
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("")
          print(
              "=========================================="
          )
          print(
              "PARSING NATS AIXM"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "XML:",
              XML
          )

          tree = ET.parse(
              XML
          )

          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          # --------------------------------------------------------
          # Namespace/local-name helpers.
          # --------------------------------------------------------

          def local(
              tag
          ):

              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def attr_local(
              element,
              wanted
          ):

              wanted = wanted.lower()

              for key, value in element.attrib.items():

                  if local(key).lower() == wanted:

                      return value

              return None

          # --------------------------------------------------------
          # Parent index.
          # --------------------------------------------------------

          parent = {}

          for parent_element in root.iter():

              for child in parent_element:

                  parent[child] = (
                      parent_element
                  )

          # --------------------------------------------------------
          # Global object index.
          #
          # AIXM/GML commonly references geometry objects by
          # xlink:href="#some-id".
          # --------------------------------------------------------

          index = {}

          for element in root.iter():

              for key, value in element.attrib.items():

                  key_name = local(
                      key
                  ).lower()

                  if key_name in {
                      "id"
                  }:

                      if value:

                          index[
                              value.lstrip("#")
                          ] = element

          print(
              "Indexed XML objects:",
              len(index)
          )

          # --------------------------------------------------------
          # Resolve a reference.
          # --------------------------------------------------------

          def resolve(
              element
          ):

              if element is None:

                  return None

              href = attr_local(
                  element,
                  "href"
              )

              if not href:

                  return element

              reference = href.split(
                  "#",
                  1
              )[-1]

              reference = reference.strip()

              if not reference:

                  return element

              return index.get(
                  reference,
                  element
              )

          # --------------------------------------------------------
          # Resolve recursively while retaining actual children.
          # --------------------------------------------------------

          def resolved_variants(
              element
          ):

              result = []

              seen = set()

              current = element

              for _ in range(
                  20
              ):

                  if current is None:

                      break

                  marker = id(
                      current
                  )

                  if marker in seen:

                      break

                  seen.add(
                      marker
                  )

                  result.append(
                      current
                  )

                  href = attr_local(
                      current,
                      "href"
                  )

                  if not href:

                      break

                  reference = href.split(
                      "#",
                      1
                  )[-1
                  ].strip()

                  if not reference:

                      break

                  current = index.get(
                      reference
                  )

              return result

          # --------------------------------------------------------
          # Coordinate helpers.
          # --------------------------------------------------------

          def current_srs(
              element
          ):

              current = element

              for _ in range(
                  30
              ):

                  if current is None:

                      break

                  value = attr_local(
                      current,
                      "srsName"
                  )

                  if value:

                      return value

                  current = parent.get(
                      current
                  )

              # NATS AIXM is WGS84 / EPSG:4326.
              return "EPSG:4326"

          def dimension_for(
              element
          ):

              value = (
                  attr_local(
                      element,
                      "srsDimension"
                  )
                  or
                  attr_local(
                      element,
                      "dimension"
                  )
              )

              if value:

                  try:

                      return int(
                          value
                      )

                  except ValueError:

                      pass

              return 2

          def number_list(
              text
          ):

              if not text:

                  return []

              values = []

              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:

                      continue

                  try:

                      values.append(
                          float(
                              token
                          )
                      )

                  except ValueError:

                      pass

              return values

          def pair_list(
              element,
              text
          ):

              values = number_list(
                  text
              )

              dimension = dimension_for(
                  element
              )

              if dimension < 2:

                  dimension = 2

              coordinates = []

              for i in range(
                  0,
                  len(values),
                  dimension
              ):

                  chunk = values[
                      i:i + dimension
                  ]

                  if len(chunk) < 2:

                      continue

                  first = chunk[0]
                  second = chunk[1]

                  srs = current_srs(
                      element
                  ).upper()

                  # EPSG:4326 in AIXM is latitude,
                  # longitude. GeoJSON is longitude,
                  # latitude.
                  #
                  # CRS84 is already longitude,
                  # latitude.

                  if (
                      "4326" in srs
                      and
                      "CRS84" not in srs
                  ):

                      coordinates.append(
                          [
                              second,
                              first
                          ]
                      )

                  else:

                      coordinates.append(
                          [
                              first,
                              second
                          ]
                      )

              return coordinates

          def direct_coordinates(
              element
          ):

              coordinates = []

              for node in element.iter():

                  name = local(
                      node.tag
                  )

                  if name == "posList":

                      if node.text:

                          coordinates.extend(
                              pair_list(
                                  node,
                                  node.text
                              )
                          )

                  elif name == "pos":

                      if node.text:

                          coordinates.extend(
                              pair_list(
                                  node,
                                  node.text
                              )
                          )

                  elif name == "coordinates":

                      if node.text:

                          text = node.text.strip()

                          for token in re.split(
                              r"\s+",
                              text
                          ):

                              bits = token.split(
                                  ","
                              )

                              if len(bits) < 2:

                                  continue

                              try:

                                  first = float(
                                      bits[0]
                                  )

                                  second = float(
                                      bits[1]
                                  )

                              except ValueError:

                                  continue

                              srs = current_srs(
                                  node
                              ).upper()

                              if (
                                  "4326" in srs
                                  and
                                  "CRS84" not in srs
                              ):

                                  coordinates.append(
                                      [
                                          second,
                                          first
                                      ]
                                  )

                              else:

                                  coordinates.append(
                                      [
                                          first,
                                          second
                                      ]
                                  )

              return coordinates

          # --------------------------------------------------------
          # Distance / angle helpers.
          # --------------------------------------------------------

          def radius_metres(
              element
          ):

              value = None

              for node in element.iter():

                  if local(
                      node.tag
                  ) == "radius":

                      value = node

                      break

              if value is None:

                  return None

              if not value.text:

                  return None

              try:

                  radius = float(
                      value.text.strip()
                  )

              except ValueError:

                  return None

              uom = (
                  attr_local(
                      value,
                      "uom"
                  )
                  or
                  "m"
              ).lower()

              if uom in {
                  "m",
                  "metre",
                  "metres",
                  "meter",
                  "meters"
              }:

                  return radius

              if uom in {
                  "km",
                  "kilometre",
                  "kilometres",
                  "kilometer",
                  "kilometers"
              }:

                  return radius * 1000.0

              if uom in {
                  "nm",
                  "[nmi_i]",
                  "nmi"
              }:

                  return radius * 1852.0

              return radius

          def angle_value(
              element,
              name
          ):

              for node in element.iter():

                  if local(
                      node.tag
                  ) == name:

                      if not node.text:

                          return None

                      try:

                          return float(
                              node.text.strip()
                          )

                      except ValueError:

                          return None

              return None

          # --------------------------------------------------------
          # Approximate metres-to-degrees conversion for circular
          # geometry.
          #
          # This is only used to densify an AIXM circular segment.
          # --------------------------------------------------------

          def metres_per_degree_lat():

              return 111320.0

          def metres_per_degree_lon(
              latitude
          ):

              return (
                  111320.0
                  *
                  max(
                      0.05,
                      math.cos(
                          math.radians(
                              latitude
                          )
                      )
                  )
              )

          def arc_by_center(
              element
          ):

              center = None

              for node in element.iter():

                  if local(
                      node.tag
                  ) == "pos":

                      if node.text:

                          values = number_list(
                              node.text
                          )

                          if len(values) >= 2:

                              srs = current_srs(
                                  node
                              ).upper()

                              if (
                                  "4326" in srs
                                  and
                                  "CRS84" not in srs
                              ):

                                  center = (
                                      values[1],
                                      values[0]
                                  )

                              else:

                                  center = (
                                      values[0],
                                      values[1]
                                  )

                          break

              if center is None:

                  return []

              radius = radius_metres(
                  element
              )

              if radius is None:

                  return []

              start = angle_value(
                  element,
                  "startAngle"
              )

              end = angle_value(
                  element,
                  "endAngle"
              )

              if (
                  start is None
                  or
                  end is None
              ):

                  return []

              srs = current_srs(
                  element
              ).upper()

              # AIXM commonly uses EPSG:4326.
              # For EPSG:4326 the angular direction is
              # mirrored relative to lon/lat plotting.
              #
              # We therefore explicitly handle the axis
              # order rather than assuming GeoJSON ordering.

              delta = end - start

              if delta == 0:

                  delta = 360.0

              # Keep the defined direction and ensure we don't
              # accidentally create multiple turns.

              while delta > 360.0:

                  delta -= 360.0

              while delta < -360.0:

                  delta += 360.0

              steps = max(
                  8,
                  int(
                      abs(delta)
                      /
                      4.0
                  )
              )

              steps = min(
                  steps,
                  180
              )

              points = []

              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i
                      /
                      steps
                  )

                  angle = (
                      start
                      +
                      delta
                      *
                      fraction
                  )

                  radians = math.radians(
                      angle
                  )

                  # Radius is measured in metres.
                  #
                  # EPSG:4326 uses latitude/longitude
                  # axis order, so angular direction is
                  # reversed when represented as lon/lat.
                  if (
                      "4326" in srs
                      and
                      "CRS84" not in srs
                  ):

                      lon = (
                          center[0]
                          +
                          (
                              radius
                              *
                              math.cos(
                                  radians
                              )
                              /
                              metres_per_degree_lon(
                                  center[1]
                              )
                          )
                      )

                      lat = (
                          center[1]
                          -
                          (
                              radius
                              *
                              math.sin(
                                  radians
                              )
                              /
                              metres_per_degree_lat()
                          )
                      )

                  else:

                      lon = (
                          center[0]
                          +
                          (
                              radius
                              *
                              math.cos(
                                  radians
                              )
                              /
                              metres_per_degree_lon(
                                  center[1]
                              )
                          )
                      )

                      lat = (
                          center[1]
                          +
                          (
                              radius
                              *
                              math.sin(
                                  radians
                              )
                              /
                              metres_per_degree_lat()
                          )
                      )

                  points.append(
                      [
                          lon,
                          lat
                      ]
                  )

              return points

          # --------------------------------------------------------
          # Curve segment extraction.
          # --------------------------------------------------------

          LINE_SEGMENTS = {
              "LineStringSegment",
              "GeodesicString",
              "Geodesic",
              "ArcStringByBulge"
          }

          ARC_SEGMENTS = {
              "Arc",
              "ArcString",
              "Circle"
          }

          def segment_points(
              segment,
              visited=None
          ):

              if visited is None:

                  visited = set()

              if segment is None:

                  return []

              marker = id(
                  segment
              )

              if marker in visited:

                  return []

              visited.add(
                  marker
              )

              variants = resolved_variants(
                  segment
              )

              if not variants:

                  return []

              target = variants[-1]

              name = local(
                  target.tag
              )

              if name == "ArcByCenterPoint":

                  return arc_by_center(
                      target
                  )

              if name == "CircleByCenterPoint":

                  points = arc_by_center(
                      target
                  )

                  if points:

                      if (
                          points[0]
                          !=
                          points[-1]
                      ):

                          points.append(
                              points[0]
                          )

                  return points

              if name in LINE_SEGMENTS:

                  return direct_coordinates(
                      target
                  )

              if name in ARC_SEGMENTS:

                  points = direct_coordinates(
                      target
                  )

                  # A GML Arc is defined by control points.
                  # Keep those points in sequence. This preserves
                  # the actual source geometry rather than dropping
                  # the feature when the arc cannot be densified.
                  return points

              if name == "Curve":

                  result = []

                  for child in target.iter():

                      child_name = local(
                          child.tag
                      )

                      if child_name in {
                          "LineStringSegment",
                          "GeodesicString",
                          "Geodesic",
                          "ArcStringByBulge",
                          "Arc",
                          "ArcString",
                          "Circle",
                          "ArcByCenterPoint",
                          "CircleByCenterPoint"
                      }:

                          result.extend(
                              segment_points(
                                  child,
                                  visited
                              )
                          )

                  return result

              # Generic fallback:
              # if the referenced object contains known curve
              # segments, process them.
              result = []

              for child in target.iter():

                  child_name = local(
                      child.tag
                  )

                  if child_name in {
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcStringByBulge",
                      "Arc",
                      "ArcString",
                      "Circle",
                      "ArcByCenterPoint",
                      "CircleByCenterPoint"
                  }:

                      result.extend(
                          segment_points(
                              child,
                              visited
                          )
                      )

              if result:

                  return result

              return direct_coordinates(
                  target
              )

          # --------------------------------------------------------
          # Ring extraction.
          # --------------------------------------------------------

          def ring_points(
              ring
          ):

              if ring is None:

                  return []

              variants = resolved_variants(
                  ring
              )

              if not variants:

                  return []

              target = variants[-1]

              # Direct LinearRing coordinates.
              direct = []

              for child in target.iter():

                  child_name = local(
                      child.tag
                  )

                  if child_name in {
                      "posList",
                      "pos"
                  }:

                      if child.text:

                          direct.extend(
                              pair_list(
                                  child,
                                  child.text
                              )
                          )

              if len(direct) >= 4:

                  return direct

              # AIXM commonly uses:
              #
              # Ring
              #   curveMember
              #     Curve
              #       segments
              #         GeodesicString
              #         ArcByCenterPoint
              #
              result = []

              for child in target:

                  child_name = local(
                      child.tag
                  )

                  if child_name != "curveMember":

                      continue

                  members = resolved_variants(
                      child
                  )

                  member = (
                      members[-1]
                      if members
                      else
                      child
                  )

                  # The curveMember can itself contain a Curve.
                  #
                  # It can also resolve directly to a curve object.

                  points = segment_points(
                      member
                  )

                  if points:

                      result.extend(
                          points
                      )

              if len(result) >= 2:

                  # Remove duplicated join points between curve
                  # segments.

                  cleaned = []

                  for point in result:

                      if (
                          not cleaned
                          or
                          point
                          !=
                          cleaned[-1]
                      ):

                          cleaned.append(
                              point
                          )

                  result = cleaned

                  if len(result) >= 3:

                      if (
                          result[0]
                          !=
                          result[-1]
                      ):

                          result.append(
                              result[0]
                          )

                  return result

              # Final recursive fallback.

              fallback = direct_coordinates(
                  target
              )

              if len(fallback) >= 4:

                  return fallback

              return []

          # --------------------------------------------------------
          # Polygon patch extraction.
          # --------------------------------------------------------

          def polygon_from_patch(
              patch
          ):

              exterior_ring = None
              interior_rings = []

              for child in patch.iter():

                  name = local(
                      child.tag
                  )

                  if name == "exterior":

                      exterior_ring = child

                      break

              if exterior_ring is None:

                  return None

              exterior_ring_candidates = []

              for child in exterior_ring.iter():

                  if local(
                      child.tag
                  ) in {
                      "LinearRing",
                      "Ring"
                  }:

                      exterior_ring_candidates.append(
                          child
                      )

              if not exterior_ring_candidates:

                  return None

              exterior = ring_points(
                  exterior_ring_candidates[0]
              )

              if len(exterior) < 4:

                  return None

              for child in patch.iter():

                  if local(
                      child.tag
                  ) != "interior":

                      continue

                  for ring in child.iter():

                      if local(
                          ring.tag
                      ) in {
                          "LinearRing",
                          "Ring"
                      }:

                          points = ring_points(
                              ring
                          )

                          if len(points) >= 4:

                              interior_rings.append(
                                  points
                              )

                          break

              return [
                  exterior
              ] + interior_rings

          # --------------------------------------------------------
          # Find surfaces associated with an Airspace.
          # --------------------------------------------------------

          def surfaces_for_airspace(
              airspace
          ):

              surfaces = []
              seen = set()

              def add_surface(
                  element
              ):

                  if element is None:

                      return

                  for variant in resolved_variants(
                      element
                  ):

                      name = local(
                          variant.tag
                      )

                      if name in {
                          "Surface",
                          "CompositeSurface"
                      }:

                          marker = id(
                              variant
                          )

                          if marker not in seen:

                              seen.add(
                                  marker
                              )

                              surfaces.append(
                                  variant
                              )

                      for child in variant.iter():

                          child_name = local(
                              child.tag
                          )

                          if child_name in {
                              "Surface",
                              "CompositeSurface"
                          }:

                              marker = id(
                                  child
                              )

                              if marker not in seen:

                                  seen.add(
                                      marker
                                  )

                                  surfaces.append(
                                      child
                                  )

              # Direct horizontalProjection elements.
              for element in airspace.iter():

                  name = local(
                      element.tag
                  )

                  if name == "horizontalProjection":

                      add_surface(
                          element
                      )

                  elif name == "theAirspaceVolume":

                      resolved = resolve(
                          element
                      )

                      if resolved is not None:

                          for child in resolved.iter():

                              if local(
                                  child.tag
                              ) == "horizontalProjection":

                                  add_surface(
                                      child
                                  )

              # Direct AirspaceVolume objects.
              for element in airspace.iter():

                  if local(
                      element.tag
                  ) != "AirspaceVolume":

                      continue

                  for child in element.iter():

                      if local(
                          child.tag
                      ) == "horizontalProjection":

                          add_surface(
                              child
                          )

              return surfaces

          # --------------------------------------------------------
          # Convert surfaces to polygons.
          # --------------------------------------------------------

          def polygons_for_airspace(
              airspace
          ):

              polygons = []

              for surface in surfaces_for_airspace(
                  airspace
              ):

                  for patch in surface.iter():

                      if local(
                          patch.tag
                      ) != "PolygonPatch":

                          continue

                      polygon = polygon_from_patch(
                          patch
                      )

                      if polygon is not None:

                          polygons.append(
                              polygon
                          )

              return polygons

          # --------------------------------------------------------
          # Text helpers.
          # --------------------------------------------------------

          def text_values(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }

              values = []

              for child in element.iter():

                  if (
                      local(
                          child.tag
                      ).lower()
                      in wanted
                      and
                      child.text
                  ):

                      value = (
                          child.text.strip()
                      )

                      if value:

                          values.append(
                              value
                          )

              return values

          def first_text(
              element,
              names
          ):

              values = text_values(
                  element,
                  names
              )

              return (
                  values[0]
                  if values
                  else ""
              )

          # --------------------------------------------------------
          # Airspace classification.
          #
          # AIXM's Airspace type and class are treated separately.
          #
          # AviMap output:
          #
          # A-G
          # PA
          # RA
          # DA
          # ATZ
          # MATZ
          # RMZ
          # TMZ
          # --------------------------------------------------------

          categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          counts = {
              category: 0
              for category in categories
          }

          geometry_counts = {
              category: 0
              for category in categories
          }

          def normalise_code(
              value
          ):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )

          def classify(
              airspace
          ):

              type_values = text_values(
                  airspace,
                  {
                      "type",
                      "AirspaceType",
                      "codeType"
                  }
              )

              class_values = text_values(
                  airspace,
                  {
                      "class",
                      "AirspaceClass",
                      "codeClass",
                      "classification"
                  }
              )

              other_values = text_values(
                  airspace,
                  {
                      "designator",
                      "name",
                      "localType",
                      "AirspaceLocalType"
                  }
              )

              # ----------------------------------------------------
              # First use explicit AIXM type codes.
              # ----------------------------------------------------

              explicit = []

              for value in (
                  type_values
                  +
                  class_values
              ):

                  code = normalise_code(
                      value
                  )

                  explicit.append(
                      code
                  )

              # Special categories first.
              for code in explicit:

                  if code in {
                      "MATZ"
                  }:

                      return "MATZ"

                  if code in {
                      "RMZ"
                  }:

                      return "RMZ"

                  if code in {
                      "TMZ"
                  }:

                      return "TMZ"

                  if code in {
                      "ATZ"
                  }:

                      return "ATZ"

              # P/R/D are represented by AviMap as PA/RA/DA.
              for code in explicit:

                  if code in {
                      "P",
                      "PROHIBITED"
                  }:

                      return "PA"

                  if code in {
                      "R",
                      "RESTRICTED"
                  }:

                      return "RA"

                  if code in {
                      "D",
                      "DANGER"
                  }:

                      return "DA"

              # Class A-G.
              for code in (
                  class_values
                  +
                  type_values
              ):

                  value = normalise_code(
                      code
                  )

                  if value in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return value

                  match = re.search(
                      r"CLASS([A-G])",
                      value
                  )

                  if match:

                      return match.group(
                          1
                      )

              # ----------------------------------------------------
              # Text fallback.
              # ----------------------------------------------------

              combined = " ".join(
                  type_values
                  +
                  class_values
                  +
                  other_values
              ).upper()

              if (
                  "MILITARY AERODROME TRAFFIC ZONE"
                  in combined
                  or
                  re.search(
                      r"\bMATZ\b",
                      combined
                  )
              ):

                  return "MATZ"

              if (
                  "RADIO MANDATORY ZONE"
                  in combined
                  or
                  re.search(
                      r"\bRMZ\b",
                      combined
                  )
              ):

                  return "RMZ"

              if (
                  "TRANSPONDER MANDATORY ZONE"
                  in combined
                  or
                  re.search(
                      r"\bTMZ\b",
                      combined
                  )
              ):

                  return "TMZ"

              if (
                  "AERODROME TRAFFIC ZONE"
                  in combined
                  or
                  re.search(
                      r"\bATZ\b",
                      combined
                  )
              ):

                  return "ATZ"

              if (
                  "PROHIBITED"
                  in combined
              ):

                  return "PA"

              if (
                  "RESTRICTED"
                  in combined
              ):

                  return "RA"

              if (
                  "DANGER"
                  in combined
              ):

                  return "DA"

              match = re.search(
                  r"\bCLASS\s*([A-G])\b",
                  combined
              )

              if match:

                  return match.group(
                      1
                  )

              return None

          # --------------------------------------------------------
          # Airspace processing.
          # --------------------------------------------------------

          raw_count = 0
          classified_count = 0
          geometry_failures = 0

          features = []

          # Used to prevent duplicate feature output where an
          # Airspace has repeated geometry components.
          feature_keys = set()

          # --------------------------------------------------------
          # Diagnostic geometry structure counters.
          # --------------------------------------------------------

          geometry_tag_counts = {}

          for element in root.iter():

              if local(
                  element.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              category = classify(
                  element
              )

              if category is None:

                  continue

              classified_count += 1

              counts[
                  category
              ] += 1

              # ----------------------------------------------------
              # Diagnostics: identify geometry objects associated
              # with this airspace.
              # ----------------------------------------------------

              for child in element.iter():

                  name = local(
                      child.tag
                  )

                  if name in {
                      "horizontalProjection",
                      "AirspaceVolume",
                      "AirspaceGeometryComponent",
                      "Surface",
                      "CompositeSurface",
                      "PolygonPatch",
                      "Ring",
                      "LinearRing",
                      "curveMember",
                      "Curve",
                      "segments",
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "Arc",
                      "ArcString",
                      "ArcByCenterPoint",
                      "Circle",
                      "CircleByCenterPoint",
                      "pos",
                      "posList"
                  }:

                      geometry_tag_counts[
                          name
                      ] = (
                          geometry_tag_counts.get(
                              name,
                              0
                          )
                          +
                          1
                      )

              polygons = polygons_for_airspace(
                  element
              )

              if not polygons:

                  geometry_failures += 1

                  continue

              # ----------------------------------------------------
              # Remove malformed polygons.
              # ----------------------------------------------------

              valid_polygons = []

              for polygon in polygons:

                  if not polygon:

                      continue

                  exterior = polygon[0]

                  if len(
                      exterior
                  ) < 4:

                      continue

                  if (
                      exterior[0]
                      !=
                      exterior[-1]
                  ):

                      exterior.append(
                          exterior[0]
                      )

                  valid_polygons.append(
                      polygon
                  )

              if not valid_polygons:

                  geometry_failures += 1

                  continue

              geometry_counts[
                  category
              ] += 1

              # ----------------------------------------------------
              # Build GeoJSON geometry.
              # ----------------------------------------------------

              if len(
                  valid_polygons
              ) == 1:

                  geometry = {
                      "type":
                          "Polygon",

                      "coordinates":
                          valid_polygons[0]
                  }

              else:

                  geometry = {
                      "type":
                          "MultiPolygon",

                      "coordinates":
                          valid_polygons
                  }

              designator = first_text(
                  element,
                  {
                      "designator"
                  }
              )

              name = first_text(
                  element,
                  {
                      "name"
                  }
              )

              # Extract class/type information for diagnostics and
              # future styling.

              airspace_type = first_text(
                  element,
                  {
                      "type"
                  }
              )

              airspace_class = first_text(
                  element,
                  {
                      "class"
                  }
              )

              # ----------------------------------------------------
              # Geometry-based dedupe.
              # ----------------------------------------------------

              geometry_key = json.dumps(
                  geometry,
                  sort_keys=True,
                  separators=(
                      ",",
                      ":"
                  )
              )

              key = (
                  designator,
                  category,
                  geometry_key
              )

              if key in feature_keys:

                  continue

              feature_keys.add(
                  key
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          {
                              "name":
                                  (
                                      name
                                      or
                                      designator
                                      or
                                      "Unknown airspace"
                                  ),

                              "designator":
                                  designator,

                              "category":
                                  category,

                              "airspace_type":
                                  airspace_type,

                              "airspace_class":
                                  airspace_class,

                              "source":
                                  "NATS UK ICAO AIP Dataset",

                              "airac":
                                  AIRAC
                          },

                      "geometry":
                          geometry
                  }
              )

          # --------------------------------------------------------
          # Results.
          # --------------------------------------------------------

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "Raw NATS Airspace:",
              raw_count
          )

          print(
              "Classified AviMap airspaces:",
              classified_count
          )

          print(
              "Valid GeoJSON features:",
              len(features)
          )

          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print(
              "CLASSIFICATION COUNTS"
          )

          print(
              "------------------------------------------"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{counts[category]}"
              )

          print("")
          print(
              "GEOMETRY COUNTS"
          )

          print(
              "------------------------------------------"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts[category]}"
              )

          print("")
          print(
              "GEOMETRY STRUCTURE FOUND"
          )

          print(
              "------------------------------------------"
          )

          for name in sorted(
              geometry_tag_counts
          ):

              print(
                  f"{name:24s}: "
                  f"{geometry_tag_counts[name]}"
              )

          # --------------------------------------------------------
          # Sanity checks.
          # --------------------------------------------------------

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  "AIXM Airspace count."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero AviMap airspace "
                  "classifications were produced."
              )

          if len(features) == 0:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "GEOMETRY EXTRACTION FAILED"
              )
              print(
                  "=========================================="
              )

              print("")
              print(
                  "The AIXM was downloaded and the requested "
                  "airspaces were classified, but no valid "
                  "polygon geometry was produced."
              )

              print("")
              print(
                  "Geometry structure observed:"
              )

              for name in sorted(
                  geometry_tag_counts
              ):

                  print(
                      f"{name}: "
                      f"{geometry_tag_counts[name]}"
                  )

              print("")
              print(
                  "Existing GeoJSON will NOT be replaced."
              )

              raise SystemExit(
                  1
              )

          # --------------------------------------------------------
          # Write GeoJSON.
          # --------------------------------------------------------

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }

          Path(
              OUT
          ).write_text(
              json.dumps(
                  output,
                  separators=(
                      ",",
                      ":"
                  ),
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "GeoJSON written:"
          )

          print(
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPs TO GEOJSON
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def normalise(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          field_map = {
              normalise(field):
                  field
              for field in fields
              if field
          }

          def find_field(
              *names
          ):

              for name in names:

                  key = normalise(
                      name
                  )

                  if key in field_map:

                      return field_map[
                          key
                      ]

              for key, original in field_map.items():

                  for name in names:

                      target = normalise(
                          name
                      )

                      if (
                          target in key
                          or
                          key in target
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              lat_field is None
              or
              lon_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP "
                  "latitude/longitude fields."
              )

          def coordinate(
              value,
              latitude
          ):

              if value is None:

                  return None

              text = str(
                  value
              ).strip()

              if not text:

                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(
                          1
                      ).upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  number = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )

              except ValueError:

                  return None

              limit = (
                  90
                  if latitude
                  else
                  180
              )

              if not (
                  -limit
                  <= number
                  <= limit
              ):

                  return None

              if hemisphere in {
                  "S",
                  "W"
              }:

                  number = -abs(
                      number
                  )

              return number

          features = []

          for row in rows:

              latitude = coordinate(
                  row.get(
                      lat_field
                  ),
                  True
              )

              longitude = coordinate(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  continue

              properties = {
                  str(key):
                      value
                  for key, value
                  in row.items()
                  if key
              }

              if name_field:

                  properties[
                      "name"
                  ] = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              else:

                  properties[
                      "name"
                  ] = "VRP"

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      longitude,
                                      latitude
                                  ]
                          }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: Zero valid VRPs."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  ),
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE GENERATED DATA
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"
          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          test -s \
            "${AIRSPACE_FILE}"

          test -s \
            "${VRP_FILE}"

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "${AIRSPACE_FILE}"
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              "${VRP_FILE}"
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""

          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero airspaces."

            exit 1

          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero VRPs."

            exit 1

          fi

          echo ""
          echo "Airspace categories in generated GeoJSON:"

          jq -r '
            .features
            | group_by(.properties.category)
            | .[]
            | "\(.[0].properties.category): \(length)"
          ' \
            "${AIRSPACE_FILE}"

          echo ""
          echo "Validation successful."

      # ============================================================
      # INSTALL VALIDATED AVIATION DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p \
            data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT UPDATED NATS AVIATION DATA
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."

            exit 0

          fi

          echo ""
          echo "Changes to be committed:"
          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
