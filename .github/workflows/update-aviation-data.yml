              if not coordinates:
                  continue


              identifier = (
                  attr(
                      geometry,
                      "id"
                  )
                  or
                  attr(
                      geometry,
                      "uuid"
                  )
                  or
                  ""
              )


              href = attr(
                  geometry,
                  "href"
              )


              standalone_geometry_matches.append(
                  {
                      "tag":
                          local(
                              geometry.tag
                          ),

                      "id":
                          identifier,

                      "href":
                          href,

                      "coordinates":
                          coordinates
                  }
              )


          # ========================================================
          # REPORT AIRSPACE MATCHES
          # ========================================================

          print("")
          print(
              "Potential EGUL-related Airspace objects:",
              len(
                  matches
              )
          )


          if not matches:

              print("")
              print(
                  "NO AIRSPACE MATCHES FOUND."
              )

              print(
                  "The MATZ may be represented by geometry which is"
              )

              print(
                  "not referenced directly from an Airspace object."
              )


          for number, match in enumerate(
              matches,
              start=1
          ):

              print("")
              print(
                  "------------------------------------------"
              )

              print(
                  f"AIRSPACE MATCH {number}"
              )

              print(
                  "------------------------------------------"
              )

              print(
