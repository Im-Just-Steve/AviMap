          )

          # --------------------------------------------------------
          # Lakenheath / Mildenhall CMATZ.
          #
          # Keep the two published MATZ cores/stubs as the component
          # geometries, then provide one CMATZ MultiPolygon carrying
          # the combined-zone identity. NATS Note 5 describes the
          # non-standard demarcation joining the easternmost points
          # of the two 5 NM circles.
          #
          # For MSFS visualisation the component polygons are retained
          # rather than performing a lossy polygon boolean operation.
          # --------------------------------------------------------

          lakenheath = next(
              item for item in MATZ
              if item["name"] == "Lakenheath"
          )

          mildenhall = next(
              item for item in MATZ
              if item["name"] == "Mildenhall"
          )

          cmatz_polygons = []

          for item in (lakenheath, mildenhall):

              cmatz_polygons.append(
                  [
                      circle(
                          item["lat"],
                          item["lon"],
                          5.0,
                      )
                  ]
              )

              lengths = [5.0, 5.0]

              # Lakenheath note 2 identifies the NE stub as the
              # non-standard stub. The lateral dimensions remain the
              # standard 4 NM width.
              for index, heading in enumerate(item["headings"]):

                  length = lengths[index]

                  cmatz_polygons.append(
                      [
                          rectangle_from_axis(
                              item["lat"],
                              item["lon"],
                              heading,
                              length,
                              4.0,
                          )
                      ]
                  )

          # Add a thin connector between the easternmost portions of
          # the two 5 NM circles. This represents NATS Note 5's
          # straight-line demarcation.
          #
          # The connector is deliberately narrow so it acts as the
          # demarcation rather than creating a large artificial block.
          east_l = destination(
              lakenheath["lat"],
              lakenheath["lon"],
              90.0,
              5.0,
          )

          east_m = destination(
              mildenhall["lat"],
              mildenhall["lon"],
              90.0,
              5.0,
          )

          connector_left = destination(
              east_l[0],
              east_l[1],
              0.0,
              0.05,
          )

          connector_right = destination(
              east_l[0],
              east_l[1],
              180.0,
              0.05,
          )

          connector_end_left = destination(
              east_m[0],
              east_m[1],
              0.0,
              0.05,
          )

          connector_end_right = destination(
              east_m[0],
              east_m[1],
              180.0,
              0.05,
          )

          cmatz_polygons.append(
              [
                  [
                      [connector_left[1], connector_left[0]],
                      [connector_end_left[1], connector_end_left[0]],
                      [connector_end_right[1], connector_end_right[0]],
                      [connector_right[1], connector_right[0]],
                      [connector_left[1], connector_left[0]],
                  ]
              ]
          )

          features.append(
              feature(
                  {
                      "type": "MultiPolygon",
                      "coordinates": cmatz_polygons,
                  },
                  {
                      "source": "NATS UK AIP ENR 2.2",
                      "airspace_type": "CMATZ",
                      "name": "Lakenheath/Mildenhall CMATZ",
                      "controlling_aerodrome": "Lakenheath",
                      "frequency": "128.900",
                      "geometry_part": "combined_zone",
                      "components": [
                          "Lakenheath",
                          "Mildenhall",
                      ],
                      "notes": (
                          "NATS Notes 2, 3, 4 and 5. "
                          "Non-standard Lakenheath NE stub; "
                          "Mildenhall stub extension; "
                          "non-standard eastern demarcation."
                      ),
                      "lower_limit": "SFC",
                      "upper_limit": "3000 FT AAL",
                  },
              )
          )

          # --------------------------------------------------------
          # Summary / write.
          # --------------------------------------------------------

          collection = {
              "type": "FeatureCollection",
              "features": features,
          }

          OUT.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          print("")
          print("==========================================")
          print("NATS MATZ / CMATZ GENERATION")
          print("==========================================")
          print("MATZ definitions:", len(MATZ))
          print("MATZ/CMATZ GeoJSON features:", len(features))
          print("Output:", OUT)
          print("==========================================")

