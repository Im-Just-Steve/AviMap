      - name: Commit updated aviation data
        shell: bash
        run: |
          set -euo pipefail

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Preparing aviation data commit"
          echo "=========================================="
          echo ""
          echo "NATS AIRAC: $AIRAC"
          echo ""

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff \
            --cached \
            --quiet; then

            echo "No aviation data changes detected."

            exit 0

          fi

          echo ""
          echo "Changes to be committed:"
          git diff \
            --cached \
            --stat

          git commit \
            -m "Update NATS aviation data ${AIRAC}"

          git push

          echo ""
          echo "=========================================="
          echo "AVIATION DATA UPDATED"
          echo "=========================================="
          echo ""
          echo "NATS AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "Airspace and VRP GeoJSON committed."
