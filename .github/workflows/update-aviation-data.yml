name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats-datasets.html

          test -s /tmp/nats-datasets.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = "https://nats-uk.ead-it.com"

          html = open(
              "/tmp/nats-datasets.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(
              timezone.utc
          ).date()

          def select_dataset(patterns, label):
              candidates = []

              for href in hrefs:

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          href,
                          flags=re.I
                      )

                      if not match:
                          continue

                      try:
                          date = datetime.strptime(
                              match.group(1),
                              "%Y%m%d"
                          ).date()
                      except ValueError:
                          continue

                      candidates.append(
                          (date, href)
                      )

                      break

              if not candidates:

                  print("")
                  print(
                      f"ERROR: No {label} dataset found on NATS page."
                  )

                  print("")
                  print("Relevant links found:")

                  for href in hrefs:

                      upper = href.upper()

                      if (
                          "AIP" in upper
                          or "AIS" in upper
                          or "VRP" in upper
                      ):
                          print(href)

                  raise SystemExit(1)

              current = [
                  item
                  for item in candidates
                  if item[0] <= today
              ]

              date, href = max(
                  current or candidates,
                  key=lambda item: item[0]
              )

              url = urljoin(
                  BASE,
                  href
              )

              print("")
              print(label)
              print("  Date:", date)
              print("  URL :", url)

              return date, url

          # --------------------------------------------------------
          # AIP XML
          # --------------------------------------------------------

          aip_date, aip_url = select_dataset(
              [
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})\.XML$',
                  r'EG_AIP_DS_FULL_(\d{8})\.xml$'
              ],
              "UK ICAO AIP XML"
          )

          # --------------------------------------------------------
          # AIP KML / KMZ
          #
          # Current NATS page exposes:
          #
          # EG_AIS_DS_FULL_20260806_KML.zip
          #
          # which contains:
          #
          # EG_AIP_DS_FULL_20260806.kmz
          # --------------------------------------------------------

          kml_date, kml_url = select_dataset(
              [
                  r'EG_AIS_DS_FULL_(\d{8})_KML\.zip$',
                  r'EG_AIP_DS_FULL_(\d{8})_KML\.zip$',
                  r'EG_AIS_DS_(\d{8})_KML\.zip$'
              ],
              "UK ICAO AIP KML"
          )

          # --------------------------------------------------------
          # VRP
          # --------------------------------------------------------

          vrp_date, vrp_url = select_dataset(
              [
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV$',
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV$'
              ],
              "NATS VRP"
          )

          # --------------------------------------------------------
          # XML and KML must be the same AIRAC
          # --------------------------------------------------------

          if aip_date != kml_date:

              raise SystemExit(
                  "ERROR: AIP XML and KML AIRAC dates differ. "
                  f"XML={aip_date}, KML={kml_date}"
              )

          print("")
          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print("AIP XML:")
          print(aip_url)
          print("")
          print("AIP KML:")
          print(kml_url)
          print("")
          print("VRP:")
          print(vrp_url)
          print("")
          print("AIRAC:")
          print(aip_date)

          open(
              "/tmp/nats-aip-url.txt",
              "w"
          ).write(aip_url)

          open(
              "/tmp/nats-aip-date.txt",
              "w"
          ).write(str(aip_date))

          open(
              "/tmp/nats-kml-url.txt",
              "w"
          ).write(kml_url)

          open(
              "/tmp/nats-kml-date.txt",
              "w"
          ).write(str(kml_date))

          open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ).write(vrp_url)

          open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ).write(str(vrp_date))
          PY

      # ============================================================
      # DOWNLOAD NATS AIP XML
      # ============================================================

      - name: Download NATS AIP XML dataset
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo "=========================================="
          echo "Downloading NATS AIP XML"
          echo "=========================================="
          echo ""
          echo "$AIP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$AIP_URL" \
            -o /tmp/nats-aip-source

          test -s /tmp/nats-aip-source

          rm -rf /tmp/nats-aip
          mkdir -p /tmp/nats-aip

          if file /tmp/nats-aip-source | grep -qi "zip"; then

              echo "AIP source is ZIP."

              unzip \
                -o \
                /tmp/nats-aip-source \
                -d /tmp/nats-aip

          else

              echo "ERROR: AIP source is not a ZIP."

              file /tmp/nats-aip-source

              exit 1

          fi

          echo ""
          echo "AIP extracted files:"

          find \
            /tmp/nats-aip \
            -type f \
            -print

          AIP_XML=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "*.xml" \
              | head -n 1
          )

          if [ -z "$AIP_XML" ]; then

              echo ""
              echo "ERROR: No AIP XML found."

              exit 1

          fi

          cp \
            "$AIP_XML" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIP XML:"
          echo "$AIP_XML"

          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS KML DATASET
      #
      # IMPORTANT:
      #
      # NATS gives us a ZIP containing a KMZ.
      # The KMZ then contains the actual KML.
      #
      # ZIP
      #  └── EG_AIP_DS_FULL_20260806.kmz
      #       └── *.kml
      #
      # ============================================================

      - name: Download NATS AIP KML dataset
        run: |
          set -euo pipefail

          KML_URL=$(cat /tmp/nats-kml-url.txt)

          echo "=========================================="
          echo "Downloading NATS AIP KML dataset"
          echo "=========================================="
          echo ""
          echo "$KML_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$KML_URL" \
            -o /tmp/nats-kml-source

          test -s /tmp/nats-kml-source

          rm -rf \
            /tmp/nats-kml \
            /tmp/nats-kmz

          mkdir -p \
            /tmp/nats-kml \
            /tmp/nats-kmz

          echo ""
          echo "Outer archive:"

          file \
            /tmp/nats-kml-source

          # --------------------------------------------------------
          # OUTER ZIP
          # --------------------------------------------------------

          unzip \
            -o \
            /tmp/nats-kml-source \
            -d /tmp/nats-kml

          echo ""
          echo "Outer ZIP contents:"

          find \
            /tmp/nats-kml \
            -type f \
            -print

          # --------------------------------------------------------
          # FIND KMZ
          # --------------------------------------------------------

          KMZ_FILE=$(
            find \
              /tmp/nats-kml \
              -type f \
              -iname "*.kmz" \
              | head -n 1
          )

          if [ -z "$KMZ_FILE" ]; then

              echo ""
              echo "ERROR: No KMZ file found inside NATS KML ZIP."

              find \
                /tmp/nats-kml \
                -type f \
                -print

              exit 1

          fi

          echo ""
          echo "KMZ found:"
          echo "$KMZ_FILE"

          # --------------------------------------------------------
          # KMZ IS ANOTHER ZIP
          # --------------------------------------------------------

          echo ""
          echo "Extracting KMZ..."

          unzip \
            -o \
            "$KMZ_FILE" \
            -d /tmp/nats-kmz

          echo ""
          echo "KMZ contents:"

          find \
            /tmp/nats-kmz \
            -type f \
            -print

          # --------------------------------------------------------
          # FIND ACTUAL KML
          # --------------------------------------------------------

          KML_COUNT=$(
            find \
              /tmp/nats-kmz \
              -type f \
              -iname "*.kml" \
              | wc -l
          )

          echo ""
          echo "Actual KML files found:"
          echo "$KML_COUNT"

          if [ "$KML_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR: KMZ contained no KML."

              find \
                /tmp/nats-kmz \
                -type f \
                -print

              exit 1

          fi

          mkdir -p \
            /tmp/nats-final-kml

          find \
            /tmp/nats-kmz \
            -type f \
            -iname "*.kml" \
            -exec cp {} /tmp/nats-final-kml/ \;

          echo ""
          echo "Final KML files:"

          find \
            /tmp/nats-final-kml \
            -type f \
            -print

      # ============================================================
      # DOWNLOAD NATS VRPS
      # ============================================================

      - name: Download NATS VRP list
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "$VRP_URL" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          rm -rf \
            /tmp/nats-vrp

          mkdir -p \
            /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi "zip"; then

              unzip \
                -o \
                /tmp/nats-vrp-source \
                -d /tmp/nats-vrp

          else

              cp \
                /tmp/nats-vrp-source \
                /tmp/nats-vrp/vrps.csv

          fi

          VRP_CSV=$(
            find \
              /tmp/nats-vrp \
              -type f \
              \( \
                -iname "*.csv" \
                -o \
                -iname "*.CSV" \
              \) \
              | head -n 1
          )

          if [ -z "$VRP_CSV" ]; then

              echo ""
              echo "ERROR: No VRP CSV found."

              find \
                /tmp/nats-vrp \
                -type f \
                -print

              exit 1

          fi

          cp \
            "$VRP_CSV" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "$VRP_CSV"

          wc -c \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS KML AIRSPACE TO GEOJSON
      # ============================================================

      - name: Convert NATS KML airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          KML_ROOT = Path(
              "/tmp/nats-final-kml"
          )

          AIP_XML = Path(
              "/tmp/uk-aip.xml"
          )

          OUT = Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "")
              ).strip()

          def classify(
              text,
              explicit_class=""
          ):

              value = clean(
                  text
              ).upper()

              # ----------------------------------------------------
              # SPECIAL ZONES
              # ----------------------------------------------------

              if re.search(
                  r"\b(?:MATZ|MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE|MILITARY\s+ATZ)\b",
                  value
              ):
                  return "MATZ"

              if re.search(
                  r"\b(?:RMZ|RADIO\s+(?:COMMUNICATION\s+)?MANDATORY\s+ZONE)\b",
                  value
              ):
                  return "RMZ"

              if re.search(
                  r"\b(?:TMZ|TRANSPONDER\s+MANDATORY\s+ZONE)\b",
                  value
              ):
                  return "TMZ"

              if re.search(
                  r"\b(?:ATZ|AERODROME\s+TRAFFIC\s+ZONE)\b",
                  value
              ):
                  return "ATZ"

              # ----------------------------------------------------
              # P / R / D
              # ----------------------------------------------------

              if re.search(
                  r"\b(?:PA|PROHIBITED\s+AREA|PROHIBITED)\b",
                  value
              ):
                  return "PA"

              if re.search(
                  r"\b(?:RA|RESTRICTED\s+AREA|RESTRICTED)\b",
                  value
              ):
                  return "RA"

              if re.search(
                  r"\b(?:DA|DANGER\s+AREA|DANGER)\b",
                  value
              ):
                  return "DA"

              # ----------------------------------------------------
              # CLASS A-G
              # ----------------------------------------------------

              explicit = re.sub(
                  r"[^A-Z0-9]",
                  "",
                  str(
                      explicit_class or ""
                  ).upper()
              )

              if explicit in {
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              }:
                  return explicit

              if explicit in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:
                  return explicit[-1]

              match = re.search(
                  r"\bCLASS\s*([A-G])\b",
                  value
              )

              if match:
                  return match.group(1)

              match = re.search(
                  r"\b([A-G])\s+CLASS\b",
                  value
              )

              if match:
                  return match.group(1)

              return None

          # ========================================================
          # READ AIP XML METADATA
          # ========================================================

          xml_index = []

          print("")
          print("==========================================")
          print("INDEXING NATS AIP XML")
          print("==========================================")

          try:

              tree = ET.parse(
                  AIP_XML
              )

              root = tree.getroot()

              for element in root.iter():

                  if local(
                      element.tag
                  ) != "Airspace":
                      continue

                  designator = ""
                  name = ""
                  metadata = []

                  for node in element.iter():

                      tag = local(
                          node.tag
                      )

                      value = clean(
                          node.text
                          if node.text
                          else ""
                      )

                      if not value:
                          continue

                      if tag.lower() in {
                          "designator",
                          "airspacedesignator"
                      }:

                          if not designator:
                              designator = value

                      if tag.lower() in {
                          "name",
                          "airspacename"
                      }:

                          if not name:
                              name = value

                      if tag.lower() in {
                          "type",
                          "airspacetype",
                          "localtype",
                          "airspacelocaltype",
                          "class",
                          "airspaceclassification",
                          "classification"
                      }:

                          metadata.append(
                              value
                          )

                  combined = " ".join(
                      [
                          designator,
                          name
                      ]
                      + metadata
                  )

                  category = classify(
                      combined
                  )

                  xml_index.append(
                      {
                          "designator": designator,
                          "name": name,
                          "category": category,
                          "text": combined
                      }
                  )

          except Exception as exc:

              print(
                  "WARNING: AIP XML metadata indexing failed:"
              )

              print(
                  repr(exc)
              )

          print(
              "AIP metadata records:",
              len(xml_index)
          )

          def xml_match(
              text
          ):

              upper = text.upper()

              for item in xml_index:

                  designator = (
                      item["designator"]
                      or ""
                  ).upper()

                  name = (
                      item["name"]
                      or ""
                  ).upper()

                  if (
                      designator
                      and
                      designator in upper
                  ):
                      return item

                  if (
                      name
                      and
                      len(name) >= 5
                      and
                      name in upper
                  ):
                      return item

              return None

          # ========================================================
          # KML COORDINATES
          # ========================================================

          def parse_coordinates(
              text
          ):

              points = []

              for token in re.split(
                  r"\s+",
                  clean(text)
              ):

                  if not token:
                      continue

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:

                      lon = float(
                          parts[0]
                      )

                      lat = float(
                          parts[1]
                      )

                  except ValueError:

                      continue

                  if not (
                      -180 <= lon <= 180
                      and
                      -90 <= lat <= 90
                  ):
                      continue

                  points.append(
                      [
                          lon,
                          lat
                      ]
                  )

              return points

          def geometry_from_placemark(
              placemark
          ):

              polygons = []

              for polygon in placemark.iter():

                  if local(
                      polygon.tag
                  ) != "Polygon":
                      continue

                  rings = []

                  for ring in polygon.iter():

                      if local(
                          ring.tag
                      ) != "LinearRing":
                          continue

                      coordinate_text = None

                      for child in ring:

                          if local(
                              child.tag
                          ) == "coordinates":

                              coordinate_text = (
                                  child.text
                                  or ""
                              )

                              break

                      if not coordinate_text:
                          continue

                      points = parse_coordinates(
                          coordinate_text
                      )

                      if len(points) < 3:
                          continue

                      if points[0] != points[-1]:

                          points.append(
                              points[0]
                          )

                      rings.append(
                          points
                      )

                  if rings:

                      polygons.append(
                          rings
                      )

              if not polygons:
                  return None

              if len(polygons) == 1:

                  return {
                      "type": "Polygon",
                      "coordinates": polygons[0]
                  }

              return {
                  "type": "MultiPolygon",
                  "coordinates": polygons
              }

          # ========================================================
          # PROCESS ALL KML FILES
          # ========================================================

          kml_files = sorted(
              KML_ROOT.rglob(
                  "*.kml"
              )
          )

          print("")
          print("==========================================")
          print("NATS KML AIRSPACE CONVERSION")
          print("==========================================")

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "KML files:",
              len(kml_files)
          )

          if not kml_files:

              raise SystemExit(
                  "ERROR: No final KML files found."
              )

          features = []

          placemark_count = 0
          geometry_count = 0
          filtered_count = 0

          categories = {}

          for kml_file in kml_files:

              print("")
              print(
                  "Reading:",
                  kml_file
              )

              tree = ET.parse(
                  kml_file
              )

              root = tree.getroot()

              for placemark in root.iter():

                  if local(
                      placemark.tag
                  ) != "Placemark":
                      continue

                  placemark_count += 1

                  name = ""

                  for child in placemark:

                      if local(
                          child.tag
                      ) == "name":

                          name = clean(
                              child.text
                              or ""
                          )

                          break

                  all_text = []

                  for node in placemark.iter():

                      if node.text:

                          value = clean(
                              node.text
                          )

                          if value:
                              all_text.append(
                                  value
                              )

                  placemark_text = " ".join(
                      all_text
                  )

                  metadata = xml_match(
                      placemark_text
                  )

                  category = classify(
                      placemark_text
                  )

                  if category is None and metadata:

                      category = metadata[
                          "category"
                      ]

                  # ------------------------------------------------
                  # OMIT EVERYTHING OUTSIDE OUR CURRENT DATASET
                  # ------------------------------------------------

                  if category is None:

                      filtered_count += 1

                      continue

                  geometry = geometry_from_placemark(
                      placemark
                  )

                  if geometry is None:
                      continue

                  geometry_count += 1

                  categories[
                      category
                  ] = (
                      categories.get(
                          category,
                          0
                      )
                      + 1
                  )

                  properties = {
                      "name": (
                          name
                          or
                          (
                              metadata["name"]
                              if metadata
                              else
                              "Unknown airspace"
                          )
                      ),
                      "category": category,
                      "source": (
                          "NATS UK ICAO AIP"
                      ),
                      "airac": AIRAC
                  }

                  if metadata:

                      if metadata[
                          "designator"
                      ]:

                          properties[
                              "designator"
                          ] = metadata[
                              "designator"
                          ]

                  features.append(
                      {
                          "type": "Feature",
                          "properties": properties,
                          "geometry": geometry
                      }
                  )

          print("")
          print("==========================================")
          print("AIRSPACE CONVERSION RESULT")
          print("==========================================")

          print("")
          print(
              "KML placemarks:",
              placemark_count
          )

          print(
              "Valid geometries:",
              geometry_count
          )

          print(
              "Filtered:",
              filtered_count
          )

          print(
              "GeoJSON features:",
              len(features)
          )

          print("")
          print("Categories:")

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              print(
                  f"  {category}: "
                  f"{categories.get(category, 0)}"
              )

          # --------------------------------------------------------
          # SAFETY
          # --------------------------------------------------------

          if not features:

              raise SystemExit(
                  "ERROR: NATS KML conversion produced "
                  "zero valid airspace geometries."
              )

          if len(features) < 100:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  f"airspace dataset: {len(features)}."
              )

          OUT.write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "Written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value)
                  .strip()
                  .lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(
              *names
          ):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              for key, original in normalised.items():

                  for name in names:

                      target = norm(
                          name
                      )

                      if (
                          target in key
                          or
                          key in target
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              not lat_field
              or
              not lon_field
          ):

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP "
                  f"coordinate fields: {fields}"
              )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = (
                  str(value)
                  .strip()
                  .replace(
                      ",",
                      "."
                  )
              )

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  number = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):

                          number = -abs(
                              number
                          )

                      return number

              except ValueError:

                  pass

              compact = (
                  text
                  .replace(
                      "°",
                      ""
                  )
                  .replace(
                      "'",
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      " ",
                      ""
                  )
              )

              try:

                  if "." in compact:

                      integer_part, decimal_part = (
                          compact.split(
                              ".",
                              1
                          )
                      )

                  else:

                      integer_part = compact
                      decimal_part = ""

                  if latitude:

                      if len(
                          integer_part
                      ) < 6:

                          return None

                      degrees = int(
                          integer_part[:2]
                      )

                      minutes = int(
                          integer_part[2:4]
                      )

                      seconds_text = (
                          integer_part[4:]
                      )

                  else:

                      if len(
                          integer_part
                      ) < 7:

                          return None

                      degrees = int(
                          integer_part[:3]
                      )

                      minutes = int(
                          integer_part[3:5]
                      )

                      seconds_text = (
                          integer_part[5:]
                      )

                  if decimal_part:

                      seconds_text += (
                          "."
                          + decimal_part
                      )

                  seconds = float(
                      seconds_text
                  )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):

                      return None

                  result = (
                      degrees
                      +
                      minutes / 60
                      +
                      seconds / 3600
                  )

                  if hemisphere in (
                      "S",
                      "W"
                  ):

                      result = -abs(
                          result
                      )

                  return result

              except (
                  ValueError,
                  IndexError
              ):

                  return None

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):

                  invalid += 1
                  continue

              name = (
                  str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()
                  if name_field
                  else ""
              )

              name = (
                  name
                  or
                  f"VRP {index}"
              )

              properties = {
                  str(k).strip(): v
                  for k, v in row.items()
                  if k
              }

              properties[
                  "name"
              ] = name

              properties[
                  "ident"
              ] = name

              properties[
                  "category"
              ] = "VRP"

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": properties,
                      "geometry": {
                          "type": "Point",
                          "coordinates": [
                              lon,
                              lat
                          ]
                      }
                  }
              )

          print("")
          print("==========================================")
          print("VRP CONVERSION RESULT")
          print("==========================================")

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          print(
              "Invalid:",
              invalid
          )

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero valid points."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING GENERATED NATS DATA"
          echo "=========================================="

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"
          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          test -s "$AIRSPACE_FILE"
          test -s "$VRP_FILE"

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "$AIRSPACE_FILE"
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              "$VRP_FILE"
          )

          echo ""
          echo "Airspaces: $AIRSPACE_COUNT"
          echo "VRPs:      $VRP_COUNT"

          test "$AIRSPACE_COUNT" -gt 0
          test "$VRP_COUNT" -gt 0

          jq -e \
            '.type == "FeatureCollection"' \
            "$AIRSPACE_FILE" \
            > /dev/null

          jq -e \
            '.type == "FeatureCollection"' \
            "$VRP_FILE" \
            > /dev/null

          echo ""
          echo "Validation successful."

      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          echo ""
          echo "Installed:"
          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff \
            --cached \
            --quiet; then

            echo "No aviation-data changes detected."

            exit 0

          fi

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          git diff \
            --cached \
            --stat

          git commit \
            -m "Update UK aviation data from NATS AIS ${AIRAC}"

          git push
