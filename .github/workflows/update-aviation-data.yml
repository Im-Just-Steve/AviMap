name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            curl \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # IMPORTANT:
      # NATS does NOT reliably expose the AIP dataset as a direct
      # href from the generic digital-datasets index.
      #
      # The Dataset Checklist is the authoritative discovery source.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINDING CURRENT NATS DATASETS"
          echo "=========================================="
          echo ""

          python3 <<'PY'
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/"
          )

          CHECKLIST_DIR = (
              BASE +
              "Checklists/"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          print(
              "Today (UTC):",
              today
          )

          # --------------------------------------------------------
          # Find checklist links from the NATS digital datasets page.
          # --------------------------------------------------------

          index_url = (
              BASE +
              "index.html"
          )

          print("")
          print(
              "Downloading NATS digital dataset index..."
          )
          print(
              index_url
          )

          request = urllib.request.Request(
              index_url,
              headers={
                  "User-Agent":
                  "AviMap-NATS-Data-Updater/1.0"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          except Exception as exc:

              raise SystemExit(
                  "ERROR: Could not download NATS "
                  f"dataset index: {exc}"
              )

          checklist_links = []

          for match in re.finditer(
              r'href\s*=\s*["\']([^"\']+)["\']',
              html,
              flags=re.I
          ):

              href = match.group(1)

              if re.search(
                  r"Dataset[_ ]Checklist[_ ]"
                  r"\d{4}[_-]\d{2}[_-]\d{2}",
                  href,
                  flags=re.I
              ):

                  checklist_links.append(
                      href
                  )

          # --------------------------------------------------------
          # If the index doesn't expose checklist hrefs, probe the
          # current and previous AIRAC checklist dates directly.
          #
          # This is intentionally bounded and does not guess dataset
          # download URLs.
          # --------------------------------------------------------

          checklist_candidates = []

          for day_offset in range(
              0,
              70
          ):

              from datetime import timedelta

              date = (
                  today
                  - timedelta(
                      days=day_offset
                  )
              )

              date_string = date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_DIR
                      +
                      f"Dataset_Checklist_"
                      f"{date_string}.HTML"
                  ),
                  (
                      CHECKLIST_DIR
                      +
                      f"Dataset_Checklist_"
                      f"{date_string}.html"
                  )
              ]

              checklist_candidates.extend(
                  candidates
              )

          # --------------------------------------------------------
          # Convert discovered relative links to absolute URLs.
          # --------------------------------------------------------

          for href in checklist_links:

              if href.startswith(
                  "http://"
              ) or href.startswith(
                  "https://"
              ):
                  checklist_candidates.append(
                      href
                  )

              elif href.startswith("/"):
                  checklist_candidates.append(
                      "https://nats-uk.ead-it.com"
                      + href
                  )

              else:
                  checklist_candidates.append(
                      CHECKLIST_DIR
                      + href
                  )

          # Remove duplicates while preserving order.
          seen = set()
          ordered_candidates = []

          for url in checklist_candidates:

              if url in seen:
                  continue

              seen.add(url)
              ordered_candidates.append(
                  url
              )

          checklist_found = None
          checklist_html = None
          checklist_date = None

          print("")
          print(
              "Searching NATS Dataset Checklists..."
          )

          for url in ordered_candidates:

              match = re.search(
                  r"Dataset[_ ]Checklist[_-]"
                  r"(\d{4})[_-](\d{2})[_-](\d{2})",
                  url,
                  flags=re.I
              )

              if not match:
                  continue

              try:

                  date = datetime.strptime(
                      "-".join(
                          match.groups()
                      ),
                      "%Y-%m-%d"
                  ).date()

              except ValueError:
                  continue

              if date > today:
                  continue

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "AviMap-NATS-Data-Updater/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      content = (
                          response.read()
                          .decode(
                              "utf-8",
                              errors="replace"
                          )
                      )

                  if (
                      "EG_AIP_DS_FULL_" in content
                      and
                      "EG_VRP_DS_AREA1_FULL_" in content
                  ):

                      if (
                          checklist_date is None
                          or
                          date > checklist_date
                      ):

                          checklist_found = url
                          checklist_html = content
                          checklist_date = date

              except Exception:
                  continue

          if checklist_found is None:

              raise SystemExit(
                  "ERROR: Could not locate a NATS "
                  "Dataset Checklist containing both "
                  "the AIP and VRP datasets."
              )

          print("")
          print(
              "Selected NATS checklist:"
          )
          print(
              checklist_found
          )

          print(
              "Checklist date:",
              checklist_date
          )

          Path(
              "/tmp/nats-checklist.html"
          ).write_text(
              checklist_html,
              encoding="utf-8"
          )

          # ========================================================
          # EXTRACT CURRENT AIP DATASET
          # ========================================================

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_html,
              flags=re.I
          )

          if not aip_matches:

              raise SystemExit(
                  "ERROR: NATS checklist does not contain "
                  "an AIP XML dataset."
              )

          aip_dates = []

          for value in aip_matches:

              try:
                  date = datetime.strptime(
                      value,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:
                  aip_dates.append(
                      (date, value)
                  )

          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current NATS AIP XML "
                  "dataset found in checklist."
              )

          aip_date, aip_suffix = max(
              aip_dates,
              key=lambda item: item[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_suffix}.XML"
          )

          # ========================================================
          # EXTRACT CURRENT VRP DATASET
          # ========================================================

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_html,
              flags=re.I
          )

          if not vrp_matches:

              raise SystemExit(
                  "ERROR: NATS checklist does not contain "
                  "a VRP CSV dataset."
              )

          vrp_dates = []

          for value in vrp_matches:

              try:
                  date = datetime.strptime(
                      value,
                      "%Y%m%d"
                  ).date()

              except ValueError:
                  continue

              if date <= today:
                  vrp_dates.append(
                      (date, value)
                  )

          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current NATS VRP CSV "
                  "dataset found in checklist."
              )

          vrp_date, vrp_suffix = max(
              vrp_dates,
              key=lambda item: item[0]
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_suffix}.CSV"
          )

          # ========================================================
          # FIND THE ACTUAL DOWNLOAD URLS
          #
          # The checklist contains the filenames. The NATS download
          # area uses those filenames under the published dataset
          # locations.
          #
          # We deliberately test candidate URLs with HEAD/GET and
          # only select a URL that actually exists.
          # ========================================================

          def test_url(url):

              request = urllib.request.Request(
                  url,
                  method="HEAD",
                  headers={
                      "User-Agent":
                      "AviMap-NATS-Data-Updater/1.0"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      return response.status == 200

              except Exception:
                  pass

              return False

          # --------------------------------------------------------
          # AIP candidates.
          #
          # Include the known NATS ICAO/AIP publishing locations.
          # --------------------------------------------------------

          aip_candidates = [
              BASE
              + "ICAO/"
              + aip_filename,

              BASE
              + "AIP/"
              + aip_filename,

              BASE
              + "AIP%20Data/"
              + aip_filename,

              BASE
              + "AIP%20Dataset/"
              + aip_filename,

              BASE
              + "AIP%20Data%20Set/"
              + aip_filename,

              BASE
              + "ICAO%20AIP/"
              + aip_filename
          ]

          aip_url = None

          print("")
          print(
              "Testing NATS AIP download locations..."
          )

          for candidate in aip_candidates:

              print(
                  "Trying:",
                  candidate
              )

              if test_url(candidate):

                  aip_url = candidate

                  print(
                      "FOUND:",
                      candidate
                  )

                  break

          if aip_url is None:

              # ----------------------------------------------------
              # NATS has previously exposed the AIP dataset through
              # downloadable archive paths. Search the checklist
              # itself for a direct link containing the filename.
              # ----------------------------------------------------

              escaped_filename = re.escape(
                  aip_filename
              )

              direct_links = re.findall(
                  r'href\s*=\s*["\']([^"\']*'
                  + escaped_filename
                  + r'[^"\']*)["\']',
                  checklist_html,
                  flags=re.I
              )

              for href in direct_links:

                  if href.startswith(
                      "http://"
                  ) or href.startswith(
                      "https://"
                  ):

                      candidate = href

                  elif href.startswith("/"):

                      candidate = (
                          "https://nats-uk.ead-it.com"
                          + href
                      )

                  else:

                      candidate = (
                          CHECKLIST_DIR
                          + href
                      )

                  if test_url(candidate):

                      aip_url = candidate

                      print(
                          "FOUND DIRECT CHECKLIST LINK:",
                          candidate
                      )

                      break

          if aip_url is None:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{aip_filename}, but no usable "
                  "download URL could be confirmed."
              )

          # --------------------------------------------------------
          # VRP candidates.
          # --------------------------------------------------------

          vrp_candidates = [
              BASE
              + "VRP/"
              + vrp_filename,

              BASE
              + "VRP/"
              + vrp_filename.lower(),

              BASE
              + "Visual%20Reference%20Points/"
              + vrp_filename,

              BASE
              + "Visual%20Reference%20Points/"
              + vrp_filename.lower(),

              BASE
              + "VRP%20Data/"
              + vrp_filename
          ]

          vrp_url = None

          print("")
          print(
              "Testing NATS VRP download locations..."
          )

          for candidate in vrp_candidates:

              print(
                  "Trying:",
                  candidate
              )

              if test_url(candidate):

                  vrp_url = candidate

                  print(
                      "FOUND:",
                      candidate
                  )

                  break

          if vrp_url is None:

              escaped_filename = re.escape(
                  vrp_filename
              )

              direct_links = re.findall(
                  r'href\s*=\s*["\']([^"\']*'
                  + escaped_filename
                  + r'[^"\']*)["\']',
                  checklist_html,
                  flags=re.I
              )

              for href in direct_links:

                  if href.startswith(
                      "http://"
                  ) or href.startswith(
                      "https://"
                  ):

                      candidate = href

                  elif href.startswith("/"):

                      candidate = (
                          "https://nats-uk.ead-it.com"
                          + href
                      )

                  else:

                      candidate = (
                          CHECKLIST_DIR
                          + href
                      )

                  if test_url(candidate):

                      vrp_url = candidate

                      print(
                          "FOUND DIRECT CHECKLIST LINK:",
                          candidate
                      )

                      break

          if vrp_url is None:

              raise SystemExit(
                  "ERROR: NATS checklist identifies "
                  f"{vrp_filename}, but no usable "
                  "VRP download URL could be confirmed."
              )

          # ========================================================
          # WRITE RESULTS
          # ========================================================

          Path(
              "/tmp/nats-aip-url.txt"
          ).write_text(
              aip_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              vrp_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("NATS DATASET DISCOVERY COMPLETE")
          print("==========================================")
          print("")
          print(
              "AIP date:",
              aip_date
          )
          print(
              "AIP filename:",
              aip_filename
          )
          print(
              "AIP URL:",
              aip_url
          )
          print("")
          print(
              "VRP date:",
              vrp_date
          )
          print(
              "VRP filename:",
              vrp_filename
          )
          print(
              "VRP URL:",
              vrp_url
          )
          print("")

          PY

      # ============================================================
      # DOWNLOAD NATS AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS AIP DATASET"
          echo "=========================================="
          echo ""
          echo "Dataset:"
          cat /tmp/nats-aip-filename.txt
          echo ""
          echo "URL:"
          echo "${AIP_URL}"
          echo ""

          mkdir -p /tmp/nats-aip

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_URL}" \
            -o /tmp/nats-aip-source

          test -s /tmp/nats-aip-source

          file /tmp/nats-aip-source

          # --------------------------------------------------------
          # NATS may provide either XML directly or a ZIP archive.
          # --------------------------------------------------------

          if file /tmp/nats-aip-source | grep -qi zip; then

            echo ""
            echo "AIP download is a ZIP archive."

            unzip \
              -o \
              /tmp/nats-aip-source \
              -d /tmp/nats-aip

          else

            echo ""
            echo "AIP download is direct XML."

            cp \
              /tmp/nats-aip-source \
              /tmp/nats-aip/$(cat /tmp/nats-aip-filename.txt)

          fi

          # --------------------------------------------------------
          # Locate the FULL XML specifically.
          # --------------------------------------------------------

          AIP_FILE=$(
            find /tmp/nats-aip \
              -type f \
              -iname 'EG_AIP_DS_FULL_*.xml' \
              | head -n 1
          )

          if [ -z "${AIP_FILE}" ]; then

            echo ""
            echo "ERROR: No FULL NATS AIP XML found."
            echo ""
            find /tmp/nats-aip \
              -type f \
              -print

            exit 1

          fi

          cp \
            "${AIP_FILE}" \
            /tmp/uk-aip.xml

          echo ""
          echo "Selected AIP XML:"
          echo "${AIP_FILE}"
          echo ""

          ls -lh \
            /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""
          echo "Dataset:"
          cat /tmp/nats-vrp-filename.txt
          echo ""
          echo "URL:"
          echo "${VRP_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          mkdir -p /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi zip; then

            unzip \
              -o \
              /tmp/nats-vrp-source \
              -d /tmp/nats-vrp

          else

            cp \
              /tmp/nats-vrp-source \
              /tmp/nats-vrp/vrps.csv

          fi

          VRP_CSV=$(
            find /tmp/nats-vrp \
              -type f \
              \( \
                -iname '*.csv' \
                -o \
                -iname '*.CSV' \
              \) \
              | head -n 1
          )

          if [ -z "${VRP_CSV}" ]; then

            echo "ERROR: No VRP CSV found."

            find /tmp/nats-vrp \
              -type f \
              -print

            exit 1

          fi

          cp \
            "${VRP_CSV}" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "${VRP_CSV}"

          wc -c \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("")
          print("==========================================")
          print("CONVERTING NATS AIXM AIRSPACE")
          print("==========================================")
          print("")
          print("AIRAC:", AIRAC)
          print("XML:", XML)
          print("")

          # ========================================================
          # XML HELPERS
          # ========================================================

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def text_of(parent, names):

              wanted = set(names)

              for element in parent.iter():

                  if (
                      local(element.tag) in wanted
                      and element.text
                  ):

                      value = (
                          element.text.strip()
                      )

                      if value:
                          return value

              return ""

          def all_text(parent, names):

              wanted = set(names)
              values = []

              for element in parent.iter():

                  if (
                      local(element.tag) in wanted
                      and element.text
                  ):

                      value = (
                          element.text.strip()
                      )

                      if value:
                          values.append(value)

              return values

          def number(value):

              try:
                  return float(
                      str(value).strip()
                  )

              except Exception:
                  return None

          def pairs_from_text(text):

              numbers = []

              for token in re.split(
                  r"[\s,]+",
                  str(text).strip()
              ):

                  if not token:
                      continue

                  try:
                      numbers.append(
                          float(token)
                      )

                  except ValueError:
                      pass

              return numbers

          # ========================================================
          # PARSE XML
          # ========================================================

          tree = ET.parse(XML)
          root = tree.getroot()

          # ========================================================
          # GLOBAL ID INDEX
          # ========================================================

          element_index = {}

          for element in root.iter():

              for attribute_name, attribute_value in (
                  element.attrib.items()
              ):

                  if local(
                      attribute_name
                  ) in {
                      "id",
                      "gml:id"
                  }:

                      if attribute_value:
                          element_index[
                              attribute_value
                          ] = element

          print(
              "Indexed XML objects:",
              len(element_index)
          )

          # ========================================================
          # REFERENCE RESOLUTION
          # ========================================================

          def resolve(element):

              if element is None:
                  return None

              current = element
              seen = set()

              while current is not None:

                  href = None

                  for attribute_name, attribute_value in (
                      current.attrib.items()
                  ):

                      if local(
                          attribute_name
                      ) in {
                          "href",
                          "xlink:href"
                      }:

                          href = attribute_value
                          break

                  if not href:
                      return current

                  reference = (
                      href.strip()
                  )

                  if reference.startswith(
                      "#"
                  ):
                      reference = (
                          reference[1:]
                      )

                  if reference in seen:
                      return current

                  seen.add(
                      reference
                  )

                  target = element_index.get(
                      reference
                  )

                  if target is None:
                      return current

                  current = target

              return None

          # ========================================================
          # RING EXTRACTION
          # ========================================================

          def ring_points(ring):

              ring = resolve(ring)

              if ring is None:
                  return []

              # posList
              for element in ring.iter():

                  if (
                      local(element.tag)
                      == "posList"
                      and
                      element.text
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) < 8:
                          continue

                      coords = []

                      for index in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          lat = values[index]
                          lon = values[index + 1]

                          coords.append(
                              [
                                  lon,
                                  lat
                              ]
                          )

                      if len(coords) >= 4:
                          return coords

              # pos elements
              coords = []

              for element in ring.iter():

                  if (
                      local(element.tag)
                      != "pos"
                      or
                      not element.text
                  ):
                      continue

                  values = pairs_from_text(
                      element.text
                  )

                  if len(values) >= 2:

                      coords.append(
                          [
                              values[1],
                              values[0]
                          ]
                      )

              if len(coords) >= 4:
                  return coords

              return []

          def rings_from_container(
              container
          ):

              container = resolve(
                  container
              )

              if container is None:
                  return []

              rings = []

              for element in container.iter():

                  if (
                      local(element.tag)
                      != "LinearRing"
                  ):
                      continue

                  ring = ring_points(
                      element
                  )

                  if len(ring) >= 4:

                      if (
                          ring[0]
                          !=
                          ring[-1]
                      ):
                          ring.append(
                              ring[0]
                          )

                      rings.append(
                          ring
                      )

              return rings

          # ========================================================
          # CIRCLE TO POLYGON
          # ========================================================

          def circle_geometry(
              container
          ):

              container = resolve(
                  container
              )

              if container is None:
                  return None

              circle = None

              for element in container.iter():

                  if (
                      local(element.tag)
                      ==
                      "CircleByCenterPoint"
                  ):

                      circle = resolve(
                          element
                      )

                      break

              if circle is None:
                  return None

              center = None
              radius = None
              radius_uom = "NM"

              for element in circle.iter():

                  tag = local(
                      element.tag
                  )

                  if (
                      tag == "pos"
                      and
                      element.text
                      and
                      center is None
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) >= 2:

                          center = (
                              values[0],
                              values[1]
                          )

                  elif (
                      tag == "posList"
                      and
                      element.text
                      and
                      center is None
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) >= 2:

                          center = (
                              values[0],
                              values[1]
                          )

                  elif (
                      tag == "radius"
                      and
                      element.text
                  ):

                      radius = number(
                          element.text
                      )

                      radius_uom = (
                          element.attrib.get(
                              "uom",
                              "NM"
                          )
                          .strip()
                          .upper()
                      )

              if (
                  center is None
                  or
                  radius is None
                  or
                  radius <= 0
              ):
                  return None

              lat, lon = center

              if radius_uom in {
                  "M",
                  "METRE",
                  "METRES",
                  "METER",
                  "METERS"
              }:

                  radius_nm = (
                      radius / 1852.0
                  )

              elif radius_uom in {
                  "KM",
                  "KILOMETRE",
                  "KILOMETRES",
                  "KILOMETER",
                  "KILOMETERS"
              }:

                  radius_nm = (
                      radius / 1.852
                  )

              elif radius_uom in {
                  "FT",
                  "FOOT",
                  "FEET"
              }:

                  radius_nm = (
                      radius / 6076.12
                  )

              else:

                  radius_nm = radius

              earth_radius_nm = 3440.065

              lat_rad = math.radians(
                  lat
              )

              angular = (
                  radius_nm
                  / earth_radius_nm
              )

              coords = []

              for index in range(
                  97
              ):

                  bearing = (
                      2
                      * math.pi
                      * index
                      / 96
                  )

                  lat2 = math.asin(
                      math.sin(lat_rad)
                      *
                      math.cos(angular)
                      +
                      math.cos(lat_rad)
                      *
                      math.sin(angular)
                      *
                      math.cos(bearing)
                  )

                  lon2 = (
                      math.radians(lon)
                      +
                      math.atan2(
                          math.sin(bearing)
                          *
                          math.sin(angular)
                          *
                          math.cos(lat_rad),
                          math.cos(angular)
                          -
                          math.sin(lat_rad)
                          *
                          math.sin(lat2)
                      )
                  )

                  coords.append(
                      [
                          math.degrees(
                              lon2
                          ),
                          math.degrees(
                              lat2
                          )
                      ]
                  )

              return coords

          # ========================================================
          # GEOMETRY EXTRACTION
          # ========================================================

          def geometry_from_airspace(
              airspace
          ):

              containers = []

              # horizontalProjection references
              for element in airspace.iter():

                  if (
                      local(element.tag)
                      ==
                      "horizontalProjection"
                  ):

                      resolved = resolve(
                          element
                      )

                      if (
                          resolved is not None
                          and
                          resolved not in containers
                      ):

                          containers.append(
                              resolved
                          )

              # Direct geometry
              for element in airspace.iter():

                  if local(
                      element.tag
                  ) in {
                      "Surface",
                      "Polygon",
                      "PolygonPatch",
                      "CircleByCenterPoint"
                  }:

                      resolved = resolve(
                          element
                      )

                      if (
                          resolved is not None
                          and
                          resolved not in containers
                      ):

                          containers.append(
                              resolved
                          )

              if not containers:
                  containers = [
                      airspace
                  ]

              polygons = []

              for container in containers:

                  container = resolve(
                      container
                  )

                  if container is None:
                      continue

                  # ------------------------------------------------
                  # Circle
                  # ------------------------------------------------

                  circle = circle_geometry(
                      container
                  )

                  if circle is not None:

                      return {
                          "type": "Polygon",
                          "coordinates": [
                              circle
                          ]
                      }

                  # ------------------------------------------------
                  # Polygon patches
                  # ------------------------------------------------

                  patches = []

                  for element in container.iter():

                      if (
                          local(element.tag)
                          ==
                          "PolygonPatch"
                      ):

                          patch = resolve(
                              element
                          )

                          if (
                              patch is not None
                              and
                              patch not in patches
                          ):

                              patches.append(
                                  patch
                              )

                  for patch in patches:

                      rings = (
                          rings_from_container(
                              patch
                          )
                      )

                      if rings:
                          polygons.append(
                              rings
                          )

                  # ------------------------------------------------
                  # Direct polygon fallback
                  # ------------------------------------------------

                  if not patches:

                      rings = (
                          rings_from_container(
                              container
                          )
                      )

                      if rings:
                          polygons.append(
                              rings
                          )

              if not polygons:
                  return None

              if len(polygons) == 1:

                  return {
                      "type": "Polygon",
                      "coordinates":
                          polygons[0]
                  }

              return {
                  "type": "MultiPolygon",
                  "coordinates":
                      polygons
              }

          # ========================================================
          # CLASSIFICATION
          # ========================================================

          def classify(
              airspace_type,
              icao_class,
              name,
              designator
          ):

              values = [
                  airspace_type,
                  icao_class,
                  name,
                  designator
              ]

              combined = " ".join(
                  str(value or "").upper()
                  for value in values
              )

              compact = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  combined
              ).strip()

              # Special zones first.
              if re.search(
                  r"\b("
                  r"MATZ|"
                  r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE|"
                  r"MILITARY\s+ATZ"
                  r")\b",
                  compact
              ):
                  return "MATZ"

              if re.search(
                  r"\b("
                  r"RMZ|"
                  r"RADIO\s+(?:COMMUNICATION\s+)?MANDATORY\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "RMZ"

              if re.search(
                  r"\b("
                  r"TMZ|"
                  r"TRANSPONDER\s+MANDATORY\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "TMZ"

              if re.search(
                  r"\b("
                  r"ATZ|"
                  r"AERODROME\s+TRAFFIC\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "ATZ"

              # PA / RA / DA.
              if re.search(
                  r"\b("
                  r"PROHIBITED(?:\s+AREA)?|PA"
                  r")\b",
                  compact
              ):
                  return "PA"

              if re.search(
                  r"\b("
                  r"RESTRICTED(?:\s+AREA)?|RA"
                  r")\b",
                  compact
              ):
                  return "RA"

              if re.search(
                  r"\b("
                  r"DANGER(?:\s+AREA)?|DA"
                  r")\b",
                  compact
              ):
                  return "DA"

              class_text = re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      icao_class or ""
                  ).upper()
              )

              if class_text in {
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              }:
                  return class_text

              if class_text in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:
                  return class_text[-1]

              type_text = re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      airspace_type or ""
                  ).upper()
              )

              if type_text in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:
                  return type_text[-1]

              return None

          # ========================================================
          # PROCESS AIRSPACE
          # ========================================================

          features = []

          raw_airspaces = 0
          classified_count = 0
          geometry_count = 0
          geometry_failures = 0

          classification_counts = {}
          geometry_counts = {}
          geometry_failure_counts = {}

          failures = []

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":
                  continue

              raw_airspaces += 1

              designator = text_of(
                  airspace,
                  {
                      "designator",
                      "AirspaceDesignator"
                  }
              )

              name = text_of(
                  airspace,
                  {
                      "name",
                      "AirspaceName"
                  }
              )

              airspace_type = " ".join(
                  all_text(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "localType",
                          "AirspaceLocalType"
                      }
                  )
              )

              icao_class = " ".join(
                  all_text(
                      airspace,
                      {
                          "class",
                          "AirspaceClassification"
                      }
                  )
              )

              category = classify(
                  airspace_type,
                  icao_class,
                  name,
                  designator
              )

              if category is None:
                  continue

              classified_count += 1

              classification_counts[
                  category
              ] = (
                  classification_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              geometry = (
                  geometry_from_airspace(
                      airspace
                  )
              )

              if geometry is None:

                  geometry_failures += 1

                  geometry_failure_counts[
                      category
                  ] = (
                      geometry_failure_counts.get(
                          category,
                          0
                      )
                      + 1
                  )

                  failures.append(
                      {
                          "category":
                              category,
                          "designator":
                              designator,
                          "name":
                              name
                      }
                  )

                  continue

              geometry_count += 1

              geometry_counts[
                  category
              ] = (
                  geometry_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              properties = {
                  "name":
                      name
                      or
                      designator
                      or
                      "Unknown airspace",

                  "designator":
                      designator,

                  "aixmType":
                      airspace_type,

                  "icaoClass":
                      icao_class,

                  "category":
                      category,

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC
              }

              for key in (
                  "upperLimit",
                  "lowerLimit",
                  "upperLimitReference",
                  "lowerLimitReference",
                  "verticalExtent"
              ):

                  value = text_of(
                      airspace,
                      {key}
                  )

                  if value:
                      properties[key] = value

              features.append(
                  {
                      "type":
                          "Feature",

                      "id":
                          designator
                          or
                          f"NATS-AIRSPACE-{len(features)+1}",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )

          # ========================================================
          # DEBUG OUTPUT
          # ========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )
          print("")
          print(
              "AIRAC:",
              AIRAC
          )
          print(
              "Raw NATS Airspace:",
              raw_airspaces
          )
          print(
              "Classified AviMap airspaces:",
              classified_count
          )
          print(
              "Geometry successes:",
              geometry_count
          )
          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "CLASSIFICATION COUNTS"
          )
          print(
              "=========================================="
          )

          categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{classification_counts.get(category, 0)}"
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "GEOMETRY COUNTS"
          )
          print(
              "=========================================="
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"classified="
                  f"{classification_counts.get(category, 0):4d} "
                  f"geometry="
                  f"{geometry_counts.get(category, 0):4d} "
                  f"failed="
                  f"{geometry_failure_counts.get(category, 0):4d}"
              )

          if failures:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "GEOMETRY FAILURE DETAILS"
              )
              print(
                  "=========================================="
              )

              for failure in failures:

                  print(
                      f"{failure['category']} "
                      f"{failure['designator']} "
                      f"{failure['name']}"
                  )

          # ========================================================
          # SAFETY CHECKS
          # ========================================================

          if raw_airspaces < 1000:

              raise SystemExit(
                  "ERROR: NATS AIXM dataset contains "
                  f"only {raw_airspaces} Airspace objects. "
                  "Refusing to publish."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero AviMap airspace objects."
              )

          if geometry_count == 0:

              raise SystemExit(
                  "ERROR: Zero valid geometries."
              )

          if geometry_failures != 0:

              raise SystemExit(
                  "ERROR: "
                  f"{geometry_failures} selected airspace "
                  "features have no usable geometry. "
                  "Refusing to publish incomplete data."
              )

          if geometry_count != classified_count:

              raise SystemExit(
                  "ERROR: Geometry/classification count "
                  "mismatch."
              )

          if len(features) < 100:

              raise SystemExit(
                  "ERROR: Suspiciously small airspace "
                  f"dataset: {len(features)} features."
              )

          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }

          Path(
              OUT
          ).write_text(
              json.dumps(
                  output,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "Airspace GeoJSON created:"
          )
          print(
              OUT
          )
          print(
              "Features:",
              len(features)
          )

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value)
                  .strip()
                  .lower()
              )

          normalised = {
              norm(field):
                  field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  if norm(name) in normalised:

                      return normalised[
                          norm(name)
                      ]

              for key, original in normalised.items():

                  for name in names:

                      n = norm(name)

                      if (
                          n in key
                          or
                          key in n
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              not lat_field
              or
              not lon_field
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP "
                  f"coordinate fields: {fields}"
              )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = (
                  str(value)
                  .strip()
                  .replace(
                      ",",
                      "."
                  )
              )

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  decimal = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= decimal
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          decimal = -abs(
                              decimal
                          )

                      return decimal

              except ValueError:
                  pass

              compact = (
                  text
                  .replace(
                      "°",
                      ""
                  )
                  .replace(
                      "'",
                      ""
                  )
                  .replace(
                      '"',
                      ""
                  )
                  .replace(
                      " ",
                      ""
                  )
              )

              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):

                  try:

                      if "." in compact:

                          integer_part, decimal_part = (
                              compact.split(
                                  ".",
                                  1
                              )
                          )

                      else:

                          integer_part = compact
                          decimal_part = ""

                      if latitude:

                          if len(
                              integer_part
                          ) < 6:

                              raise ValueError

                          degrees = int(
                              integer_part[
                                  :2
                              ]
                          )

                          minutes = int(
                              integer_part[
                                  2:4
                              ]
                          )

                          seconds_text = (
                              integer_part[
                                  4:
                              ]
                          )

                      else:

                          if len(
                              integer_part
                          ) < 7:

                              raise ValueError

                          degrees = int(
                              integer_part[
                                  :3
                              ]
                          )

                          minutes = int(
                              integer_part[
                                  3:5
                              ]
                          )

                          seconds_text = (
                              integer_part[
                                  5:
                              ]
                          )

                      if decimal_part:

                          seconds_text += (
                              "."
                              +
                              decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      if (
                          minutes >= 60
                          or
                          seconds >= 60
                      ):

                          raise ValueError

                      result = (
                          degrees
                          +
                          minutes / 60
                          +
                          seconds / 3600
                      )

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          result = -abs(
                              result
                          )

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):

                      pass

              numbers = re.findall(
                  r"[-+]?\d+(?:[.,]\d+)?",
                  text
              )

              if not numbers:
                  return None

              values = [
                  float(
                      value.replace(
                          ",",
                          "."
                      )
                  )
                  for value in numbers
              ]

              result = abs(
                  values[0]
              )

              if len(values) > 1:

                  result += (
                      abs(values[1])
                      / 60
                  )

              if len(values) > 2:

                  result += (
                      abs(values[2])
                      / 3600
                  )

              if hemisphere in {
                  "S",
                  "W"
              }:

                  result = -result

              limit = (
                  90
                  if latitude
                  else 180
              )

              if (
                  result < -limit
                  or
                  result > limit
              ):

                  return None

              return result

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              latitude = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              longitude = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  invalid += 1
                  continue

              name = (
                  str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()
                  if name_field
                  else ""
              )

              if not name:

                  name = (
                      f"VRP {index}"
                  )

              properties = {
                  str(key).strip():
                      value
                  for key, value
                  in row.items()
                  if key
              }

              properties[
                  "name"
              ] = name

              properties[
                  "ident"
              ] = name

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      longitude,
                                      latitude
                                  ]
                          }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )
          print(
              "CSV records:",
              len(rows)
          )
          print(
              "Valid VRPs:",
              len(features)
          )
          print(
              "Invalid coordinates:",
              invalid
          )

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero features."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero airspaces."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero VRPs."
            exit 1
          fi

          echo "Validation successful."

      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."
            exit 0

          fi

          echo ""
          echo "=========================================="
          echo "COMMITTING NATS AVIATION DATA"
          echo "=========================================="
          echo ""

          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
