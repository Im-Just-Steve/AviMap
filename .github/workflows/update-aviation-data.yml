name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html" \
            -o /tmp/nats-datasets.html

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/digital-datasets/index.html"
          )

          html = open(
              "/tmp/nats-datasets.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          today = datetime.now(timezone.utc).date()

          def choose(pattern, label):
              candidates = []

              for href in hrefs:
                  match = re.search(
                      pattern,
                      href,
                      flags=re.I
                  )

                  if not match:
                      continue

                  try:
                      date = datetime.strptime(
                          match.group(1),
                          "%Y%m%d"
                      ).date()
                  except ValueError:
                      continue

                  candidates.append(
                      (date, href)
                  )

              if not candidates:
                  raise SystemExit(
                      f"ERROR: No {label} dataset found on NATS page."
                  )

              current = [
                  item
                  for item in candidates
                  if item[0] <= today
              ]

              selected = max(
                  current or candidates,
                  key=lambda item: item[0]
              )

              date, href = selected

              url = urljoin(
                  BASE,
                  href
              )

              print(
                  f"{label}: {date} -> {url}"
              )

              return date, url

          # --------------------------------------------------------
          # AIP / AIXM
          # --------------------------------------------------------

          aip_date, aip_url = choose(
              r'EG_AIP_DS_FULL_(\d{8})\.XML$',
              "UK ICAO AIP XML"
          )

          # --------------------------------------------------------
          # VRP
          # --------------------------------------------------------

          vrp_candidates = []

          for href in hrefs:

              match = re.search(
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})'
                  r'(?:_CSV)?(?:\.CSV|_CSV\.zip|\.zip)$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  date = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              vrp_candidates.append(
                  (date, href)
              )

          if not vrp_candidates:
              raise SystemExit(
                  "ERROR: No NATS VRP dataset found on NATS page."
              )

          current_vrp = [
              item
              for item in vrp_candidates
              if item[0] <= today
          ]

          vrp_date, vrp_href = max(
              current_vrp or vrp_candidates,
              key=lambda item: item[0]
          )

          vrp_url = urljoin(
              BASE,
              vrp_href
          )

          print(
              f"VRP dataset: {vrp_date} -> {vrp_url}"
          )

          with open(
              "/tmp/nats-aip-url.txt",
              "w"
          ) as f:
              f.write(aip_url)

          with open(
              "/tmp/nats-aip-date.txt",
              "w"
          ) as f:
              f.write(str(aip_date))

          with open(
              "/tmp/nats-vrp-url.txt",
              "w"
          ) as f:
              f.write(vrp_url)

          with open(
              "/tmp/nats-vrp-date.txt",
              "w"
          ) as f:
              f.write(str(vrp_date))

          PY

      # ============================================================
      # DOWNLOAD NATS AIXM
      # ============================================================

      - name: Download NATS UK ICAO AIP AIXM
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS AIXM"
          echo "=========================================="
          echo ""
          echo "URL:"
          echo "${AIP_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_URL}" \
            -o /tmp/uk-aip.xml

          test -s /tmp/uk-aip.xml

          echo ""
          echo "Downloaded AIXM dataset:"
          ls -lh /tmp/uk-aip.xml

      # ============================================================
      # DOWNLOAD NATS VRPS
      # ============================================================

      - name: Download NATS VRP list
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""
          echo "URL:"
          echo "${VRP_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats-vrp-source

          test -s /tmp/nats-vrp-source

          mkdir -p /tmp/nats-vrp

          if file /tmp/nats-vrp-source | grep -qi zip; then
            unzip \
              -o \
              /tmp/nats-vrp-source \
              -d /tmp/nats-vrp
          else
            cp \
              /tmp/nats-vrp-source \
              /tmp/nats-vrp/vrps.csv
          fi

          VRP_CSV=$(
            find /tmp/nats-vrp \
              -type f \
              \( \
                -iname '*.csv' \
                -o \
                -iname '*.CSV' \
              \) \
              | head -n 1
          )

          if [ -z "${VRP_CSV}" ]; then
            echo "ERROR: No CSV found in the NATS VRP dataset."
            find /tmp/nats-vrp -type f -print
            exit 1
          fi

          cp \
            "${VRP_CSV}" \
            /tmp/uk-vrps.csv

          echo ""
          echo "Selected VRP CSV:"
          echo "${VRP_CSV}"

          echo ""
          echo "CSV size:"
          wc -c /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          # ========================================================
          # XML HELPERS
          # ========================================================

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def text_of(parent, names):
              wanted = set(names)

              for element in parent.iter():

                  if (
                      local(element.tag) in wanted
                      and element.text
                  ):
                      value = element.text.strip()

                      if value:
                          return value

              return ""

          def all_text(parent, names):
              wanted = set(names)

              values = []

              for element in parent.iter():

                  if (
                      local(element.tag) in wanted
                      and element.text
                  ):
                      value = element.text.strip()

                      if value:
                          values.append(value)

              return values

          def number(value):
              try:
                  return float(
                      str(value).strip()
                  )
              except Exception:
                  return None

          def pairs_from_text(text):
              numbers = []

              for token in re.split(
                  r"[\s,]+",
                  str(text).strip()
              ):
                  if not token:
                      continue

                  try:
                      numbers.append(
                          float(token)
                      )
                  except ValueError:
                      pass

              return numbers

          # ========================================================
          # PARSE XML
          # ========================================================

          print("")
          print("==========================================")
          print("NATS AIXM AIRSPACE CONVERSION")
          print("==========================================")
          print("")
          print("AIRAC:", AIRAC)
          print("")

          tree = ET.parse(XML)
          root = tree.getroot()

          # ========================================================
          # BUILD GLOBAL XML ID INDEX
          #
          # AIXM commonly stores the actual geometry separately and
          # references it from Airspace via xlink:href.
          # ========================================================

          element_index = {}

          for element in root.iter():

              for attribute_name, attribute_value in element.attrib.items():

                  attribute_local = local(
                      attribute_name
                  )

                  if attribute_local in {
                      "id",
                      "gml:id"
                  }:
                      if attribute_value:
                          element_index[
                              attribute_value
                          ] = element

          print(
              "Indexed XML geometry/reference objects:",
              len(element_index)
          )

          # ========================================================
          # RESOLVE AIXM / XLINK REFERENCES
          # ========================================================

          def resolve(element):
              if element is None:
                  return None

              current = element

              seen = set()

              while current is not None:

                  href = None

                  for attribute_name, attribute_value in current.attrib.items():

                      if local(attribute_name) in {
                          "href",
                          "xlink:href"
                      }:
                          href = attribute_value
                          break

                  if not href:
                      return current

                  reference = href.strip()

                  if reference.startswith("#"):
                      reference = reference[1:]

                  if reference in seen:
                      return current

                  seen.add(reference)

                  target = element_index.get(
                      reference
                  )

                  if target is None:
                      return current

                  current = target

              return None

          # ========================================================
          # RING EXTRACTION
          # ========================================================

          def ring_points(ring):
              ring = resolve(ring)

              if ring is None:
                  return []

              # ----------------------------------------------------
              # Prefer gml:posList
              # ----------------------------------------------------

              for element in ring.iter():

                  if (
                      local(element.tag) == "posList"
                      and element.text
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) < 8:
                          continue

                      coords = []

                      for index in range(
                          0,
                          len(values) - 1,
                          2
                      ):
                          lat = values[index]
                          lon = values[index + 1]

                          coords.append(
                              [
                                  lon,
                                  lat
                              ]
                          )

                      if len(coords) >= 4:
                          return coords

              # ----------------------------------------------------
              # Fallback to gml:pos
              # ----------------------------------------------------

              coords = []

              for element in ring.iter():

                  if (
                      local(element.tag) != "pos"
                      or not element.text
                  ):
                      continue

                  values = pairs_from_text(
                      element.text
                  )

                  if len(values) >= 2:
                      coords.append(
                          [
                              values[1],
                              values[0]
                          ]
                      )

              if len(coords) >= 4:
                  return coords

              return []

          # ========================================================
          # FIND LINEAR RINGS
          # ========================================================

          def rings_from_container(container):
              container = resolve(container)

              if container is None:
                  return []

              rings = []

              for element in container.iter():

                  if local(element.tag) != "LinearRing":
                      continue

                  ring = ring_points(
                      element
                  )

                  if len(ring) >= 4:

                      # Ensure the ring is closed.
                      if ring[0] != ring[-1]:
                          ring.append(
                              ring[0]
                          )

                      if len(ring) >= 4:
                          rings.append(
                              ring
                          )

              return rings

          # ========================================================
          # CIRCLE GEOMETRY
          #
          # AIXM CircleByCenterPoint is converted to a polygon.
          # ========================================================

          def circle_geometry(container):
              container = resolve(container)

              if container is None:
                  return None

              circle = None

              for element in container.iter():

                  if (
                      local(element.tag)
                      == "CircleByCenterPoint"
                  ):
                      circle = resolve(
                          element
                      )
                      break

              if circle is None:
                  return None

              center = None
              radius = None
              radius_uom = "NM"

              for element in circle.iter():

                  tag = local(
                      element.tag
                  )

                  if (
                      tag == "pos"
                      and element.text
                      and center is None
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) >= 2:
                          center = (
                              values[0],
                              values[1]
                          )

                  elif (
                      tag == "posList"
                      and element.text
                      and center is None
                  ):

                      values = pairs_from_text(
                          element.text
                      )

                      if len(values) >= 2:
                          center = (
                              values[0],
                              values[1]
                          )

                  elif (
                      tag == "radius"
                      and element.text
                  ):

                      radius = number(
                          element.text
                      )

                      radius_uom = (
                          element.attrib.get(
                              "uom",
                              "NM"
                          )
                          .strip()
                          .upper()
                      )

              if (
                  center is None
                  or radius is None
                  or radius <= 0
              ):
                  return None

              lat, lon = center

              # ----------------------------------------------------
              # Convert radius to nautical miles.
              # ----------------------------------------------------

              if radius_uom in {
                  "M",
                  "METRE",
                  "METRES",
                  "METER",
                  "METERS"
              }:
                  radius_nm = (
                      radius / 1852.0
                  )

              elif radius_uom in {
                  "KM",
                  "KILOMETRE",
                  "KILOMETRES",
                  "KILOMETER",
                  "KILOMETERS"
              }:
                  radius_nm = (
                      radius / 1.852
                  )

              elif radius_uom in {
                  "FT",
                  "FOOT",
                  "FEET"
              }:
                  radius_nm = (
                      radius / 6076.12
                  )

              else:
                  # AIXM/NATS normally supplies NM here.
                  radius_nm = radius

              if radius_nm <= 0:
                  return None

              # Mean Earth radius in nautical miles.
              earth_radius_nm = 3440.065

              lat_rad = math.radians(
                  lat
              )

              angular = (
                  radius_nm
                  / earth_radius_nm
              )

              coords = []

              # 96 segments gives a smooth map polygon while keeping
              # the generated GeoJSON reasonably small.
              for index in range(97):

                  bearing = (
                      2
                      * math.pi
                      * index
                      / 96
                  )

                  lat2 = math.asin(
                      math.sin(lat_rad)
                      * math.cos(angular)
                      +
                      math.cos(lat_rad)
                      * math.sin(angular)
                      * math.cos(bearing)
                  )

                  lon2 = (
                      math.radians(lon)
                      +
                      math.atan2(
                          math.sin(bearing)
                          * math.sin(angular)
                          * math.cos(lat_rad),
                          math.cos(angular)
                          -
                          math.sin(lat_rad)
                          * math.sin(lat2)
                      )
                  )

                  coords.append(
                      [
                          math.degrees(
                              lon2
                          ),
                          math.degrees(
                              lat2
                          )
                      ]
                  )

              return coords

          # ========================================================
          # GEOMETRY EXTRACTION
          # ========================================================

          def geometry_from_airspace(airspace):

              # ----------------------------------------------------
              # Build a list of geometry containers to inspect.
              #
              # First look specifically at horizontalProjection
              # references, then fall back to geometry objects nested
              # directly within the Airspace object.
              # ----------------------------------------------------

              containers = []

              for element in airspace.iter():

                  if local(element.tag) == "horizontalProjection":

                      resolved = resolve(
                          element
                      )

                      if (
                          resolved is not None
                          and resolved not in containers
                      ):
                          containers.append(
                              resolved
                          )

              # Direct nested geometry.
              for element in airspace.iter():

                  tag = local(
                      element.tag
                  )

                  if tag in {
                      "Surface",
                      "Polygon",
                      "PolygonPatch",
                      "CircleByCenterPoint"
                  }:

                      resolved = resolve(
                          element
                      )

                      if (
                          resolved is not None
                          and resolved not in containers
                      ):
                          containers.append(
                              resolved
                          )

              if not containers:
                  containers = [
                      airspace
                  ]

              polygons = []

              # ====================================================
              # PROCESS GEOMETRY CONTAINERS
              # ====================================================

              for container in containers:

                  container = resolve(
                      container
                  )

                  if container is None:
                      continue

                  # ------------------------------------------------
                  # CIRCLE
                  # ------------------------------------------------

                  circle = circle_geometry(
                      container
                  )

                  if circle is not None:
                      return {
                          "type": "Polygon",
                          "coordinates": [
                              circle
                          ]
                      }

                  # ------------------------------------------------
                  # POLYGON PATCHES
                  #
                  # A Surface may contain one or more PolygonPatch
                  # elements. Each patch becomes one polygon.
                  # ------------------------------------------------

                  patches = []

                  for element in container.iter():

                      if (
                          local(element.tag)
                          == "PolygonPatch"
                      ):

                          resolved_patch = resolve(
                              element
                          )

                          if (
                              resolved_patch is not None
                              and resolved_patch not in patches
                          ):
                              patches.append(
                                  resolved_patch
                              )

                  for patch in patches:

                      rings = rings_from_container(
                          patch
                      )

                      if rings:
                          polygons.append(
                              rings
                          )

                  # ------------------------------------------------
                  # Direct Polygon / LinearRing fallback.
                  # ------------------------------------------------

                  if not patches:

                      direct_rings = []

                      for element in container.iter():

                          if (
                              local(element.tag)
                              == "Polygon"
                          ):

                              resolved_polygon = resolve(
                                  element
                              )

                              rings = rings_from_container(
                                  resolved_polygon
                              )

                              if rings:
                                  direct_rings.extend(
                                      rings
                                  )

                      if direct_rings:
                          polygons.append(
                              direct_rings
                          )

                  # ------------------------------------------------
                  # Some AIXM structures resolve directly to a
                  # PolygonPatch without an enclosing Surface.
                  # ------------------------------------------------

                  if (
                      local(container.tag)
                      == "PolygonPatch"
                  ):

                      rings = rings_from_container(
                          container
                      )

                      if rings:
                          polygons.append(
                              rings
                          )

              # ====================================================
              # BUILD GEOJSON GEOMETRY
              # ====================================================

              if not polygons:
                  return None

              if len(polygons) == 1:
                  return {
                      "type": "Polygon",
                      "coordinates": polygons[0]
                  }

              return {
                  "type": "MultiPolygon",
                  "coordinates": polygons
              }

          # ========================================================
          # CLASSIFICATION
          # ========================================================

          def classify(
              airspace_type,
              icao_class,
              name,
              designator
          ):
              """
              Convert NATS/AIXM terminology into AviMap categories.

              Canonical categories:

                A
                B
                C
                D
                E
                F
                G
                PA
                RA
                DA
                ATZ
                MATZ
                RMZ
                TMZ
              """

              values = [
                  airspace_type,
                  icao_class,
                  name,
                  designator
              ]

              combined = " ".join(
                  str(value or "").upper()
                  for value in values
              )

              compact = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  combined
              ).strip()

              # ----------------------------------------------------
              # SPECIAL ZONES FIRST
              # ----------------------------------------------------

              if re.search(
                  r"\b("
                  r"MATZ|"
                  r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE|"
                  r"MILITARY\s+ATZ"
                  r")\b",
                  compact
              ):
                  return "MATZ"

              if re.search(
                  r"\b("
                  r"RMZ|"
                  r"RADIO\s+(?:COMMUNICATION\s+)?MANDATORY\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "RMZ"

              if re.search(
                  r"\b("
                  r"TMZ|"
                  r"TRANSPONDER\s+MANDATORY\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "TMZ"

              if re.search(
                  r"\b("
                  r"ATZ|"
                  r"AERODROME\s+TRAFFIC\s+ZONE"
                  r")\b",
                  compact
              ):
                  return "ATZ"

              # ----------------------------------------------------
              # PROHIBITED / RESTRICTED / DANGER
              # ----------------------------------------------------

              if re.search(
                  r"\b("
                  r"PROHIBITED(?:\s+AREA)?|PA"
                  r")\b",
                  compact
              ):
                  return "PA"

              if re.search(
                  r"\b("
                  r"RESTRICTED(?:\s+AREA)?|RA"
                  r")\b",
                  compact
              ):
                  return "RA"

              if re.search(
                  r"\b("
                  r"DANGER(?:\s+AREA)?|DA"
                  r")\b",
                  compact
              ):
                  return "DA"

              # ----------------------------------------------------
              # ICAO CLASS
              # ----------------------------------------------------

              class_text = re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      icao_class or ""
                  ).upper()
              )

              if class_text in {
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              }:
                  return class_text

              if class_text in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:
                  return class_text[-1]

              # ----------------------------------------------------
              # Some NATS records expose the class in airspace type.
              # ----------------------------------------------------

              type_text = re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  str(
                      airspace_type or ""
                  ).upper()
              )

              if type_text in {
                  "CLASSA",
                  "CLASSB",
                  "CLASSC",
                  "CLASSD",
                  "CLASSE",
                  "CLASSF",
                  "CLASSG"
              }:
                  return type_text[-1]

              return None

          # ========================================================
          # CONVERT AIRSPACE
          # ========================================================

          features = []

          raw_airspaces = 0
          classified_count = 0
          geometry_count = 0
          geometry_failures = 0

          classification_counts = {}
          geometry_counts = {}
          geometry_failure_counts = {}

          geometry_failures_detail = []

          for airspace in root.iter():

              if local(airspace.tag) != "Airspace":
                  continue

              raw_airspaces += 1

              designator = text_of(
                  airspace,
                  {
                      "designator",
                      "AirspaceDesignator"
                  }
              )

              name = text_of(
                  airspace,
                  {
                      "name",
                      "AirspaceName"
                  }
              )

              # ----------------------------------------------------
              # NATS/AIXM may expose the useful subtype in several
              # nested fields.
              # ----------------------------------------------------

              airspace_type = " ".join(
                  all_text(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "localType",
                          "AirspaceLocalType"
                      }
                  )
              )

              icao_class = " ".join(
                  all_text(
                      airspace,
                      {
                          "class",
                          "AirspaceClassification"
                      }
                  )
              )

              category = classify(
                  airspace_type,
                  icao_class,
                  name,
                  designator
              )

              # Only retain AviMap categories.
              if category is None:
                  continue

              classified_count += 1

              classification_counts[
                  category
              ] = (
                  classification_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              geometry = geometry_from_airspace(
                  airspace
              )

              if geometry is None:

                  geometry_failures += 1

                  geometry_failure_counts[
                      category
                  ] = (
                      geometry_failure_counts.get(
                          category,
                          0
                      )
                      + 1
                  )

                  geometry_failures_detail.append(
                      {
                          "category": category,
                          "designator": designator,
                          "name": name
                      }
                  )

                  continue

              geometry_count += 1

              geometry_counts[
                  category
              ] = (
                  geometry_counts.get(
                      category,
                      0
                  )
                  + 1
              )

              props = {
                  "name": (
                      name
                      or designator
                      or "Unknown airspace"
                  ),
                  "designator": designator,
                  "aixmType": airspace_type,
                  "icaoClass": icao_class,
                  "category": category,
                  "source": "NATS UK ICAO AIP Dataset",
                  "airac": AIRAC
              }

              # ----------------------------------------------------
              # Preserve useful altitude/type information.
              # ----------------------------------------------------

              for key in (
                  "upperLimit",
                  "lowerLimit",
                  "upperLimitReference",
                  "lowerLimitReference",
                  "verticalExtent"
              ):

                  value = text_of(
                      airspace,
                      {key}
                  )

                  if value:
                      props[key] = value

              features.append(
                  {
                      "type": "Feature",
                      "id": (
                          designator
                          or
                          f"NATS-AIRSPACE-{len(features)+1}"
                      ),
                      "properties": props,
                      "geometry": geometry
                  }
              )

          # ========================================================
          # REPORT
          # ========================================================

          print("")
          print("==========================================")
          print("NATS AIXM CONVERSION RESULTS")
          print("==========================================")
          print("")
          print(
              "AIRAC:",
              AIRAC
          )
          print(
              "Raw Airspace objects:",
              raw_airspaces
          )
          print(
              "Classified AviMap objects:",
              classified_count
          )
          print(
              "Usable geometries:",
              geometry_count
          )
          print(
              "Geometry failures:",
              geometry_failures
          )
          print("")

          print(
              "=========================================="
          )
          print(
              "CLASSIFICATION COUNTS"
          )
          print(
              "=========================================="
          )

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              print(
                  f"{category:5s}: "
                  f"{classification_counts.get(category, 0)}"
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "GEOMETRY COUNTS"
          )
          print(
              "=========================================="
          )

          for category in [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]:

              classified = classification_counts.get(
                  category,
                  0
              )

              geometries = geometry_counts.get(
                  category,
                  0
              )

              failures = geometry_failure_counts.get(
                  category,
                  0
              )

              print(
                  f"{category:5s}: "
                  f"classified={classified:4d} "
                  f"geometry={geometries:4d} "
                  f"failed={failures:4d}"
              )

          # ========================================================
          # SHOW GEOMETRY FAILURES
          # ========================================================

          if geometry_failures_detail:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "GEOMETRY FAILURES"
              )
              print(
                  "=========================================="
              )

              for failure in geometry_failures_detail:

                  print("")
                  print(
                      "Category:",
                      failure["category"]
                  )

                  print(
                      "Designator:",
                      failure["designator"]
                  )

                  print(
                      "Name:",
                      failure["name"]
                  )

          # ========================================================
          # HARD SAFETY CHECKS
          # ========================================================

          if raw_airspaces < 1000:

              raise SystemExit(
                  "ERROR: FULL NATS AIXM contains only "
                  f"{raw_airspaces} Airspace objects. "
                  "This is not the expected full dataset. "
                  "Refusing to replace existing GeoJSON."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero classified AviMap airspace "
                  "features were produced."
              )

          if geometry_count == 0:

              raise SystemExit(
                  "ERROR: Zero valid airspace geometries."
              )

          # --------------------------------------------------------
          # Every classified object must have geometry.
          #
          # This is intentionally retained. We do not publish a
          # partially converted airspace dataset.
          # --------------------------------------------------------

          if geometry_failures != 0:

              raise SystemExit(
                  "ERROR: "
                  f"{geometry_failures} selected airspace "
                  "features had no usable geometry. "
                  "Refusing to create incomplete GeoJSON."
              )

          # --------------------------------------------------------
          # Also verify the counts match exactly.
          # --------------------------------------------------------

          if geometry_count != classified_count:

              raise SystemExit(
                  "ERROR: Geometry/classification count mismatch. "
                  f"Classified={classified_count}, "
                  f"Geometry={geometry_count}. "
                  "Refusing to create GeoJSON."
              )

          if len(features) != classified_count:

              raise SystemExit(
                  "ERROR: Feature count mismatch. "
                  f"Classified={classified_count}, "
                  f"Features={len(features)}."
              )

          if len(features) < 100:

              raise SystemExit(
                  "ERROR: Suspiciously small filtered airspace "
                  f"dataset: {len(features)} features."
              )

          # ========================================================
          # WRITE GEOJSON
          # ========================================================

          output = {
              "type": "FeatureCollection",
              "features": features
          }

          Path(OUT).write_text(
              json.dumps(
                  output,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "AIRSPACE GEOJSON CREATED"
          )
          print(
              "=========================================="
          )
          print("")
          print(
              "Output:",
              OUT
          )
          print(
              "Features:",
              len(features)
          )
          print(
              "AIRAC:",
              AIRAC
          )
          print("")

          PY

      # ============================================================
      # CONVERT NATS VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/uk-vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value)
                  .strip()
                  .lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  if norm(name) in normalised:
                      return normalised[
                          norm(name)
                      ]

              for key, original in normalised.items():

                  for name in names:

                      n = norm(name)

                      if (
                          n in key
                          or
                          key in n
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if not lat_field or not lon_field:

              raise SystemExit(
                  "ERROR: Could not identify NATS VRP "
                  "coordinate fields. "
                  f"Fields: {fields}"
              )

          def parse_coord(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = (
                  str(value)
                  .strip()
                  .replace(",", ".")
              )

              if not text:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[:match.start()]
                      .strip()
                  )

              # ----------------------------------------------------
              # Decimal degrees.
              # ----------------------------------------------------

              try:

                  decimal = float(
                      text
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= decimal
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:
                          decimal = -abs(
                              decimal
                          )

                      elif hemisphere in {
                          "N",
                          "E"
                      }:
                          decimal = abs(
                              decimal
                          )

                      return decimal

              except ValueError:
                  pass

              # ----------------------------------------------------
              # Compact DMS / DDM.
              # ----------------------------------------------------

              compact = (
                  text
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              if re.fullmatch(
                  r"\d+(?:\.\d+)?",
                  compact
              ):

                  try:

                      if "." in compact:

                          integer_part, decimal_part = (
                              compact.split(
                                  ".",
                                  1
                              )
                          )

                      else:

                          integer_part = compact
                          decimal_part = ""

                      if latitude:

                          if len(integer_part) < 6:
                              raise ValueError

                          degrees = int(
                              integer_part[:2]
                          )

                          minutes = int(
                              integer_part[2:4]
                          )

                          seconds_text = (
                              integer_part[4:]
                          )

                      else:

                          if len(integer_part) < 7:
                              raise ValueError

                          degrees = int(
                              integer_part[:3]
                          )

                          minutes = int(
                              integer_part[3:5]
                          )

                          seconds_text = (
                              integer_part[5:]
                          )

                      if decimal_part:
                          seconds_text += (
                              "."
                              + decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      limit = (
                          90
                          if latitude
                          else 180
                      )

                      if (
                          degrees > limit
                          or
                          minutes >= 60
                          or
                          seconds >= 60
                      ):
                          raise ValueError

                      result = (
                          degrees
                          +
                          minutes / 60
                          +
                          seconds / 3600
                      )

                      if hemisphere in {
                          "S",
                          "W"
                      }:
                          result = -abs(
                              result
                          )

                      elif hemisphere in {
                          "N",
                          "E"
                      }:
                          result = abs(
                              result
                          )

                      return result

                  except (
                      ValueError,
                      IndexError
                  ):
                      pass

              # ----------------------------------------------------
              # DMS/DDM with separators.
              # ----------------------------------------------------

              upper = (
                  text
                  .upper()
                  .replace("°", " ")
                  .replace("'", " ")
                  .replace('"', " ")
              )

              numbers = re.findall(
                  r"[-+]?\d+(?:[.,]\d+)?",
                  upper
              )

              if not numbers:
                  return None

              values = [
                  float(
                      value.replace(
                          ",",
                          "."
                      )
                  )
                  for value in numbers
              ]

              result = abs(
                  values[0]
              )

              if len(values) > 1:

                  result += (
                      abs(values[1])
                      / 60
                  )

              if len(values) > 2:

                  result += (
                      abs(values[2])
                      / 3600
                  )

              if hemisphere in {
                  "S",
                  "W"
              }:
                  result = -result

              limit = (
                  90
                  if latitude
                  else 180
              )

              if (
                  result < -limit
                  or
                  result > limit
              ):
                  return None

              return result

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              latitude = parse_coord(
                  row.get(lat_field),
                  True
              )

              longitude = parse_coord(
                  row.get(lon_field),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):
                  invalid += 1
                  continue

              if not (
                  -90
                  <= latitude
                  <= 90
              ):
                  invalid += 1
                  continue

              if not (
                  -180
                  <= longitude
                  <= 180
              ):
                  invalid += 1
                  continue

              name = (
                  str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()
                  if name_field
                  else ""
              )

              if not name:
                  name = (
                      f"VRP {index}"
                  )

              props = {
                  str(key).strip(): value
                  for key, value in row.items()
                  if key
              }

              props["name"] = name
              props["ident"] = name
              props["source"] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type": "Feature",
                      "properties": props,
                      "geometry": {
                          "type": "Point",
                          "coordinates": [
                              longitude,
                              latitude
                          ]
                      }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )
          print(
              f"CSV records:         {len(rows)}"
          )
          print(
              f"Valid VRPs:          {len(features)}"
          )
          print(
              f"Invalid coordinates: {invalid}"
          )
          print("")

          if not features:

              raise SystemExit(
                  "ERROR: NATS VRP conversion produced "
                  "zero features. Existing repository "
                  "data will NOT be replaced."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE BEFORE TOUCHING REPOSITORY DATA
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: zero airspaces."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: zero VRPs."
            exit 1
          fi

          echo "Validation successful."

      # ============================================================
      # INSTALL ONLY VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT ONLY IF CHANGED
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          echo ""
          echo "Checking for changes..."
          echo ""

          git status --short

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo ""
            echo "=========================================="
            echo "NO DATA CHANGES DETECTED"
            echo "=========================================="
            echo ""
            echo "The downloaded datasets are identical"
            echo "to the versions already in Git."
            echo ""

            exit 0

          fi

          echo ""
          echo "=========================================="
          echo "DATA CHANGES DETECTED"
          echo "=========================================="
          echo ""

          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push

          echo ""
          echo "Aviation data committed successfully."
