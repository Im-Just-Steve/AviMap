              for item in match[
                  "coordinate_matches"
              ][
                  :100
              ]:

                  print(
                      "  ",
                      item
                  )


              airspace = airspaces[
                  match[
                      "index"
                  ] - 1
              ]


              safe_id = re.sub(
                  r"[^A-Za-z0-9_.-]",
                  "_",
                  match[
                      "id"
                  ]
                  or
                  f"match_{number}"
              )


              output_path = Path(
                  f"/tmp/egul-airspace-{number}-{safe_id}.xml"
              )


              output_path.write_bytes(
