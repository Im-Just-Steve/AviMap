name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # IMPORTANT:
      # We do NOT construct the NATS AIP download filename.
      #
      # The NATS checklist identifies the dataset, but the actual
      # downloadable URL is obtained by parsing NATS HTML links.
      #
      # We inspect:
      #   1. The current checklist
      #   2. The NATS digital-datasets index
      #   3. Any linked dataset page exposed by those pages
      #
      # The actual href supplied by NATS is then used.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINDING CURRENT NATS DATASETS"
          echo "=========================================="
          echo ""

          python3 <<'PY'
          import html
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          USER_AGENT = (
              "AviMap-NATS-Data-Updater/1.0"
          )

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          DIGITAL_DATASETS_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/export/sites/default/en/"
              "Publications/digital-datasets/"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          print(
              "Today (UTC):",
              today
          )

          # --------------------------------------------------------
          # HTML link parser
          # --------------------------------------------------------

          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self._href = None
                  self._text = []

              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attributes = dict(
                      attrs
                  )

                  self._href = (
                      attributes.get("href")
                  )

                  self._text = []

              def handle_data(
                  self,
                  data
              ):

                  if self._href is not None:

                      self._text.append(
                          data
                      )

              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self._href is not None
                  ):

                      text = " ".join(
                          self._text
                      )

                      self.links.append(
                          (
                              self._href,
                              text
                          )
                      )

                      self._href = None
                      self._text = []

          def fetch(
              url
          ):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  body = response.read()

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

              return (
                  body,
                  content_type
              )

          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:

                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result

          def normalise(
              value
          ):

              return re.sub(
                  r"[^A-Z0-9]+",
                  "",
                  value.upper()
              )

          def looks_like_aip(
              url,
              text,
              airac
          ):

              combined = (
                  f"{url} {text}"
              ).upper()

              compact = normalise(
                  combined
              )

              stamp = airac

              # Exact checklist dataset identity.
              if (
                  f"EGAIPDSFULL{stamp}"
                  in compact
              ):

                  return True

              # Some NATS download links use AIS naming.
              if (
                  f"EGAISDSFULL{stamp}"
                  in compact
              ):

                  return True

              # Archive links can use spaces and omit underscores.
              if (
                  stamp in compact
                  and
                  (
                      "AIP" in compact
                      or
                      "AIS" in compact
                  )
                  and
                  (
                      "ZIP" in compact
                      or
                      "XML" in compact
                  )
              ):

                  return True

              return False

          def looks_like_vrp(
              url,
              text,
              airac
          ):

              combined = (
                  f"{url} {text}"
              ).upper()

              compact = normalise(
                  combined
              )

              if (
                  f"EGVRPDSAREA1FULL{airac}"
                  in compact
              ):

                  return True

              if (
                  airac in compact
                  and
                  "VRP" in compact
                  and
                  (
                      "CSV" in compact
                      or
                      "XLSX" in compact
                      or
                      "ZIP" in compact
                  )
              ):

                  return True

              return False

          # --------------------------------------------------------
          # Find latest checklist.
          # --------------------------------------------------------

          selected_html = None
          selected_url = None
          selected_date = None

          print("")
          print(
              "Searching NATS Dataset Checklists..."
          )

          for offset in range(
              0,
              90
          ):

              date = (
                  today -
                  timedelta(
                      days=offset
                  )
              )

              stamp = date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.html",

                  CHECKLIST_BASE +
                  f"Dataset_Checklist_{stamp}.HTML"
              ]

              for url in candidates:

                  try:

                      body, _ = fetch(
                          url
                      )

                  except Exception:

                      continue

                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )

                  if (
                      "EG_AIP_DS_FULL_" not in text
                      or
                      "EG_VRP_DS_AREA1_FULL_" not in text
                  ):

                      continue

                  selected_html = body
                  selected_url = url
                  selected_date = date

                  break

              if selected_html is not None:

                  break

          if selected_html is None:

              raise SystemExit(
                  "ERROR: Could not find a current "
                  "NATS Dataset Checklist."
              )

          print("")
          print(
              "Selected NATS checklist:"
          )
          print(
              selected_url
          )

          print(
              "Checklist date:",
              selected_date
          )

          checklist_text = selected_html.decode(
              "utf-8",
              errors="replace"
          )

          # --------------------------------------------------------
          # Determine AIP AIRAC.
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )

          if not aip_matches:

              raise SystemExit(
                  "ERROR: NATS checklist contains no "
                  "AIP XML dataset."
              )

          aip_candidates = []

          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue

              if date <= today:

                  aip_candidates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not aip_candidates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )

          aip_date, aip_stamp = max(
              aip_candidates,
              key=lambda x: x[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_stamp}.XML"
          )

          # --------------------------------------------------------
          # Determine VRP AIRAC.
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )

          if not vrp_matches:

              raise SystemExit(
                  "ERROR: NATS checklist contains no "
                  "VRP dataset."
              )

          vrp_candidates = []

          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue

              if date <= today:

                  vrp_candidates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not vrp_candidates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )

          vrp_date, vrp_stamp = max(
              vrp_candidates,
              key=lambda x: x[0]
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_stamp}.CSV"
          )

          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "AIP checklist dataset:",
              aip_filename
          )

          print("")
          print(
              "VRP AIRAC:",
              vrp_stamp
          )

          print(
              "VRP checklist dataset:",
              vrp_filename
          )

          # --------------------------------------------------------
          # Parse checklist links.
          # --------------------------------------------------------

          checklist_links = parse_links(
              selected_url,
              selected_html
          )

          print("")
          print(
              "Checklist links found:",
              len(checklist_links)
          )

          # --------------------------------------------------------
          # Fetch digital dataset index.
          # --------------------------------------------------------

          print("")
          print(
              "Downloading NATS digital dataset index..."
          )

          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Could not download "
                  "digital dataset index:",
                  exc
              )

              index_links = []

          print(
              "Index links found:",
              len(index_links)
          )

          # --------------------------------------------------------
          # Search for actual NATS-provided AIP hrefs.
          #
          # We never manufacture an archive filename here.
          # --------------------------------------------------------

          aip_links = []

          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              key = (
                  url,
                  text
              )

              if key in seen:

                  continue

              seen.add(
                  key
              )

              if looks_like_aip(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )

          print("")
          print(
              "AIP links matching current AIRAC:"
          )

          for url, text in aip_links:

              print(
                  "TEXT:",
                  text
              )

              print(
                  "HREF:",
                  url
              )

          # --------------------------------------------------------
          # Follow matching dataset pages and inspect their links.
          #
          # This handles the case where the checklist points to a
          # dataset landing page rather than the archive itself.
          # --------------------------------------------------------

          expanded_links = []

          for url, text in list(
              aip_links
          ):

              parsed = urlparse(
                  url
              )

              path = parsed.path.lower()

              if (
                  path.endswith(
                      ".html"
                  )
                  or
                  path.endswith(
                      ".htm"
                  )
                  or
                  path.endswith(
                      "/"
                  )
              ):

                  print("")
                  print(
                      "Inspecting linked AIP dataset page:"
                  )

                  print(
                      url
                  )

                  try:

                      body, _ = fetch(
                          url
                      )

                      links = parse_links(
                          url,
                          body
                      )

                      for child_url, child_text in links:

                          if looks_like_aip(
                              child_url,
                              child_text,
                              aip_stamp
                          ):

                              expanded_links.append(
                                  (
                                      child_url,
                                      child_text
                                  )
                              )

                  except Exception as exc:

                      print(
                          "WARNING: Could not inspect:",
                          exc
                      )

          aip_links.extend(
              expanded_links
          )

          # Deduplicate.
          unique_aip_links = []

          seen_urls = set()

          for url, text in aip_links:

              if url in seen_urls:

                  continue

              seen_urls.add(
                  url
              )

              unique_aip_links.append(
                  (
                      url,
                      text
                  )
              )

          aip_links = unique_aip_links

          print("")
          print(
              "Final NATS-provided AIP links:"
          )

          for url, text in aip_links:

              print(
                  url
              )

          # --------------------------------------------------------
          # Search for VRP links in exactly the same way.
          # --------------------------------------------------------

          vrp_links = []

          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              key = (
                  url,
                  text
              )

              if key in seen:

                  continue

              seen.add(
                  key
              )

              if looks_like_vrp(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )

          # --------------------------------------------------------
          # Save discovery information.
          # --------------------------------------------------------

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # AIP discovery must succeed.
          # --------------------------------------------------------

          if not aip_links:

              print("")
              print(
                  "=========================================="
              )
              print(
                  "NATS AIP DISCOVERY FAILED"
              )
              print(
                  "=========================================="
              )

              print("")
              print(
                  "Checklist dataset:"
              )

              print(
                  aip_filename
              )

              print("")
              print(
                  "No NATS-provided href matching the "
                  "current AIP dataset was found."
              )

              print("")
              print(
                  "The workflow will NOT guess a URL."
              )

              raise SystemExit(
                  1
              )

          print("")
          print(
              "NATS dataset discovery complete."
          )

          PY

      # ============================================================
      # DOWNLOAD NATS AIP
      #
      # Every URL used here came from a NATS HTML href.
      # No archive filename is invented.
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS AIP DATASET"
          echo "=========================================="
          echo ""

          mkdir -p \
            /tmp/nats-aip

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "NATS supplied URL:"
            echo "${URL}"

            rm -f \
              /tmp/nats-aip-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output \
                /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 120 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then

              continue

            fi

            echo ""
            echo "Response type:"

            file \
              /tmp/nats-aip-download

            # ------------------------------------------------------
            # Direct XML.
            # ------------------------------------------------------

            if grep -aqi \
              "<[^>]*AIXM" \
              /tmp/nats-aip-download; then

              echo ""
              echo "SUCCESS: NATS supplied direct AIP XML."

              cp \
                /tmp/nats-aip-download \
                /tmp/uk-aip.xml

              FOUND="${URL}"

              break

            fi

            # ------------------------------------------------------
            # ZIP archive.
            # ------------------------------------------------------

            if file \
              /tmp/nats-aip-download \
              | grep -qi \
                "Zip archive"; then

              echo ""
              echo "SUCCESS: NATS supplied AIP ZIP."

              rm -rf \
                /tmp/nats-aip

              mkdir -p \
                /tmp/nats-aip

              cp \
                /tmp/nats-aip-download \
                /tmp/nats-aip.zip

              unzip \
                -o \
                /tmp/nats-aip.zip \
                -d /tmp/nats-aip

              echo ""
              echo "AIP archive contents:"

              find \
                /tmp/nats-aip \
                -type f \
                -print

              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )

              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml

                FOUND="${URL}"

                break

              fi

              echo ""
              echo "ZIP did not contain the expected FULL AIP XML."

            fi

          done < /tmp/nats-aip-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "=========================================="
            echo "NATS AIP DOWNLOAD FAILED"
            echo "=========================================="
            echo ""

            echo "NATS checklist dataset:"
            cat \
              /tmp/nats-aip-filename.txt

            echo ""
            echo "NATS-provided links tested:"

            cat \
              /tmp/nats-aip-links.txt

            echo ""
            echo "No aviation data has been changed."

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "NATS AIP DOWNLOAD SUCCESSFUL"
          echo "=========================================="
          echo ""

          echo "Source:"
          echo "${FOUND}"

          echo ""
          echo "AIP XML:"
          ls -lh \
            /tmp/uk-aip.xml

          echo ""
          echo "XML validation:"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "/tmp/uk-aip.xml"

          ET.parse(
              path
          )

          print(
              "AIP XML parses successfully."
          )
          PY

      # ============================================================
      # DOWNLOAD NATS VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING NATS VRP DATASET"
          echo "=========================================="
          echo ""

          mkdir -p \
            /tmp/nats-vrp

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "NATS supplied URL:"
            echo "${URL}"

            rm -f \
              /tmp/nats-vrp-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output \
                /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 120 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then

              continue

            fi

            file \
              /tmp/nats-vrp-download

            # ------------------------------------------------------
            # ZIP.
            # ------------------------------------------------------

            if file \
              /tmp/nats-vrp-download \
              | grep -qi \
                "Zip archive"; then

              rm -rf \
                /tmp/nats-vrp

              mkdir -p \
                /tmp/nats-vrp

              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp

              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )

              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv

                FOUND="${URL}"

                break

              fi

            fi

            # ------------------------------------------------------
            # Direct CSV.
            # ------------------------------------------------------

            if head \
              -n 5 \
              /tmp/nats-vrp-download \
              | grep -qi \
                "latitude\|longitude\|longitude"; then

              cp \
                /tmp/nats-vrp-download \
                /tmp/uk-vrps.csv

              FOUND="${URL}"

              break

            fi

          done < /tmp/nats-vrp-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "=========================================="
            echo "NATS VRP DOWNLOAD FAILED"
            echo "=========================================="
            echo ""

            echo "VRP checklist dataset:"
            cat \
              /tmp/nats-vrp-filename.txt

            echo ""
            echo "NATS-provided VRP links:"

            cat \
              /tmp/nats-vrp-links.txt

            exit 1

          fi

          test -s \
            /tmp/uk-vrps.csv

          echo ""
          echo "VRP source:"
          echo "${FOUND}"

          echo ""
          echo "VRP CSV:"
          ls -lh \
            /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT NATS AIXM AIRSPACE
      #
      # Retain ONLY:
      #
      # A-G
      # PA
      # RA
      # DA
      # ATZ
      # MATZ
      # RMZ
      # TMZ
      #
      # NOTAM airspace is deliberately excluded for now.
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("")
          print(
              "=========================================="
          )
          print(
              "PARSING NATS AIXM"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "XML:",
              XML
          )

          tree = ET.parse(
              XML
          )

          root = tree.getroot()

          print(
              "XML parsed successfully."
          )

          def local(tag):

              return tag.rsplit(
                  "}",
                  1
              )[-1]

          index = {}

          for element in root.iter():

              for key, value in element.attrib.items():

                  if local(key) in {
                      "id",
                      "href"
                  }:

                      if value:

                          index[
                              value.lstrip("#")
                          ] = element

          print(
              "Indexed XML objects:",
              len(index)
          )

          def resolve(element):

              current = element
              seen = set()

              while current is not None:

                  href = None

                  for key, value in current.attrib.items():

                      if local(key) in {
                          "href"
                      }:

                          href = value
                          break

                  if not href:

                      return current

                  reference = href.lstrip(
                      "#"
                  )

                  if reference in seen:

                      return current

                  seen.add(
                      reference
                  )

                  current = index.get(
                      reference
                  )

              return current

          def texts(
              element,
              names
          ):

              wanted = set(
                  names
              )

              values = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      in wanted
                      and
                      child.text
                  ):

                      value = (
                          child.text.strip()
                      )

                      if value:

                          values.append(
                              value
                          )

              return values

          def first_text(
              element,
              names
          ):

              values = texts(
                  element,
                  names
              )

              return (
                  values[0]
                  if values
                  else ""
              )

          def nums(text):

              values = []

              for value in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not value:

                      continue

                  try:

                      values.append(
                          float(value)
                      )

                  except ValueError:

                      pass

              return values

          def ring_from(
              element
          ):

              element = resolve(
                  element
              )

              if element is None:

                  return []

              for child in element.iter():

                  if (
                      local(child.tag)
                      == "posList"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      coords = []

                      for i in range(
                          0,
                          len(values) - 1,
                          2
                      ):

                          coords.append(
                              [
                                  values[i + 1],
                                  values[i]
                              ]
                          )

                      if len(coords) >= 4:

                          if (
                              coords[0]
                              !=
                              coords[-1]
                          ):

                              coords.append(
                                  coords[0]
                              )

                          return coords

              coords = []

              for child in element.iter():

                  if (
                      local(child.tag)
                      == "pos"
                      and
                      child.text
                  ):

                      values = nums(
                          child.text
                      )

                      if len(values) >= 2:

                          coords.append(
                              [
                                  values[1],
                                  values[0]
                              ]
                          )

              if len(coords) >= 4:

                  if (
                      coords[0]
                      !=
                      coords[-1]
                  ):

                      coords.append(
                          coords[0]
                      )

                  return coords

              return []

          def geometry_for(
              airspace
          ):

              polygons = []

              candidates = []

              for element in airspace.iter():

                  resolved = resolve(
                      element
                  )

                  if resolved is not None:

                      candidates.append(
                          resolved
                      )

              seen = set()

              for element in candidates:

                  marker = id(
                      element
                  )

                  if marker in seen:

                      continue

                  seen.add(
                      marker
                  )

                  for polygon in element.iter():

                      if local(
                          polygon.tag
                      ) not in {
                          "PolygonPatch",
                          "Polygon"
                      }:

                          continue

                      rings = []

                      for ring in polygon.iter():

                          if local(
                              ring.tag
                          ) != "LinearRing":

                              continue

                          points = ring_from(
                              ring
                          )

                          if points:

                              rings.append(
                                  points
                              )

                      if rings:

                          polygons.append(
                              rings
                          )

              if not polygons:

                  return None

              if len(polygons) == 1:

                  return {
                      "type":
                          "Polygon",

                      "coordinates":
                          polygons[0]
                  }

              return {
                  "type":
                      "MultiPolygon",

                  "coordinates":
                      polygons
              }

          def classify(
              airspace
          ):

              values = []

              values.extend(
                  texts(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "localType",
                          "AirspaceLocalType",
                          "class",
                          "AirspaceClassification",
                          "designator",
                          "name"
                      }
                  )
              )

              combined = (
                  " ".join(
                      values
                  ).upper()
              )

              compact = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  combined
              )

              # ----------------------------------------------------
              # Special categories first.
              # ----------------------------------------------------

              if (
                  re.search(
                      r"\bMATZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"MILITARY\s+AERODROME\s+TRAFFIC\s+ZONE",
                      compact
                  )
              ):

                  return "MATZ"

              if (
                  re.search(
                      r"\bRMZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"RADIO\s+MANDATORY\s+ZONE",
                      compact
                  )
              ):

                  return "RMZ"

              if (
                  re.search(
                      r"\bTMZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"TRANSPONDER\s+MANDATORY\s+ZONE",
                      compact
                  )
              ):

                  return "TMZ"

              if (
                  re.search(
                      r"\bATZ\b",
                      compact
                  )
                  or
                  re.search(
                      r"AERODROME\s+TRAFFIC\s+ZONE",
                      compact
                  )
              ):

                  return "ATZ"

              # ----------------------------------------------------
              # P / R / D.
              # ----------------------------------------------------

              if re.search(
                  r"\bPROHIBITED\b",
                  compact
              ):

                  return "PA"

              if re.search(
                  r"\bRESTRICTED\b",
                  compact
              ):

                  return "RA"

              if re.search(
                  r"\bDANGER\b",
                  compact
              ):

                  return "DA"

              # ----------------------------------------------------
              # A-G.
              # ----------------------------------------------------

              for letter in (
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              ):

                  if re.search(
                      rf"\bCLASS\s*{letter}\b",
                      compact
                  ):

                      return letter

              for value in values:

                  cleaned = re.sub(
                      r"[^A-Z]",
                      "",
                      value.upper()
                  )

                  if cleaned in {
                      "A",
                      "B",
                      "C",
                      "D",
                      "E",
                      "F",
                      "G"
                  }:

                      return cleaned

              return None

          categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "PA",
              "RA",
              "DA",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          counts = {
              category: 0
              for category in categories
          }

          geometry_counts = {
              category: 0
              for category in categories
          }

          raw_count = 0
          classified_count = 0
          geometry_failures = 0

          features = []

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              category = classify(
                  airspace
              )

              if category is None:

                  continue

              classified_count += 1

              counts[
                  category
              ] += 1

              geometry = geometry_for(
                  airspace
              )

              if geometry is None:

                  geometry_failures += 1

                  continue

              geometry_counts[
                  category
              ] += 1

              designator = first_text(
                  airspace,
                  {
                      "designator"
                  }
              )

              name = first_text(
                  airspace,
                  {
                      "name"
                  }
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          {
                              "name":
                                  (
                                      name
                                      or
                                      designator
                                      or
                                      "Unknown airspace"
                                  ),

                              "designator":
                                  designator,

                              "category":
                                  category,

                              "source":
                                  "NATS UK ICAO AIP Dataset",

                              "airac":
                                  AIRAC
                          },

                      "geometry":
                          geometry
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )

          print(
              "Raw NATS Airspace:",
              raw_count
          )

          print(
              "Classified AviMap airspaces:",
              classified_count
          )

          print(
              "Geometry successes:",
              len(features)
          )

          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print(
              "CLASSIFICATION COUNTS"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{counts[category]}"
              )

          print("")
          print(
              "GEOMETRY COUNTS"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts[category]}"
              )

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  "AIXM dataset."
              )

          if classified_count == 0:

              raise SystemExit(
                  "ERROR: Zero filtered airspace."
              )

          if len(features) == 0:

              raise SystemExit(
                  "ERROR: Zero valid airspace geometry."
              )

          Path(
              OUT
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "GeoJSON written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPs
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:

              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )

          except csv.Error:

              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:

              raise SystemExit(
                  "ERROR: VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          mapping = {
              norm(field):
                  field
              for field in fields
              if field
          }

          def find_field(
              *names
          ):

              for name in names:

                  if norm(name) in mapping:

                      return mapping[
                          norm(name)
                      ]

              for key, original in mapping.items():

                  for name in names:

                      n = norm(name)

                      if (
                          n in key
                          or
                          key in n
                      ):

                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          if (
              lat_field is None
              or
              lon_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP "
                  "latitude/longitude fields."
              )

          def coord(
              value,
              latitude
          ):

              if value is None:

                  return None

              text = str(
                  value
              ).strip()

              if not text:

                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(1)
                      .upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              try:

                  value = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= value
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          value = -abs(
                              value
                          )

                      return value

              except ValueError:

                  pass

              return None

          features = []

          for row in rows:

              lat = coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):

                  continue

              name = ""

              if name_field:

                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              properties = {
                  str(key):
                      value
                  for key, value
                  in row.items()
                  if key
              }

              properties[
                  "name"
              ] = (
                  name
                  or
                  "VRP"
              )

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      lon,
                                      lat
                                  ]
                          }
                  }
              )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print(
              "CSV records:",
              len(rows)
          )

          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: Zero valid VRPs."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE GENERATED DATA
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="

          echo ""
          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero airspaces."

            exit 1

          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero VRPs."

            exit 1

          fi

          echo ""
          echo "Validation successful."

      # ============================================================
      # INSTALL VALIDATED AVIATION DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p \
            data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT UPDATED DATA
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo "No aviation data changes detected."

            exit 0

          fi

          echo ""
          echo "Changes to be committed:"
          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
