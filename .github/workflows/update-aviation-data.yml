name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3


      # ============================================================
      # DISCOVER CURRENT NATS DATASETS
      # ============================================================

      - name: Discover current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin


          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"


          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )


          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )


          today = datetime.now(
              timezone.utc
          ).date()


          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []


              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []


              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:
                      self.text.append(
                          data
                      )


              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )


          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )


          def is_aip_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGAIPDSFULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "AIP" in value
                      and
                      (
                          "XML" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          def is_vrp_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "VRP" in value
                      and
                      (
                          "CSV" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          print(
              "=========================================="
          )

          print(
              "NATS DATASET DISCOVERY"
          )

          print(
              "=========================================="
          )


          checklist_body = None
          checklist_url = None


          print(
              "Searching NATS Dataset Checklists..."
          )


          for offset in range(90):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]


              for candidate in candidates:

                  try:

                      body, _ = fetch(
                          candidate
                      )

                  except Exception:

                      continue


                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )


                  if (
                      "EG_AIP_DS_FULL_"
                      in text
                      and
                      "EG_VRP_DS_AREA1_FULL_"
                      in text
                  ):

                      checklist_body = body
                      checklist_url = candidate

                      break


              if checklist_body is not None:
                  break


          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find current NATS Dataset Checklist."
              )


          print(
              "Checklist:"
          )

          print(
              checklist_url
          )


          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )


          # --------------------------------------------------------
          # AIP AIRAC
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )


          aip_dates = []


          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )


          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )


          # --------------------------------------------------------
          # VRP AIRAC
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )


          vrp_dates = []


          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )


          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )


          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "VRP AIRAC:",
              vrp_stamp
          )


          # --------------------------------------------------------
          # LINKS
          # --------------------------------------------------------

          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )


          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Digital dataset index unavailable:"
              )

              print(
                  exc
              )

              index_links = []


          aip_links = []
          vrp_links = []

          seen = set()


          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)


              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )


              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )


          # --------------------------------------------------------
          # FOLLOW DATASET PAGES
          # --------------------------------------------------------

          for url, text in list(
              aip_links
          ):

              lower = url.lower()


              if not (
                  lower.endswith(
                      ".html"
                  )
                  or
                  lower.endswith(
                      ".htm"
                  )
                  or
                  lower.endswith(
                      "/"
                  )
              ):

                  continue


              try:

                  body, _ = fetch(
                      url
                  )


                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          aip_links.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )


              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )


          def unique_links(
              links
          ):

              result = []
              seen_urls = set()


              for url, text in links:

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  result.append(
                      (
                          url,
                          text
                      )
                  )


              return result


          aip_links = unique_links(
              aip_links
          )

          vrp_links = unique_links(
              vrp_links
          )


          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "NATS AIP download candidates:"
          )


          for url, text in aip_links:

              print(
                  text,
                  "=>",
                  url
              )


          print("")
          print(
              "NATS VRP download candidates:"
          )


          for url, text in vrp_links:

              print(
                  text,
                  "=>",
                  url
              )


          if not aip_links:

              raise SystemExit(
                  "ERROR: No NATS AIP download href found."
              )


          if not vrp_links:

              raise SystemExit(
                  "ERROR: No NATS VRP download href found."
              )

          PY


      # ============================================================
      # DOWNLOAD AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip

          mkdir -p /tmp/nats-aip

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing NATS AIP URL:"
            echo "${URL}"


            rm -f /tmp/nats-aip-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-aip-download


            if file /tmp/nats-aip-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip

              mkdir -p /tmp/nats-aip


              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip


              echo ""
              echo "AIP archive contents:"

              find \
                /tmp/nats-aip \
                -type f \
                -print


              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )


              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS AIP download failed."

            exit 1

          fi


          echo ""
          echo "AIP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-aip.xml


          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY


      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-vrp

          mkdir -p /tmp/nats-vrp

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing NATS VRP URL:"
            echo "${URL}"


            rm -f /tmp/nats-vrp-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-vrp-download


            if file /tmp/nats-vrp-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-vrp

              mkdir -p /tmp/nats-vrp


              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp


              echo ""
              echo "VRP archive contents:"

              find \
                /tmp/nats-vrp \
                -type f \
                -print


              VRP_CSV=$(
                find \
                  /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )


              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-vrp-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS VRP download failed."

            exit 1

          fi


          echo ""
          echo "VRP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-vrps.csv


          echo ""
          echo "VRP first 10 lines:"

          head \
            -n 10 \
            /tmp/uk-vrps.csv


      # ============================================================
      # IMPORT EVERY NATS AIRSPACE FEATURE
      #
      # IMPORTANT:
      #
      # THERE IS NO AIRSPACE CLASSIFICATION FILTER HERE.
      #
      # EVERY AIXM Airspace FEATURE IS RETAINED.
      #
      # If geometry cannot be resolved, the feature is still written
      # with geometry:null so that NOTHING is silently discarded.
      # ============================================================

      - name: Import ALL NATS airspace
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/avimap-data


          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET

          from pathlib import Path


          XML_FILE = (
              "/tmp/uk-aip.xml"
          )


          OUTPUT_FILE = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )


          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()


          tree = ET.parse(
              XML_FILE
          )

          root = tree.getroot()


          # ========================================================
          # XML HELPERS
          # ========================================================

          def local(
              tag
          ):

              return tag.rsplit(
                  "}",
                  1
              )[-1]


          def attr_local(
              element,
              wanted
          ):

              wanted = wanted.lower()


              for key, value in element.attrib.items():

                  if (
                      local(
                          key
                      ).lower()
                      ==
                      wanted
                  ):

                      return value


              return None


          # ========================================================
          # BUILD GLOBAL XML ID INDEX
          # ========================================================

          xml_id_index = {}


          parent_map = {}


          for parent in root.iter():

              for child in parent:

                  parent_map[
                      child
                  ] = parent


          for element in root.iter():

              for key, value in element.attrib.items():

                  if (
                      local(
                          key
                      ).lower()
                      in {
                          "id",
                          "uuid"
                      }
                      and
                      value
                  ):

                      xml_id_index[
                          value.lstrip("#")
                      ] = element


          print("")
          print(
              "XML indexed objects:",
              len(
                  xml_id_index
              )
          )


          # ========================================================
          # XLink RESOLUTION
          # ========================================================

          def href_target(
              element
          ):

              if element is None:
                  return None


              href = (
                  attr_local(
                      element,
                      "href"
                  )
                  or
                  attr_local(
                      element,
                      "xlink:href"
                  )
              )


              if not href:
                  return None


              reference = href.split(
                  "#",
                  1
              )[-1].strip()


              if not reference:
                  return None


              return xml_id_index.get(
                  reference
              )


          def resolved_chain(
              element,
              maximum=25
          ):

              result = []

              seen = set()

              current = element


              for _ in range(
                  maximum
              ):

                  if current is None:
                      break


                  marker = id(
                      current
                  )


                  if marker in seen:
                      break


                  seen.add(
                      marker
                  )

                  result.append(
                      current
                  )


                  target = href_target(
                      current
                  )


                  if target is None:
                      break


                  current = target


              return result


          # ========================================================
          # COORDINATE HELPERS
          # ========================================================

          def srs_name(
              element
          ):

              current = element


              for _ in range(
                  40
              ):

                  if current is None:
                      break


                  value = attr_local(
                      current,
                      "srsName"
                  )


                  if value:
                      return value


                  current = parent_map.get(
                      current
                  )


              return "EPSG:4326"


          def srs_dimension(
              element
          ):

              value = (
                  attr_local(
                      element,
                      "srsDimension"
                  )
                  or
                  attr_local(
                      element,
                      "dimension"
                  )
              )


              try:

                  return max(
                      2,
                      int(
                          value
                      )
                  )

              except (
                  TypeError,
                  ValueError
              ):

                  return 2


          def numbers(
              text
          ):

              if not text:
                  return []


              result = []


              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue


                  try:

                      result.append(
                          float(
                              token
                          )
                      )

                  except ValueError:

                      pass


              return result


          def coordinate_pairs(
              element,
              text
          ):

              values = numbers(
                  text
              )


              dimension = srs_dimension(
                  element
              )


              result = []


              for offset in range(
                  0,
                  len(values),
                  dimension
              ):

                  point = values[
                      offset:
                      offset + dimension
                  ]


                  if len(point) < 2:
                      continue


                  x = point[0]
                  y = point[1]


                  srs = srs_name(
                      element
                  ).upper()


                  # AIXM datasets are normally EPSG:4326.
                  # EPSG:4326 uses latitude/longitude ordering,
                  # whereas GeoJSON requires longitude/latitude.
                  if (
                      "4326" in srs
                      and
                      "CRS84" not in srs
                  ):

                      result.append(
                          [
                              y,
                              x
                          ]
                      )

                  else:

                      result.append(
                          [
                              x,
                              y
                          ]
                      )


              return result


          def direct_points(
              element
          ):

              result = []


              for node in element.iter():

                  name = local(
                      node.tag
                  )


                  if name in {
                      "posList",
                      "pos"
                  }:

                      if node.text:

                          result.extend(
                              coordinate_pairs(
                                  node,
                                  node.text
                              )
                          )


                  elif name == "coordinates":

                      if not node.text:
                          continue


                      for token in re.split(
                          r"\s+",
                          node.text.strip()
                      ):

                          parts = token.split(
                              ","
                          )


                          if len(parts) < 2:
                              continue


                          try:

                              x = float(
                                  parts[0]
                              )

                              y = float(
                                  parts[1]
                              )

                          except ValueError:

                              continue


                          srs = srs_name(
                              node
                          ).upper()


                          if (
                              "4326" in srs
                              and
                              "CRS84" not in srs
                          ):

                              result.append(
                                  [
                                      y,
                                      x
                                  ]
                              )

                          else:

                              result.append(
                                  [
                                      x,
                                      y
                                  ]
                              )


              return result


          # ========================================================
          # CURVE / ARC SUPPORT
          # ========================================================

          def radius_metres(
              element
          ):

              for node in element.iter():

                  if local(
                      node.tag
                  ) != "radius":
                      continue


                  if not node.text:
                      return None


                  try:

                      radius = float(
                          node.text.strip()
                      )

                  except ValueError:

                      return None


                  unit = (
                      attr_local(
                          node,
                          "uom"
                      )
                      or
                      "m"
                  ).lower()


                  if unit in {
                      "km",
                      "kilometre",
                      "kilometres",
                      "kilometer",
                      "kilometers"
                  }:

                      radius *= 1000.0


                  elif unit in {
                      "nm",
                      "nmi",
                      "[nmi_i]"
                  }:

                      radius *= 1852.0


                  return radius


              return None


          def angle_value(
              element,
              name
          ):

              for node in element.iter():

                  if (
                      local(
                          node.tag
                      )
                      ==
                      name
                      and
                      node.text
                  ):

                      try:

                          return float(
                              node.text.strip()
                          )

                      except ValueError:

                          return None


              return None


          def arc_points(
              element
          ):

              center = None


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      )
                      ==
                      "pos"
                      and
                      node.text
                  ):

                      points = coordinate_pairs(
                          node,
                          node.text
                      )


                      if points:

                          center = points[0]


                      break


              if center is None:
                  return []


              radius = radius_metres(
                  element
              )


              if radius is None:
                  return []


              start = angle_value(
                  element,
                  "startAngle"
              )


              end = angle_value(
                  element,
                  "endAngle"
              )


              if (
                  start is None
                  or
                  end is None
              ):

                  return []


              delta = (
                  end -
                  start
              )


              if delta == 0:
                  delta = 360.0


              while delta > 360.0:
                  delta -= 360.0


              while delta < -360.0:
                  delta += 360.0


              steps = min(
                  180,
                  max(
                      8,
                      int(
                          abs(
                              delta
                          )
                          /
                          4.0
                      )
                  )
              )


              points = []


              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i /
                      steps
                  )


                  angle = math.radians(
                      start +
                      (
                          delta *
                          fraction
                      )
                  )


                  latitude = (
                      center[1]
                      +
                      (
                          radius
                          *
                          math.sin(
                              angle
                          )
                          /
                          111320.0
                      )
                  )


                  longitude = (
                      center[0]
                      +
                      (
                          radius
                          *
                          math.cos(
                              angle
                          )
                          /
                          (
                              111320.0
                              *
                              max(
                                  0.05,
                                  math.cos(
                                      math.radians(
                                          latitude
                                      )
                                  )
                              )
                          )
                      )
                  )


                  points.append(
                      [
                          longitude,
                          latitude
                      ]
                  )


              return points


          # ========================================================
          # CURVE SEGMENT EXTRACTION
          # ========================================================

          def curve_segment_points(
              element,
              seen=None
          ):

              if seen is None:
                  seen = set()


              if element is None:
                  return []


              marker = id(
                  element
              )


              if marker in seen:
                  return []


              seen.add(
                  marker
              )


              chain = resolved_chain(
                  element
              )


              if not chain:
                  return []


              target = chain[-1]


              name = local(
                  target.tag
              )


              if name in {
                  "ArcByCenterPoint",
                  "CircleByCenterPoint"
              }:

                  points = arc_points(
                      target
                  )


                  if (
                      name
                      ==
                      "CircleByCenterPoint"
                      and
                      points
                      and
                      points[0]
                      !=
                      points[-1]
                  ):

                      points.append(
                          points[0]
                      )


                  return points


              if name in {
                  "LineStringSegment",
                  "GeodesicString",
                  "Geodesic",
                  "ArcStringByBulge",
                  "Arc",
                  "ArcString",
                  "Circle"
              }:

                  return direct_points(
                      target
                  )


              result = []


              for child in target.iter():

                  if local(
                      child.tag
                  ) in {
                      "LineStringSegment",
                      "GeodesicString",
                      "Geodesic",
                      "ArcStringByBulge",
                      "Arc",
                      "ArcString",
                      "Circle",
                      "ArcByCenterPoint",
                      "CircleByCenterPoint"
                  }:

                      result.extend(
                          curve_segment_points(
                              child,
                              seen
                          )
                      )


              if result:
                  return result


              return direct_points(
                  target
              )


          # ========================================================
          # RING EXTRACTION
          # ========================================================

          def ring_points(
              ring
          ):

              chain = resolved_chain(
                  ring
              )


              if not chain:
                  return []


              target = chain[-1]


              direct = direct_points(
                  target
              )


              if len(direct) >= 4:

                  if (
                      direct[0]
                      !=
                      direct[-1]
                  ):

                      direct.append(
                          direct[0]
                      )


                  return direct


              result = []


              for node in target.iter():

                  if local(
                      node.tag
                  ) != "curveMember":
                      continue


                  result.extend(
                      curve_segment_points(
                          node
                      )
                  )


              cleaned = []


              for point in result:

                  if (
                      not cleaned
                      or
                      point
                      !=
                      cleaned[-1]
                  ):

                      cleaned.append(
                          point
                      )


              if len(cleaned) >= 3:

                  if (
                      cleaned[0]
                      !=
                      cleaned[-1]
                  ):

                      cleaned.append(
                          cleaned[0]
                      )


                  return cleaned


              return []


          # ========================================================
          # SURFACE EXTRACTION
          # ========================================================

          def surface_objects(
              airspace
          ):

              result = []

              seen = set()


              # First collect any Surface directly contained
              # in the Airspace feature.

              candidates = [
                  airspace
              ]


              # Also follow every href occurring anywhere below
              # the Airspace feature. This is important because
              # AIXM geometry may be stored by reference.

              for node in airspace.iter():

                  target = href_target(
                      node
                  )


                  if target is not None:

                      candidates.append(
                          target
                      )


              # Walk all candidates recursively.

              for candidate in candidates:

                  for node in (
                      [candidate]
                      +
                      list(
                          candidate.iter()
                      )
                  ):

                      chain = resolved_chain(
                          node
                      )


                      for item in chain:

                          name = local(
                              item.tag
                          )


                          if name not in {
                              "Surface",
                              "CompositeSurface"
                          }:

                              continue


                          marker = id(
                              item
                          )


                          if marker in seen:
                              continue


                          seen.add(
                              marker
                          )

                          result.append(
                              item
                          )


              return result


          # ========================================================
          # POLYGON EXTRACTION
          # ========================================================

          def polygons_for_airspace(
              airspace
          ):

              polygons = []


              for surface in surface_objects(
                  airspace
              ):

                  for patch in surface.iter():

                      if local(
                          patch.tag
                      ) != "PolygonPatch":
                          continue


                      exterior_ring = None
                      interior_rings = []


                      for node in patch.iter():

                          name = local(
                              node.tag
                          )


                          if name == "exterior":

                              for ring in node.iter():

                                  if local(
                                      ring.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      exterior_ring = ring

                                      break


                          elif name == "interior":

                              for ring in node.iter():

                                  if local(
                                      ring.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      points = ring_points(
                                          ring
                                      )


                                      if len(
                                          points
                                      ) >= 4:

                                          interior_rings.append(
                                              points
                                          )


                                      break


                      if exterior_ring is None:
                          continue


                      outer = ring_points(
                          exterior_ring
                      )


                      if len(
                          outer
                      ) < 4:

                          continue


                      polygons.append(
                          [
                              outer
                          ]
                          +
                          interior_rings
                      )


              return polygons


          # ========================================================
          # AIRSPACE PROPERTY EXTRACTION
          #
          # NO CLASSIFICATION IS PERFORMED.
          # ========================================================

          def first_value(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }


              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      value = node.text.strip()


                      if value:
                          return value


              return ""


          # ========================================================
          # FIND EVERY NATS AIRSPACE
          # ========================================================

          airspace_elements = []


          for element in root.iter():

              if local(
                  element.tag
              ) == "Airspace":

                  airspace_elements.append(
                      element
                  )


          print("")
          print(
              "=========================================="
          )

          print(
              "RAW NATS AIRSPACE IMPORT"
          )

          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "NATS Airspace features found:",
              len(
                  airspace_elements
              )
          )


          if not airspace_elements:

              raise SystemExit(
                  "ERROR: NATS AIXM contains no Airspace features."
              )


          # ========================================================
          # CREATE GEOJSON
          #
          # EVERY AIRSPACE FEATURE IS WRITTEN.
          # ========================================================

          features = []


          geometry_success = 0
          geometry_missing = 0
          polygon_count = 0


          for index, airspace in enumerate(
              airspace_elements,
              start=1
          ):

              polygons = polygons_for_airspace(
                  airspace
              )


              geometry = None


              if polygons:

                  polygon_count += len(
                      polygons
                  )


                  if len(
                      polygons
                  ) == 1:

                      geometry = {
                          "type":
                              "Polygon",
                          "coordinates":
                              polygons[0]
                      }

                  else:

                      geometry = {
                          "type":
                              "MultiPolygon",
                          "coordinates":
                              polygons
                      }


                  geometry_success += 1

              else:

                  geometry_missing += 1


              # ----------------------------------------------------
              # Preserve useful NATS/AIXM metadata.
              #
              # We DO NOT use these fields to filter anything.
              # ----------------------------------------------------

              designator = first_value(
                  airspace,
                  {
                      "designator"
                  }
              )


              name = first_value(
                  airspace,
                  {
                      "name"
                  }
              )


              airspace_type = first_value(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )


              local_type = first_value(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )


              airspace_class = first_value(
                  airspace,
                  {
                      "class",
                      "AirspaceClass"
                  }
              )


              identifier = (
                  attr_local(
                      airspace,
                      "id"
                  )
                  or
                  attr_local(
                      airspace,
                      "uuid"
                  )
                  or
                  ""
              )


              properties = {
                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC,

                  "nats_feature_type":
                      "Airspace",

                  "nats_id":
                      identifier,

                  "designator":
                      designator,

                  "name":
                      (
                          name
                          or
                          designator
                          or
                          identifier
                          or
                          "NATS Airspace"
                      ),

                  "airspace_type":
                      airspace_type,

                  "local_type":
                      local_type,

                  "airspace_class":
                      airspace_class,

                  "geometry_available":
                      geometry is not None
              }


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )


          # ========================================================
          # WRITE OUTPUT
          # ========================================================

          output = {
              "type":
                  "FeatureCollection",

              "features":
                  features
          }


          Path(
              OUTPUT_FILE
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "=========================================="
          )

          print(
              "IMPORT COMPLETE"
          )

          print(
              "=========================================="
          )

          print(
              "NATS Airspace features:",
              len(features)
          )

          print(
              "Features with geometry:",
              geometry_success
          )

          print(
              "Features without geometry:",
              geometry_missing
          )

          print(
              "Polygon geometries:",
              polygon_count
          )

          print(
              "GeoJSON written:",
              OUTPUT_FILE
          )


          # --------------------------------------------------------
          # IMPORTANT:
          #
          # We intentionally DO NOT fail because some features have
          # no geometry.
          #
          # The purpose of this build is to expose the complete NATS
          # Airspace feature set so we can inspect what NATS actually
          # supplied before deciding how AviMap should portray it.
          # --------------------------------------------------------

          PY


      # ============================================================
      # IMPORT ALL NATS VRPs
      # ============================================================

      - name: Import ALL NATS reporting points
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re

          from pathlib import Path


          SOURCE = Path(
              "/tmp/uk-vrps.csv"
          )


          OUTPUT = Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          )


          raw = SOURCE.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )


          print("")
          print(
              "=========================================="
          )

          print(
              "NATS VRP IMPORT"
          )

          print(
              "=========================================="
          )


          try:

              dialect = csv.Sniffer().sniff(
                  raw[:20000],
                  delimiters=",;\t|"
              )

          except csv.Error:

              dialect = csv.excel


          print(
              "Detected delimiter:",
              repr(
                  dialect.delimiter
              )
          )


          reader = csv.DictReader(
              raw.splitlines(),
              dialect=dialect
          )


          rows = list(
              reader
          )


          if not rows:

              raise SystemExit(
                  "ERROR: NATS VRP CSV contains no records."
              )


          fields = [
              field
              for field in rows[0].keys()
              if field is not None
          ]


          print(
              "CSV records:",
              len(rows)
          )


          print(
              "Fields:"
          )


          for field in fields:

              print(
                  "  ",
                  repr(field)
              )


          def normalise(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )


          normalised = {
              normalise(field):
                  field
              for field in fields
          }


          def find_field(
              candidates
          ):

              for candidate in candidates:

                  key = normalise(
                      candidate
                  )


                  if key in normalised:

                      return normalised[
                          key
                      ]


              for key, original in normalised.items():

                  for candidate in candidates:

                      candidate_key = normalise(
                          candidate
                      )


                      if candidate_key in key:

                          return original


              return None


          latitude_field = find_field(
              [
                  "Latitude",
                  "Lat"
              ]
          )


          longitude_field = find_field(
              [
                  "Longitude",
                  "Longitude",
                  "Lon"
              ]
          )


          if (
              latitude_field is None
              or
              longitude_field is None
          ):

              raise SystemExit(
                  "ERROR: Could not identify VRP latitude/longitude fields."
              )


          print(
              "Latitude field:",
              latitude_field
          )


          print(
              "Longitude field:",
              longitude_field
          )


          def parse_coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None


              text = str(
                  value
              ).strip()


              if not text:
                  return None


              hemisphere = None


              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )


              if match:

                  hemisphere = (
                      match.group(
                          1
                      ).upper()
                  )


                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )


              # Decimal degrees.

              try:

                  number = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )


                  limit = (
                      90
                      if latitude
                      else
                      180
                  )


                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          number = -abs(
                              number
                          )


                      return number


              except ValueError:

                  pass


              # NATS DMS form, e.g.
              #
              # 514645N
              # 0001328W

              if hemisphere:

                  cleaned = re.sub(
                      r"[^0-9.]",
                      "",
                      text
                  )


                  try:

                      integer_part = cleaned.split(
                          ".",
                          1
                      )[0]


                      if len(
                          integer_part
                      ) >= 6:

                          if latitude:

                              degrees = float(
                                  cleaned[:2]
                              )

                              minutes = float(
                                  cleaned[2:4]
                              )

                              seconds = float(
                                  cleaned[4:]
                              )

                          else:

                              degrees = float(
                                  cleaned[:3]
                              )

                              minutes = float(
                                  cleaned[3:5]
                              )

                              seconds = float(
                                  cleaned[5:]
                              )


                          number = (
                              degrees
                              +
                              (
                                  minutes /
                                  60.0
                              )
                              +
                              (
                                  seconds /
                                  3600.0
                              )
                          )


                          if hemisphere in {
                              "S",
                              "W"
                          }:

                              number = -number


                          return number


                  except ValueError:

                      pass


              return None


          name_field = find_field(
              [
                  "VRP name",
                  "Name",
                  "Designator",
                  "Identifier",
                  "VRP"
              ]
          )


          features = []


          invalid = 0


          for row in rows:

              latitude = parse_coordinate(
                  row.get(
                      latitude_field
                  ),
                  True
              )


              longitude = parse_coordinate(
                  row.get(
                      longitude_field
                  ),
                  False
              )


              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  invalid += 1

                  continue


              properties = {
                  str(key):
                      value
                  for key, value in row.items()
                  if key
              }


              if name_field:

                  properties[
                      "name"
                  ] = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()


              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )


              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      longitude,
                                      latitude
                                  ]
                          }
                  }
              )


          print("")
          print(
              "Valid VRPs:",
              len(features)
          )


          print(
              "Invalid VRP rows:",
              invalid
          )


          if not features:

              raise SystemExit(
                  "ERROR: Zero valid NATS VRPs."
              )


          OUTPUT.write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )


          print(
              "VRP GeoJSON written:",
              OUTPUT
          )

          PY


      # ============================================================
      # VALIDATION
      #
      # NO AIRSPACE CATEGORY VALIDATION.
      #
      # We only check that the NATS Airspace collection and VRP
      # collection exist and contain records.
      # ============================================================

      - name: Validate raw NATS import
        run: |
          set -euo pipefail


          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"

          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"


          test -s "${AIRSPACE_FILE}"

          test -s "${VRP_FILE}"


          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "${AIRSPACE_FILE}"
          )


          VRP_COUNT=$(
            jq \
              '.features | length' \
              "${VRP_FILE}"
          )


          AIRSPACE_WITH_GEOMETRY=$(
            jq \
              '[.features[] | select(.geometry != null)] | length' \
              "${AIRSPACE_FILE}"
          )


          AIRSPACE_WITHOUT_GEOMETRY=$(
            jq \
              '[.features[] | select(.geometry == null)] | length' \
              "${AIRSPACE_FILE}"
          )


          echo ""
          echo "=========================================="

          echo "RAW NATS IMPORT SUMMARY"

          echo "=========================================="

          echo ""

          echo "NATS Airspace features:"
          echo "${AIRSPACE_COUNT}"

          echo ""

          echo "Airspace with geometry:"
          echo "${AIRSPACE_WITH_GEOMETRY}"

          echo ""

          echo "Airspace without geometry:"
          echo "${AIRSPACE_WITHOUT_GEOMETRY}"

          echo ""

          echo "NATS reporting points:"
          echo "${VRP_COUNT}"

          echo ""


          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero NATS Airspace features."

            exit 1

          fi


          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: Zero NATS reporting points."

            exit 1

          fi


          echo "Raw NATS import validation successful."


      # ============================================================
      # INSTALL DATA
      # ============================================================

      - name: Install NATS aviation data
        run: |
          set -euo pipefail


          mkdir -p data


          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson


          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson


          echo ""
          echo "Installed:"
          echo ""


          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit NATS aviation data
        run: |
          set -euo pipefail


          git config \
            user.name \
            "AviMap Data Bot"


          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes detected."

            exit 0

          fi


          echo ""
          echo "Files being committed:"

          git diff \
            --cached \
            --stat


          git commit \
            -m "Import complete NATS aviation dataset"


          git push
