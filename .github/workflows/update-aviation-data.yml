          echo "Airspace:"
          echo "${AIRSPACE_COUNT}"

          echo ""

          echo "Airspace with geometry:"
          echo "${GEOMETRY_COUNT}"

          echo ""

          echo "Airspace without geometry:"
          echo "${NULL_GEOMETRY_COUNT}"

          echo ""

          echo "Reporting points:"
          echo "${VRP_COUNT}"

          echo ""


          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then

            echo "ERROR: No airspace."

            exit 1

          fi


          if [ "${VRP_COUNT}" -eq 0 ]; then

            echo "ERROR: No reporting points."

            exit 1

          fi


          echo "Validation successful."


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install aviation data
        run: |
          set -euo pipefail

          mkdir -p data


          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson


          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson


          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


          if git diff --cached --quiet; then

            echo "No aviation data changes."

            exit 0

          fi


          git diff \
            --cached \
            --stat


          git commit \
            -m "Improve NATS AIXM airspace geometry"


          git push
