            exit 1

          fi


          echo "Validation successful."


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data


          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson


          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson


          echo ""
          echo "Installed:"
          ls -lh \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail


          git config \
            user.name \
            "AviMap Data Bot"


          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson


          if git diff --cached --quiet; then

            echo ""
            echo "No aviation data changes."

            exit 0

          fi


          echo ""
          echo "Changes:"
          git diff \
            --cached \
            --stat


          git commit \
            -m "Fix NATS airspace geometry reconstruction"


          git push
