      # ============================================================
      # CONVERT NATS VRP CSV -> GEOJSON
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          python3 <<'PY'
          from pathlib import Path
          import csv
          import json
          import re
          import sys

          VRP_ROOT = Path(
              "/tmp/nats-vrp"
          )

          OUTPUT = Path(
              "data/uk-reporting-points.geojson"
          )

          csv_files = list(
              VRP_ROOT.rglob("*.csv")
          )

          if not csv_files:

              print(
                  "ERROR: No NATS VRP CSV found."
              )

              sys.exit(1)

          csv_file = csv_files[0]

          print("")
          print("==========================================")
          print("NATS VRP CONVERSION")
          print("==========================================")
          print("")
          print(
              "CSV:",
              csv_file
          )

          def normalise_key(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  value.lower()
              )

          def find_column(
              headers,
              candidates
          ):

              normalised = {
                  normalise_key(header): header
                  for header in headers
              }

              for candidate in candidates:

                  key = normalise_key(
                      candidate
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              return None

          def parse_coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None

              value = str(
                  value
              ).strip().upper()

              if not value:
                  return None

              # Decimal degrees.
              try:

                  number = float(
                      value
                  )

                  if latitude:

                      if -90 <= number <= 90:
                          return number

                  else:

                      if -180 <= number <= 180:
                          return number

              except ValueError:
                  pass

              # DDMMSS[N/S]
              # DDDMMSS[E/W]

              match = re.fullmatch(
                  r"(\d+)([NSEW])",
                  value
              )

              if not match:
                  return None

              digits = match.group(1)
              hemisphere = match.group(2)

              if latitude:

                  if len(digits) != 6:
                      return None

              else:

                  if len(digits) != 7:
                      return None

              degrees = int(
                  digits[:-4]
              )

              minutes = int(
                  digits[-4:-2]
              )

              seconds = int(
                  digits[-2:]
              )

              if minutes >= 60:
                  return None

              if seconds >= 60:
                  return None

              result = (
                  degrees
                  +
                  minutes / 60.0
                  +
                  seconds / 3600.0
              )

              if hemisphere in {
                  "S",
                  "W"
              }:

                  result = -result

              return result

          with csv_file.open(
              "r",
              encoding="utf-8-sig",
              errors="replace",
              newline=""
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              headers = reader.fieldnames or []

              print("")
              print("CSV fields:")

              for header in headers:
                  print(
                      f"  {header}"
                  )

              name_column = find_column(
                  headers,
                  [
                      "VRP name",
                      "VRP Name",
                      "Name",
                      "VRP"
                  ]
              )

              lat_column = find_column(
                  headers,
                  [
                      "Latitude",
                      "Lat"
                  ]
              )

              lon_column = find_column(
                  headers,
                  [
                      "Longitude",
                      "Long",
                      "Lon"
                  ]
              )

              aerodrome_column = find_column(
                  headers,
                  [
                      "Associated Aerodrome",
                      "Aerodrome"
                  ]
              )

              icao_column = find_column(
                  headers,
                  [
                      "ICAO Code",
                      "ICAO"
                  ]
              )

              valid_from_column = find_column(
                  headers,
                  [
                      "Valid From",
                      "ValidFrom"
                  ]
              )

              print("")
              print("Detected fields:")
              print(
                  "  Name:",
                  name_column
              )
              print(
                  "  Latitude:",
                  lat_column
              )
              print(
                  "  Longitude:",
                  lon_column
              )

              if not lat_column or not lon_column:

                  print(
                      "ERROR: Could not identify "
                      "latitude/longitude columns."
                  )

                  sys.exit(1)

              features = []
              invalid = 0

              for row in reader:

                  latitude = parse_coordinate(
                      row.get(
                          lat_column,
                          ""
                      ),
                      True
                  )

                  longitude = parse_coordinate(
                      row.get(
                          lon_column,
                          ""
                      ),
                      False
                  )

                  if (
                      latitude is None
                      or
                      longitude is None
                  ):

                      invalid += 1
                      continue

                  name = (
                      row.get(
                          name_column,
                          ""
                      ).strip()
                      if name_column
                      else ""
                  )

                  aerodrome = (
                      row.get(
                          aerodrome_column,
                          ""
                      ).strip()
                      if aerodrome_column
                      else ""
                  )

                  icao = (
                      row.get(
                          icao_column,
                          ""
                      ).strip()
                      if icao_column
                      else ""
                  )

                  valid_from = (
                      row.get(
                          valid_from_column,
                          ""
                      ).strip()
                      if valid_from_column
                      else ""
                  )

                  features.append(
                      {
                          "type": "Feature",
                          "geometry": {
                              "type": "Point",
                              "coordinates": [
                                  longitude,
                                  latitude
                              ]
                          },
                          "properties": {
                              "name": name,
                              "designator": name,
                              "associatedAerodrome": aerodrome,
                              "icao": icao,
                              "validFrom": valid_from,

                              "category": "VRP",
                              "colour": "purple",
                              "boundary": "dashed",

                              "source": "NATS Visual Reference Points Dataset"
                          }
                      }
                  )

          print("")
          print("==========================================")
          print("VRP CONVERSION RESULT")
          print("==========================================")
          print("")
          print(
              f"Valid VRPs: {len(features)}"
          )
          print(
              f"Invalid records: {invalid}"
          )

          if not features:

              print(
                  "ERROR: VRP conversion produced zero valid points."
              )

              sys.exit(1)

          collection = {
              "type": "FeatureCollection",
              "features": features
          }

          temporary = OUTPUT.with_suffix(
              ".geojson.tmp"
          )

          temporary.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          temporary.replace(
              OUTPUT
          )

          print("")
          print(
              f"Written: {OUTPUT}"
          )

          PY

          test -s data/uk-reporting-points.geojson


      # ============================================================
      # VALIDATE GENERATED DATA
      # ============================================================

      - name: Validate generated aviation GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          files = [
              Path(
                  "data/uk-airspace.geojson"
              ),
              Path(
                  "data/uk-reporting-points.geojson"
              )
          ]

          for path in files:

              print("")
              print(
                  "Validating:",
                  path
              )

              if not path.exists():

                  print(
                      "ERROR: File does not exist."
                  )

                  sys.exit(1)

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:

                      data = json.load(
                          handle
                      )

              except Exception as exc:

                  print(
                      "ERROR: Invalid JSON:",
                      exc
                  )

                  sys.exit(1)

              if data.get(
                  "type"
              ) != "FeatureCollection":

                  print(
                      "ERROR: Not a FeatureCollection."
                  )

                  sys.exit(1)

              features = data.get(
                  "features"
              )

              if not isinstance(
                  features,
                  list
              ):

                  print(
                      "ERROR: features is not a list."
                  )

                  sys.exit(1)

              if len(features) == 0:

                  print(
                      "ERROR: FeatureCollection is empty."
                  )

                  sys.exit(1)

              for feature in features:

                  if feature.get(
                      "type"
                  ) != "Feature":

                      print(
                          "ERROR: Invalid Feature."
                      )

                      sys.exit(1)

                  if not feature.get(
                      "geometry"
                  ):

                      print(
                          "ERROR: Feature has no geometry."
                      )

                      sys.exit(1)

              print(
                  f"Valid features: {len(features)}"
              )

          print("")
          print(
              "All generated GeoJSON passed validation."
          )

          PY


