          import json
          import math
          from pathlib import Path

          OUT = Path("/tmp/avimap-data/uk-matz.geojson")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          EARTH_M = 6371008.8
          NM_M = 1852.0

          def destination(lat, lon, bearing_deg, distance_nm):
              bearing = math.radians(bearing_deg)
              angular = distance_nm * NM_M / EARTH_M

              lat1 = math.radians(lat)
              lon1 = math.radians(lon)

              lat2 = math.asin(
                  math.sin(lat1) * math.cos(angular)
                  + math.cos(lat1)
                  * math.sin(angular)
                  * math.cos(bearing)
              )

              lon2 = lon1 + math.atan2(
                  math.sin(bearing) * math.sin(angular) * math.cos(lat1),
                  math.cos(angular)
                  - math.sin(lat1) * math.sin(lat2)
              )

              return (
                  math.degrees(lat2),
                  (math.degrees(lon2) + 540.0) % 360.0 - 180.0,
              )

          def circle(lat, lon, radius_nm, points=96):
              coords = []

              for i in range(points + 1):
                  bearing = 360.0 * i / points
                  p_lat, p_lon = destination(
                      lat,
                      lon,
                      bearing,
                      radius_nm,
                  )
                  coords.append([p_lon, p_lat])

              return coords

          def rectangle_from_axis(
              lat,
              lon,
              bearing_deg,
              length_nm,
              width_nm,
              start_distance_nm=0.0,
          ):
              half_width = width_nm / 2.0

              start_lat, start_lon = destination(
                  lat,
                  lon,
                  bearing_deg,
                  start_distance_nm,
              )

              end_lat, end_lon = destination(
                  lat,
                  lon,
                  bearing_deg,
                  start_distance_nm + length_nm,
              )

              start_left = destination(
                  start_lat,
                  start_lon,
                  bearing_deg - 90.0,
                  half_width,
              )

              start_right = destination(
                  start_lat,
                  start_lon,
                  bearing_deg + 90.0,
                  half_width,
              )

              end_left = destination(
                  end_lat,
                  end_lon,
                  bearing_deg - 90.0,
                  half_width,
              )

              end_right = destination(
                  end_lat,
                  end_lon,
                  bearing_deg + 90.0,
                  half_width,
              )

              return [
                  [start_left[1], start_left[0]],
                  [start_right[1], start_right[0]],
                  [end_right[1], end_right[0]],
                  [end_left[1], end_left[0]],
                  [start_left[1], start_left[0]],
              ]

          def feature(geometry, properties):
              return {
