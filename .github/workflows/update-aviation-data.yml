name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # DETERMINE CURRENT NATS DATASET DATE
      #
      # We use the NATS Digital Datasets page directly.
      # No Dataset Checklist is required.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          NATS_PAGE="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "${NATS_PAGE}" \
            -o /tmp/nats-index.html

          test -s /tmp/nats-index.html

          echo ""
          echo "NATS page downloaded successfully."

          python3 <<'PY'
          import re
          from datetime import date

          html = open(
              "/tmp/nats-index.html",
              encoding="utf-8",
              errors="replace"
          ).read()

          # --------------------------------------------------------
          # NATS currently displays AIRAC dates as DD/MM/YYYY.
          # Find every date appearing on the dataset page.
          # --------------------------------------------------------

          dates = []

          for match in re.finditer(
              r'\b(\d{2})/(\d{2})/(\d{4})\b',
              html
          ):
              day = int(match.group(1))
              month = int(match.group(2))
              year = int(match.group(3))

              try:
                  d = date(
                      year,
                      month,
                      day
                  )
              except ValueError:
                  continue

              if d <= date.today():
                  dates.append(d)

          if not dates:
              raise SystemExit(
                  "ERROR: Could not find an effective NATS dataset date."
              )

          effective = max(
              dates
          )

          dates_text = effective.strftime(
              "%Y%m%d"
          )

          print("")
          print("==========================================")
          print("NATS DATASET DATE")
          print("==========================================")
          print("")
          print(
              f"Effective date: {effective}"
          )
          print(
              f"Dataset suffix: {dates_text}"
          )
          print("")

          # --------------------------------------------------------
          # The NATS Digital Dataset page currently identifies the
          # UK ICAO AIP and VRP datasets. Store the effective date
          # for the download step.
          # --------------------------------------------------------

          with open(
              "/tmp/nats-date.txt",
              "w"
          ) as f:
              f.write(
                  dates_text
              )
          PY


      # ============================================================
      # DOWNLOAD NATS AIP DATA
      #
      # Try the known NATS export structures rather than depending
      # on the Dataset Checklist.
      # ============================================================

      - name: Download NATS AIP data
        run: |
          set -euo pipefail

          DATE=$(cat /tmp/nats-date.txt)

          mkdir -p /tmp/nats

          echo "=========================================="
          echo "Downloading NATS AIP"
          echo "=========================================="
          echo ""
          echo "AIRAC: ${DATE}"
          echo ""

          AIP_XML="EG_AIP_DS_FULL_${DATE}.XML"
          AIP_KML="EG_AIP_DS_FULL_${DATE}.KML"

          # NATS export location used by the digital datasets service.
          BASE="https://nats-uk.ead-it.com/cms-nats/export/sites/default/en/Publications/digital-datasets"

          XML_URL="${BASE}/AIP/${AIP_XML}"
          KML_URL="${BASE}/AIP/${AIP_KML}"

          echo "Trying:"
          echo "${XML_URL}"
          echo ""

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "${XML_URL}" \
            -o /tmp/nats/aip.xml
          then

            echo ""
            echo "Primary AIP XML location failed."
            echo "Searching the NATS page for the actual download URL."

            python3 <<'PY'
            import re
            import html
            from urllib.parse import urljoin

            source = open(
                "/tmp/nats-index.html",
                encoding="utf-8",
                errors="replace"
            ).read()

            target = open(
                "/tmp/nats-date.txt"
            ).read().strip()

            filename = (
                f"EG_AIP_DS_FULL_{target}.XML"
            )

            urls = []

            for href in re.findall(
                r'href\s*=\s*["\']([^"\']+)["\']',
                html.unescape(source),
                flags=re.I
            ):

                href = html.unescape(
                    href
                )

                if filename.lower() in href.lower():
                    urls.append(
                        urljoin(
                            "https://nats-uk.ead-it.com/",
                            href
                        )
                    )

            if not urls:
                raise SystemExit(
                    "ERROR: Could not locate the NATS AIP XML download URL."
                )

            open(
                "/tmp/nats-aip-xml-url.txt",
                "w"
            ).write(
                urls[0]
            )
            PY

            XML_URL=$(cat /tmp/nats-aip-xml-url.txt)

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              -L \
              -A "AviMap/1.0" \
              "${XML_URL}" \
              -o /tmp/nats/aip.xml
          fi

          echo ""
          echo "Trying:"
          echo "${KML_URL}"
          echo ""

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "${KML_URL}" \
            -o /tmp/nats/aip.kml
          then

            echo ""
            echo "Primary AIP KML location failed."
            echo "Searching the NATS page for the actual download URL."

            python3 <<'PY'
            import re
            import html
            from urllib.parse import urljoin

            source = open(
                "/tmp/nats-index.html",
                encoding="utf-8",
                errors="replace"
            ).read()

            target = open(
                "/tmp/nats-date.txt"
            ).read().strip()

            filename = (
                f"EG_AIP_DS_FULL_{target}.KML"
            )

            urls = []

            for href in re.findall(
                r'href\s*=\s*["\']([^"\']+)["\']',
                html.unescape(source),
                flags=re.I
            ):

                href = html.unescape(
                    href
                )

                if filename.lower() in href.lower():
                    urls.append(
                        urljoin(
                            "https://nats-uk.ead-it.com/",
                            href
                        )
                    )

            if not urls:
                raise SystemExit(
                    "ERROR: Could not locate the NATS AIP KML download URL."
                )

            open(
                "/tmp/nats-aip-kml-url.txt",
                "w"
            ).write(
                urls[0]
            )
            PY

            KML_URL=$(cat /tmp/nats-aip-kml-url.txt)

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              -L \
              -A "AviMap/1.0" \
              "${KML_URL}" \
              -o /tmp/nats/aip.kml
          fi

          test -s /tmp/nats/aip.xml
          test -s /tmp/nats/aip.kml

          echo ""
          echo "AIP download successful:"
          ls -lh \
            /tmp/nats/aip.xml \
            /tmp/nats/aip.kml


      # ============================================================
      # DOWNLOAD NATS VRP DATA
      # ============================================================

      - name: Download NATS VRP data
        run: |
          set -euo pipefail

          DATE=$(cat /tmp/nats-date.txt)

          VRP="EG_VRP_DS_AREA1_FULL_${DATE}.CSV"

          BASE="https://nats-uk.ead-it.com/cms-nats/export/sites/default/en/Publications/digital-datasets"

          VRP_URL="${BASE}/VRP/${VRP}"

          echo "=========================================="
          echo "Downloading NATS VRP"
          echo "=========================================="
          echo ""
          echo "${VRP_URL}"
          echo ""

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            -L \
            -A "AviMap/1.0" \
            "${VRP_URL}" \
            -o /tmp/nats/vrp-download
          then

            echo ""
            echo "Primary VRP location failed."
            echo "Searching NATS page for actual VRP download URL."

            python3 <<'PY'
            import re
            import html
            from urllib.parse import urljoin

            source = open(
                "/tmp/nats-index.html",
                encoding="utf-8",
                errors="replace"
            ).read()

            target = open(
                "/tmp/nats-date.txt"
            ).read().strip()

            filename = (
                f"EG_VRP_DS_AREA1_FULL_{target}.CSV"
            )

            urls = []

            for href in re.findall(
                r'href\s*=\s*["\']([^"\']+)["\']',
                html.unescape(source),
                flags=re.I
            ):

                href = html.unescape(
                    href
                )

                if filename.lower() in href.lower():
                    urls.append(
                        urljoin(
                            "https://nats-uk.ead-it.com/",
                            href
                        )
                    )

            if not urls:
                raise SystemExit(
                    "ERROR: Could not locate NATS VRP download URL."
                )

            open(
                "/tmp/nats-vrp-url.txt",
                "w"
            ).write(
                urls[0]
            )
            PY

            VRP_URL=$(cat /tmp/nats-vrp-url.txt)

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              -L \
              -A "AviMap/1.0" \
              "${VRP_URL}" \
              -o /tmp/nats/vrp-download
          fi

          test -s /tmp/nats/vrp-download

          mkdir -p /tmp/nats/vrp-extract

          if unzip -t \
            /tmp/nats/vrp-download \
            >/dev/null 2>&1
          then

            echo "VRP download is a ZIP archive."

            unzip \
              -o \
              /tmp/nats/vrp-download \
              -d /tmp/nats/vrp-extract

            VRP_CSV=$(
              find \
                /tmp/nats/vrp-extract \
                -type f \
                -iname "*.csv" \
                | head -n 1 || true
            )

            if [ -z "${VRP_CSV}" ]; then
              echo "ERROR: No CSV found in VRP archive."
              exit 1
            fi

            cp \
              "${VRP_CSV}" \
              /tmp/nats/vrps.csv

          else

            cp \
              /tmp/nats/vrp-download \
              /tmp/nats/vrps.csv

          fi

          test -s /tmp/nats/vrps.csv

          echo ""
          echo "VRP download successful:"
          wc -l /tmp/nats/vrps.csv


      # ============================================================
      # CONVERT AIRSPACE
      # ============================================================

      - name: Convert NATS airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse(
              "/tmp/nats/aip.kml"
          )

          root = tree.getroot()

          def local(tag):
              return tag.split(
                  "}",
                  1
              )[-1].lower()

          def text(element):
              return " ".join(
                  x.strip()
                  for x in element.itertext()
                  if x.strip()
              )

          def parse_coords(value):
              result = []

              for token in re.split(
                  r"\s+",
                  value.strip()
              ):

                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:
                      lon = float(parts[0])
                      lat = float(parts[1])
                  except ValueError:
                      continue

                  if (
                      -180 <= lon <= 180
                      and
                      -90 <= lat <= 90
                  ):
                      result.append([
                          lon,
                          lat
                      ])

              return result

          def classify(value):
              value = value.upper()

              if re.search(
                  r"\b(PROHIBITED|RESTRICTED|DANGER)\b",
                  value
              ):
                  return "PRD"

              if re.search(
                  r"\bATZ\b",
                  value
              ):
                  return "ATZ"

              if re.search(
                  r"\bTMZ\b",
                  value
              ):
                  return "TMZ"

              if re.search(
                  r"\bMATZ\b",
                  value
              ):
                  return "MATZ"

              if re.search(
                  r"\bRMZ\b",
                  value
              ):
                  return "RMZ"

              if re.search(
                  r"\bCLASS\s*A\b",
                  value
              ):
                  return "CLASS_A"

              if re.search(
                  r"\bCLASS\s*[BCD]\b",
                  value
              ):
                  return "CONTROLLED"

              if re.search(
                  r"\b(CTA|CTR|TMA|CTZ|CONTROLLED)\b",
                  value
              ):
                  return "CONTROLLED"

              return "OTHER"

          features = []

          for placemark in root.iter():

              if local(
                  placemark.tag
              ) != "placemark":
                  continue

              name = ""
              description = ""

              for element in placemark.iter():

                  tag = local(
                      element.tag
                  )

                  if (
                      tag == "name"
                      and
                      not name
                  ):
                      name = text(
                          element
                      )

                  if (
                      tag == "description"
                      and
                      not description
                  ):
                      description = text(
                          element
                      )

              searchable = text(
                  placemark
              )

              category = classify(
                  searchable
              )

              rings = []

              for element in placemark.iter():

                  if local(
                      element.tag
                  ) != "coordinates":
                      continue

                  coords = parse_coords(
                      text(element)
                  )

                  if len(coords) >= 3:

                      if coords[0] != coords[-1]:
                          coords.append(
                              coords[0]
                          )

                      rings.append(
                          coords
                      )

              if not rings:
                  continue

              features.append({
                  "type": "Feature",
                  "properties": {
                      "name": (
                          name
                          or
                          "NATS airspace"
                      ),
                      "description": description,
                      "category": category,
                      "source": "NATS UK ICAO AIP Dataset"
                  },
                  "geometry": {
                      "type": "Polygon",
                      "coordinates": rings
                  }
              })

          if not features:
              raise SystemExit(
                  "ERROR: NATS AIP produced zero airspace polygons."
              )

          Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(
              f"Airspace polygons: {len(features)}"
          )
          PY


      # ============================================================
      # CONVERT VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          lookup = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in lookup:
                      return lookup[key]

              for key, original in lookup.items():

                  for name in names:

                      wanted = norm(
                          name
                      )

                      if (
                          wanted in key
                          or
                          key in wanted
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          print("")
          print("CSV fields:")

          for field in fields:
              print(
                  f"  {field}"
              )

          print("")
          print("Detected fields:")
          print(
              f"  Name:      {name_field}"
          )
          print(
              f"  Latitude:  {lat_field}"
          )
          print(
              f"  Longitude: {lon_field}"
          )

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify VRP coordinates."
              )

          def parse_coord(
              value,
              latitude
          ):
              if value is None:
                  return None

              value = str(
                  value
              ).strip()

              if not value:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  value,
                  flags=re.I
              )

              if match:

                  hemisphere = match.group(
                      1
                  ).upper()

                  value = value[
                      :match.start()
                  ].strip()

              try:

                  number = float(
                      value.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          number = -abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              compact = (
                  value
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              match = re.fullmatch(
                  r"(\d+)(?:\.(\d+))?",
                  compact
              )

              if not match:
                  return None

              integer_part = match.group(
                  1
              )

              decimal_part = (
                  match.group(2)
                  or
                  ""
              )

              try:

                  if latitude:

                      if len(
                          integer_part
                      ) < 6:
                          return None

                      degrees = int(
                          integer_part[:2]
                      )

                      minutes = int(
                          integer_part[2:4]
                      )

                      seconds_text = (
                          integer_part[4:]
                      )

                  else:

                      if len(
                          integer_part
                      ) < 7:
                          return None

                      degrees = int(
                          integer_part[:3]
                      )

                      minutes = int(
                          integer_part[3:5]
                      )

                      seconds_text = (
                          integer_part[5:]
                      )

                  if decimal_part:
                      seconds_text += (
                          "."
                          + decimal_part
                      )

                  seconds = float(
                      seconds_text
                  )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if result > limit:
                      return None

                  if hemisphere in (
                      "S",
                      "W"
                  ):
                      result = -result

                  return result

              except ValueError:
                  return None

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):

                  invalid += 1
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              if not name:
                  name = (
                      f"VRP {index}"
                  )

              properties = {
                  str(k): v
                  for k, v in row.items()
                  if k
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          lon,
                          lat
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(
              f"CSV records:         {len(rows)}"
          )
          print(
              f"Valid VRPs:          {len(features)}"
          )
          print(
              f"Invalid coordinates: {invalid}"
          )
          print("")

          if not features:
              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # VALIDATE BEFORE TOUCHING REPOSITORY DATA
      # ============================================================

      - name: Validate generated data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL DATA VALIDATION"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Airspace data is empty."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: VRP data is empty."
            exit 1
          fi

          echo "Validation passed."


      # ============================================================
      # INSTALL DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          Source: NATS UK Digital Datasets.

          Airspace:
          - UK ICAO AIP Dataset

          Reporting points:
          - Visual Reference Points (VRP) List

          Data is validated before being committed to the repository.
          EOF


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          if git diff --cached --quiet; then

            echo "No aviation data changes."

          else

            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push

          fi
