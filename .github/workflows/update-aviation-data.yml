          # Warton — NATS Note 7.
          #
          # 20 NM x 6 NM rectangle, major axis 071/251, offset 1 NM
          # south of the ARP. The portion inside the 5 NM ARP circle
          # is SFC-3000; remainder is 1000-3000.
