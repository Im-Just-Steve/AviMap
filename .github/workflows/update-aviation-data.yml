name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3

      # ============================================================
      # FIND CURRENT NATS DATASETS
      #
      # IMPORTANT:
      # We discover the actual href supplied by NATS.
      # We do not manufacture download URLs.
      # ============================================================

      - name: Find current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []

              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)

              def handle_endtag(self, tag):
                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

          def parse_links(base_url, body):
              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result

          def compact(value):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )

          def is_aip_link(url, text, airac):
              value = compact(
                  url + " " + text
              )

              if (
                  f"EGAIPDSFULL{airac}"
                  in value
              ):
                  return True

              if (
                  airac in value
                  and
                  (
                      "AIP" in value
                      or
                      "AIS" in value
                  )
                  and
                  (
                      "XML" in value
                      or
                      "ZIP" in value
                  )
              ):
                  return True

              return False

          def is_vrp_link(url, text, airac):
              value = compact(
                  url + " " + text
              )

              if (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
              ):
                  return True

              if (
                  airac in value
                  and
                  "VRP" in value
                  and
                  (
                      "CSV" in value
                      or
                      "ZIP" in value
                  )
              ):
                  return True

              return False

          # --------------------------------------------------------
          # Find latest checklist.
          # --------------------------------------------------------

          checklist_body = None
          checklist_url = None
          checklist_date = None

          print(
              "Searching NATS Dataset Checklists..."
          )

          for offset in range(90):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]

              for candidate in candidates:

                  try:
                      body, _ = fetch(
                          candidate
                      )
                  except Exception:
                      continue

                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )

                  if (
                      "EG_AIP_DS_FULL_" not in text
                      or
                      "EG_VRP_DS_AREA1_FULL_" not in text
                  ):
                      continue

                  checklist_body = body
                  checklist_url = candidate
                  checklist_date = candidate_date
                  break

              if checklist_body is not None:
                  break

          if checklist_body is None:
              raise SystemExit(
                  "ERROR: Could not find current "
                  "NATS Dataset Checklist."
              )

          print(
              "Checklist:",
              checklist_url
          )

          print(
              "Checklist date:",
              checklist_date
          )

          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )

          # --------------------------------------------------------
          # AIP AIRAC.
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )

          aip_dates = []

          for stamp in aip_matches:

              try:
                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              if date <= today:
                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not aip_dates:
              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )

          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda x: x[0]
          )

          aip_filename = (
              f"EG_AIP_DS_FULL_{aip_stamp}.XML"
          )

          # --------------------------------------------------------
          # VRP AIRAC.
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )

          vrp_dates = []

          for stamp in vrp_matches:

              try:
                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              if date <= today:
                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )

          if not vrp_dates:
              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )

          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda x: x[0]
          )

          vrp_filename = (
              f"EG_VRP_DS_AREA1_FULL_{vrp_stamp}.CSV"
          )

          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "AIP dataset:",
              aip_filename
          )

          print("")
          print(
              "VRP AIRAC:",
              vrp_stamp
          )

          print(
              "VRP dataset:",
              vrp_filename
          )

          # --------------------------------------------------------
          # Parse links.
          # --------------------------------------------------------

          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )

          try:
              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Digital dataset index unavailable:",
                  exc
              )

              index_links = []

          # --------------------------------------------------------
          # AIP links.
          # --------------------------------------------------------

          aip_links = []
          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)

              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )

          # --------------------------------------------------------
          # Follow linked pages.
          # --------------------------------------------------------

          expanded = []

          for url, text in list(
              aip_links
          ):

              lower = url.lower()

              if not (
                  lower.endswith(".html")
                  or
                  lower.endswith(".htm")
                  or
                  lower.endswith("/")
              ):
                  continue

              try:
                  body, _ = fetch(
                      url
                  )

                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          expanded.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )

              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )

          aip_links.extend(
              expanded
          )

          unique = []
          seen = set()

          for url, text in aip_links:

              if url in seen:
                  continue

              seen.add(url)

              unique.append(
                  (
                      url,
                      text
                  )
              )

          aip_links = unique

          # --------------------------------------------------------
          # VRP links.
          # --------------------------------------------------------

          vrp_links = []
          seen = set()

          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)

              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )

          # --------------------------------------------------------
          # Save discovery information.
          # --------------------------------------------------------

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-filename.txt"
          ).write_text(
              aip_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              vrp_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-filename.txt"
          ).write_text(
              vrp_filename,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "NATS AIP links:"
          )

          for url, text in aip_links:
              print(
                  text,
                  "=>",
                  url
              )

          print("")
          print(
              "NATS VRP links:"
          )

          for url, text in vrp_links:
              print(
                  text,
                  "=>",
                  url
              )

          if not aip_links:
              raise SystemExit(
                  "ERROR: No NATS AIP download href found."
              )

          if not vrp_links:
              raise SystemExit(
                  "ERROR: No NATS VRP download href found."
              )

          PY

      # ============================================================
      # DOWNLOAD AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip
          mkdir -p /tmp/nats-aip

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "Testing NATS AIP URL:"
            echo "${URL}"

            rm -f /tmp/nats-aip-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi

            file /tmp/nats-aip-download

            if file /tmp/nats-aip-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip
              mkdir -p /tmp/nats-aip

              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip

              echo ""
              echo "AIP archive contents:"
              find /tmp/nats-aip -type f -print

              AIP_XML=$(
                find /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )

              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml

                FOUND="${URL}"
                break

              fi

            fi

            if grep -aqi \
              "<[^>]*Airspace" \
              /tmp/nats-aip-download; then

              cp \
                /tmp/nats-aip-download \
                /tmp/uk-aip.xml

              FOUND="${URL}"
              break

            fi

          done < /tmp/nats-aip-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS AIP download failed."

            cat /tmp/nats-aip-links.txt

            exit 1

          fi

          echo ""
          echo "AIP source:"
          echo "${FOUND}"

          ls -lh /tmp/uk-aip.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY

      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-vrp
          mkdir -p /tmp/nats-vrp

          FOUND=""

          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue

            echo ""
            echo "Testing NATS VRP URL:"
            echo "${URL}"

            rm -f /tmp/nats-vrp-download

            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-vrp-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )

            echo "HTTP: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi

            file /tmp/nats-vrp-download

            if file /tmp/nats-vrp-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-vrp
              mkdir -p /tmp/nats-vrp

              unzip \
                -o \
                /tmp/nats-vrp-download \
                -d /tmp/nats-vrp

              echo ""
              echo "VRP archive contents:"
              find /tmp/nats-vrp -type f -print

              VRP_CSV=$(
                find /tmp/nats-vrp \
                  -type f \
                  \( \
                    -iname '*.csv' \
                    -o \
                    -iname '*.CSV' \
                  \) \
                  | head -n 1
              )

              if [ -n "${VRP_CSV}" ]; then

                cp \
                  "${VRP_CSV}" \
                  /tmp/uk-vrps.csv

                FOUND="${URL}"
                break

              fi

            fi

            # Direct CSV fallback.
            if grep -aqi \
              "latitude\|longitude\|latitude.*longitude" \
              /tmp/nats-vrp-download; then

              cp \
                /tmp/nats-vrp-download \
                /tmp/uk-vrps.csv

              FOUND="${URL}"
              break

            fi

          done < /tmp/nats-vrp-links.txt

          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS VRP download failed."

            cat /tmp/nats-vrp-links.txt

            exit 1

          fi

          echo ""
          echo "VRP source:"
          echo "${FOUND}"

          echo ""
          echo "VRP file:"
          ls -lh /tmp/uk-vrps.csv

          echo ""
          echo "VRP first 10 lines:"
          head -n 10 /tmp/uk-vrps.csv

      # ============================================================
      # CONVERT AIXM AIRSPACE
      #
      # IMPORTANT CHANGE:
      #
      # We DO NOT convert NATS classifications into PA / RA / DA.
      #
      # The source classification is retained exactly as supplied
      # by NATS/AIXM:
      #
      #   airspace_class
      #   airspace_type
      #   local_type
      #
      # The filter uses those source values.
      #
      # For Class A-G:
      #   AIXM AirspaceClass = A-G
      #
      # For P/R/D:
      #   AIXM AirspaceType = P/R/D
      #
      # For ATZ/MATZ/RMZ/TMZ:
      #   AIXM local/type fields are retained and matched directly.
      #
      # No PA/RA/DA translation is performed.
      # ============================================================

      - name: Convert NATS AIXM airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          XML = "/tmp/uk-aip.xml"

          OUT = (
              "/tmp/avimap-data/"
              "uk-airspace.geojson"
          )

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          tree = ET.parse(
              XML
          )

          root = tree.getroot()

          def local(tag):
              return tag.rsplit(
                  "}",
                  1
              )[-1]

          def attr_local(element, wanted):
              wanted = wanted.lower()

              for key, value in element.attrib.items():

                  if local(key).lower() == wanted:
                      return value

              return None

          # --------------------------------------------------------
          # Parent index.
          # --------------------------------------------------------

          parent = {}

          for parent_element in root.iter():

              for child in parent_element:

                  parent[child] = parent_element

          # --------------------------------------------------------
          # Global xlink/id index.
          # --------------------------------------------------------

          index = {}

          for element in root.iter():

              for key, value in element.attrib.items():

                  if local(key).lower() == "id" and value:

                      index[
                          value.lstrip("#")
                      ] = element

          def resolve(element):

              if element is None:
                  return None

              href = attr_local(
                  element,
                  "href"
              )

              if not href:
                  return element

              reference = href.split(
                  "#",
                  1
              )[-1].strip()

              if not reference:
                  return element

              return index.get(
                  reference,
                  element
              )

          def resolved_variants(element):

              result = []
              seen = set()
              current = element

              for _ in range(20):

                  if current is None:
                      break

                  marker = id(current)

                  if marker in seen:
                      break

                  seen.add(marker)
                  result.append(current)

                  href = attr_local(
                      current,
                      "href"
                  )

                  if not href:
                      break

                  reference = href.split(
                      "#",
                      1
                  )[-1].strip()

                  if not reference:
                      break

                  current = index.get(
                      reference
                  )

              return result

          # --------------------------------------------------------
          # Text extraction.
          # --------------------------------------------------------

          def values_for(element, names):

              wanted = {
                  name.lower()
                  for name in names
              }

              result = []

              for child in element.iter():

                  if (
                      local(
                          child.tag
                      ).lower()
                      in wanted
                      and
                      child.text
                  ):

                      value = child.text.strip()

                      if value:
                          result.append(
                              value
                          )

              return result

          def first_value(element, names):

              values = values_for(
                  element,
                  names
              )

              return (
                  values[0]
                  if values
                  else ""
              )

          # --------------------------------------------------------
          # Coordinates.
          # --------------------------------------------------------

          def current_srs(element):

              current = element

              for _ in range(30):

                  if current is None:
                      break

                  value = attr_local(
                      current,
                      "srsName"
                  )

                  if value:
                      return value

                  current = parent.get(
                      current
                  )

              return "EPSG:4326"

          def dimension_for(element):

              value = (
                  attr_local(
                      element,
                      "srsDimension"
                  )
                  or
                  attr_local(
                      element,
                      "dimension"
                  )
              )

              try:
                  return max(
                      2,
                      int(value)
                  )
              except (TypeError, ValueError):
                  return 2

          def number_list(text):

              if not text:
                  return []

              result = []

              for token in re.split(
                  r"[\s,]+",
                  text.strip()
              ):

                  if not token:
                      continue

                  try:
                      result.append(
                          float(token)
                      )
                  except ValueError:
                      pass

              return result

          def pair_list(element, text):

              numbers = number_list(
                  text
              )

              dimension = dimension_for(
                  element
              )

              result = []

              for i in range(
                  0,
                  len(numbers),
                  dimension
              ):

                  chunk = numbers[
                      i:i + dimension
                  ]

                  if len(chunk) < 2:
                      continue

                  first = chunk[0]
                  second = chunk[1]

                  srs = current_srs(
                      element
                  ).upper()

                  if (
                      "4326" in srs
                      and
                      "CRS84" not in srs
                  ):

                      result.append(
                          [
                              second,
                              first
                          ]
                      )

                  else:

                      result.append(
                          [
                              first,
                              second
                          ]
                      )

              return result

          def direct_coordinates(element):

              result = []

              for node in element.iter():

                  name = local(
                      node.tag
                  )

                  if name in {
                      "posList",
                      "pos"
                  }:

                      if node.text:

                          result.extend(
                              pair_list(
                                  node,
                                  node.text
                              )
                          )

                  elif name == "coordinates":

                      if not node.text:
                          continue

                      for token in re.split(
                          r"\s+",
                          node.text.strip()
                      ):

                          bits = token.split(",")

                          if len(bits) < 2:
                              continue

                          try:
                              first = float(
                                  bits[0]
                              )

                              second = float(
                                  bits[1]
                              )

                          except ValueError:
                              continue

                          srs = current_srs(
                              node
                          ).upper()

                          if (
                              "4326" in srs
                              and
                              "CRS84" not in srs
                          ):

                              result.append(
                                  [
                                      second,
                                      first
                                  ]
                              )

                          else:

                              result.append(
                                  [
                                      first,
                                      second
                                  ]
                              )

              return result

          # --------------------------------------------------------
          # Circular geometry.
          # --------------------------------------------------------

          def radius_metres(element):

              node = None

              for child in element.iter():

                  if local(
                      child.tag
                  ) == "radius":

                      node = child
                      break

              if node is None or not node.text:
                  return None

              try:
                  radius = float(
                      node.text.strip()
                  )
              except ValueError:
                  return None

              uom = (
                  attr_local(
                      node,
                      "uom"
                  )
                  or
                  "m"
              ).lower()

              if uom in {
                  "km",
                  "kilometre",
                  "kilometres",
                  "kilometer",
                  "kilometers"
              }:

                  radius *= 1000.0

              elif uom in {
                  "nm",
                  "nmi",
                  "[nmi_i]"
              }:

                  radius *= 1852.0

              return radius

          def angle_value(element, name):

              for child in element.iter():

                  if (
                      local(
                          child.tag
                      )
                      == name
                      and
                      child.text
                  ):

                      try:
                          return float(
                              child.text.strip()
                          )
                      except ValueError:
                          return None

              return None

          def arc_by_center(element):

              center = None

              for child in element.iter():

                  if (
                      local(
                          child.tag
                      )
                      == "pos"
                      and
                      child.text
                  ):

                      numbers = number_list(
                          child.text
                      )

                      if len(numbers) >= 2:

                          srs = current_srs(
                              child
                          ).upper()

                          if (
                              "4326" in srs
                              and
                              "CRS84" not in srs
                          ):

                              center = (
                                  numbers[1],
                                  numbers[0]
                              )

                          else:

                              center = (
                                  numbers[0],
                                  numbers[1]
                              )

                      break

              if center is None:
                  return []

              radius = radius_metres(
                  element
              )

              if radius is None:
                  return []

              start = angle_value(
                  element,
                  "startAngle"
              )

              end = angle_value(
                  element,
                  "endAngle"
              )

              if (
                  start is None
                  or
                  end is None
              ):

                  return []

              delta = end - start

              if delta == 0:
                  delta = 360.0

              while delta > 360.0:
                  delta -= 360.0

              while delta < -360.0:
                  delta += 360.0

              steps = min(
                  180,
                  max(
                      8,
                      int(
                          abs(delta) / 4.0
                      )
                  )
              )

              points = []

              for i in range(
                  steps + 1
              ):

                  fraction = (
                      i
                      /
                      steps
                  )

                  angle = (
                      start
                      +
                      delta
                      *
                      fraction
                  )

                  radians = math.radians(
                      angle
                  )

                  lat = center[1]

                  lon = (
                      center[0]
                      +
                      (
                          radius
                          *
                          math.cos(
                              radians
                          )
                          /
                          (
                              111320.0
                              *
                              max(
                                  0.05,
                                  math.cos(
                                      math.radians(
                                          lat
                                      )
                                  )
                              )
                          )
                      )
                  )

                  lat = (
                      center[1]
                      +
                      (
                          radius
                          *
                          math.sin(
                              radians
                          )
                          /
                          111320.0
                      )
                  )

                  points.append(
                      [
                          lon,
                          lat
                      ]
                  )

              return points

          # --------------------------------------------------------
          # Curve segments.
          # --------------------------------------------------------

          SEGMENTS = {
              "LineStringSegment",
              "GeodesicString",
              "Geodesic",
              "ArcStringByBulge",
              "Arc",
              "ArcString",
              "Circle",
              "ArcByCenterPoint",
              "CircleByCenterPoint"
          }

          def segment_points(
              element,
              visited=None
          ):

              if visited is None:
                  visited = set()

              if element is None:
                  return []

              marker = id(element)

              if marker in visited:
                  return []

              visited.add(marker)

              variants = resolved_variants(
                  element
              )

              if not variants:
                  return []

              target = variants[-1]

              name = local(
                  target.tag
              )

              if name in {
                  "ArcByCenterPoint",
                  "CircleByCenterPoint"
              }:

                  points = arc_by_center(
                      target
                  )

                  if (
                      name
                      ==
                      "CircleByCenterPoint"
                      and
                      points
                      and
                      points[0]
                      !=
                      points[-1]
                  ):

                      points.append(
                          points[0]
                      )

                  return points

              if name in {
                  "LineStringSegment",
                  "GeodesicString",
                  "Geodesic",
                  "ArcStringByBulge",
                  "Arc",
                  "ArcString",
                  "Circle"
              }:

                  return direct_coordinates(
                      target
                  )

              result = []

              for child in target.iter():

                  if local(
                      child.tag
                  ) in SEGMENTS:

                      result.extend(
                          segment_points(
                              child,
                              visited
                          )
                      )

              if result:
                  return result

              return direct_coordinates(
                  target
              )

          # --------------------------------------------------------
          # Rings.
          # --------------------------------------------------------

          def ring_points(ring):

              variants = resolved_variants(
                  ring
              )

              if not variants:
                  return []

              target = variants[-1]

              direct = []

              for child in target.iter():

                  if local(
                      child.tag
                  ) in {
                      "posList",
                      "pos"
                  }:

                      if child.text:

                          direct.extend(
                              pair_list(
                                  child,
                                  child.text
                              )
                          )

              if len(direct) >= 4:
                  return direct

              result = []

              for child in target:

                  if local(
                      child.tag
                  ) != "curveMember":

                      continue

                  result.extend(
                      segment_points(
                          child
                      )
                  )

              cleaned = []

              for point in result:

                  if (
                      not cleaned
                      or
                      point
                      !=
                      cleaned[-1]
                  ):

                      cleaned.append(
                          point
                      )

              if len(cleaned) >= 3:

                  if (
                      cleaned[0]
                      !=
                      cleaned[-1]
                  ):

                      cleaned.append(
                          cleaned[0]
                      )

                  return cleaned

              return []

          # --------------------------------------------------------
          # Surfaces.
          # --------------------------------------------------------

          def surfaces_for_airspace(
              airspace
          ):

              result = []
              seen = set()

              for element in airspace.iter():

                  if local(
                      element.tag
                  ) not in {
                      "horizontalProjection",
                      "theAirspaceVolume"
                  }:

                      continue

                  for candidate in (
                      [element]
                      +
                      list(
                          element.iter()
                      )
                  ):

                      resolved = resolve(
                          candidate
                      )

                      if resolved is None:
                          continue

                      for item in (
                          [resolved]
                          +
                          list(
                              resolved.iter()
                          )
                      ):

                          if local(
                              item.tag
                          ) not in {
                              "Surface",
                              "CompositeSurface"
                          }:

                              continue

                          marker = id(item)

                          if marker in seen:
                              continue

                          seen.add(marker)
                          result.append(item)

              return result

          def polygons_for_airspace(
              airspace
          ):

              polygons = []

              for surface in surfaces_for_airspace(
                  airspace
              ):

                  for patch in surface.iter():

                      if local(
                          patch.tag
                      ) != "PolygonPatch":

                          continue

                      exterior = None
                      interiors = []

                      for child in patch.iter():

                          name = local(
                              child.tag
                          )

                          if name == "exterior":

                              for ring in child.iter():

                                  if local(
                                      ring.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      exterior = ring
                                      break

                          elif name == "interior":

                              for ring in child.iter():

                                  if local(
                                      ring.tag
                                  ) in {
                                      "LinearRing",
                                      "Ring"
                                  }:

                                      points = ring_points(
                                          ring
                                      )

                                      if len(points) >= 4:
                                          interiors.append(
                                              points
                                          )

                                      break

                      if exterior is None:
                          continue

                      outer = ring_points(
                          exterior
                      )

                      if len(outer) < 4:
                          continue

                      polygons.append(
                          [
                              outer
                          ]
                          +
                          interiors
                      )

              return polygons

          # ========================================================
          # NATS CLASSIFICATION
          #
          # NO PA / RA / DA CONVERSION.
          #
          # We preserve the NATS fields and use them directly.
          # ========================================================

          def clean(value):
              return re.sub(
                  r"\s+",
                  " ",
                  value.strip()
              )

          def compact(value):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )

          def source_classification(
              airspace
          ):

              airspace_class = first_value(
                  airspace,
                  {
                      "class",
                      "AirspaceClass",
                      "codeClass"
                  }
              )

              airspace_type = first_value(
                  airspace,
                  {
                      "type",
                      "AirspaceType",
                      "codeType"
                  }
              )

              local_type = first_value(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )

              designator = first_value(
                  airspace,
                  {
                      "designator"
                  }
              )

              name = first_value(
                  airspace,
                  {
                      "name"
                  }
              )

              # ----------------------------------------------------
              # Class A-G is sourced directly from AirspaceClass.
              # ----------------------------------------------------

              class_code = compact(
                  airspace_class
              )

              if class_code in {
                  "A",
                  "B",
                  "C",
                  "D",
                  "E",
                  "F",
                  "G"
              }:

                  return {
                      "category":
                          class_code,

                      "category_source":
                          "airspace_class",

                      "airspace_class":
                          airspace_class,

                      "airspace_type":
                          airspace_type,

                      "local_type":
                          local_type,

                      "designator":
                          designator,

                      "name":
                          name
                  }

              # ----------------------------------------------------
              # P/R/D are retained exactly as NATS type codes.
              # ----------------------------------------------------

              type_code = compact(
                  airspace_type
              )

              if type_code in {
                  "P",
                  "R",
                  "D"
              }:

                  return {
                      "category":
                          type_code,

                      "category_source":
                          "airspace_type",

                      "airspace_class":
                          airspace_class,

                      "airspace_type":
                          airspace_type,

                      "local_type":
                          local_type,

                      "designator":
                          designator,

                      "name":
                          name
                  }

              # ----------------------------------------------------
              # Special zones are matched using the NATS/AIXM
              # source values, without translating them to another
              # AviMap category.
              # ----------------------------------------------------

              candidates = [
                  local_type,
                  airspace_type,
                  designator,
                  name
              ]

              for value in candidates:

                  code = compact(
                      value
                  )

                  if code in {
                      "ATZ",
                      "MATZ",
                      "RMZ",
                      "TMZ"
                  }:

                      return {
                          "category":
                              code,

                          "category_source":
                              (
                                  "local_type"
                                  if value == local_type
                                  else
                                  "airspace_type"
                                  if value == airspace_type
                                  else
                                  "designator"
                                  if value == designator
                                  else
                                  "name"
                              ),

                          "airspace_class":
                              airspace_class,

                          "airspace_type":
                              airspace_type,

                          "local_type":
                              local_type,

                          "designator":
                              designator,

                          "name":
                              name
                      }

              # Textual NATS values are allowed only where the
              # source field explicitly contains the zone name.
              #
              # This does NOT rename it to an AviMap category.

              for value in candidates:

                  code = compact(
                      value
                  )

                  if code in {
                      "AERODROMETRAFFICZONE",
                      "MILITARYAERODROMETRAFFICZONE",
                      "RADIOMANDATORYZONE",
                      "TRANSPONDERMANDATORYZONE"
                  }:

                      category = {
                          "AERODROMETRAFFICZONE":
                              "ATZ",

                          "MILITARYAERODROMETRAFFICZONE":
                              "MATZ",

                          "RADIOMANDATORYZONE":
                              "RMZ",

                          "TRANSPONDERMANDATORYZONE":
                              "TMZ"
                      }[
                          code
                      ]

                      return {
                          "category":
                              category,

                          "category_source":
                              (
                                  "local_type"
                                  if value == local_type
                                  else
                                  "airspace_type"
                                  if value == airspace_type
                                  else
                                  "designator"
                                  if value == designator
                                  else
                                  "name"
                              ),

                          "airspace_class":
                              airspace_class,

                          "airspace_type":
                              airspace_type,

                          "local_type":
                              local_type,

                          "designator":
                              designator,

                          "name":
                              name
                      }

              return None

          # --------------------------------------------------------
          # Process all NATS Airspace objects.
          # --------------------------------------------------------

          categories = [
              "A",
              "B",
              "C",
              "D",
              "E",
              "F",
              "G",
              "P",
              "R",
              "ATZ",
              "MATZ",
              "RMZ",
              "TMZ"
          ]

          classification_counts = {
              value: 0
              for value in categories
          }

          geometry_counts = {
              value: 0
              for value in categories
          }

          raw_count = 0
          selected_count = 0
          geometry_failures = 0

          features = []
          seen_features = set()

          # Diagnostic raw values not selected.
          unselected_types = {}
          unselected_local_types = {}
          unselected_classes = {}

          for airspace in root.iter():

              if local(
                  airspace.tag
              ) != "Airspace":

                  continue

              raw_count += 1

              classification = source_classification(
                  airspace
              )

              if classification is None:

                  airspace_type = first_value(
                      airspace,
                      {
                          "type",
                          "AirspaceType",
                          "codeType"
                      }
                  )

                  local_type = first_value(
                      airspace,
                      {
                          "localType",
                          "AirspaceLocalType"
                      }
                  )

                  airspace_class = first_value(
                      airspace,
                      {
                          "class",
                          "AirspaceClass",
                          "codeClass"
                      }
                  )

                  if airspace_type:
                      key = clean(
                          airspace_type
                      )

                      unselected_types[
                          key
                      ] = (
                          unselected_types.get(
                              key,
                              0
                          )
                          +
                          1
                      )

                  if local_type:
                      key = clean(
                          local_type
                      )

                      unselected_local_types[
                          key
                      ] = (
                          unselected_local_types.get(
                              key,
                              0
                          )
                          +
                          1
                      )

                  if airspace_class:
                      key = clean(
                          airspace_class
                      )

                      unselected_classes[
                          key
                      ] = (
                          unselected_classes.get(
                              key,
                              0
                          )
                          +
                          1
                      )

                  continue

              selected_count += 1

              category = classification[
                  "category"
              ]

              classification_counts[
                  category
              ] += 1

              polygons = polygons_for_airspace(
                  airspace
              )

              if not polygons:

                  geometry_failures += 1
                  continue

              valid_polygons = []

              for polygon in polygons:

                  if not polygon:
                      continue

                  outer = polygon[0]

                  if len(outer) < 4:
                      continue

                  if (
                      outer[0]
                      !=
                      outer[-1]
                  ):

                      outer.append(
                          outer[0]
                      )

                  valid_polygons.append(
                      polygon
                  )

              if not valid_polygons:

                  geometry_failures += 1
                  continue

              geometry_counts[
                  category
              ] += 1

              if len(
                  valid_polygons
              ) == 1:

                  geometry = {
                      "type":
                          "Polygon",

                      "coordinates":
                          valid_polygons[0]
                  }

              else:

                  geometry = {
                      "type":
                          "MultiPolygon",

                      "coordinates":
                          valid_polygons
                  }

              designator = (
                  classification[
                      "designator"
                  ]
              )

              name = (
                  classification[
                      "name"
                  ]
              )

              key = (
                  designator,
                  category,
                  json.dumps(
                      geometry,
                      sort_keys=True
                  )
              )

              if key in seen_features:
                  continue

              seen_features.add(
                  key
              )

              properties = {
                  # ------------------------------------------------
                  # NATS/AIXM source terminology.
                  # ------------------------------------------------

                  "category":
                      category,

                  "category_source":
                      classification[
                          "category_source"
                      ],

                  "airspace_class":
                      classification[
                          "airspace_class"
                      ],

                  "airspace_type":
                      classification[
                          "airspace_type"
                      ],

                  "local_type":
                      classification[
                          "local_type"
                      ],

                  "designator":
                      designator,

                  "name":
                      (
                          name
                          or
                          designator
                          or
                          "Unknown airspace"
                      ),

                  # ------------------------------------------------
                  # Provenance.
                  # ------------------------------------------------

                  "source":
                      "NATS UK ICAO AIP Dataset",

                  "airac":
                      AIRAC
              }

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          geometry
                  }
              )

          # --------------------------------------------------------
          # Diagnostics.
          # --------------------------------------------------------

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS AIXM AIRSPACE RESULT"
          )
          print(
              "=========================================="
          )

          print(
              "AIRAC:",
              AIRAC
          )

          print(
              "Raw NATS Airspace:",
              raw_count
          )

          print(
              "Selected using NATS classifications:",
              selected_count
          )

          print(
              "Valid GeoJSON features:",
              len(features)
          )

          print(
              "Geometry failures:",
              geometry_failures
          )

          print("")
          print(
              "NATS SOURCE CLASSIFICATION COUNTS"
          )

          print(
              "------------------------------------------"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{classification_counts[category]}"
              )

          print("")
          print(
              "NATS SOURCE GEOMETRY COUNTS"
          )

          print(
              "------------------------------------------"
          )

          for category in categories:

              print(
                  f"{category:5s}: "
                  f"{geometry_counts[category]}"
              )

          print("")
          print(
              "UNSELECTED NATS AIRSPACE TYPES"
          )

          print(
              "------------------------------------------"
          )

          for value, count in sorted(
              unselected_types.items(),
              key=lambda x: (
                  -x[1],
                  x[0]
              )
          )[:50]:

              print(
                  f"{count:5d}  {value}"
              )

          print("")
          print(
              "UNSELECTED NATS LOCAL TYPES"
          )

          print(
              "------------------------------------------"
          )

          for value, count in sorted(
              unselected_local_types.items(),
              key=lambda x: (
                  -x[1],
                  x[0]
              )
          )[:50]:

              print(
                  f"{count:5d}  {value}"
              )

          print("")
          print(
              "UNSELECTED NATS CLASSES"
          )

          print(
              "------------------------------------------"
          )

          for value, count in sorted(
              unselected_classes.items(),
              key=lambda x: (
                  -x[1],
                  x[0]
              )[:50]:

              print(
                  f"{count:5d}  {value}"
              )

          # --------------------------------------------------------
          # Safety checks.
          # --------------------------------------------------------

          if raw_count < 1000:

              raise SystemExit(
                  "ERROR: Suspiciously small NATS "
                  "AIXM Airspace count."
              )

          if selected_count == 0:

              raise SystemExit(
                  "ERROR: No NATS airspace categories "
                  "matched."
              )

          if len(features) == 0:

              raise SystemExit(
                  "ERROR: No valid NATS airspace "
                  "geometry was produced."
              )

          Path(
              OUT
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          print("")
          print(
              "GeoJSON written:",
              OUT
          )

          PY

      # ============================================================
      # CONVERT NATS VRPs
      #
      # This version does not assume the CSV uses "Latitude" and
      # "Longitude" as the exact column names.
      #
      # It prints the actual NATS headers and searches more broadly.
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          source = Path(
              "/tmp/uk-vrps.csv"
          )

          raw = source.read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          print("")
          print(
              "=========================================="
          )
          print(
              "NATS VRP CONVERSION"
          )
          print(
              "=========================================="
          )

          print("")
          print(
              "First 20 raw lines:"
          )

          for line in raw.splitlines()[:20]:
              print(
                  repr(line)
              )

          # --------------------------------------------------------
          # Detect delimiter from the actual file.
          # --------------------------------------------------------

          sample = raw[:20000]

          try:

              dialect = csv.Sniffer().sniff(
                  sample,
                  delimiters=",;\t|"
              )

          except csv.Error:

              # NATS CSV should normally be comma separated.
              dialect = csv.excel

          print("")
          print(
              "Detected delimiter:",
              repr(
                  dialect.delimiter
              )
          )

          reader = csv.DictReader(
              raw.splitlines(),
              dialect=dialect
          )

          rows = list(
              reader
          )

          if not rows:

              raise SystemExit(
                  "ERROR: VRP CSV contains zero records."
              )

          fields = [
              field
              for field in rows[0].keys()
              if field is not None
          ]

          print("")
          print(
              "NATS VRP headers:"
          )

          for field in fields:
              print(
                  repr(field)
              )

          print("")
          print(
              "CSV records:",
              len(rows)
          )

          def normalise(
              value
          ):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          normalised = {
              normalise(field):
                  field
              for field in fields
          }

          def find_exact(
              candidates
          ):

              for candidate in candidates:

                  key = normalise(
                      candidate
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              return None

          def find_contains(
              candidates
          ):

              candidate_keys = [
                  normalise(
                      candidate
                  )
                  for candidate in candidates
              ]

              # Prefer columns containing latitude/longitude
              # terminology.

              for key, original in normalised.items():

                  for candidate in candidate_keys:

                      if candidate in key:

                          return original

              return None

          # --------------------------------------------------------
          # Look for actual NATS coordinate fields.
          # --------------------------------------------------------

          lat_field = find_exact(
              [
                  "Latitude",
                  "Lat",
                  "Latitude DD",
                  "Latitude Decimal",
                  "Lat Decimal",
                  "Latitude Dec",
                  "Lat Dec",
                  "Y"
              ]
          )

          lon_field = find_exact(
              [
                  "Longitude",
                  "Lon",
                  "Long",
                  "Longitude DD",
                  "Longitude Decimal",
                  "Long Decimal",
                  "Longitude Dec",
                  "Long Dec",
                  "X"
              ]
          )

          if lat_field is None:

              lat_field = find_contains(
                  [
                      "Latitude",
                      "Lat"
                  ]
              )

          if lon_field is None:

              lon_field = find_contains(
                  [
                      "Longitude",
                      "Long",
                      "Lon"
                  ]
              )

          # --------------------------------------------------------
          # If NATS supplies combined coordinates, identify those.
          # --------------------------------------------------------

          coordinate_field = None

          if (
              lat_field is None
              or
              lon_field is None
          ):

              for field in fields:

                  key = normalise(
                      field
                  )

                  if (
                      "coordinate" in key
                      or
                      "position" in key
                      or
                      "point" in key
                  ):

                      coordinate_field = field
                      break

          print("")
          print(
              "Latitude field:",
              lat_field
          )

          print(
              "Longitude field:",
              lon_field
          )

          print(
              "Combined coordinate field:",
              coordinate_field
          )

          def parse_coordinate(
              value,
              latitude
          ):

              if value is None:
                  return None

              text = str(
                  value
              ).strip()

              if not text:
                  return None

              # ----------------------------------------------------
              # Decimal degrees with optional hemisphere.
              # ----------------------------------------------------

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  text,
                  flags=re.I
              )

              if match:

                  hemisphere = (
                      match.group(
                          1
                      ).upper()
                  )

                  text = (
                      text[
                          :match.start()
                      ]
                      .strip()
                  )

              # ----------------------------------------------------
              # Plain decimal.
              # ----------------------------------------------------

              try:

                  number = float(
                      text.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else
                      180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          number = -abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              # ----------------------------------------------------
              # Degrees/minutes/seconds.
              # ----------------------------------------------------

              numbers = re.findall(
                  r"[-+]?\d+(?:\.\d+)?",
                  text
              )

              if len(numbers) >= 2:

                  try:

                      degrees = float(
                          numbers[0]
                      )

                      minutes = float(
                          numbers[1]
                      )

                      seconds = (
                          float(
                              numbers[2]
                          )
                          if len(numbers) >= 3
                          else
                          0.0
                      )

                      sign = (
                          -1
                          if degrees < 0
                          else
                          1
                      )

                      number = (
                          abs(degrees)
                          +
                          minutes / 60.0
                          +
                          seconds / 3600.0
                      )

                      number *= sign

                      if hemisphere in {
                          "S",
                          "W"
                      }:

                          number = -abs(
                              number
                          )

                      limit = (
                          90
                          if latitude
                          else
                          180
                      )

                      if (
                          -limit
                          <= number
                          <= limit
                      ):

                          return number

                  except ValueError:
                      pass

              return None

          def parse_combined(
              value
          ):

              if value is None:
                  return None

              text = str(
                  value
              ).strip()

              if not text:
                  return None

              # Try "lat, lon".
              pieces = re.split(
                  r"\s*[,;/]\s*",
                  text
              )

              if len(pieces) >= 2:

                  lat = parse_coordinate(
                      pieces[0],
                      True
                  )

                  lon = parse_coordinate(
                      pieces[1],
                      False
                  )

                  if (
                      lat is not None
                      and
                      lon is not None
                  ):

                      return (
                          lat,
                          lon
                      )

              return None

          # --------------------------------------------------------
          # Name field.
          # --------------------------------------------------------

          name_field = find_exact(
              [
                  "VRP Name",
                  "Name",
                  "Designator",
                  "Identifier",
                  "Point Name",
                  "VRP",
                  "Point"
              ]
          )

          if name_field is None:

              name_field = find_contains(
                  [
                      "Name",
                      "Designator",
                      "Identifier",
                      "VRP"
                  ]
              )

          features = []

          for row in rows:

              latitude = None
              longitude = None

              if (
                  lat_field is not None
                  and
                  lon_field is not None
              ):

                  latitude = parse_coordinate(
                      row.get(
                          lat_field
                      ),
                      True
                  )

                  longitude = parse_coordinate(
                      row.get(
                          lon_field
                      ),
                      False
                  )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  if coordinate_field:

                      combined = parse_combined(
                          row.get(
                              coordinate_field
                          )
                      )

                      if combined:

                          latitude, longitude = (
                              combined
                          )

              if (
                  latitude is None
                  or
                  longitude is None
              ):

                  continue

              properties = {
                  str(key):
                      value
                  for key, value in row.items()
                  if key
              }

              if name_field:

                  properties[
                      "name"
                  ] = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              else:

                  properties[
                      "name"
                  ] = "VRP"

              properties[
                  "source"
              ] = (
                  "NATS Visual Reference Points List"
              )

              features.append(
                  {
                      "type":
                          "Feature",

                      "properties":
                          properties,

                      "geometry":
                          {
                              "type":
                                  "Point",

                              "coordinates":
                                  [
                                      longitude,
                                      latitude
                                  ]
                          }
                  }
              )

          print("")
          print(
              "Valid VRPs:",
              len(features)
          )

          if not features:

              raise SystemExit(
                  "ERROR: Zero valid VRPs. "
                  "See printed NATS headers and "
                  "sample rows above."
              )

          Path(
              "/tmp/avimap-data/"
              "uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type":
                          "FeatureCollection",

                      "features":
                          features
                  },
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          PY

      # ============================================================
      # VALIDATE DATA
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_FILE="/tmp/avimap-data/uk-airspace.geojson"
          VRP_FILE="/tmp/avimap-data/uk-reporting-points.geojson"

          test -s "${AIRSPACE_FILE}"
          test -s "${VRP_FILE}"

          AIRSPACE_COUNT=$(
            jq \
              '.features | length' \
              "${AIRSPACE_FILE}"
          )

          VRP_COUNT=$(
            jq \
              '.features | length' \
              "${VRP_FILE}"
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA"
          echo "=========================================="
          echo ""

          echo "Airspaces: ${AIRSPACE_COUNT}"
          echo "VRPs:      ${VRP_COUNT}"

          echo ""
          echo "NATS airspace categories:"

          jq -r '
            .features
            | group_by(.properties.category)
            | .[]
            | "\(.[0].properties.category): \(length)"
          ' \
            "${AIRSPACE_FILE}"

          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero airspaces."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Zero VRPs."
            exit 1
          fi

          echo ""
          echo "Validation successful."

      # ============================================================
      # INSTALL DATA
      # ============================================================

      - name: Install validated aviation data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson

          if git diff --cached --quiet; then

            echo "No aviation data changes detected."

            exit 0

          fi

          echo ""
          echo "Changes:"
          git diff --cached --stat

          git commit \
            -m "Update UK aviation data from NATS AIS"

          git push
