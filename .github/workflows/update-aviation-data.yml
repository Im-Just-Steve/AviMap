name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find current NATS dataset date
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS dataset date"
          echo "=========================================="

          NATS_PAGE="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$NATS_PAGE" \
            --output /tmp/nats-index.html

          test -s /tmp/nats-index.html

          python3 <<'PY'
          import re
          from datetime import date
          from pathlib import Path

          html = Path(
              "/tmp/nats-index.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          dates = []

          for match in re.finditer(
              r"\b(\d{2})/(\d{2})/(\d{4})\b",
              html
          ):
              try:
                  d = date(
                      int(match.group(3)),
                      int(match.group(2)),
                      int(match.group(1))
                  )
              except ValueError:
                  continue

              if d <= date.today():
                  dates.append(d)

          if not dates:
              raise SystemExit(
                  "ERROR: Could not determine current NATS AIRAC date."
              )

          effective = max(dates)

          suffix = effective.strftime(
              "%Y%m%d"
          )

          print("")
          print("Current NATS effective date:")
          print(f"  {effective}")
          print(f"  Dataset suffix: {suffix}")
          print("")

          Path(
              "/tmp/nats-date.txt"
          ).write_text(
              suffix,
              encoding="utf-8"
          )
          PY


      # ============================================================
      # DOWNLOAD NATS AIP
      #
      # NATS export naming convention:
      #
      # EG_AIP_DS_FULL_YYYYMMDD_XML.zip
      #
      # The archive is extracted and we use whatever XML/KML
      # geometry files NATS actually supplies.
      # ============================================================

      - name: Download NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(cat /tmp/nats-date.txt)

          mkdir -p \
            /tmp/nats/aip \
            /tmp/nats/aip-extract

          AIP_FILE="EG_AIP_DS_FULL_${DATE}_XML.zip"

          AIP_URL="https://nats-uk.ead-it.com/cms-nats/export/sites/default/en/Publications/digital-datasets/AIP/${AIP_FILE}"

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP dataset"
          echo "=========================================="
          echo ""
          echo "Dataset:"
          echo "$AIP_FILE"
          echo ""
          echo "URL:"
          echo "$AIP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$AIP_URL" \
            --output /tmp/nats/aip.zip

          test -s /tmp/nats/aip.zip

          echo ""
          echo "AIP download successful:"
          ls -lh /tmp/nats/aip.zip
          echo ""

          echo "Testing archive..."

          unzip \
            -t \
            /tmp/nats/aip.zip

          echo ""
          echo "Extracting AIP..."

          unzip \
            -o \
            /tmp/nats/aip.zip \
            -d /tmp/nats/aip-extract

          echo ""
          echo "AIP archive contents:"
          find \
            /tmp/nats/aip-extract \
            -type f \
            -print

          echo ""

          AIP_XML=$(
            find \
              /tmp/nats/aip-extract \
              -type f \
              \( \
                -iname "*.xml" \
                -o \
                -iname "*.XML" \
              \) \
              | head -n 1 || true
          )

          AIP_KML=$(
            find \
              /tmp/nats/aip-extract \
              -type f \
              \( \
                -iname "*.kml" \
                -o \
                -iname "*.KML" \
              \) \
              | head -n 1 || true
          )

          if [ -n "$AIP_XML" ]; then
            echo "$AIP_XML" \
              > /tmp/nats-aip-xml.txt
          fi

          if [ -n "$AIP_KML" ]; then
            echo "$AIP_KML" \
              > /tmp/nats-aip-kml.txt
          fi

          echo "Detected XML:"
          echo "${AIP_XML:-NONE}"

          echo ""
          echo "Detected KML:"
          echo "${AIP_KML:-NONE}"

          echo ""

          if [ -z "$AIP_XML" ] && [ -z "$AIP_KML" ]; then
            echo "ERROR: No XML or KML found inside NATS AIP archive."
            exit 1
          fi


      # ============================================================
      # DOWNLOAD NATS VRP
      # ============================================================

      - name: Download NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(cat /tmp/nats-date.txt)

          mkdir -p \
            /tmp/nats/vrp \
            /tmp/nats/vrp-extract

          VRP_FILE="EG_VRP_DS_AREA1_FULL_${DATE}_CSV.zip"

          VRP_URL="https://nats-uk.ead-it.com/cms-nats/export/sites/default/en/Publications/digital-datasets/VRP/${VRP_FILE}"

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "Dataset:"
          echo "$VRP_FILE"
          echo ""
          echo "URL:"
          echo "$VRP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats/vrp.zip

          test -s /tmp/nats/vrp.zip

          echo ""
          echo "VRP download successful:"
          ls -lh /tmp/nats/vrp.zip

          echo ""
          echo "Extracting VRP archive..."

          unzip \
            -o \
            /tmp/nats/vrp.zip \
            -d /tmp/nats/vrp-extract

          VRP_CSV=$(
            find \
              /tmp/nats/vrp-extract \
              -type f \
              -iname "*.csv" \
              | head -n 1 || true
          )

          if [ -z "$VRP_CSV" ]; then
            echo "ERROR: No CSV found in NATS VRP archive."
            exit 1
          fi

          cp \
            "$VRP_CSV" \
            /tmp/nats/vrps.csv

          echo ""
          echo "VRP CSV:"
          echo "$VRP_CSV"

          echo ""
          wc -l /tmp/nats/vrps.csv


      # ============================================================
      # CONVERT AIRSPACE
      #
      # Prefer KML if NATS supplies it because it directly contains
      # display geometry.
      #
      # If only XML is supplied, stop with diagnostics rather than
      # silently producing incorrect airspace.
      # ============================================================

      - name: Convert NATS airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          if [ -f /tmp/nats-aip-kml.txt ]; then

            AIP_KML=$(cat /tmp/nats-aip-kml.txt)

            echo ""
            echo "Using NATS KML geometry:"
            echo "$AIP_KML"
            echo ""

            python3 <<'PY'
            import json
            import re
            import xml.etree.ElementTree as ET
            from pathlib import Path

            kml_path = Path(
                "/tmp/nats-aip-kml.txt"
            ).read_text().strip()

            tree = ET.parse(
                kml_path
            )

            root = tree.getroot()

            def local(tag):
                return tag.split(
                    "}",
                    1
                )[-1].lower()

            def text(element):
                return " ".join(
                    x.strip()
                    for x in element.itertext()
                    if x.strip()
                )

            def parse_coords(value):
                result = []

                for token in re.split(
                    r"\s+",
                    value.strip()
                ):

                    parts = token.split(",")

                    if len(parts) < 2:
                        continue

                    try:
                        lon = float(parts[0])
                        lat = float(parts[1])
                    except ValueError:
                        continue

                    if (
                        -180 <= lon <= 180
                        and
                        -90 <= lat <= 90
                    ):
                        result.append([
                            lon,
                            lat
                        ])

                return result

            def classify(value):
                value = value.upper()

                if re.search(
                    r"\b(PROHIBITED|RESTRICTED|DANGER)\b",
                    value
                ):
                    return "PRD"

                if re.search(
                    r"\bATZ\b",
                    value
                ):
                    return "ATZ"

                if re.search(
                    r"\bTMZ\b",
                    value
                ):
                    return "TMZ"

                if re.search(
                    r"\bMATZ\b",
                    value
                ):
                    return "MATZ"

                if re.search(
                    r"\bRMZ\b",
                    value
                ):
                    return "RMZ"

                if re.search(
                    r"\bCLASS\s*A\b",
                    value
                ):
                    return "CLASS_A"

                if re.search(
                    r"\bCLASS\s*[BCD]\b",
                    value
                ):
                    return "CONTROLLED"

                if re.search(
                    r"\b(CTA|CTR|TMA|CTZ|CONTROLLED)\b",
                    value
                ):
                    return "CONTROLLED"

                return "OTHER"

            features = []

            for placemark in root.iter():

                if local(
                    placemark.tag
                ) != "placemark":
                    continue

                name = ""
                description = ""

                for element in placemark.iter():

                    tag = local(
                        element.tag
                    )

                    if (
                        tag == "name"
                        and
                        not name
                    ):
                        name = text(
                            element
                        )

                    if (
                        tag == "description"
                        and
                        not description
                    ):
                        description = text(
                            element
                        )

                searchable = text(
                    placemark
                )

                category = classify(
                    searchable
                )

                rings = []

                for element in placemark.iter():

                    if local(
                        element.tag
                    ) != "coordinates":
                        continue

                    coords = parse_coords(
                        text(element)
                    )

                    if len(coords) >= 3:

                        if coords[0] != coords[-1]:
                            coords.append(
                                coords[0]
                            )

                        rings.append(
                            coords
                        )

                if not rings:
                    continue

                features.append({
                    "type": "Feature",
                    "properties": {
                        "name": (
                            name
                            or
                            "NATS airspace"
                        ),
                        "description": description,
                        "category": category,
                        "source": "NATS UK ICAO AIP Dataset"
                    },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": rings
                    }
                })

            print("")
            print(
                f"Airspace polygons: {len(features)}"
            )
            print("")

            if not features:
                raise SystemExit(
                    "ERROR: NATS KML contained zero airspace polygons."
                )

            Path(
                "/tmp/avimap-data/uk-airspace.geojson"
            ).write_text(
                json.dumps(
                    {
                        "type": "FeatureCollection",
                        "features": features
                    },
                    separators=(",", ":")
                ),
                encoding="utf-8"
            )
            PY

          else

            echo ""
            echo "=========================================="
            echo "NATS AIP FORMAT"
            echo "=========================================="
            echo ""
            echo "NATS supplied XML but no KML geometry."
            echo ""
            echo "The XML will NOT be guessed or converted blindly."
            echo ""
            echo "XML file:"
            cat /tmp/nats-aip-xml.txt
            echo ""
            echo ""
            echo "The workflow is stopping safely."
            echo "No existing airspace data will be replaced."
            exit 1

          fi


      # ============================================================
      # CONVERT VRPS
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          lookup = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):

              for name in names:

                  key = norm(
                      name
                  )

                  if key in lookup:
                      return lookup[key]

              for key, original in lookup.items():

                  for name in names:

                      wanted = norm(
                          name
                      )

                      if (
                          wanted in key
                          or
                          key in wanted
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          print("")
          print("CSV fields:")

          for field in fields:
              print(
                  f"  {field}"
              )

          print("")
          print("Detected:")
          print(
              f"  Name      : {name_field}"
          )
          print(
              f"  Latitude  : {lat_field}"
          )
          print(
              f"  Longitude : {lon_field}"
          )
          print("")

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify VRP coordinates."
              )

          def parse_coord(
              value,
              latitude
          ):
              if value is None:
                  return None

              value = str(
                  value
              ).strip()

              if not value:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  value,
                  flags=re.I
              )

              if match:

                  hemisphere = match.group(
                      1
                  ).upper()

                  value = value[
                      :match.start()
                  ].strip()

              try:

                  number = float(
                      value.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          number = -abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              compact = (
                  value
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              match = re.fullmatch(
                  r"(\d+)(?:\.(\d+))?",
                  compact
              )

              if not match:
                  return None

              integer_part = match.group(
                  1
              )

              decimal_part = (
                  match.group(2)
                  or
                  ""
              )

              try:

                  if latitude:

                      if len(integer_part) < 6:
                          return None

                      degrees = int(
                          integer_part[:2]
                      )

                      minutes = int(
                          integer_part[2:4]
                      )

                      seconds_text = (
                          integer_part[4:]
                      )

                  else:

                      if len(integer_part) < 7:
                          return None

                      degrees = int(
                          integer_part[:3]
                      )

                      minutes = int(
                          integer_part[3:5]
                      )

                      seconds_text = (
                          integer_part[5:]
                      )

                  if decimal_part:
                      seconds_text += (
                          "."
                          + decimal_part
                      )

                  seconds = float(
                      seconds_text
                  )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):
                      return None

                  result = (
                      degrees
                      + minutes / 60
                      + seconds / 3600
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if result > limit:
                      return None

                  if hemisphere in (
                      "S",
                      "W"
                  ):
                      result = -result

                  return result

              except ValueError:
                  return None

          features = []

          for index, row in enumerate(
              rows,
              1
          ):

              lat = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              lon = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  lat is None
                  or
                  lon is None
              ):
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              if not name:
                  name = f"VRP {index}"

              properties = {
                  str(key): value
                  for key, value in row.items()
                  if key
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          lon,
                          lat
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(
              f"CSV records: {len(rows)}"
          )
          print(
              f"Valid VRPs:  {len(features)}"
          )
          print("")

          if not features:
              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL VALIDATION"
          echo "=========================================="
          echo ""
          echo "Airspaces : $AIRSPACE_COUNT"
          echo "VRPs      : $VRP_COUNT"
          echo ""

          if [ "$AIRSPACE_COUNT" -eq 0 ]; then
            echo "ERROR: Airspace dataset is empty."
            exit 1
          fi

          if [ "$VRP_COUNT" -eq 0 ]; then
            echo "ERROR: VRP dataset is empty."
            exit 1
          fi

          echo "Validation successful."


      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated aviation data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          Source: NATS UK Digital Datasets.

          Airspace:
          - UK ICAO AIP Dataset

          Reporting points:
          - Visual Reference Points (VRP) List

          Data is validated before being committed.
          EOF


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated aviation data
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push

          fi
