                          "designator"
                      ]
                  )
              )

              print(
                  "Name:",
                  repr(
                      match[
                          "name"
                      ]
                  )
              )

              print(
                  "Type:",
                  repr(
                      match[
                          "type"
                      ]
                  )
              )

              print(
                  "Local type:",
                  repr(
                      match[
                          "local_type"
                      ]
                  )
              )

              print(
                  "Class:",
                  repr(
                      match[
                          "class"
                      ]
                  )
              )

              print(
                  "Textual match:",
                  match[
                      "textual_match"
                  ]
              )

              print(
                  "Nearest geometry coordinate:",
                  match[
                      "minimum_distance_nm"
                  ]
              )


              print("")
              print(
                  "Referenced/reachable geometry tags:"
              )


              for tag in match[
                  "reachable_tags"
              ]:

                  print(
                      "  ",
