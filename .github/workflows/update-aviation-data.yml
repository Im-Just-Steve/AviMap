          features = []

          def base_properties(item):
              return {
                  "source": "NATS UK AIP ENR 2.2",
                  "airspace_type": "MATZ",
                  "name": item["name"],
                  "controlling_aerodrome": item["controlling"],
                  "frequency": item["frequency"],
                  "centre_lat": item["lat"],
                  "centre_lon": item["lon"],
                  "stub_headings_true": item["headings"],
                  "notes": item.get("notes", ""),
                  "lower_limit": "SFC",
                  "upper_limit": "3000 FT AAL",
              }

          # --------------------------------------------------------
          # Generate normal MATZs.
          # --------------------------------------------------------

          for item in MATZ:

              if item.get("special") == "warton":
                  continue

              radius = item.get("radius_nm", 5.0)

              props = base_properties(item)
              props.update({
                  "geometry_part": "core",
                  "radius_nm": radius,
              })

              features.append(
                  feature(
                      {
                          "type": "Polygon",
                          "coordinates": [
                              circle(
                                  item["lat"],
                                  item["lon"],
                                  radius,
                              )
                          ],
                      },
                      props,
                  )
              )

              headings = item["headings"]
              lengths = item.get(
                  "stub_lengths_nm",
                  [5.0] * len(headings),
              )

              for index, heading in enumerate(headings):

                  length = lengths[index]

                  stub_props = base_properties(item)
                  stub_props.update({
                      "geometry_part": "stub",
                      "stub_heading_true": heading,
                      "stub_length_nm": length,
                      "stub_width_nm": 4.0,
                      "lower_limit": "1000 FT AAL",
                      "upper_limit": "3000 FT AAL",
