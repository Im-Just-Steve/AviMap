name: Test NATS AIP download paths

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Test NATS AIP download paths
        shell: bash
        run: |
          set -u

          DATE="20260806"

          echo "=========================================="
          echo "NATS AIP DOWNLOAD TEST"
          echo "=========================================="
          echo ""
          echo "Testing AIRAC date: $DATE"
          echo ""

          FILES=(
            "EG_AIP_DS_FULL_${DATE}.XML"
            "EG_AIP_DS_FULL_${DATE}.KML"
            "EG_AIP_DS_DIFF_DELTA_${DATE}.XML"
          )

          PATHS=(
            "AIP"
            "AIP/"
            "AIP%20Data"
            "AIP_Data"
            "aip"
            "AIP-Dataset"
            "AIP_Dataset"
            "AIP%20Dataset"
            "AIP%20Data%20Set"
            "AIP_Data_Set"
            "AIXM"
            "AIXM51"
          )

          BASE="https://nats-uk.ead-it.com/cms-nats/export/sites/default/en/Publications/digital-datasets"

          for DIR in "${PATHS[@]}"; do

            echo ""
            echo "------------------------------------------"
            echo "Testing directory: $DIR"
            echo "------------------------------------------"

            for FILE in "${FILES[@]}"; do

              URL="$BASE/$DIR/$FILE"

              STATUS=$(
                curl \
                  --silent \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  --location \
                  --max-time 20 \
                  --user-agent "AviMap/1.0" \
                  "$URL"
              )

              echo "$STATUS  $URL"

            done

          done

          echo ""
          echo "=========================================="
          echo "TEST COMPLETE"
          echo "=========================================="
