name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # FIND CURRENT NATS DATASETS
      # ============================================================

      - name: Find current NATS AIP and VRP datasets
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Finding current NATS datasets"
          echo "=========================================="

          python3 <<'PY'
          import html
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, unquote

          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          EXPORT_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/export/sites/default/en/"
              "Publications/digital-datasets/"
          )

          today = datetime.now(
              timezone.utc
          ).date()

          print("")
          print("Downloading NATS digital datasets index...")

          index = html.unescape(
              fetch(INDEX_URL)
          )

          # Find every Dataset_Checklist_YYYY_MM_DD.HTML link.
          checklist_matches = re.findall(
              r'Dataset_Checklist_(\d{4})_(\d{2})_(\d{2})\.HTML',
              index,
              flags=re.I
          )

          checklist_candidates = []

          for year, month, day in checklist_matches:
              try:
                  date = datetime(
                      int(year),
                      int(month),
                      int(day)
                  ).date()
              except ValueError:
                  continue

              url = (
                  CHECKLIST_BASE
                  + f"Dataset_Checklist_{year}_{month}_{day}.HTML"
              )

              checklist_candidates.append(
                  (date, url)
              )

          # Fallback to the currently published checklist.
          if not checklist_candidates:
              checklist_candidates.append(
                  (
                      datetime(
                          2026,
                          7,
                          9
                      ).date(),
                      CHECKLIST_BASE
                      + "Dataset_Checklist_2026_07_09.HTML"
                  )
              )

          eligible_checklists = [
              item
              for item in checklist_candidates
              if item[0] <= today
          ]

          if not eligible_checklists:
              raise SystemExit(
                  "ERROR: No effective NATS Dataset Checklist found."
              )

          checklist_date, checklist_url = max(
              eligible_checklists,
              key=lambda item: item[0]
          )

          print("")
          print("Selected NATS checklist:")
          print(f"  Date: {checklist_date}")
          print(f"  URL : {checklist_url}")
          print("")

          checklist = html.unescape(
              fetch(checklist_url)
          )

          Path(
              "/tmp/nats-checklist.html"
          ).write_text(
              checklist,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Find dataset filenames in the checklist.
          # --------------------------------------------------------

          def find_names(pattern):
              return sorted(
                  set(
                      re.findall(
                          pattern,
                          checklist,
                          flags=re.I
                      )
                  )
              )

          aip_xml_names = find_names(
              r'EG_AIP_DS_FULL_\d{8}\.XML'
          )

          aip_kml_names = find_names(
              r'EG_AIP_DS_FULL_\d{8}\.KML'
          )

          vrp_csv_names = find_names(
              r'EG_VRP_DS_AREA1_FULL_\d{8}\.CSV'
          )

          print("==========================================")
          print("NATS CHECKLIST DATASETS")
          print("==========================================")
          print("")

          print("AIP XML candidates:")
          for name in aip_xml_names:
              print(f"  {name}")

          print("")
          print("AIP KML candidates:")
          for name in aip_kml_names:
              print(f"  {name}")

          print("")
          print("VRP CSV candidates:")
          for name in vrp_csv_names:
              print(f"  {name}")

          print("")

          def filename_date(filename):
              match = re.search(
                  r'_(\d{8})\.',
                  filename
              )

              if not match:
                  return None

              try:
                  return datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  return None

          def select_latest(names, description):
              candidates = []

              for name in names:
                  date = filename_date(name)

                  if date is not None and date <= today:
                      candidates.append(
                          (date, name)
                      )

              if not candidates:
                  raise SystemExit(
                      f"ERROR: No current {description} dataset found."
                  )

              return max(
                  candidates,
                  key=lambda item: item[0]
              )

          aip_xml_date, aip_xml_name = select_latest(
              aip_xml_names,
              "AIP XML"
          )

          aip_kml_date, aip_kml_name = select_latest(
              aip_kml_names,
              "AIP KML"
          )

          vrp_date, vrp_name = select_latest(
              vrp_csv_names,
              "VRP CSV"
          )

          if aip_xml_date != aip_kml_date:
              raise SystemExit(
                  "ERROR: AIP XML and KML are different AIRAC dates: "
                  f"{aip_xml_date} / {aip_kml_date}"
              )

          # --------------------------------------------------------
          # Locate URLs in the checklist.
          #
          # NATS sometimes puts the filename directly in href and
          # sometimes places the filename in a table beside the href.
          # We inspect the surrounding HTML.
          # --------------------------------------------------------

          def find_url(filename):
              escaped = re.escape(filename)

              # Direct href containing filename.
              match = re.search(
                  r'href\s*=\s*["\']([^"\']*'
                  + escaped
                  + r'[^"\']*)["\']',
                  checklist,
                  flags=re.I
              )

              if match:
                  href = html.unescape(
                      unquote(
                          match.group(1)
                      )
                  )

                  return urljoin(
                      checklist_url,
                      href
                  )

              # Look around each occurrence of the filename.
              occurrences = list(
                  re.finditer(
                      escaped,
                      checklist,
                      flags=re.I
                  )
              )

              for occurrence in occurrences:
                  start = max(
                      0,
                      occurrence.start() - 4000
                  )

                  end = min(
                      len(checklist),
                      occurrence.end() + 4000
                  )

                  nearby = checklist[
                      start:end
                  ]

                  hrefs = re.findall(
                      r'href\s*=\s*["\']([^"\']+)["\']',
                      nearby,
                      flags=re.I
                  )

                  for href in hrefs:
                      href = html.unescape(
                          unquote(
                              href
                          )
                      )

                      url = urljoin(
                          checklist_url,
                          href
                      )

                      if "/cms-nats/export/" in url:
                          return url

              return None

          aip_xml_url = find_url(
              aip_xml_name
          )

          aip_kml_url = find_url(
              aip_kml_name
          )

          vrp_url = find_url(
              vrp_name
          )

          # --------------------------------------------------------
          # Fallback to the standard NATS export locations if the
          # checklist does not expose the href.
          # --------------------------------------------------------

          if aip_xml_url is None:
              aip_xml_url = (
                  EXPORT_BASE
                  + "AIP/"
                  + aip_xml_name
              )

          if aip_kml_url is None:
              aip_kml_url = (
                  EXPORT_BASE
                  + "AIP/"
                  + aip_kml_name
              )

          if vrp_url is None:
              vrp_url = (
                  EXPORT_BASE
                  + "VRP/"
                  + vrp_name
              )

          print("==========================================")
          print("SELECTED NATS DATASETS")
          print("==========================================")
          print("")
          print(f"AIP AIRAC DATE : {aip_xml_date}")
          print(f"AIP XML        : {aip_xml_name}")
          print(f"AIP XML URL    : {aip_xml_url}")
          print("")
          print(f"AIP KML        : {aip_kml_name}")
          print(f"AIP KML URL    : {aip_kml_url}")
          print("")
          print(f"VRP DATE       : {vrp_date}")
          print(f"VRP CSV        : {vrp_name}")
          print(f"VRP CSV URL    : {vrp_url}")
          print("")

          Path(
              "/tmp/nats-aip-xml-url.txt"
          ).write_text(
              aip_xml_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-kml-url.txt"
          ).write_text(
              aip_kml_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              vrp_url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-airac-date.txt"
          ).write_text(
              str(aip_xml_date),
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-vrp-date.txt"
          ).write_text(
              str(vrp_date),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # DOWNLOAD AIP
      # ============================================================

      - name: Download NATS UK ICAO AIP dataset
        run: |
          set -euo pipefail

          mkdir -p /tmp/nats

          AIP_XML_URL=$(cat /tmp/nats-aip-xml-url.txt)
          AIP_KML_URL=$(cat /tmp/nats-aip-kml-url.txt)

          echo "=========================================="
          echo "Downloading NATS AIP"
          echo "=========================================="
          echo ""
          echo "XML:"
          echo "${AIP_XML_URL}"
          echo ""
          echo "KML:"
          echo "${AIP_KML_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_XML_URL}" \
            -o /tmp/nats/aip.xml

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${AIP_KML_URL}" \
            -o /tmp/nats/aip.kml

          test -s /tmp/nats/aip.xml
          test -s /tmp/nats/aip.kml

          echo ""
          echo "Downloaded AIP files:"
          ls -lh /tmp/nats/


      # ============================================================
      # DOWNLOAD VRP
      # ============================================================

      - name: Download NATS VRP dataset
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "${VRP_URL}"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "${VRP_URL}" \
            -o /tmp/nats/vrp-download

          test -s /tmp/nats/vrp-download

          mkdir -p /tmp/nats/vrp-extract

          if unzip -t \
            /tmp/nats/vrp-download \
            >/dev/null 2>&1
          then

            echo "VRP download is a ZIP archive."

            unzip \
              -o \
              /tmp/nats/vrp-download \
              -d /tmp/nats/vrp-extract

            VRP_CSV=$(
              find \
                /tmp/nats/vrp-extract \
                -type f \
                -iname "*.csv" \
                | head -n 1 || true
            )

            if [ -z "${VRP_CSV}" ]; then
              echo "ERROR: No CSV found in VRP ZIP."
              find \
                /tmp/nats/vrp-extract \
                -type f \
                -print
              exit 1
            fi

            cp \
              "${VRP_CSV}" \
              /tmp/nats/vrps.csv

          else

            echo "VRP download is not a ZIP."

            if head -n 1 \
              /tmp/nats/vrp-download \
              | grep -qi "latitude"
            then

              cp \
                /tmp/nats/vrp-download \
                /tmp/nats/vrps.csv

            else

              echo "ERROR: VRP download is neither ZIP nor CSV."
              exit 1

            fi

          fi

          test -s /tmp/nats/vrps.csv

          echo ""
          echo "VRP CSV:"
          wc -l /tmp/nats/vrps.csv
          ls -lh /tmp/nats/vrps.csv


      # ============================================================
      # CONVERT AIRSPACE KML TO GEOJSON
      # ============================================================

      - name: Convert NATS airspace to GeoJSON
        run: |
          set -euo pipefail

          mkdir -p /tmp/avimap-data

          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          tree = ET.parse(
              "/tmp/nats/aip.kml"
          )

          root = tree.getroot()

          def local(tag):
              return tag.split(
                  "}",
                  1
              )[-1].lower()

          def text(element):
              return " ".join(
                  part.strip()
                  for part in element.itertext()
                  if part.strip()
              )

          def parse_coordinates(value):
              result = []

              for token in re.split(
                  r"\s+",
                  value.strip()
              ):
                  parts = token.split(",")

                  if len(parts) < 2:
                      continue

                  try:
                      lon = float(parts[0])
                      lat = float(parts[1])
                  except ValueError:
                      continue

                  if (
                      -180 <= lon <= 180
                      and
                      -90 <= lat <= 90
                  ):
                      result.append([
                          lon,
                          lat
                      ])

              return result

          def classify(value):
              value = value.upper()

              if re.search(
                  r"\b(PROHIBITED|RESTRICTED|DANGER)\b",
                  value
              ):
                  return "PRD"

              if re.search(
                  r"\bATZ\b",
                  value
              ):
                  return "ATZ"

              if re.search(
                  r"\bTMZ\b",
                  value
              ):
                  return "TMZ"

              if re.search(
                  r"\bMATZ\b",
                  value
              ):
                  return "MATZ"

              if re.search(
                  r"\bRMZ\b",
                  value
              ):
                  return "RMZ"

              if re.search(
                  r"\bCLASS\s*A\b",
                  value
              ):
                  return "CLASS_A"

              if re.search(
                  r"\bCLASS\s*[BCD]\b",
                  value
              ):
                  return "CONTROLLED"

              if re.search(
                  r"\b(CTA|CTR|TMA|CTZ|CONTROLLED)\b",
                  value
              ):
                  return "CONTROLLED"

              return "OTHER"

          features = []

          for placemark in root.iter():

              if local(
                  placemark.tag
              ) != "placemark":
                  continue

              name = ""

              description = ""

              for child in placemark.iter():

                  tag = local(
                      child.tag
                  )

                  if tag == "name" and not name:
                      name = text(child)

                  if tag == "description" and not description:
                      description = text(child)

              searchable = text(
                  placemark
              )

              category = classify(
                  searchable
              )

              if category == "OTHER":
                  if not re.search(
                      r"\b(AIRSPACE|CLASS\s*[A-G]|ATZ|TMZ|MATZ|RMZ|"
                      r"CTA|CTR|TMA|CTZ|PROHIBITED|RESTRICTED|DANGER)\b",
                      searchable,
                      flags=re.I
                  ):
                      continue

              rings = []

              for element in placemark.iter():

                  if local(
                      element.tag
                  ) != "coordinates":
                      continue

                  coords = parse_coordinates(
                      text(element)
                  )

                  if len(coords) >= 3:

                      if coords[0] != coords[-1]:
                          coords.append(
                              coords[0]
                          )

                      rings.append(
                          coords
                      )

              if not rings:
                  continue

              geometry = {
                  "type": "Polygon",
                  "coordinates": rings
              }

              features.append({
                  "type": "Feature",
                  "properties": {
                      "name": (
                          name
                          or
                          "NATS airspace"
                      ),
                      "description": description,
                      "category": category,
                      "source": "NATS UK ICAO AIP Dataset",
                      "airac": Path(
                          "/tmp/nats-airac-date.txt"
                      ).read_text().strip()
                  },
                  "geometry": geometry
              })

          if not features:
              raise SystemExit(
                  "ERROR: NATS KML produced zero airspace polygons."
              )

          output = {
              "type": "FeatureCollection",
              "features": features
          }

          Path(
              "/tmp/avimap-data/uk-airspace.geojson"
          ).write_text(
              json.dumps(
                  output,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          counts = {}

          for feature in features:
              category = feature[
                  "properties"
              ][
                  "category"
              ]

              counts[category] = (
                  counts.get(
                      category,
                      0
                  ) + 1
              )

          print("")
          print("==========================================")
          print("NATS AIRSPACE RESULT")
          print("==========================================")
          print("")
          print(
              f"Airspace polygons: {len(features)}"
          )

          for category, count in sorted(
              counts.items()
          ):
              print(
                  f"  {category}: {count}"
              )
          PY


      # ============================================================
      # CONVERT VRPs
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          raw = Path(
              "/tmp/nats/vrps.csv"
          ).read_text(
              encoding="utf-8-sig",
              errors="replace"
          )

          try:
              dialect = csv.Sniffer().sniff(
                  raw[:8192],
                  delimiters=",;\t"
              )
          except csv.Error:
              dialect = csv.excel

          rows = list(
              csv.DictReader(
                  raw.splitlines(),
                  dialect=dialect
              )
          )

          if not rows:
              raise SystemExit(
                  "ERROR: NATS VRP CSV contains zero records."
              )

          fields = list(
              rows[0].keys()
          )

          def norm(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  str(value).lower()
              )

          normalised = {
              norm(field): field
              for field in fields
              if field
          }

          def find_field(*names):
              for name in names:
                  key = norm(name)

                  if key in normalised:
                      return normalised[key]

              for key, original in normalised.items():
                  for name in names:
                      wanted = norm(name)

                      if (
                          wanted in key
                          or
                          key in wanted
                      ):
                          return original

              return None

          name_field = find_field(
              "VRP Name",
              "VRP",
              "Name",
              "Designator",
              "Identifier",
              "Point Name",
              "Point"
          )

          lat_field = find_field(
              "Latitude",
              "Lat",
              "Latitude DD",
              "Latitude Decimal"
          )

          lon_field = find_field(
              "Longitude",
              "Lon",
              "Long",
              "Longitude DD",
              "Longitude Decimal"
          )

          print("")
          print("CSV fields:")

          for field in fields:
              print(
                  f"  {field}"
              )

          print("")
          print("Detected fields:")
          print(
              f"  Name:      {name_field}"
          )
          print(
              f"  Latitude:  {lat_field}"
          )
          print(
              f"  Longitude: {lon_field}"
          )

          if not lat_field or not lon_field:
              raise SystemExit(
                  "ERROR: Could not identify VRP coordinates."
              )

          def parse_coord(value, latitude):
              if value is None:
                  return None

              value = str(
                  value
              ).strip()

              if not value:
                  return None

              hemisphere = None

              match = re.search(
                  r"([NSEW])\s*$",
                  value,
                  flags=re.I
              )

              if match:
                  hemisphere = match.group(
                      1
                  ).upper()

                  value = value[
                      :match.start()
                  ].strip()

              # Decimal degrees.
              try:
                  number = float(
                      value.replace(
                          ",",
                          "."
                      )
                  )

                  limit = (
                      90
                      if latitude
                      else 180
                  )

                  if (
                      -limit
                      <= number
                      <= limit
                  ):

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          number = -abs(
                              number
                          )

                      return number

              except ValueError:
                  pass

              compact = (
                  value
                  .replace("°", "")
                  .replace("'", "")
                  .replace('"', "")
                  .replace(" ", "")
              )

              # NATS DDMMSS / DDDMMSS.
              match = re.fullmatch(
                  r"(\d+)(?:\.(\d+))?",
                  compact
              )

              if match:

                  integer_part = match.group(
                      1
                  )

                  decimal_part = (
                      match.group(2)
                      or
                      ""
                  )

                  try:

                      if latitude:

                          if len(
                              integer_part
                          ) < 6:
                              return None

                          degrees = int(
                              integer_part[:2]
                          )

                          minutes = int(
                              integer_part[2:4]
                          )

                          seconds_text = (
                              integer_part[4:]
                          )

                      else:

                          if len(
                              integer_part
                          ) < 7:
                              return None

                          degrees = int(
                              integer_part[:3]
                          )

                          minutes = int(
                              integer_part[3:5]
                          )

                          seconds_text = (
                              integer_part[5:]
                          )

                      if decimal_part:
                          seconds_text += (
                              "."
                              + decimal_part
                          )

                      seconds = float(
                          seconds_text
                      )

                      if (
                          minutes >= 60
                          or
                          seconds >= 60
                      ):
                          return None

                      result = (
                          degrees
                          + minutes / 60
                          + seconds / 3600
                      )

                      limit = (
                          90
                          if latitude
                          else 180
                      )

                      if result > limit:
                          return None

                      if hemisphere in (
                          "S",
                          "W"
                      ):
                          result = -result

                      return result

                  except ValueError:
                      return None

              return None

          features = []
          invalid = 0

          for index, row in enumerate(
              rows,
              1
          ):

              latitude = parse_coord(
                  row.get(
                      lat_field
                  ),
                  True
              )

              longitude = parse_coord(
                  row.get(
                      lon_field
                  ),
                  False
              )

              if (
                  latitude is None
                  or
                  longitude is None
              ):
                  invalid += 1
                  continue

              name = ""

              if name_field:
                  name = str(
                      row.get(
                          name_field,
                          ""
                      )
                  ).strip()

              if not name:
                  name = (
                      f"VRP {index}"
                  )

              properties = {
                  str(key): value
                  for key, value in row.items()
                  if key
              }

              properties["name"] = name
              properties["ident"] = name
              properties["source"] = "NATS VRP List"

              features.append({
                  "type": "Feature",
                  "properties": properties,
                  "geometry": {
                      "type": "Point",
                      "coordinates": [
                          longitude,
                          latitude
                      ]
                  }
              })

          print("")
          print("==========================================")
          print("NATS VRP RESULT")
          print("==========================================")
          print("")
          print(
              f"CSV records:         {len(rows)}"
          )
          print(
              f"Valid VRPs:          {len(features)}"
          )
          print(
              f"Invalid coordinates: {invalid}"
          )
          print("")

          if not features:
              raise SystemExit(
                  "ERROR: NATS VRP conversion produced ZERO valid VRPs. "
                  "Existing repository data will NOT be replaced."
              )

          Path(
              "/tmp/avimap-data/uk-reporting-points.geojson"
          ).write_text(
              json.dumps(
                  {
                      "type": "FeatureCollection",
                      "features": features
                  },
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY


      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate generated NATS data
        run: |
          set -euo pipefail

          AIRSPACE_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-airspace.geojson
          )

          VRP_COUNT=$(
            jq '.features | length' \
            /tmp/avimap-data/uk-reporting-points.geojson
          )

          echo ""
          echo "=========================================="
          echo "FINAL NATS DATA COUNTS"
          echo "=========================================="
          echo ""
          echo "Airspaces : ${AIRSPACE_COUNT}"
          echo "VRPs      : ${VRP_COUNT}"
          echo ""

          if [ "${AIRSPACE_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated airspace data is empty."
            exit 1
          fi

          if [ "${VRP_COUNT}" -eq 0 ]; then
            echo "ERROR: Generated VRP data is empty."
            exit 1
          fi

          echo "Validation successful."
          echo "Existing repository data has not been changed yet."


      # ============================================================
      # INSTALL VALIDATED DATA
      # ============================================================

      - name: Install validated NATS data
        run: |
          set -euo pipefail

          mkdir -p data

          cp \
            /tmp/avimap-data/uk-airspace.geojson \
            data/uk-airspace.geojson

          cp \
            /tmp/avimap-data/uk-reporting-points.geojson \
            data/uk-reporting-points.geojson

          cat > data/SOURCES.md <<'EOF'
          # AviMap UK aviation data

          Aviation data is sourced from NATS UK digital datasets.

          Airspace:
          - UK ICAO AIP Dataset
          - NATS AIP KML geometry
          - Corresponding NATS AIXM XML dataset

          Reporting points:
          - NATS Visual Reference Points (VRP) List

          The GitHub Actions workflow validates both datasets before
          replacing the repository data.
          EOF


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit updated NATS aviation data
        run: |
          set -euo pipefail

          git config \
            user.name \
            "AviMap Data Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            data/uk-airspace.geojson \
            data/uk-reporting-points.geojson \
            data/SOURCES.md

          echo ""
          echo "=========================================="
          echo "DATA CHANGE CHECK"
          echo "=========================================="
          echo ""

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Existing aviation data remains untouched."
          else
            git diff --cached --stat

            git commit \
              -m "Update UK aviation data from NATS"

            git push

            echo ""
            echo "=========================================="
            echo "NATS AVIATION DATA UPDATE COMPLETE"
            echo "=========================================="
          fi
