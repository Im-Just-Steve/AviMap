name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download UK airspace from OpenAIP
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -e

          mkdir -p data

          echo "Requesting UK airspace from OpenAIP..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=1" \
            -o /tmp/openaip-page.json

          echo "OpenAIP response received."

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/openaip-page.json";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));

          console.log("Response keys:", Object.keys(data));

          if (!Array.isArray(data.items)) {
            throw new Error("OpenAIP response does not contain an 'items' array.");
          }

          console.log("Airspaces on first page:", data.items.length);
          console.log("Total airspaces:", data.totalCount);
          console.log("Total pages:", data.totalPages);

          if (data.items.length === 0) {
            throw new Error("OpenAIP returned zero UK airspaces.");
          }
          NODE

      - name: Download all UK airspace pages
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          set -e

          rm -f /tmp/all-airspaces.jsonl

          PAGE=1

          while true; do

            echo "Downloading OpenAIP page ${PAGE}..."

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 5 \
              -H "x-openaip-api-key: ${OPENAIP_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.core.openaip.net/api/airspaces?country=GB&approved=true&limit=100&page=${PAGE}" \
              -o "/tmp/page-${PAGE}.json"

            node <<NODE
            const fs = require("fs");

            const file = "/tmp/page-${PAGE}.json";
            const data = JSON.parse(fs.readFileSync(file, "utf8"));

            if (!Array.isArray(data.items)) {
              throw new Error("Page ${PAGE} does not contain an items array.");
            }

            console.log(
              "Page ${PAGE}:",
              data.items.length,
              "airspaces"
            );

            fs.appendFileSync(
              "/tmp/all-airspaces.jsonl",
              data.items.map(x => JSON.stringify(x)).join("\\n") + "\\n"
            );

            if (${PAGE} >= Number(data.totalPages || 1)) {
              process.exit(0);
            }
            NODE

            PAGE=$((PAGE + 1))

          done

      - name: Convert OpenAIP airspace to GeoJSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const input = "/tmp/all-airspaces.jsonl";
          const output = "data/uk-airspace.geojson";

          const lines = fs.readFileSync(input, "utf8")
            .split(/\r?\n/)
            .filter(Boolean);

          const features = [];

          for (const line of lines) {
            const item = JSON.parse(line);

            let geometry = item.geometry;

            if (typeof geometry === "string") {
              try {
                geometry = JSON.parse(geometry);
              } catch {
                continue;
              }
            }

            if (!geometry || !geometry.type || !geometry.coordinates) {
              continue;
            }

            features.push({
              type: "Feature",
              id: item._id || item.id,

              properties: {
                id: item._id || item.id || "",
                name: item.name || "Unknown airspace",
                type: item.type ?? "",
                icaoClass: item.icaoClass ?? "",
                activity: item.activity ?? "",
                upperLimit: item.upperLimit ?? null,
                lowerLimit: item.lowerLimit ?? null,
                country: item.country ?? "GB"
              },

              geometry
            });
          }

          if (features.length === 0) {
            throw new Error(
              "Conversion produced zero GeoJSON features."
            );
          }

          const geojson = {
            type: "FeatureCollection",
            features
          };

          fs.writeFileSync(
            output,
            JSON.stringify(geojson)
          );

          console.log(
            `Created ${features.length} UK airspace features.`
          );
          NODE

      - name: Validate GeoJSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "data/uk-airspace.geojson";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));

          if (data.type !== "FeatureCollection") {
            throw new Error("Airspace file is not a FeatureCollection.");
          }

          if (!Array.isArray(data.features)) {
            throw new Error("Airspace FeatureCollection has no features array.");
          }

          if (data.features.length === 0) {
            throw new Error("Airspace FeatureCollection contains zero features.");
          }

          console.log(
            `Validated ${data.features.length} UK airspace features.`
          );
          NODE

      - name: Commit updated airspace data
        run: |
          git config user.name "AviMap Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/uk-airspace.geojson

          if git diff --cached --quiet; then
            echo "No changes to UK airspace data."
          else
            git commit -m "Update UK airspace data"
            git push
          fi
