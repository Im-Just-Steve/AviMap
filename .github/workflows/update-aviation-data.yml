name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            file \
            jq \
            python3


      # ============================================================
      # DISCOVER CURRENT NATS DATASETS
      # ============================================================

      - name: Discover current NATS datasets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import html
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin


          USER_AGENT = "AviMap-NATS-Data-Updater/1.0"

          CHECKLIST_BASE = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/Checklists/"
          )

          INDEX_URL = (
              "https://nats-uk.ead-it.com/"
              "cms-nats/opencms/en/Publications/"
              "digital-datasets/index.html"
          )

          today = datetime.now(
              timezone.utc
          ).date()


          class LinkParser(HTMLParser):

              def __init__(self):
                  super().__init__(
                      convert_charrefs=True
                  )

                  self.links = []
                  self.href = None
                  self.text = []


              def handle_starttag(
                  self,
                  tag,
                  attrs
              ):

                  if tag.lower() != "a":
                      return

                  attrs = dict(attrs)

                  self.href = attrs.get(
                      "href"
                  )

                  self.text = []


              def handle_data(
                  self,
                  data
              ):

                  if self.href is not None:
                      self.text.append(
                          data
                      )


              def handle_endtag(
                  self,
                  tag
              ):

                  if (
                      tag.lower() == "a"
                      and
                      self.href is not None
                  ):

                      self.links.append(
                          (
                              self.href,
                              " ".join(
                                  self.text
                              )
                          )
                      )

                      self.href = None
                      self.text = []


          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          USER_AGENT
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=45
              ) as response:

                  return (
                      response.read(),
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )


          def parse_links(
              base_url,
              body
          ):

              parser = LinkParser()

              parser.feed(
                  body.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              result = []

              for href, text in parser.links:

                  if not href:
                      continue

                  absolute = urljoin(
                      base_url,
                      html.unescape(
                          href.strip()
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      html.unescape(
                          text
                      ).strip()
                  )

                  result.append(
                      (
                          absolute,
                          text
                      )
                  )

              return result


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  value.upper()
              )


          def is_aip_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGAIPDSFULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "AIP" in value
                      and
                      (
                          "XML" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          def is_vrp_link(
              url,
              text,
              airac
          ):

              value = compact(
                  url + " " + text
              )

              return (
                  f"EGVRPDSAREA1FULL{airac}"
                  in value
                  or
                  (
                      airac in value
                      and
                      "VRP" in value
                      and
                      (
                          "CSV" in value
                          or
                          "ZIP" in value
                      )
                  )
              )


          print(
              "=========================================="
          )

          print(
              "NATS DATASET DISCOVERY"
          )

          print(
              "=========================================="
          )


          checklist_body = None
          checklist_url = None


          for offset in range(90):

              candidate_date = (
                  today
                  -
                  timedelta(
                      days=offset
                  )
              )

              stamp = candidate_date.strftime(
                  "%Y_%m_%d"
              )

              candidates = [
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.html"
                  ),
                  (
                      CHECKLIST_BASE
                      +
                      f"Dataset_Checklist_{stamp}.HTML"
                  )
              ]


              for candidate in candidates:

                  try:

                      body, _ = fetch(
                          candidate
                      )

                  except Exception:

                      continue


                  text = body.decode(
                      "utf-8",
                      errors="replace"
                  )


                  if (
                      "EG_AIP_DS_FULL_"
                      in text
                      and
                      "EG_VRP_DS_AREA1_FULL_"
                      in text
                  ):

                      checklist_body = body
                      checklist_url = candidate

                      break


              if checklist_body is not None:
                  break


          if checklist_body is None:

              raise SystemExit(
                  "ERROR: Could not find current NATS Dataset Checklist."
              )


          print(
              "Checklist:",
              checklist_url
          )


          checklist_text = checklist_body.decode(
              "utf-8",
              errors="replace"
          )


          # --------------------------------------------------------
          # AIP AIRAC
          # --------------------------------------------------------

          aip_matches = re.findall(
              r"EG_AIP_DS_FULL_(\d{8})\.XML",
              checklist_text,
              flags=re.I
          )


          aip_dates = []


          for stamp in aip_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  aip_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not aip_dates:

              raise SystemExit(
                  "ERROR: No current AIP AIRAC found."
              )


          aip_date, aip_stamp = max(
              aip_dates,
              key=lambda item: item[0]
          )


          # --------------------------------------------------------
          # VRP AIRAC
          # --------------------------------------------------------

          vrp_matches = re.findall(
              r"EG_VRP_DS_AREA1_FULL_(\d{8})\.CSV",
              checklist_text,
              flags=re.I
          )


          vrp_dates = []


          for stamp in vrp_matches:

              try:

                  date = datetime.strptime(
                      stamp,
                      "%Y%m%d"
                  ).date()

              except ValueError:

                  continue


              if date <= today:

                  vrp_dates.append(
                      (
                          date,
                          stamp
                      )
                  )


          if not vrp_dates:

              raise SystemExit(
                  "ERROR: No current VRP AIRAC found."
              )


          vrp_date, vrp_stamp = max(
              vrp_dates,
              key=lambda item: item[0]
          )


          print("")
          print(
              "AIP AIRAC:",
              aip_stamp
          )

          print(
              "VRP AIRAC:",
              vrp_stamp
          )


          # --------------------------------------------------------
          # DISCOVER DOWNLOAD LINKS
          # --------------------------------------------------------

          checklist_links = parse_links(
              checklist_url,
              checklist_body
          )


          try:

              index_body, _ = fetch(
                  INDEX_URL
              )

              index_links = parse_links(
                  INDEX_URL,
                  index_body
              )

          except Exception as exc:

              print(
                  "WARNING: Dataset index unavailable:",
                  exc
              )

              index_links = []


          aip_links = []
          vrp_links = []
          seen = set()


          for url, text in (
              checklist_links
              +
              index_links
          ):

              if url in seen:
                  continue

              seen.add(url)


              if is_aip_link(
                  url,
                  text,
                  aip_stamp
              ):

                  aip_links.append(
                      (
                          url,
                          text
                      )
                  )


              if is_vrp_link(
                  url,
                  text,
                  vrp_stamp
              ):

                  vrp_links.append(
                      (
                          url,
                          text
                      )
                  )


          # --------------------------------------------------------
          # FOLLOW AIP DATASET PAGES
          # --------------------------------------------------------

          for url, text in list(
              aip_links
          ):

              lower = url.lower()


              if not (
                  lower.endswith(
                      ".html"
                  )
                  or
                  lower.endswith(
                      ".htm"
                  )
                  or
                  lower.endswith(
                      "/"
                  )
              ):

                  continue


              try:

                  body, _ = fetch(
                      url
                  )


                  for child_url, child_text in parse_links(
                      url,
                      body
                  ):

                      if is_aip_link(
                          child_url,
                          child_text,
                          aip_stamp
                      ):

                          aip_links.append(
                              (
                                  child_url,
                                  child_text
                              )
                          )


              except Exception as exc:

                  print(
                      "WARNING:",
                      exc
                  )


          def unique_links(
              links
          ):

              result = []
              seen_urls = set()


              for url, text in links:

                  if url in seen_urls:
                      continue

                  seen_urls.add(
                      url
                  )

                  result.append(
                      (
                          url,
                          text
                      )
                  )


              return result


          aip_links = unique_links(
              aip_links
          )

          vrp_links = unique_links(
              vrp_links
          )


          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              aip_date.strftime(
                  "%Y-%m-%d"
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-aip-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in aip_links
              ),
              encoding="utf-8"
          )


          Path(
              "/tmp/nats-vrp-links.txt"
          ).write_text(
              "\n".join(
                  url
                  for url, _ in vrp_links
              ),
              encoding="utf-8"
          )


          print("")
          print(
              "AIP candidates:"
          )

          for url, text in aip_links:

              print(
                  text,
                  "=>",
                  url
              )


          print("")
          print(
              "VRP candidates:"
          )

          for url, text in vrp_links:

              print(
                  text,
                  "=>",
                  url
              )


          if not aip_links:

              raise SystemExit(
                  "ERROR: No AIP download candidate found."
              )


          if not vrp_links:

              raise SystemExit(
                  "ERROR: No VRP download candidate found."
              )

          PY


      # ============================================================
      # DOWNLOAD NATS AIP
      # ============================================================

      - name: Download NATS AIP dataset
        run: |
          set -euo pipefail

          rm -rf /tmp/nats-aip

          mkdir -p /tmp/nats-aip

          FOUND=""


          while IFS= read -r URL; do

            [ -z "${URL}" ] && continue


            echo ""
            echo "Testing NATS AIP URL:"
            echo "${URL}"


            rm -f /tmp/nats-aip-download


            HTTP_CODE=$(
              curl \
                --location \
                --silent \
                --show-error \
                --output /tmp/nats-aip-download \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-delay 3 \
                --connect-timeout 20 \
                --max-time 180 \
                "${URL}" \
                || true
            )


            echo "HTTP: ${HTTP_CODE}"


            if [ "${HTTP_CODE}" != "200" ]; then
              continue
            fi


            file /tmp/nats-aip-download


            if file /tmp/nats-aip-download | grep -qi "Zip archive"; then

              rm -rf /tmp/nats-aip

              mkdir -p /tmp/nats-aip


              unzip \
                -o \
                /tmp/nats-aip-download \
                -d /tmp/nats-aip


              echo ""
              echo "AIP archive contents:"

              find \
                /tmp/nats-aip \
                -type f \
                -print


              AIP_XML=$(
                find \
                  /tmp/nats-aip \
                  -type f \
                  \( \
                    -iname 'EG_AIP_DS_FULL_*.xml' \
                    -o \
                    -iname 'EG_AIP_DS_FULL_*.XML' \
                  \) \
                  | head -n 1
              )


              if [ -n "${AIP_XML}" ]; then

                cp \
                  "${AIP_XML}" \
                  /tmp/uk-aip.xml


                FOUND="${URL}"

                break

              fi

            fi

          done < /tmp/nats-aip-links.txt


          if [ -z "${FOUND}" ]; then

            echo ""
            echo "ERROR: NATS AIP download failed."

            exit 1

          fi


          echo ""
          echo "AIP source:"
          echo "${FOUND}"


          ls -lh \
            /tmp/uk-aip.xml


          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse(
              "/tmp/uk-aip.xml"
          )

          print(
              "AIXM XML parses successfully."
          )
          PY



      # ============================================================
      # FORENSIC NATS MATZ / EGUL DIAGNOSTIC
      #
      # This step deliberately does NOT modify the AIXM data.
      # It searches the raw NATS AIXM for the known Lakenheath
      # MATZ location and reports exactly how NATS represents it.
      # ============================================================

      - name: Forensic search for EGUL / Lakenheath MATZ
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import math
          import re
          import xml.etree.ElementTree as ET

          from pathlib import Path


          XML_FILE = "/tmp/uk-aip.xml"

          TARGET_LAT = 52.4094028
          TARGET_LON = 0.5610111

          # The known Lakenheath MATZ is approximately 5 NM radius.
          # Search generously so that we catch the ATZ, MATZ, stubs,
          # referenced geometry and nearby airspace objects.
          SEARCH_NM = 8.0


          def local(tag):
              return tag.rsplit("}", 1)[-1]


          def attr(element, name):
              if element is None:
                  return None

              wanted = name.lower()

              for key, value in element.attrib.items():
                  if local(key).lower() == wanted:
                      return value

              return None


          def parse_numbers(value):
              if not value:
                  return []

              result = []

              for token in re.split(r"[\s,]+", value.strip()):
                  if not token:
                      continue

                  try:
                      result.append(float(token))
                  except ValueError:
                      pass

              return result


          def haversine_nm(lat1, lon1, lat2, lon2):
              radius_km = 6371.0088

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(
                  lat2 - lat1
              )

              dl = math.radians(
                  lon2 - lon1
              )

              a = (
                  math.sin(dp / 2) ** 2
                  +
                  math.cos(p1)
                  *
                  math.cos(p2)
                  *
                  math.sin(dl / 2) ** 2
              )

              distance_km = (
                  2
                  *
                  radius_km
                  *
                  math.asin(
                      math.sqrt(a)
                  )
              )

              return distance_km / 1.852


          def coordinate_candidates(node):
              """
              Return both possible coordinate axis interpretations.

              We deliberately test both orders because this is a
              forensic diagnostic and we do not want an unexpected
              CRS axis convention to hide the EGUL geometry.
              """

              tag = local(node.tag)

              if tag not in {
                  "pos",
                  "posList",
                  "coordinates"
              }:
                  return []

              values = parse_numbers(
                  node.text
              )

              if not values:
                  return []

              pairs = []

              if tag == "posList":

                  try:
                      dimension = int(
                          attr(
                              node,
                              "srsDimension"
                          )
                          or "2"
                      )
                  except ValueError:
                      dimension = 2

                  dimension = max(
                      2,
                      dimension
                  )

                  for i in range(
                      0,
                      len(values),
                      dimension
                  ):

                      part = values[
                          i:i + dimension
                      ]

                      if len(part) >= 2:
                          pairs.append(
                              (
                                  part[0],
                                  part[1]
                              )
                          )

              else:

                  if len(values) >= 2:
                      pairs.append(
                          (
                              values[0],
                              values[1]
                          )
                      )


              result = []

              for first, second in pairs:

                  # lat/lon
                  if (
                      -90 <= first <= 90
                      and
                      -180 <= second <= 180
                  ):

                      result.append(
                          (
                              first,
                              second,
                              "lat-lon"
                          )
                      )

                  # lon/lat
                  if (
                      -180 <= first <= 180
                      and
                      -90 <= second <= 90
                  ):

                      result.append(
                          (
                              second,
                              first,
                              "lon-lat"
                          )
                      )

              return result


          def first_value(
              element,
              names
          ):

              wanted = {
                  name.lower()
                  for name in names
              }

              for node in element.iter():

                  if (
                      local(
                          node.tag
                      ).lower()
                      in wanted
                      and
                      node.text
                  ):

                      value = node.text.strip()

                      if value:
                          return value

              return ""


          # ========================================================
          # LOAD XML
          # ========================================================

          tree = ET.parse(
              XML_FILE
          )

          root = tree.getroot()


          # ========================================================
          # BUILD GLOBAL ID / HREF INDEX
          #
          # This is the important addition over the previous
          # diagnostic. AIXM commonly stores geometry separately
          # and references it with xlink:href.
          # ========================================================

          id_index = {}


          def add_id(
              value,
              element
          ):

              if not value:
                  return

              value = value.strip()

              if not value:
                  return

              candidates = {
                  value,
                  value.lstrip("#")
              }

              if "#" in value:
                  candidates.add(
                      value.rsplit(
                          "#",
                          1
                      )[-1]
                  )

              if value.startswith(
                  "urn:uuid:"
              ):
                  candidates.add(
                      value[9:]
                  )

              for candidate in candidates:
                  id_index[
                      candidate
                  ] = element


          for element in root.iter():

              for key, value in element.attrib.items():

                  lname = local(
                      key
                  ).lower()

                  if lname in {
                      "id",
                      "uuid",
                      "identifier"
                  }:

                      add_id(
                          value,
                          element
                      )


          def resolve(
              value
          ):

              if not value:
                  return None

              candidates = [
                  value,
                  value.lstrip("#")
              ]

              if "#" in value:
                  candidates.append(
                      value.rsplit(
                          "#",
                          1
                      )[-1]
                  )

              if value.startswith(
                  "urn:uuid:"
              ):
                  candidates.append(
                      value[9:]
                  )

              for candidate in candidates:

                  if candidate in id_index:
                      return id_index[
                          candidate
                      ]

              return None


          def href_target(
              element
          ):

              return resolve(
                  attr(
                      element,
                      "href"
                  )
              )


          # ========================================================
          # AIRSPACE OBJECTS
          # ========================================================

          airspaces = [
              node
              for node in root.iter()
              if local(
                  node.tag
              ) == "Airspace"
          ]


          print("")
          print(
              "=========================================="
          )

          print(
              "EGUL / MATZ FORENSIC NATS SEARCH"
          )

          print(
              "=========================================="
          )

          print("")
          print(
              "Target latitude:",
              TARGET_LAT
          )

          print(
              "Target longitude:",
              TARGET_LON
          )

          print(
              "Search radius:",
              SEARCH_NM,
              "NM"
          )

          print(
              "NATS Airspace objects:",
              len(
                  airspaces
              )
          )

          print(
              "Global XML identifiers:",
              len(
                  id_index
              )
          )


          # ========================================================
          # FIND EVERY GEOMETRY OBJECT IN THE ENTIRE AIXM DOCUMENT
          # ========================================================

          geometry_names = {
              "Surface",
              "CompositeSurface",
              "PolygonPatch",
              "Ring",
              "LinearRing",
              "Curve",
              "LineStringSegment",
              "GeodesicString",
              "ArcString",
              "ArcStringByBulge",
              "CircleByCenterPoint",
              "ArcByCenterPoint"
          }


          geometry_objects = [
              node
              for node in root.iter()
              if local(
                  node.tag
              ) in geometry_names
          ]


          print(
              "Geometry objects in XML:",
              len(
                  geometry_objects
              )
          )


          # ========================================================
          # TRACE ALL REFERENCES FROM AN AIRSPACE
          # ========================================================

          def reachable(
              start
          ):

              queue = [
                  start
              ]

              result = []

              seen = set()


              while queue:

                  current = queue.pop()

                  if current is None:
                      continue

                  marker = id(
                      current
                  )

                  if marker in seen:
                      continue

                  seen.add(
                      marker
                  )

                  result.append(
                      current
                  )


                  for child in current.iter():

                      target = href_target(
                          child
                      )

                      if target is not None:
                          queue.append(
                              target
                          )


              return result


          # ========================================================
          # EXTRACT COORDINATE EVIDENCE FROM AN OBJECT
          # ========================================================

          def object_coordinates(
              object_node
          ):

              output = []

              for node in object_node.iter():

                  for lat, lon, ordering in coordinate_candidates(
                      node
                  ):

                      distance = haversine_nm(
                          TARGET_LAT,
                          TARGET_LON,
                          lat,
                          lon
                      )

                      if distance <= SEARCH_NM:

                          output.append(
                              {
                                  "tag":
                                      local(
                                          node.tag
                                      ),

                                  "lat":
                                      lat,

                                  "lon":
                                      lon,

                                  "ordering":
                                      ordering,

                                  "distance_nm":
                                      distance,

                                  "srs":
                                      attr(
                                          node,
                                          "srsName"
                                      ),

                                  "node_id":
                                      attr(
                                          node,
                                          "id"
                                      ),

                                  "href":
                                      attr(
                                          node,
                                          "href"
                                      )
                              }
                          )

              return output


          # ========================================================
          # SEARCH AIRSPACE OBJECTS
          # ========================================================

          matches = []


          for index, airspace in enumerate(
              airspaces,
              start=1
          ):

              identifier = (
                  attr(
                      airspace,
                      "id"
                  )
                  or
                  attr(
                      airspace,
                      "uuid"
                  )
                  or
                  ""
              )


              designator = first_value(
                  airspace,
                  {
                      "designator"
                  }
              )


              name = first_value(
                  airspace,
                  {
                      "name"
                  }
              )


              airspace_type = first_value(
                  airspace,
                  {
                      "type",
                      "AirspaceType"
                  }
              )


              local_type = first_value(
                  airspace,
                  {
                      "localType",
                      "AirspaceLocalType"
                  }
              )


              airspace_class = first_value(
                  airspace,
                  {
                      "class",
                      "AirspaceClass"
                  }
              )


              # ----------------------------------------------------
              # Text search across the Airspace AND referenced
              # geometry objects.
              # ----------------------------------------------------

              reachable_objects = reachable(
                  airspace
              )


              combined_text = " ".join(
                  (
                      node.text
                      or
                      ""
                  ).strip()
                  for object_node in reachable_objects
                  for node in object_node.iter()
                  if (
                      node.text
                      and
                      node.text.strip()
                  )
              )


              upper_text = combined_text.upper()


              textual_match = any(
                  token in upper_text
                  for token in (
                      "EGUL",
                      "LAKENHEATH",
                      "52.409",
                      "0.561",
                      "N52 24",
                      "E000 33",
                      "522433",
                      "000333"
                  )
              )


              # ----------------------------------------------------
              # Spatial search through both inline and referenced
              # geometry.
              # ----------------------------------------------------

              coordinate_matches = []


              for object_node in reachable_objects:

                  coordinate_matches.extend(
                      object_coordinates(
                          object_node
                      )
                  )


              minimum_distance = None


              if coordinate_matches:

                  minimum_distance = min(
                      item[
                          "distance_nm"
                      ]
                      for item in coordinate_matches
                  )


              if (
                  textual_match
                  or
                  coordinate_matches
              ):

                  matches.append(
                      {
                          "index":
                              index,

                          "id":
                              identifier,

                          "designator":
                              designator,

                          "name":
                              name,

                          "type":
                              airspace_type,

                          "local_type":
                              local_type,

                          "class":
                              airspace_class,

                          "textual_match":
                              textual_match,

                          "minimum_distance_nm":
                              minimum_distance,

                          "coordinate_matches":
                              coordinate_matches,

                          "reachable_tags":
                              sorted(
                                  {
                                      local(
                                          node.tag
                                      )
                                      for object_node
                                      in reachable_objects
                                      for node
                                      in object_node.iter()
                                  }
                              )
