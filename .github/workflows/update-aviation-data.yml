name: Update UK aviation data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL PYTHON DEPENDENCIES
      # ============================================================

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install lxml shapely


      # ============================================================
      # DOWNLOAD NATS DIGITAL DATASET INDEX
      # ============================================================

      - name: Download NATS dataset page
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading NATS Digital Datasets page"
          echo "=========================================="

          NATS_URL="https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/index.html"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36" \
            "$NATS_URL" \
            --output /tmp/nats.html

          test -s /tmp/nats.html

          echo ""
          echo "NATS page downloaded:"
          wc -c /tmp/nats.html


      # ============================================================
      # DISCOVER CURRENT NATS AIP DATASET
      # ============================================================

      - name: Find current NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          xml_datasets = []

          for href in hrefs:

              match = re.search(
                  r'/ICAO_AIP/'
                  r'EG_AIP_DS_(\d{8})_XML\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  date_value = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              xml_datasets.append(
                  (
                      date_value,
                      href
                  )
              )

          if not xml_datasets:

              print("")
              print("ERROR: No NATS AIP XML dataset found.")
              print("")
              print("ICAO_AIP links found:")

              for href in hrefs:
                  if "ICAO_AIP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in xml_datasets
              if item[0] <= today
          ]

          if not usable:
              raise SystemExit(
                  "ERROR: No current/effective NATS AIP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print("")
          print("==========================================")
          print("NATS AIP DATASET SELECTED")
          print("==========================================")
          print("")
          print("AIRAC / effective date:")
          print(effective_date)
          print("")
          print("URL:")
          print(url)
          print("")

          Path(
              "/tmp/nats-aip-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          Path(
              "/tmp/nats-aip-date.txt"
          ).write_text(
              str(effective_date),
              encoding="utf-8"
          )

          PY


      # ============================================================
      # DOWNLOAD NATS AIP XML
      # ============================================================

      - name: Download NATS AIP dataset
        shell: bash
        run: |
          set -euo pipefail

          AIP_URL=$(cat /tmp/nats-aip-url.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS AIP"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "URL:"
          echo "$AIP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$AIP_URL" \
            --output /tmp/nats-aip.zip

          test -s /tmp/nats-aip.zip

          echo ""
          echo "Downloaded:"
          ls -lh /tmp/nats-aip.zip

          echo ""
          echo "Testing ZIP:"
          unzip -t /tmp/nats-aip.zip

          mkdir -p /tmp/nats-aip

          unzip \
            -o \
            /tmp/nats-aip.zip \
            -d /tmp/nats-aip

          echo ""
          echo "Extracted files:"
          find \
            /tmp/nats-aip \
            -type f \
            -print


      # ============================================================
      # LOCATE AIP XML
      # ============================================================

      - name: Locate NATS AIP XML
        shell: bash
        run: |
          set -euo pipefail

          AIRAC=$(cat /tmp/nats-aip-date.txt)

          XML_FILE=$(
            find \
              /tmp/nats-aip \
              -type f \
              -iname "EG_AIP_DS_FULL_${AIRAC}.xml" \
              | head -n 1
          )

          if [ -z "$XML_FILE" ]; then

            XML_FILE=$(
              find \
                /tmp/nats-aip \
                -type f \
                -iname "*.xml" \
                ! -iname "export-filter.xml" \
                | head -n 1
            )

          fi

          if [ -z "$XML_FILE" ]; then
            echo "ERROR: No usable NATS AIP XML found."
            exit 1
          fi

          echo ""
          echo "NATS AIP XML:"
          echo "$XML_FILE"
          echo ""

          ls -lh "$XML_FILE"

          printf '%s' "$XML_FILE" \
            > /tmp/nats-aip-xml-file.txt


      # ============================================================
      # DOWNLOAD NATS VRP DATASET
      # ============================================================

      - name: Find current NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          BASE_URL = "https://nats-uk.ead-it.com"

          html = Path(
              "/tmp/nats.html"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          hrefs = re.findall(
              r'href=["\']([^"\']+)["\']',
              html,
              flags=re.I
          )

          datasets = []

          for href in hrefs:

              match = re.search(
                  r'/VRP/'
                  r'EG_VRP_DS_AREA1_FULL_(\d{8})_CSV\.zip$',
                  href,
                  flags=re.I
              )

              if not match:
                  continue

              try:
                  date_value = datetime.strptime(
                      match.group(1),
                      "%Y%m%d"
                  ).date()
              except ValueError:
                  continue

              datasets.append(
                  (
                      date_value,
                      href
                  )
              )

          if not datasets:

              print("")
              print("ERROR: No NATS VRP dataset found.")
              print("")
              print("VRP links found:")

              for href in hrefs:
                  if "VRP" in href.upper():
                      print(href)

              raise SystemExit(1)

          today = datetime.now(
              timezone.utc
          ).date()

          usable = [
              item
              for item in datasets
              if item[0] <= today
          ]

          if not usable:
              raise SystemExit(
                  "ERROR: No current/effective NATS VRP dataset found."
              )

          effective_date, href = max(
              usable,
              key=lambda item: item[0]
          )

          url = urljoin(
              BASE_URL,
              href
          )

          print("")
          print("==========================================")
          print("NATS VRP DATASET SELECTED")
          print("==========================================")
          print("")
          print("Date:")
          print(effective_date)
          print("")
          print("URL:")
          print(url)
          print("")

          Path(
              "/tmp/nats-vrp-url.txt"
          ).write_text(
              url,
              encoding="utf-8"
          )

          PY


      - name: Download NATS VRP dataset
        shell: bash
        run: |
          set -euo pipefail

          VRP_URL=$(cat /tmp/nats-vrp-url.txt)

          echo ""
          echo "=========================================="
          echo "Downloading NATS VRP dataset"
          echo "=========================================="
          echo ""
          echo "$VRP_URL"
          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --user-agent "AviMap/1.0" \
            "$VRP_URL" \
            --output /tmp/nats-vrp.zip

          test -s /tmp/nats-vrp.zip

          mkdir -p /tmp/nats-vrp

          unzip \
            -o \
            /tmp/nats-vrp.zip \
            -d /tmp/nats-vrp

          echo ""
          echo "VRP files:"
          find \
            /tmp/nats-vrp \
            -type f \
            -print


      # ============================================================
      # CONVERT NATS AIP AIXM -> GEOJSON
      # ============================================================

      - name: Convert NATS AIP airspace to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          XML_FILE=$(cat /tmp/nats-aip-xml-file.txt)
          AIRAC=$(cat /tmp/nats-aip-date.txt)

          echo ""
          echo "=========================================="
          echo "Converting NATS AIP airspace"
          echo "=========================================="
          echo ""
          echo "AIRAC:"
          echo "$AIRAC"
          echo ""
          echo "XML:"
          echo "$XML_FILE"
          echo ""

          python3 <<'PY'
          from pathlib import Path
          from datetime import date
          from lxml import etree
          from shapely.geometry import Polygon, MultiPolygon, GeometryCollection, mapping
          from shapely.ops import unary_union
          import json
          import re
          import sys

          XML_FILE = Path(
              "/tmp/nats-aip-xml-file.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          AIRAC = Path(
              "/tmp/nats-aip-date.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          OUTPUT = Path(
              "data/uk-airspace.geojson"
          )

          NS = {
              "aixm": "http://www.aixm.aero/schema/5.1",
              "gml": "http://www.opengis.net/gml/3.2",
              "xlink": "http://www.w3.org/1999/xlink",
              "xsi": "http://www.w3.org/2001/XMLSchema-instance"
          }

          parser = etree.XMLParser(
              huge_tree=True,
              recover=False,
              remove_comments=True
          )

          print("Parsing AIXM XML...")
          tree = etree.parse(
              XML_FILE,
              parser
          )

          root = tree.getroot()

          # --------------------------------------------------------
          # Index every gml:id so xlink:href geometry references
          # can be resolved.
          # --------------------------------------------------------

          id_index = {}

          for element in root.iter():

              gml_id = element.get(
                  "{http://www.opengis.net/gml/3.2}id"
              )

              if gml_id:
                  id_index[gml_id] = element

          print(
              f"Indexed XML objects: {len(id_index)}"
          )

          def local_name(element):
              return etree.QName(
                  element
              ).localname.lower()

          def clean_text(element):
              if element is None:
                  return ""

              value = "".join(
                  element.itertext()
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

          def first_text(element, names):
              wanted = {
                  name.lower()
                  for name in names
              }

              for child in element.iter():

                  if local_name(child) in wanted:

                      value = clean_text(
                          child
                      )

                      if value:
                          return value

              return ""

          def all_text(element, names):
              wanted = {
                  name.lower()
                  for name in names
              }

              values = []

              for child in element.iter():

                  if local_name(child) in wanted:

                      value = clean_text(
                          child
                      )

                      if value:
                          values.append(
                              value
                          )

              return values

          def resolve_href(element):
              href = element.get(
                  "{http://www.w3.org/1999/xlink}href"
              )

              if not href:
                  return element

              if href.startswith("#"):
                  target = id_index.get(
                      href[1:]
                  )

                  if target is not None:
                      return target

              return element

          def coordinate_pairs(text):
              values = re.findall(
                  r"[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?",
                  text or ""
              )

              numbers = [
                  float(value)
                  for value in values
              ]

              if len(numbers) < 4:
                  return []

              # AIXM/GML coordinates may be encoded as:
              #
              #   lon lat
              # or:
              #   lat lon
              #
              # The NATS dataset normally uses a CRS declaration.
              # Axis handling is performed by geometry_from_element.
              return numbers

          def parse_pos_list(element):
              text = clean_text(
                  element
              )

              numbers = coordinate_pairs(
                  text
              )

              if len(numbers) < 4:
                  return []

              dim = element.get(
                  "srsDimension"
              )

              try:
                  dimension = int(
                      dim
                  ) if dim else 2
              except ValueError:
                  dimension = 2

              if dimension < 2:
                  dimension = 2

              pairs = []

              for index in range(
                  0,
                  len(numbers) - 1,
                  dimension
              ):

                  a = numbers[index]
                  b = numbers[index + 1]

                  pairs.append(
                      (
                          a,
                          b
                      )
                  )

              return pairs

          def ring_coordinates(ring):
              pos_lists = ring.xpath(
                  ".//*[local-name()='posList']"
              )

              if pos_lists:

                  return parse_pos_list(
                      pos_lists[0]
                  )

              positions = ring.xpath(
                  ".//*[local-name()='pos']"
              )

              result = []

              for pos in positions:

                  pairs = parse_pos_list(
                      pos
                  )

                  if pairs:
                      result.append(
                          pairs[0]
                      )

              return result

          def find_polygon_rings(polygon):
              exterior = polygon.xpath(
                  "./*[local-name()='exterior']"
              )

              interiors = polygon.xpath(
                  "./*[local-name()='interior']"
              )

              if not exterior:
                  exterior = polygon.xpath(
                      ".//*[local-name()='exterior']"
                  )

              if not exterior:
                  return None

              outer_ring = exterior[0].xpath(
                  ".//*[local-name()='LinearRing']"
              )

              if not outer_ring:
                  return None

              outer = ring_coordinates(
                  outer_ring[0]
              )

              holes = []

              for interior in interiors:

                  rings = interior.xpath(
                      ".//*[local-name()='LinearRing']"
                  )

                  if not rings:
                      continue

                  coords = ring_coordinates(
                      rings[0]
                  )

                  if len(coords) >= 4:
                      holes.append(
                          coords
                      )

              if len(outer) < 4:
                  return None

              return (
                  outer,
                  holes
              )

          def extract_polygons(element, seen=None):
              if seen is None:
                  seen = set()

              element = resolve_href(
                  element
              )

              marker = id(
                  element
              )

              if marker in seen:
                  return []

              seen.add(
                  marker
              )

              polygons = []

              # Direct GML polygons.
              for polygon in element.xpath(
                  ".//*[local-name()='Polygon']"
              ):

                  rings = find_polygon_rings(
                      polygon
                  )

                  if rings:
                      polygons.append(
                          rings
                      )

              # Surface / MultiSurface objects may contain
              # xlink references to polygons.
              for child in element.iter():

                  href = child.get(
                      "{http://www.w3.org/1999/xlink}href"
                  )

                  if not href:
                      continue

                  if not href.startswith("#"):
                      continue

                  target = id_index.get(
                      href[1:]
                  )

                  if target is None:
                      continue

                  polygons.extend(
                      extract_polygons(
                          target,
                          seen
                      )
                  )

              # Avoid duplicate polygon extraction.
              unique = []

              fingerprints = set()

              for outer, holes in polygons:

                  fingerprint = (
                      tuple(outer),
                      tuple(
                          tuple(hole)
                          for hole in holes
                      )
                  )

                  if fingerprint in fingerprints:
                      continue

                  fingerprints.add(
                      fingerprint
                  )

                  unique.append(
                      (
                          outer,
                          holes
                      )
                  )

              return unique

          def polygon_from_rings(
              outer,
              holes
          ):

              # Determine coordinate order.
              #
              # NATS AIXM uses a geographic CRS. For GeoJSON,
              # coordinates must be [longitude, latitude].
              #
              # If the first coordinate is clearly longitude-like
              # while the second is latitude-like, use it directly.
              #
              # Otherwise use the reverse ordering.

              def valid_lon_lat(pair):
                  return (
                      -180 <= pair[0] <= 180
                      and
                      -90 <= pair[1] <= 90
                  )

              def valid_lat_lon(pair):
                  return (
                      -90 <= pair[0] <= 90
                      and
                      -180 <= pair[1] <= 180
                  )

              def score_lon_lat(coords):

                  score = 0

                  for lon, lat in coords[:20]:

                      if valid_lon_lat(
                          (lon, lat)
                      ):
                          score += 1

                  return score

              def score_lat_lon(coords):

                  score = 0

                  for lon, lat in coords[:20]:

                      if valid_lat_lon(
                          (lat, lon)
                      ):
                          score += 1

                  return score

              direct_score = score_lon_lat(
                  outer
              )

              reverse_score = score_lat_lon(
                  outer
              )

              if reverse_score > direct_score:

                  outer_xy = [
                      (
                          lat,
                          lon
                      )
                      for lon, lat in outer
                  ]

                  holes_xy = [
                      [
                          (
                              lat,
                              lon
                          )
                          for lon, lat in hole
                      ]
                      for hole in holes
                  ]

              else:

                  outer_xy = outer

                  holes_xy = holes

              try:

                  polygon = Polygon(
                      outer_xy,
                      holes_xy
                  )

              except Exception:

                  return None

              if polygon.is_empty:
                  return None

              if not polygon.is_valid:

                  polygon = polygon.buffer(
                      0
                  )

              if polygon.is_empty:
                  return None

              return polygon

          def geometry_for_airspace(airspace):
              polygons = extract_polygons(
                  airspace
              )

              geometries = []

              for outer, holes in polygons:

                  polygon = polygon_from_rings(
                      outer,
                      holes
                  )

                  if polygon is not None:
                      geometries.append(
                          polygon
                      )

              if not geometries:
                  return None

              try:

                  geometry = unary_union(
                      geometries
                  )

              except Exception:

                  geometry = geometries[0]

              if geometry.is_empty:
                  return None

              return geometry

          def current_timeslice(airspace):

              timeslices = airspace.xpath(
                  ".//*[local-name()='AirspaceTimeSlice']"
              )

              if not timeslices:
                  return airspace

              target_date = date.fromisoformat(
                  AIRAC
              )

              candidates = []

              for timeslice in timeslices:

                  begin_values = timeslice.xpath(
                      ".//*[local-name()='beginPosition']/text()"
                  )

                  end_values = timeslice.xpath(
                      ".//*[local-name()='endPosition']/text()"
                  )

                  begin_date = None
                  end_date = None

                  if begin_values:

                      value = begin_values[0].strip()

                      try:
                          begin_date = date.fromisoformat(
                              value[:10]
                          )
                      except Exception:
                          pass

                  if end_values:

                      value = end_values[0].strip()

                      if value:

                          try:
                              end_date = date.fromisoformat(
                                  value[:10]
                              )
                          except Exception:
                              pass

                  if (
                      begin_date is not None
                      and
                      begin_date <= target_date
                      and
                      (
                          end_date is None
                          or
                          target_date < end_date
                      )
                  ):

                      candidates.append(
                          (
                              begin_date,
                              timeslice
                          )
                      )

              if candidates:

                  return max(
                      candidates,
                      key=lambda item: item[0]
                  )[1]

              return timeslices[-1]

          def airspace_class(timeslice):
              values = []

              for element in timeslice.iter():

                  if local_name(element) != "classification":
                      continue

                  value = clean_text(
                      element
                  )

                  if value:
                      values.append(
                          value.upper()
                      )

              return values[0] if values else ""

          def airspace_type(timeslice):
              for element in timeslice.iter():

                  if local_name(element) == "type":

                      value = clean_text(
                          element
                      )

                      if value:
                          return value.upper()

              return ""

          def airspace_local_type(timeslice):
              for element in timeslice.iter():

                  if local_name(element) == "localtype":

                      value = clean_text(
                          element
                      )

                      if value:
                          return value.upper()

              return ""

          def classify(
              designator,
              name,
              air_type,
              local_type,
              classification
          ):

              combined = " ".join(
                  [
                      designator,
                      name,
                      air_type,
                      local_type,
                      classification
                  ]
              ).upper()

              # ----------------------------------------------------
              # Prohibited / Restricted / Danger
              # ----------------------------------------------------

              if (
                  air_type in {
                      "P",
                      "R",
                      "D"
                  }
                  or
                  re.search(
                      r"\bPROHIBITED\b",
                      combined
                  )
                  or
                  re.search(
                      r"\bRESTRICTED\b",
                      combined
                  )
                  or
                  re.search(
                      r"\bDANGER\b",
                      combined
                  )
              ):

                  if air_type == "P" or "PROHIBITED" in combined:
                      return (
                          "PROHIBITED",
                          "red",
                          "solid"
                      )

                  if air_type == "R" or "RESTRICTED" in combined:
                      return (
                          "RESTRICTED",
                          "red",
                          "solid"
                      )

                  return (
                      "DANGER",
                      "red",
                      "solid"
                  )

              # ----------------------------------------------------
              # Class A
              # ----------------------------------------------------

              if (
                  classification == "A"
                  or
                  re.search(
                      r"\bCLASS[\s_-]*A\b",
                      combined
                  )
              ):

                  return (
                      "CLASS_A",
                      "purple",
                      "solid"
                  )

              # ----------------------------------------------------
              # ATZ
              # ----------------------------------------------------

              if (
                  air_type in {
                      "ATZ",
                      "ATZ_P"
                  }
                  or
                  local_type in {
                      "ATZ",
                      "ATZ_P"
                  }
                  or
                  "ATZ" in combined
              ):

                  return (
                      "ATZ",
                      "purple",
                      "dashed"
                  )

              # ----------------------------------------------------
              # TMZ
              # ----------------------------------------------------

              if (
                  air_type == "TMZ"
                  or
                  local_type == "TMZ"
                  or
                  "TMZ" in combined
              ):

                  return (
                      "TMZ",
                      "purple",
                      "dashed"
                  )

              # ----------------------------------------------------
              # MATZ
              # ----------------------------------------------------

              if (
                  air_type == "MATZ"
                  or
                  local_type == "MATZ"
                  or
                  "MATZ" in combined
              ):

                  return (
                      "MATZ",
                      "blue",
                      "dashed"
                  )

              # ----------------------------------------------------
              # RMZ
              # ----------------------------------------------------

              if (
                  air_type == "RMZ"
                  or
                  local_type == "RMZ"
                  or
                  "RMZ" in combined
              ):

                  return (
                      "RMZ",
                      "blue",
                      "dashed"
                  )

              # ----------------------------------------------------
              # Controlled airspace
              # ----------------------------------------------------

              controlled_types = {
                  "CTA",
                  "CTR",
                  "TMA",
                  "TCA",
                  "AWY",
                  "SECTOR",
                  "FIR",
                  "UIR"
              }

              if air_type in controlled_types:

                  return (
                      "CONTROLLED",
                      "blue",
                      "solid"
                  )

              # ----------------------------------------------------
              # Other / Class G
              # ----------------------------------------------------

              return (
                  "OTHER",
                  "grey",
                  "solid"
              )

          # --------------------------------------------------------
          # Locate Airspace features.
          # --------------------------------------------------------

          airspaces = root.xpath(
              "//*[local-name()='Airspace']"
          )

          print(
              f"NATS Airspace features found: {len(airspaces)}"
          )

          features = []

          statistics = {}

          geometry_failures = 0

          for index, airspace in enumerate(
              airspaces,
              1
          ):

              timeslice = current_timeslice(
                  airspace
              )

              designator = first_text(
                  timeslice,
                  [
                      "designator"
                  ]
              )

              name = first_text(
                  timeslice,
                  [
                      "name"
                  ]
              )

              air_type = airspace_type(
                  timeslice
              )

              local_type = airspace_local_type(
                  timeslice
              )

              classification = airspace_class(
                  timeslice
              )

              geometry = geometry_for_airspace(
                  timeslice
              )

              if geometry is None:

                  geometry = geometry_for_airspace(
                      airspace
                  )

              if geometry is None:

                  geometry_failures += 1
                  continue

              category, colour, boundary = classify(
                  designator,
                  name,
                  air_type,
                  local_type,
                  classification
              )

              statistics[
                  category
              ] = statistics.get(
                  category,
                  0
              ) + 1

              properties = {
                  "designator": designator,
                  "name": name,
                  "type": air_type,
                  "localType": local_type,
                  "classification": classification,

                  # AviMap-normalised properties.
                  "category": category,
                  "colour": colour,
                  "boundary": boundary,

                  # Useful aliases for the PWA.
                  "stroke": colour,
                  "lineStyle": boundary,
                  "airspaceType": air_type,
                  "airspaceClass": classification,

                  "source": "NATS UK ICAO AIP Dataset",
                  "airac": AIRAC
              }

              feature = {
                  "type": "Feature",
                  "geometry": mapping(
                      geometry
                  ),
                  "properties": properties
              }

              features.append(
                  feature
              )

          print("")
          print("==========================================")
          print("AIRSPACE CONVERSION RESULT")
          print("==========================================")
          print("")
          print(
              f"Source Airspace features: {len(airspaces)}"
          )
          print(
              f"Valid geometries: {len(features)}"
          )
          print(
              f"Geometry failures: {geometry_failures}"
          )
          print("")
          print("Categories:")

          for category, count in sorted(
              statistics.items()
          ):

              print(
                  f"  {category}: {count}"
              )

          if not features:

              print("")
              print(
                  "ERROR: NATS AIP conversion produced "
                  "zero valid airspace geometries."
              )

              print("")
              print(
                  "The existing uk-airspace.geojson has "
                  "NOT been replaced."
              )

              sys.exit(1)

          # --------------------------------------------------------
          # Sanity check.
          #
          # A successful parse should produce a meaningful number
          # of airspace polygons. Refuse suspiciously tiny output.
          # --------------------------------------------------------

          if len(features) < 10:

              print("")
              print(
                  "ERROR: Fewer than 10 valid NATS airspace "
                  "features were produced."
              )

              print(
                  "Refusing to replace existing GeoJSON."
              )

              sys.exit(1)

          collection = {
              "type": "FeatureCollection",
              "features": features
          }

          temporary = OUTPUT.with_suffix(
              ".geojson.tmp"
          )

          temporary.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Only now replace the existing file.
          # --------------------------------------------------------

          temporary.replace(
              OUTPUT
          )

          print("")
          print(
              f"Written: {OUTPUT}"
          )

          print(
              f"Features: {len(features)}"
          )

          PY

          test -s data/uk-airspace.geojson


      # ============================================================
      # CONVERT NATS VRP CSV -> GEOJSON
      # ============================================================

      - name: Convert NATS VRPs to GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          python3 <<'PY'
          from pathlib import Path
          import csv
          import json
          import math
          import re
          import sys

          VRP_ROOT = Path(
              "/tmp/nats-vrp"
          )

          OUTPUT = Path(
              "data/uk-reporting-points.geojson"
          )

          csv_files = list(
              VRP_ROOT.rglob("*.csv")
          ) + list(
              VRP_ROOT.rglob("*.CSV")
          )

          if not csv_files:

              print(
                  "ERROR: No NATS VRP CSV found."
              )

              sys.exit(1)

          csv_file = csv_files[0]

          print("")
          print("==========================================")
          print("NATS VRP CONVERSION")
          print("==========================================")
          print("")
          print("CSV:")
          print(csv_file)
          print("")

          def normalise_key(value):
              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  value.lower()
              )

          def parse_dms(value, is_latitude):
              if value is None:
                  return None

              text = str(
                  value
              ).strip().upper()

              if not text:
                  return None

              # Decimal degrees.
              try:

                  number = float(
                      text
                  )

                  if (
                      -90 <= number <= 90
                      if is_latitude
                      else
                      -180 <= number <= 180
                  ):

                      return number

              except ValueError:
                  pass

              # ----------------------------------------------------
              # NATS DDMMSS / DDDMMSS coordinates.
              #
              # Examples:
              #   512345N
              #   0001234W
              # ----------------------------------------------------

              match = re.fullmatch(
                  r"(\d+)([NSEW])",
                  text
              )

              if match:

                  digits = match.group(1)
                  hemisphere = match.group(2)

                  if is_latitude:

                      if len(digits) < 6:
                          return None

                      degrees = int(
                          digits[:-4]
                      )

                      minutes = int(
                          digits[-4:-2]
                      )

                      seconds = float(
                          digits[-2:]
                      )

                  else:

                      if len(digits) < 7:
                          return None

                      degrees = int(
                          digits[:-4]
                      )

                      minutes = int(
                          digits[-4:-2]
                      )

                      seconds = float(
                          digits[-2:]
                      )

                  if (
                      minutes >= 60
                      or
                      seconds >= 60
                  ):

                      return None

                  result = (
                      degrees
                      +
                      minutes / 60.0
                      +
                      seconds / 3600.0
                  )

                  if hemisphere in {
                      "S",
                      "W"
                  }:

                      result = -result

                  return result

              # ----------------------------------------------------
              # Compact coordinate without hemisphere.
              # ----------------------------------------------------

              compact = re.sub(
                  r"[^0-9.+-]",
                  "",
                  text
              )

              if compact.isdigit():

                  digits = compact

                  try:

                      if is_latitude:

                          if len(digits) < 6:
                              return None

                          degrees = int(
                              digits[:-4]
                          )

                      else:

                          if len(digits) < 7:
                              return None

                          degrees = int(
                              digits[:-4]
                          )

                      minutes = int(
                          digits[-4:-2]
                      )

                      seconds = float(
                          digits[-2:]
                      )

                      if (
                          minutes >= 60
                          or
                          seconds >= 60
                      ):
                          return None

                      return (
                          degrees
                          +
                          minutes / 60.0
                          +
                          seconds / 3600.0
                      )

                  except Exception:
                      pass

              return None

          def find_column(
              headers,
              candidates
          ):

              normalised = {
                  normalise_key(
                      header
                  ): header
                  for header in headers
              }

              for candidate in candidates:

                  key = normalise_key(
                      candidate
                  )

                  if key in normalised:

                      return normalised[
                          key
                      ]

              return None

          with csv_file.open(
              "r",
              encoding="utf-8-sig",
              errors="replace",
              newline=""
          ) as handle:

              reader = csv.DictReader(
                  handle
              )

              headers = reader.fieldnames or []

              print("CSV fields:")

              for header in headers:
                  print(
                      f"  {header}"
                  )

              name_column = find_column(
                  headers,
                  [
                      "VRP name",
                      "VRP Name",
                      "Name",
                      "VRP"
                  ]
              )

              lat_column = find_column(
                  headers,
                  [
                      "Latitude",
                      "Lat"
                  ]
              )

              lon_column = find_column(
                  headers,
                  [
                      "Longitude",
                      "Long",
                      "Lon"
                  ]
              )

              aerodrome_column = find_column(
                  headers,
                  [
                      "Associated Aerodrome",
                      "Aerodrome"
                  ]
              )

              icao_column = find_column(
                  headers,
                  [
                      "ICAO Code",
                      "ICAO"
                  ]
              )

              valid_from_column = find_column(
                  headers,
                  [
                      "Valid From",
                      "ValidFrom"
                  ]
              )

              print("")
              print("Detected fields:")
              print(
                  "  Name:",
                  name_column
              )
              print(
                  "  Latitude:",
                  lat_column
              )
              print(
                  "  Longitude:",
                  lon_column
              )
              print(
                  "  Aerodrome:",
                  aerodrome_column
              )
              print(
                  "  ICAO:",
                  icao_column
              )
              print(
                  "  Valid From:",
                  valid_from_column
              )

              if not lat_column or not lon_column:

                  print("")
                  print(
                      "ERROR: Latitude/Longitude fields "
                      "could not be detected."
                  )

                  sys.exit(1)

              features = []
              invalid = 0

              for row in reader:

                  latitude = parse_dms(
                      row.get(
                          lat_column,
                          ""
                      ),
                      True
                  )

                  longitude = parse_dms(
                      row.get(
                          lon_column,
                          ""
                      ),
                      False
                  )

                  if (
                      latitude is None
                      or
                      longitude is None
                  ):

                      invalid += 1
                      continue

                  if not (
                      -90 <= latitude <= 90
                      and
                      -180 <= longitude <= 180
                  ):

                      invalid += 1
                      continue

                  name = (
                      row.get(
                          name_column,
                          ""
                      ).strip()
                      if name_column
                      else ""
                  )

                  aerodrome = (
                      row.get(
                          aerodrome_column,
                          ""
                      ).strip()
                      if aerodrome_column
                      else ""
                  )

                  icao = (
                      row.get(
                          icao_column,
                          ""
                      ).strip()
                      if icao_column
                      else ""
                  )

                  valid_from = (
                      row.get(
                          valid_from_column,
                          ""
                      ).strip()
                      if valid_from_column
                      else ""
                  )

                  properties = {
                      "name": name,
                      "designator": name,
                      "associatedAerodrome": aerodrome,
                      "icao": icao,
                      "validFrom": valid_from,

                      # Keep VRPs visually consistent with ATZs.
                      "category": "VRP",
                      "colour": "purple",
                      "boundary": "dashed",

                      "source": "NATS Visual Reference Points Dataset"
                  }

                  features.append(
                      {
                          "type": "Feature",
                          "geometry": {
                              "type": "Point",
                              "coordinates": [
                                  longitude,
                                  latitude
                              ]
                          },
                          "properties": properties
                      }
                  )

          print("")
          print("==========================================")
          print("VRP CONVERSION RESULT")
          print("==========================================")
          print("")
          print(
              f"Valid VRPs: {len(features)}"
          )
          print(
              f"Invalid records: {invalid}"
          )

          if len(features) == 0:

              print("")
              print(
                  "ERROR: VRP conversion produced zero "
                  "valid points."
              )

              print(
                  "Existing GeoJSON has NOT been replaced."
              )

              sys.exit(1)

          collection = {
              "type": "FeatureCollection",
              "features": features
          }

          temporary = OUTPUT.with_suffix(
              ".geojson.tmp"
          )

          temporary.write_text(
              json.dumps(
                  collection,
                  ensure_ascii=False,
                  separators=(
                      ",",
                      ":"
                  )
              ),
              encoding="utf-8"
          )

          temporary.replace(
              OUTPUT
          )

          print("")
          print(
              f"Written: {OUTPUT}"
          )

          PY

          test -s data/uk-reporting-points.geojson


      # ============================================================
      # VALIDATE GENERATED GEOJSON
      # ============================================================

      - name: Validate generated aviation GeoJSON
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import sys

          files = [
              Path(
                  "data/uk-airspace.geojson"
              ),
              Path(
                  "data/uk-reporting-points.geojson"
              )
          ]

          for path in files:

              print("")
              print(
                  f"Validating {path}"
              )

              if not path.exists():

                  print(
                      f"ERROR: Missing {path}"
                  )

                  sys.exit(1)

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as handle:

                  data = json.load(
                      handle
                  )

              if data.get(
                  "type"
              ) != "FeatureCollection":

                  print(
                      f"ERROR: {path} is not a "
                      "FeatureCollection."
                  )

                  sys.exit(1)

              features = data.get(
                  "features"
              )

              if not isinstance(
                  features,
                  list
              ):

                  print(
                      f"ERROR: {path} has no valid "
                      "features array."
                  )

                  sys.exit(1)

              if len(features) == 0:

                  print(
                      f"ERROR: {path} contains zero features."
                  )

                  sys.exit(1)

              print(
                  f"Features: {len(features)}"
              )

              for feature in features:

                  if feature.get(
                      "type"
                  ) != "Feature":

                      print(
                          f"ERROR: Invalid feature in {path}"
                      )

                      sys.exit(1)

                  if not feature.get(
                      "geometry"
                  ):

                      print(
                          f"ERROR: Feature has no geometry "
                          f"in {path}"
                      )

                      sys.exit(1)

          print("")
          print(
              "All generated GeoJSON passed validation."
          )

          PY


